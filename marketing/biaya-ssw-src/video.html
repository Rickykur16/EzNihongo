<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&family=Courier+Prime:wght@400;700&display=block" rel="stylesheet">
<!--
  Video "Biaya Tokutei Ginou mandiri" 9:16 (1080×1920), 100,5 detik.
  Gaya editing mengikuti referensi konten edukasi dari pemilik produk: kanvas hitam, judul
  kotak merah di atas, panel 16:9 di tengah, kotak putih hook di bawah. Isi panel: suasana
  gelap, ilustrasi sketsa garis hitam-putih, kartu kertas bergaya mesin ketik per bagian,
  teks kapital putih dengan label merah, transisi angka geser.
  Semua animasi = render(t) (deterministik per frame); window.CUES = efek suara (sfx.py).
  Angka = tarif resmi / perkiraan per Oktober 2026, sumber di README.md. Teks TANPA em dash.
-->
<style>
:root{--red:#E0202F;--ink:#141414;--paper:#ecebe6}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000;font-family:Inter,sans-serif}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#000}
.bar{position:absolute;left:0;right:0;text-align:center}
.bar span{display:inline-block;font-weight:800;font-size:56px;line-height:1.14;letter-spacing:-.005em;padding:10px 26px 12px;border-radius:12px;text-transform:uppercase}
#topbar{top:395px}#topbar span{background:var(--red);color:#fff}
#botbar{top:1338px}#botbar span{background:#fff;color:#000}
#panel{position:absolute;left:0;top:650px;width:1080px;height:608px;overflow:hidden;background:#151515}
.shot{position:absolute;inset:0;display:none;overflow:hidden}
.cam{position:absolute;inset:0;transform-origin:50% 50%}
.dark{background:radial-gradient(ellipse 85% 85% at 50% 45%,#2a2a2a 0%,#1a1a1a 60%,#0e0e0e 100%)}
.light{background:radial-gradient(ellipse 90% 90% at 50% 45%,#f0efec 0%,#e2e0dc 70%,#cfccc6 100%)}
.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.05) brightness(.55)}
.shade{position:absolute;inset:0;background:radial-gradient(ellipse 80% 80% at 50% 45%,rgba(0,0,0,.05),rgba(0,0,0,.65))}
.grain{position:absolute;inset:-20px;opacity:.07;background-image:radial-gradient(#fff 1px,transparent 1.2px);background-size:5px 5px;mix-blend-mode:overlay}
.a{position:absolute}
.lbl{display:inline-block;background:var(--red);color:#fff;font-weight:800;text-transform:uppercase;font-size:34px;line-height:1.1;padding:4px 12px 6px;letter-spacing:.005em;white-space:nowrap}
.big{color:#fff;font-weight:900;letter-spacing:-.02em;line-height:1;white-space:nowrap;text-shadow:0 6px 26px rgba(0,0,0,.45)}
.light .big{color:var(--ink);text-shadow:none}
.sm{color:#e9e9e9;font-weight:600;font-size:30px;line-height:1.2;white-space:nowrap}
.light .sm{color:#3a3a3a}
.num{font-variant-numeric:tabular-nums}
.w{display:inline-block}
.ico{position:absolute;overflow:visible}
.ico path,.ico circle,.ico rect,.ico line,.ico polyline,.ico ellipse{fill:none;stroke:#ededed;stroke-width:4.2;stroke-linecap:round;stroke-linejoin:round}
.light .ico path,.light .ico circle,.light .ico rect,.light .ico line,.light .ico polyline,.light .ico ellipse{stroke:#1d1d1d}
.ico .acc{stroke:var(--red)!important}
/* kartu kertas mesin ketik */
.note{position:absolute;left:150px;top:96px;width:780px;height:410px;background:linear-gradient(180deg,#f1f0ec,#e3e1db);box-shadow:0 30px 60px -20px rgba(0,0,0,.8);transform:rotate(-1.2deg)}
.note:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(180deg,transparent 0 46px,rgba(0,0,0,.05) 46px 48px)}
.note .hd{position:absolute;left:56px;top:54px;font-family:'Courier Prime';font-weight:700;font-size:26px;color:var(--red);letter-spacing:.06em}
.note .rule{position:absolute;left:56px;right:56px;top:96px;height:2px;background:#9c9a94}
.note .ttl{position:absolute;left:56px;right:40px;top:140px;font-family:'Courier Prime';font-weight:700;font-size:70px;line-height:1.08;color:#262626;text-transform:uppercase}
.note .rule2{position:absolute;left:56px;right:56px;bottom:62px;height:2px;background:#bdbab3}
.clip{position:absolute;right:30px;top:-30px;width:60px;height:120px}
.tape{position:absolute;left:-26px;top:22px;width:130px;height:40px;background:rgba(230,226,212,.75);transform:rotate(-24deg);box-shadow:0 2px 6px rgba(0,0,0,.2)}
.cur{display:inline-block;width:.08em}
.mono{font-family:'Courier Prime';font-weight:700;color:#262626}
.rrow{display:flex;justify-content:space-between;font-size:24px;line-height:29px;border-bottom:1px dashed #b9b6ae}
.fine{color:#9a9a9a;font-size:22px;font-weight:600;white-space:nowrap}
</style></head>
<body><div id="stage">
<div class="bar" id="topbar"><span>Biaya Tokutei Ginou mandiri<br>dibedah satu per satu</span></div>
<div id="panel"></div>
<div class="bar" id="botbar"><span>Tanpa LPK, totalnya<br>8–9 jutaan ?!</span></div>
</div>
<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const seg=(t,a,b)=>cl((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3), eo5=x=>1-Math.pow(1-x,5);
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eback=x=>{const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const lerp=(a,b,x)=>a+(b-a)*x;
const rp=n=>Math.round(n).toLocaleString('id-ID');

// ===================== ILUSTRASI SKETSA (SVG garis, digambar saat muncul) =====================
const ICONS={
 book:'<path d="M100 62 C80 46 46 44 22 54 L22 156 C46 146 80 146 100 160 C120 146 154 146 178 156 L178 54 C154 44 120 46 100 62 Z"/><path d="M100 62 L100 160"/><path d="M40 78 C56 72 72 72 86 78"/><path d="M40 98 C56 92 72 92 86 98"/><path d="M114 78 C128 72 144 72 160 78"/><path d="M114 98 C128 92 144 92 160 98"/><path class="acc" d="M150 18 L178 46 L120 104 L98 110 L104 88 Z"/>',
 clip:'<rect x="48" y="34" width="104" height="146" rx="10"/><rect x="76" y="22" width="48" height="26" rx="6"/><polyline class="acc" points="66,78 76,88 94,68"/><path d="M106 80 L134 80"/><polyline class="acc" points="66,112 76,122 94,102"/><path d="M106 114 L134 114"/><path d="M68 150 L80 150"/><path d="M106 148 L134 148"/>',
 docs:'<rect x="62" y="28" width="96" height="128" rx="8"/><path d="M42 48 L42 172 L138 172"/><path d="M80 60 L140 60"/><path d="M80 82 L140 82"/><path d="M80 104 L124 104"/><circle class="acc" cx="128" cy="132" r="14"/>',
 passport:'<rect x="52" y="24" width="96" height="152" rx="12"/><circle cx="100" cy="86" r="28"/><ellipse cx="100" cy="86" rx="12" ry="28"/><path d="M72 86 L128 86"/><path d="M76 72 C90 76 110 76 124 72"/><path d="M76 100 C90 96 110 96 124 100"/><path class="acc" d="M74 140 L126 140"/><path d="M82 156 L118 156"/>',
 skck:'<rect x="50" y="26" width="100" height="148" rx="8"/><path d="M70 54 L130 54"/><path d="M70 76 L130 76"/><path d="M70 98 L118 98"/><path d="M70 120 L104 120"/><circle class="acc" cx="122" cy="142" r="18"/><path class="acc" d="M114 158 L110 178 L122 170 L134 178 L130 158"/>',
 head:'<path d="M62 176 L62 142 C40 128 34 98 44 72 C56 40 92 26 122 36 C150 46 166 74 160 104 L170 128 L156 132 L156 150 C156 160 148 164 138 162 L120 160 L120 176"/><circle class="acc" cx="104" cy="88" r="16"/><path class="acc" d="M104 62 L104 70 M104 106 L104 114 M78 88 L86 88 M122 88 L130 88 M86 70 L92 76 M116 100 L122 106 M122 70 L116 76 M86 106 L92 100"/>',
 card:'<rect x="22" y="52" width="156" height="104" rx="12"/><circle cx="64" cy="96" r="18"/><path d="M40 136 C46 120 82 120 88 136"/><path d="M106 84 L156 84"/><path d="M106 104 L156 104"/><path d="M106 124 L140 124"/><path class="acc" d="M22 72 L178 72"/>',
 shield:'<path d="M100 22 L164 44 L160 104 C156 142 130 166 100 180 C70 166 44 142 40 104 L36 44 Z"/><path d="M100 40 L148 56 L145 104 C142 132 124 150 100 162"/><polyline class="acc" points="72,100 92,120 130,80"/>',
 visa:'<rect x="40" y="30" width="120" height="146" rx="8"/><path d="M60 54 L104 54"/><path d="M60 72 L92 72"/><rect class="acc" x="70" y="96" width="78" height="54" rx="6" transform="rotate(-12 109 123)"/><path class="acc" d="M82 114 L88 130 L94 114 M100 114 L100 130 M114 116 C110 112 104 114 106 119 C108 123 114 123 113 128 C111 132 105 131 104 128 M120 130 L126 114 L132 130 M122 125 L130 125" transform="rotate(-12 109 123)"/>',
 steth:'<path d="M58 30 L58 82 C58 108 76 124 96 124 C116 124 134 108 134 82 L134 30"/><path d="M50 30 L66 30 M126 30 L142 30"/><path d="M96 124 L96 146 C96 170 120 176 138 164 C150 156 152 140 152 130"/><circle class="acc" cx="152" cy="116" r="14"/>',
 plane:'<path d="M20 112 L80 104 L118 46 L136 46 L118 102 L162 98 L176 80 L188 80 L182 108 L188 136 L176 136 L162 118 L118 114 L136 170 L118 170 L80 112 Z"/><path class="acc" d="M30 160 C70 150 110 158 150 150"/>',
 building:'<rect x="56" y="40" width="88" height="140"/><path d="M40 180 L160 180"/><rect x="72" y="58" width="16" height="16"/><rect x="112" y="58" width="16" height="16"/><rect x="72" y="90" width="16" height="16"/><rect x="112" y="90" width="16" height="16"/><rect x="72" y="122" width="16" height="16"/><rect x="112" y="122" width="16" height="16"/><rect class="acc" x="88" y="150" width="24" height="30"/>',
 warn:'<path class="acc" d="M100 26 L180 168 L20 168 Z"/><path d="M100 76 L100 120"/><circle cx="100" cy="144" r="4"/>',
};
function ico(name,x,y,size,inT,dur=1.1){
  return `<svg class="ico" data-draw="${inT}" data-dd="${dur}" viewBox="0 0 200 200" style="left:${x}px;top:${y}px;width:${size}px;height:${size}px">`+
    `<g filter="url(#rough)">${ICONS[name]}</g></svg>`; }

// ===================== POTONGAN TEKS =====================
// pos: "x,y" kiri-atas di panel 1080×608. in/out = detik relatif terhadap mulai shot.
const L=(txt,x,y,i,o,fs)=>`<div class="a" data-in="${i}"${o?` data-out="${o}"`:''} style="left:${x}px;top:${y}px"><span class="lbl"${fs?` style="font-size:${fs}px"`:''}>${txt}</span></div>`;
const B=(txt,x,y,i,fs=84,o,extra='')=>`<div class="a big wd" data-in="${i}"${o?` data-out="${o}"`:''} style="left:${x}px;top:${y}px;font-size:${fs}px;${extra}">${txt}</div>`;
const S=(txt,x,y,i,o,extra='')=>`<div class="a sm" data-in="${i}"${o?` data-out="${o}"`:''} style="left:${x}px;top:${y}px;${extra}">${txt}</div>`;
const C=(fmt,to,x,y,i,fs=96,dec=0,extra='')=>`<div class="a big num count" data-in="${i}" data-fmt="${fmt}" data-to="${to}" data-dec="${dec}" style="left:${x}px;top:${y}px;font-size:${fs}px;${extra}">${fmt}</div>`;
const center='width:1080px;left:0;text-align:center';
const NOTE=(hd,ttl)=>`<div class="note"><div class="tape"></div><svg class="clip" viewBox="0 0 60 120"><path d="M18 6 L18 92 C18 108 42 108 42 92 L42 22 C42 14 30 14 30 22 L30 86" fill="none" stroke="#8d8d8d" stroke-width="5" stroke-linecap="round"/></svg>
  <div class="hd">${hd}</div><div class="rule"></div><div class="ttl"><span class="tw" data-in="0.06" data-cps="32" data-text="${ttl}"></span></div><div class="rule2"></div></div>`;

// ===================== DAFTAR SHOT =====================
// Waktu mengikuti naskah ElevenLabs (13 paragraf, README.md). SEG = detik mulai tiap paragraf.
// Angka sekarang PERKIRAAN (±15 huruf/detik + jeda 0,6 dtk); begitu MP3 ada, ganti SEG dengan
// titik jeda dari audionya (ffmpeg silencedetect) dan semua adegan ikut bergeser.
const SEG=[0,9.7,17.6,23.3,25.5,28.8,30.9,34.5,36.2,40.1,44.0,51.3,59.0];
const DUR=64.9;
const segEnd=i=>i+1<SEG.length?SEG[i+1]:DUR, segDur=i=>segEnd(i)-SEG[i];
// [paragraf, mulai relatif, selesai relatif (null = akhir paragraf), latar, isi, opsi]
const SPEC=[];
const shot=(i,a,b,bg,html,o={})=>SPEC.push([i,a,b,bg,html,o]);
// item: kartu kertas singkat lalu isi
const item=(i,n,title,bg,html,o={})=>{ const nd=Math.min(.8,segDur(i)*.36);
  shot(i,0,nd,'dark',NOTE(`BAGIAN ${String(n).padStart(2,'0')} / 09`,title),{note:1});
  shot(i,nd,null,bg,html,Object.assign({whip:1},o)); };

const hookSplit=segDur(0)*.56;
shot(0,0,hookSplit,'dark',`<img class="photo" data-zoom="1" src="../../assets/landing/tokyo-night.jpg" style="object-position:50% 50%"><div class="shade"></div>
  ${L('Berangkat Tokutei Ginou tanpa LPK',0,110,0.05)}${S('totalnya sekitar',0,200,1.5)}
  ${C('± Rp{0}–{1} jt','8.1,9.2',0,250,1.9,140,1,'width:1080px;text-align:center')}`,{center:1,hit:[[1.95,'impact',1]]});
shot(0,hookSplit,null,'dark',`${S('dari mana aja angka segitu?',0,160,0.05)}${B('KITA BEDAH',0,220,0.9,110)}${L('satu per satu',0,350,1.4,null,64)}`,{center:1,whip:1});
item(1,1,'Ujian bahasa','dark',`<div class="strip" style="position:absolute;left:0;top:0;width:2160px;height:608px">
     ${L('pilih salah satu',0,70,0.15)}
     ${L('JFT-Basic',0,190,0.35)}${C('Rp{0}','550000',0,250,0.45,150,0,center)}
     <svg class="a" viewBox="0 0 400 120" style="left:820px;top:120px;width:520px;height:160px;overflow:visible"><path class="arrow" d="M10 100 C120 0 280 0 390 70" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" pathLength="1"/><path class="arrowh" d="M360 40 L392 72 L350 82" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/></svg>
     <div class="a" style="left:1080px;top:0;width:1080px;height:608px">${L('JLPT N4',0,190,3.2)}${C('Rp{0}','250000',0,250,3.3,150,0,center)}${L('cuma 2× setahun',0,430,4.6,null,40)}</div>
   </div>`,{center:1,strip:[2.6,3.3]});
item(2,2,'Ujian keterampilan','dark',`${ico('clip',70,150,300,0.05)}${L('sesuai bidang kerja',420,110,0.2)}${C('Rp{0}','220000',420,175,0.35,104)}${S('sampai',424,300,0.9)}${C('Rp{0}','740000',420,345,1.1,104)}`);
shot(3,0,null,'dark',`<div class="a" style="inset:0;background:radial-gradient(ellipse at 50% 50%,rgba(224,32,47,.28),transparent 70%)"></div>${ico('warn',110,140,300,0.0,.6)}${B('GAGAL UJIAN?',450,190,0.1,82)}${L('bayar lagi.',454,310,0.75,null,64)}`,{shake:0.75,whip:1});
item(4,3,'Paspor','dark',`${ico('passport',70,140,300,0.05,.8)}${L('paspor biasa 10 th',430,95,0.1)}${C('Rp{0}','650000',430,155,0.2,112)}${L('e-paspor 10 th',430,315,1.1)}${C('Rp{0}','950000',430,375,1.2,112)}`);
item(5,4,'SKCK','dark',`${ico('skck',90,140,300,0.0,.7)}${L('tarif resmi PNBP',450,190,0.05)}${C('Rp{0}','30000',450,255,0.15,124)}`);
item(6,5,'Psikotes','dark',`${ico('head',70,140,300,0.05,.8)}${L('maksimal',430,150,0.1)}${C('Rp{0}','550000',430,210,0.2,108)}${S('aturan BP2MI untuk SSW',432,370,0.8)}${L('psikolog terdaftar HIMPSI',430,440,1.5)}`);
item(7,6,'e-KTKLN','dark',`${ico('card',60,150,320,0.0,.6)}${B('GRATIS.',430,160,0.05,140)}${L('daftar online sendiri',436,330,0.45)}`,{hit:[[0.08,'punch'],[0.12,'correct']]});
item(8,7,'BPJS pekerja migran','dark',`${ico('shield',70,140,300,0.05,.8)}${L('kontrak 24 bulan',450,190,0.1)}${C('Rp{0}','370000',450,255,0.2,110)}`);
item(9,8,'Visa Jepang','dark',`${ico('visa',70,140,300,0.0,.8)}${L('sekali masuk',430,170,0.1)}${C('Rp{0}','1650000',430,235,0.2,94)}${S('sejak 1 Juli 2026',434,385,0.8)}`);
item(10,9,'Medical & tiket','light',`<div class="a" style="width:1080px;left:0;top:34px;text-align:center" data-in="0.05"><span class="lbl">perkiraan, bukan tarif resmi</span></div>
   ${ico('steth',150,110,210,0.1)}${ico('plane',700,110,210,2.3)}
   ${L('medical check-up',120,345,0.3)}${B('± Rp1,1 jt',120,405,0.45,72)}${S('beda tiap klinik',122,495,0.9)}
   ${L('tiket pesawat',600,345,2.5)}${B('mulai ± Rp3,3 jt',600,410,2.65,52)}${S('Jakarta–Osaka, 28 Okt,',602,488,3.1)}${S('belum bagasi',602,526,3.3)}
   <div class="a" style="left:539px;top:120px;width:2px;height:440px;background:#bbb8b1"></div>`);
const recSplit=Math.min(2.6,segDur(11)*.36);
shot(11,0,recSplit,'dark',`<div class="note" style="left:170px;top:22px;width:740px;height:566px"><div class="tape"></div>
   <div class="hd" style="top:34px"><span class="tw" data-in="0.05" data-cps="40" data-text="STRUK TG MANDIRI / OKT 2026"></span></div><div class="rule" style="top:74px"></div>
   <div class="mono" style="position:absolute;left:56px;right:56px;top:88px">${[
     ['Ujian bahasa','250rb–550rb'],['Ujian keterampilan','220rb–740rb'],['Paspor','650rb–950rb'],['SKCK','30rb'],['Psikotes','maks 550rb'],
     ['e-KTKLN','GRATIS'],['BPJS PMI 24 bln','370rb'],['Visa Jepang','1,65jt'],['Medical check-up','± 1,1jt'],['Tiket pesawat','mulai ± 3,3jt']]
     .map(([l,v],i)=>`<div class="rrow fade" data-in="${(0.3+i*0.15).toFixed(2)}"><span>${l}</span><span${v==='GRATIS'?' style="color:#1f7a45"':''}>${v}</span></div>`).join('')}
     <div class="rrow fade" data-in="1.9" style="border:0;border-top:3px solid #262626;margin-top:8px;padding-top:6px;font-size:30px;line-height:38px"><span>TOTAL</span><span style="color:var(--red)">???</span></div>
   </div></div>`);
shot(11,recSplit,null,'dark',`${L('jadi totalnya',0,110,0.05,null,44)}${C('± Rp{0}–{1} jt','8.1,9.2',0,190,0.2,132,1,'width:1080px;text-align:center')}
   ${S('kalau semua ujian lulus sekali,',0,375,1.2)}${S('belum termasuk bagasi.',0,418,1.5)}`,{center:1,whip:1,hit:[[0.25,'impact',2]]});
shot(12,0,null,'dark',`<div class="note" style="left:200px;top:40px;width:680px;height:300px"><div class="tape"></div><img src="logo-a.png" data-in="0.15" class="a" style="left:90px;top:5px;width:500px"></div>
   ${L('cek link di bio',0,385,0.9,null,46)}${S('eznihongo.com',0,470,1.4)}
   <div class="a fine" data-in="2.0" style="${center};top:548px">Tarif resmi &amp; perkiraan per Oktober 2026, bisa berubah. Cek lagi sebelum membayar.</div>`,{center:1,end:1});
const SHOTS=SPEC.map(([i,a,b,bg,html,o])=>[SEG[i]+a, b===null?segEnd(i):SEG[i]+b, bg, html, o]);

// ===================== BANGUN DOM =====================
$('panel').insertAdjacentHTML('beforeend',`<svg width="0" height="0" style="position:absolute"><filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="3.2"/></filter></svg>`);
const SH=SHOTS.map(([a,b,bg,html,o])=>{ const d=document.createElement('div'); d.className='shot '+bg;
  d.innerHTML=`<div class="cam">${html}<div class="grain"></div></div>`; $('panel').appendChild(d);
  if(o.center) d.querySelectorAll('.a').forEach(e=>{ if(!e.style.width){ e.style.left='0'; e.style.width='1080px'; e.style.textAlign='center'; } });
  d.querySelectorAll('.ico path,.ico circle,.ico rect,.ico line,.ico polyline,.ico ellipse').forEach(p=>p.setAttribute('pathLength','1'));
  // kata per kata
  d.querySelectorAll('.wd').forEach(e=>{ const base=+e.dataset.in; const words=e.textContent.split(' ');
    e.innerHTML=words.map((w,i)=>`<span class="w" data-win="${(base+i*.09).toFixed(3)}">${w}</span>`).join(' '); });
  return {el:d,a,b,o,cam:d.querySelector('.cam'),strip:d.querySelector('.strip'),
    ins:[...d.querySelectorAll('[data-in]:not(.wd):not(.tw)')],words:[...d.querySelectorAll('.w')],tws:[...d.querySelectorAll('.tw')],
    counts:[...d.querySelectorAll('.count')],icos:[...d.querySelectorAll('.ico')],photos:[...d.querySelectorAll('[data-zoom]')]}; });

// efek suara mengikuti elemen yang muncul
window.CUES=(()=>{ const E=SEG[SEG.length-1]; const c=[[0,'riser'],[0.12,'impact',0],[0.3,'boom'],[E+.15,'boom'],[E+.6,'shimmer'],[E+2.4,'sparkle']];
  SH.forEach(s=>{ const a=s.a;
    if(a>0) c.push([a, s.o.note?'whoosh_soft':(s.o.whip?'whoosh':'whoosh_soft'), s.o.whip?1:-1]);
    s.tws.forEach(e=>c.push([a+(+e.dataset.in), 'type', Math.min(1.2, e.dataset.text.length/(+(e.dataset.cps||16)))]));
    s.el.querySelectorAll('.lbl').forEach((l,i)=>{ const h=l.closest('[data-in]'); c.push([a+(+h.dataset.in),'pop',i%7]); });
    s.counts.forEach(e=>c.push([a+(+e.dataset.in)+.05,'count']));
    s.el.querySelectorAll('.rrow').forEach(e=>c.push([a+(+e.dataset.in),'tick',2]));
    if(s.o.strip) c.push([a+s.o.strip[0],'whoosh',1]);
    if(s.o.shake) c.push([a+s.o.shake,'punch']);
    (s.o.hit||[]).forEach(([r,k,x])=>c.push([a+r,k,x])); });
  return c.filter(x=>x[0]<DUR-.3).sort((x,y)=>x[0]-y[0]); })();

// ===================== RENDER =====================
function render(t){
  SH.forEach(s=>{ const on=t>=s.a&&t<s.b; s.el.style.display=on?'block':'none'; if(on) drawShot(s,t-s.a,s.b-s.a); });
  // bar atas & bawah: masuk sekali di awal
  const p=eo5(seg(t,0,.45)); ['topbar','botbar'].forEach((id,i)=>{ const e=$(id); e.style.opacity=p; e.style.transform=`translateY(${(1-p)*(i?30:-30)}px)`; });
}
function drawShot(s,lt,dur){
  // kamera: punch-in saat cut + dorong pelan; "whip" = geser cepat dari kanan dengan blur
  const pin=eo5(seg(lt,0,.32));
  let tf=`scale(${lerp(1.06,1,pin)*lerp(1,1.035,seg(lt,0,dur))})`;
  if(s.o.whip){ tf=`translateX(${(1-pin)*170}px) `+tf; s.cam.style.filter=`blur(${(1-pin)*10}px)`; } else s.cam.style.filter='';
  if(s.o.shake){ const x=lt-s.o.shake; if(x>0&&x<.4) tf+=` translate(${Math.sin(x*80)*10*Math.exp(-x*9)}px,${Math.cos(x*70)*6*Math.exp(-x*9)}px)`; }
  s.cam.style.transform=tf;
  s.photos.forEach(ph=>ph.style.transform=`scale(${lerp(1.14,1.02,eo(seg(lt,0,dur)))})`);
  if(s.strip){ const [a,b]=s.o.strip, m=eio(seg(lt,a,b)); s.strip.style.transform=`translateX(${-m*1080}px)`;
    s.strip.style.filter=`blur(${Math.sin(Math.PI*m)*8}px)`;
    const ar=s.strip.querySelector('.arrow'), ah=s.strip.querySelector('.arrowh');
    ar.style.strokeDasharray=1; ar.style.strokeDashoffset=1-eo(seg(lt,a-.6,a+.2)); ah.style.strokeDasharray=1; ah.style.strokeDashoffset=1-eo(seg(lt,a+.1,a+.35)); }
  s.ins.forEach(e=>{ const i=+e.dataset.in, o=e.dataset.out?+e.dataset.out:1e9, p=seg(lt,i,i+.26), q=seg(lt,o,o+.12);
    e.style.opacity=cl(p*2.2)*(1-q);
    if(e.classList.contains('fade')) e.style.transform=`translateX(${(1-eo5(p))*-14}px)`;
    else e.style.scale=lerp(.82,1,eback(p))*lerp(1,.96,q); });
  s.words.forEach(w=>{ const host=w.closest('[data-in]'), o=host.dataset.out?+host.dataset.out:1e9, i=+w.dataset.win, p=seg(lt,i,i+.24), q=seg(lt,o,o+.12);
    w.style.opacity=cl(p*2.4)*(1-q); w.style.transform=`translateY(${(1-eo5(p))*22}px) scale(${lerp(.8,1,eback(p))})`; });
  s.tws.forEach(e=>{ const i=+e.dataset.in, cps=+(e.dataset.cps||16), txt=e.dataset.text, n=Math.floor(cl((lt-i)*cps,0,txt.length));
    const done=n>=txt.length, blink=Math.floor(lt*2.4)%2===0;
    e.innerHTML=txt.slice(0,n).replace(/&/g,'&amp;')+((!done||blink)&&lt>=i?'<span class="cur">|</span>':''); });
  s.counts.forEach(e=>{ const i=+e.dataset.in, k=eo(seg(lt,i+.05,i+1.0)), dec=+e.dataset.dec, to=e.dataset.to.split(',').map(Number);
    e.textContent=e.dataset.fmt.replace(/\{(\d)\}/g,(_,j)=>{ const v=to[+j]*k; return dec?v.toFixed(dec).replace('.',','):rp(Math.round(v/1000)*1000); }); });
  s.icos.forEach(svg=>{ const i=+svg.dataset.draw, d=+svg.dataset.dd, p=eo(seg(lt,i,i+d));
    svg.style.opacity=p>0?1:0; svg.querySelectorAll('[pathLength]').forEach((el,k,all)=>{ const q=cl(p*1.25-k/all.length*.25);
      el.style.strokeDasharray=1; el.style.strokeDashoffset=1-q; }); });
}
window.render=render; window.DUR=DUR;
render(0);
</script>
