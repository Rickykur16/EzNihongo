.layer{position:absolute;left:0;top:0;transform-origin:0 0}
.layer>img{display:block}
.crop{position:absolute;opacity:0;background-repeat:no-repeat}
.cursor{position:absolute;left:0;top:0;transform-origin:4px 4px;opacity:0}
.ring{position:absolute;border-radius:50%;border:5px solid var(--red);opacity:0}

const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const seg=(t,a,b)=>cl((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3), eo5=x=>1-Math.pow(1-x,5);
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eback=x=>{const c=1.6;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const lerp=(a,b,x)=>a+(b-a)*x;
const shake=(t,a,amp)=>{const x=t-a; return x<0||x>.35?0:Math.sin(x*90)*amp*Math.exp(-x*12)};

// ===================== JADWAL =====================
// adegan: [id, mulai, selesai]
const SCENES=[['hk',0,2.4],['sred',2.4,3.75],['ssplit',3.75,4.95],['slogo',4.95,6.3],
  ['sdash',6.3,10.35],['sbel',10.35,14.45],['srev',14.45,18.95],['sprog',18.95,22.55],['shp',22.55,26.2],['send',26.2,30.01]];

// caption: [mulai, selesai, top(px), tema, [[gaya, teks],...]]  gaya: s kecil, b besar, i serif miring; +y kuning, +r merah
const CAPS=[
  [0.05,1.3,1060,'dark',[['s','ga ada yang bakal'],['b','ngasih tau'],['i','kalian hal ini…']]],
  [1.3,2.4,1120,'dark',[['s','kerja ke'],['b y','Jepang']]],

// Bootcamp disisipkan di waktu NYATA 6,3–10,3; adegan aplikasi lama (waktu "lama") dipadatkan.
const BOOT=[6.3,10.3];

// peta waktu nyata → waktu lama (setelah bootcamp). Frasa Progres kedua (lama 21,0–22,55) dilewati.
const KNOTS=[[10.3,6.3],[13.7,10.35],[17.1,14.45],[20.8,18.95],[22.8,21.0]];
function toOld(T){ if(T<BOOT[0]) return T; if(T>=26.2) return T;
  if(T>=22.8) return 22.55+(T-22.8)*(26.2-22.55)/(26.2-22.8);
  for(let i=0;i<KNOTS.length-1;i++){ const [a,oa]=KNOTS[i],[b,ob]=KNOTS[i+1]; if(T>=a&&T<b) return oa+(T-a)*(ob-oa)/(b-a); }
  return 6.3; }
function toReal(o){ if(o<6.3||o>=26.2) return o; if(o>=21.0&&o<22.55) return null;
  if(o>=22.55) return 22.8+(o-22.55)*(26.2-22.8)/(26.2-22.55);
