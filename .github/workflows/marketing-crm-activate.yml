name: Activate Marketing CRM on VPS

on:
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  activate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Back up, restore-test, migrate and enable CRM
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: 168.144.107.34
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DEPLOY_SHA
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd /var/www/eznihongo
            bash backend/deploy/activate-marketing-crm.sh "$DEPLOY_SHA"
