name: Deploy to VPS

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# Cegah dua deploy paralel race di VPS yang sama (git reset + migrate +
# restart bisa saling injak kalau dua push berdekatan).
concurrency:
  group: deploy-vps${{ github.event_name == 'pull_request' && format('-pr-{0}', github.event.number) || '' }}
  cancel-in-progress: false

jobs:
  # Cek lockfile + parse-check seluruh source backend sebelum sentuh VPS.
  # Cepat (<60s); gagalnya CI = deploy tidak jalan, jadi syntax error tidak
  # pernah membunuh production.
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-ci-test
          POSTGRES_DB: eznihongo_payment_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install backend deps
        working-directory: backend
        run: npm ci
      - name: Syntax-check backend sources
        working-directory: backend
        run: find src migrations scripts -name '*.js' -o -name '*.mjs' | xargs -I{} node --check {}
      - name: Test backend and payment transactions
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql://postgres:local-ci-test@127.0.0.1:5432/eznihongo_payment_test
        run: npm test
      - name: Test student learning-state contract
        run: node --test learning-state.test.js

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Pull, install, migrate, restart, healthcheck
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: 168.144.107.34
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DEPLOY_SHA
          script: |
            set -euo pipefail
            # Jangan memasang ujung main yang mungkin belum diuji oleh run ini.
            if [[ ! "${DEPLOY_SHA:-}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "FATAL: DEPLOY_SHA harus full commit SHA dari workflow"
              exit 1
            fi
            cd /var/www/eznihongo
            git fetch --prune origin +refs/heads/main:refs/remotes/origin/main
            git cat-file -e "${DEPLOY_SHA}^{commit}"
            if ! git merge-base --is-ancestor "$DEPLOY_SHA" origin/main; then
              echo "FATAL: commit yang diuji tidak lagi berada pada main"
              exit 1
            fi
            previous_sha=$(git rev-parse HEAD)
            # Re-run lama tidak boleh diam-diam menurunkan versi kode setelah
            # migrasi yang lebih baru. Rollback harus melalui review terpisah.
            if ! git merge-base --is-ancestor "$previous_sha" "$DEPLOY_SHA"; then
              echo "FATAL: deploy bukan fast-forward dari $previous_sha ke $DEPLOY_SHA"
              exit 1
            fi
            git reset --hard "$DEPLOY_SHA"
            if [ "$(git rev-parse HEAD)" != "$DEPLOY_SHA" ]; then
              echo "FATAL: checkout tidak cocok dengan commit yang diuji"
              exit 1
            fi
            echo "Release checkout: $previous_sha -> $DEPLOY_SHA"

            # HTML menentukan versi asset dan redirect entry siswa. Jangan
            # biarkan browser menyimpan index/dashboard lama lintas deploy.
            install -m 0644 backend/deploy/nginx-html-cache.conf /etc/nginx/conf.d/eznihongo-html-cache.conf
            nginx -t
            systemctl reload nginx

            cd backend
            # --omit=dev sengaja: backend hanya punya runtime deps; lock-checked
            # install lebih cepat dan menjamin parity dengan CI di atas.
            npm ci --omit=dev
            npm run migrate

            systemctl restart eznihongo-api

            # Healthcheck loop. systemctl restart return 0 walau ExecStart crash
            # (Restart=always), jadi /api/health adalah signal sebenarnya.
            ok=0
            for i in 1 2 3 4 5; do
              if curl -fsS http://127.0.0.1:3001/api/health > /dev/null; then
                ok=1
                break
              fi
              sleep 2
            done
            if [ "$ok" != "1" ]; then
              echo "FATAL: /api/health tidak respond setelah restart"
              systemctl status eznihongo-api --no-pager || true
              journalctl -u eznihongo-api -n 50 --no-pager || true
              exit 1
            fi
            echo "Deploy ok: $DEPLOY_SHA at $(date)"
