<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Status Pesanan - EzNihongo</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Shippori+Mincho:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../styles/tokens.css"/>
<link rel="stylesheet" href="../styles/components.css"/>
<link rel="stylesheet" href="course.css?v=20260911-2"/>
</head>
<body>

<nav class="c-nav">
  <a href="../index.html"><img src="../logo.png" alt="EzNihongo"/></a>
  <a href="../index.html#pricing" class="c-back">← Kembali ke harga</a>
</nav>

<main class="c-main">
  <div class="c-wrap" id="o-wrap" style="max-width:640px;">
    <header class="c-header">
      <div class="c-eyebrow">Status Pesanan</div>
      <h1 class="c-title" id="o-title">Memuat...</h1>
      <p class="c-subtitle" id="o-subtitle"></p>
    </header>
    <p class="ez-sr-only" id="o-live-status" role="status" aria-live="polite" aria-atomic="true"></p>
    <section class="c-card" id="o-body" aria-labelledby="o-title" aria-busy="true"></section>
  </div>
</main>

<footer class="c-footer">
  <p>© 2026 <strong>EzNihongo</strong>. · <a href="../privacy.html">Kebijakan Privasi</a> · <a href="../terms.html">Syarat &amp; Ketentuan</a></p>
</footer>

<script src="../api-client.js"></script>
<script>
function formatRupiah(n) {
  return "Rp " + Number(n || 0).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
}
function fmtDate(iso) {
  if (!iso) return "-";
  return new Date(iso).toLocaleString("id-ID", { dateStyle: "medium", timeStyle: "short" });
}
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

const STATUS_META = {
  pending_payment: { label: "Menunggu Transfer", tone: "warn" },
  awaiting_review: { label: "Menunggu Verifikasi Admin", tone: "warn" },
  approved: { label: "Disetujui — Akses Aktif", tone: "ok" },
  rejected: { label: "Bukti Ditolak — Upload Ulang", tone: "bad" },
  expired: { label: "Kadaluarsa", tone: "muted" },
  cancelled: { label: "Dibatalkan", tone: "muted" },
};
const TONE_STYLE = {
  warn: "background:var(--warning-soft);color:var(--warning);border:1px solid #e7c78b;",
  ok: "background:var(--success-soft);color:var(--success);border:1px solid #b8d49d;",
  bad: "background:var(--danger-soft);color:var(--danger);border:1px solid #fecaca;",
  muted: "background:var(--paper-200);color:var(--ink-700);border:1px solid var(--paper-300);",
};
function statusBadge(status) {
  const meta = STATUS_META[status] || { label: status, tone: "muted" };
  return `<span class="badge" style="display:inline-block;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;${TONE_STYLE[meta.tone]}">${esc(meta.label)}</span>`;
}

function getOrderId() {
  return new URLSearchParams(location.search).get("id");
}

function bankAccountsHtml(accounts, orderNumber) {
  if (!accounts || accounts.length === 0) {
    return `<p style="color:var(--warning);">Rekening belum dikonfigurasi admin. Hubungi kami via WhatsApp untuk instruksi transfer.</p>`;
  }
  const rows = accounts.map(a => `
    <div style="border:1px solid var(--paper-300);border-radius:10px;padding:14px 16px;margin-bottom:10px;background:var(--paper-50);">
      <div style="font-weight:700;color:var(--ink-900);">${esc(a.bankName)}${a.label ? " · " + esc(a.label) : ""}</div>
      <div style="font-family:monospace;font-size:18px;margin:4px 0;">${esc(a.accountNumber)}</div>
      <div style="color:var(--ink-700);font-size:13px;">a.n. ${esc(a.accountHolder)}</div>
    </div>`).join("");
  return `
    ${rows}
    <p style="font-size:13px;color:var(--info);background:var(--info-soft);border:1px solid #bfd2ee;border-radius:8px;padding:10px 12px;">
      Wajib cantumkan <strong>${esc(orderNumber)}</strong> di berita transfer, supaya admin bisa mencocokkan pembayaranmu.
    </p>`;
}

function uploadFormHtml(order) {
  const isRejected = order.status === "rejected";
  return `
    ${isRejected ? `<p style="color:var(--danger);font-size:13px;margin-bottom:12px;">Bukti sebelumnya ditolak — lihat alasan di atas, lalu upload ulang bukti yang benar.</p>` : ""}
    <form id="o-proof-form" style="margin-top:6px;">
      <div class="field"><label for="o-file">Bukti transfer (JPG/PNG/WEBP/PDF, maks 5MB)</label>
        <input type="file" name="file" id="o-file" accept="image/jpeg,image/png,image/webp,application/pdf" required />
      </div>
      <div class="field-row">
        <div class="field"><label for="o-bank-name">Bank pengirim (opsional)</label><input id="o-bank-name" name="claimedBankName" placeholder="BCA" /></div>
        <div class="field"><label for="o-sender-name">Nama pengirim (opsional)</label><input id="o-sender-name" name="claimedSenderName" /></div>
      </div>
      <div class="field"><label for="o-amount">Jumlah yang ditransfer (opsional)</label><input type="number" id="o-amount" name="claimedAmountIdr" placeholder="${order.amountIdr}" /></div>
      <button type="submit" class="c-submit" id="o-upload-btn">${isRejected ? "Upload Ulang Bukti" : "Kirim Bukti Transfer"}</button>
    </form>
    <p id="o-upload-err" role="alert" aria-live="assertive" aria-atomic="true" hidden style="color:var(--danger);font-size:13px;margin-top:8px;"></p>`;
}

let _lastOrderLiveStatus = "";
function setOrderLiveStatus(message) {
  if (message === _lastOrderLiveStatus) return;
  _lastOrderLiveStatus = message;
  document.getElementById("o-live-status").textContent = message;
}

async function wireUploadForm(order) {
  const form = document.getElementById("o-proof-form");
  if (!form) return;
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("o-upload-btn");
    const errEl = document.getElementById("o-upload-err");
    errEl.textContent = "";
    errEl.hidden = true;
    const fileEl = document.getElementById("o-file");
    if (!fileEl.files[0]) return;
    btn.disabled = true;
    btn.textContent = "Mengunggah...";
    setOrderLiveStatus("Mengunggah bukti transfer...");
    try {
      const fd = new FormData(form);
      const res = await window.ezApi(`/orders/${encodeURIComponent(order.id)}/payment-proof`, {
        method: "POST",
        body: fd,
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
      setOrderLiveStatus("Bukti transfer berhasil dikirim. Memperbarui status pesanan...");
      await loadAndRender();
    } catch (err) {
      setOrderLiveStatus("");
      errEl.textContent = "Gagal upload: " + (err.message || "coba lagi.");
      errEl.hidden = false;
      btn.disabled = false;
      btn.textContent = "Kirim Bukti Transfer";
    }
  });
}

function renderOrder(data) {
  const { order, payments, bankAccounts } = data;
  document.title = `Pesanan ${order.orderNumber} - EzNihongo`;
  document.getElementById("o-title").textContent = order.courseTitle;
  document.getElementById("o-subtitle").innerHTML =
    `No. Pesanan <code>${esc(order.orderNumber)}</code> · ${formatRupiah(order.amountIdr)}`;

  const body = document.getElementById("o-body");
  body.setAttribute("aria-busy", "false");
  const statusMeta = STATUS_META[order.status] || { label: order.status, tone: "muted" };
  setOrderLiveStatus(`Status pesanan: ${statusMeta.label}.`);
  const latestPayment = (payments || [])[0];

  if (order.status === "approved") {
    body.innerHTML = `
      <p style="margin-bottom:14px;">${statusBadge(order.status)}</p>
      <p style="color:var(--ink-700);line-height:1.7;">Pembayaranmu sudah diverifikasi. Kelas sudah bisa diakses sekarang.</p>
      <a href="../dashboard.html?v=20260902-1${order.courseSlug ? "&course=" + encodeURIComponent(order.courseSlug) : ""}"
         class="c-submit" style="display:block;text-align:center;text-decoration:none;margin-top:16px;">Buka Dashboard →</a>`;
    return;
  }

  if (order.status === "expired" || order.status === "cancelled") {
    body.innerHTML = `
      <p style="margin-bottom:14px;">${statusBadge(order.status)}</p>
      <p style="color:var(--ink-700);line-height:1.7;">
        ${order.status === "expired"
          ? "Pesanan ini sudah lewat batas waktu pembayaran."
          : "Pesanan ini sudah dibatalkan."}
        Buat pesanan baru untuk melanjutkan.
      </p>
      <a href="${order.courseSlug ? "detail.html?slug=" + encodeURIComponent(order.courseSlug) : "../index.html#pricing"}"
         class="c-submit" style="display:block;text-align:center;text-decoration:none;margin-top:16px;">Buat Pesanan Baru →</a>`;
    return;
  }

  // pending_payment / awaiting_review / rejected — all still actionable.
  const rejectionNote = order.status === "rejected" && latestPayment?.rejectionReason
    ? `<div style="background:var(--danger-soft);border:1px solid #fecaca;border-radius:8px;padding:10px 12px;margin-bottom:14px;color:var(--danger);font-size:13px;">
         Alasan ditolak: ${esc(latestPayment.rejectionReason)}
       </div>`
    : "";
  const reviewNote = order.status === "awaiting_review"
    ? `<p style="color:var(--ink-700);font-size:13px;margin-bottom:14px;">Bukti sudah dikirim dan sedang direview admin. Kalau salah upload, kirim ulang di bawah ini.</p>`
    : "";

  body.innerHTML = `
    <p style="margin-bottom:14px;">${statusBadge(order.status)} <span style="font-size:12px;color:var(--ink-700);">Kadaluarsa ${fmtDate(order.expiresAt)}</span></p>
    ${rejectionNote}${reviewNote}
    <h2>Instruksi Transfer</h2>
    ${bankAccountsHtml(bankAccounts, order.orderNumber)}
    <h2 style="margin-top:24px;">${order.status === "rejected" ? "Upload Ulang Bukti" : "Upload Bukti Transfer"}</h2>
    ${uploadFormHtml(order)}
  `;
  wireUploadForm(order);
}

let _pollTimer = null;
async function loadAndRender() {
  const id = getOrderId();
  const body = document.getElementById("o-body");
  if (!id) {
    document.getElementById("o-title").textContent = "Pesanan tidak ditemukan";
    setOrderLiveStatus("");
    body.setAttribute("aria-busy", "false");
    body.innerHTML = `<p role="alert" style="color:var(--danger);">Alamat halaman tidak menyertakan nomor pesanan.</p>`;
    return;
  }
  body.setAttribute("aria-busy", "true");
  try {
    const res = await window.ezApi(`/orders/${encodeURIComponent(id)}`);
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      document.getElementById("o-title").textContent = "Pesanan tidak ditemukan";
      setOrderLiveStatus("");
      body.setAttribute("aria-busy", "false");
      body.innerHTML =
        `<p role="alert" style="color:var(--ink-700);">${esc(data.error || "Pesanan ini tidak bisa diakses.")}</p>`;
      return;
    }
    const data = await res.json();
    renderOrder(data);
    // Light polling while still in-review — no push notifications yet, so
    // the page quietly refreshes itself instead of requiring a manual reload.
    if (data.order.status === "awaiting_review" || data.order.status === "pending_payment") {
      clearTimeout(_pollTimer);
      _pollTimer = setTimeout(loadAndRender, 30000);
    }
  } catch (err) {
    setOrderLiveStatus("");
    body.setAttribute("aria-busy", "false");
    body.innerHTML = `<p role="alert" style="color:var(--danger);">Gagal memuat: ${esc(err.message)}</p>`;
  }
}

async function init() {
  const user = typeof window.ezGetMe === "function" ? await window.ezGetMe() : null;
  if (!user) {
    const here = `courses/order.html${location.search}`;
    window.location.replace(`../login.html?next=${encodeURIComponent(here)}`);
    return;
  }
  await loadAndRender();
}
document.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
