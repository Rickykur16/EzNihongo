  .grammar-example-item {
    background: var(--du-surface);
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 8px;
  }
  .grammar-example-item:last-child { margin-bottom: 0; }
  .grammar-example-row { display: flex; align-items: flex-start; gap: 10px; }
  .grammar-example { flex: 1; min-width: 0;
    font-size: 15.5px;
    color: var(--du-ink);
    font-family: 'Noto Sans JP', sans-serif;
    line-height: 1.7;
    white-space: pre-wrap;
  }
  .ge-play {
    flex: 0 0 auto; width: 30px; height: 30px; margin-top: 2px;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 999px; cursor: pointer;
    background: #fff; color: var(--brand-red);
    border: 1.5px solid var(--du-border, #ece9e3);
    transition: background .15s, color .15s, transform .15s;
  }
  .ge-play svg { width: 14px; height: 14px; }
  .ge-play:hover { background: var(--brand-red); color: #fff; border-color: var(--brand-red); transform: scale(1.08); }
  .ge-play.playing { background: var(--brand-red); color: #fff; border-color: var(--brand-red); animation: pulse 0.9s infinite; }
  .grammar-example-id {
    margin-top: 6px;
    font-size: 13px;
    color: var(--du-ink-2, #6b5f4f);
    line-height: 1.55;
    font-style: italic;
  }
  /* Terjemahan Indonesia per baris dialog — kecil, italic. Visibility
     (tap/selalu/off) dikontrol di blok .grammar-karaoke[data-arti] di bawah. */
  .gk-line-id { font-size: 12.5px; color: #8a7d66; font-style: italic; line-height: 1.5; }
  .grammar-notes {
    font-size: 12.5px;
    color: var(--du-ink-3);
    margin-top: 8px;
    line-height: 1.5;
    font-style: italic;
  }

  /* ── DECK (kosakata cards) ─────────────────────────────────────── */
  .deck-hero {
    background: linear-gradient(90deg, var(--du-surface-2) 0%, var(--du-surface) 100%);
    border: 1px solid var(--du-border);
    border-radius: 12px;
    padding: 20px 24px;
    display: flex; justify-content: space-between; align-items: center; gap: 20px;
    margin: 18px 0 20px;
  }
  .deck-hero .dh-eyebrow {
    font-size: 11px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--brand-red); margin-bottom: 6px;
  }
  .deck-hero .dh-body { font-size: 13.5px; color: var(--du-ink-2); line-height: 1.5; max-width: 560px; }
  .deck-hero .dh-stat {
    display: flex; flex-direction: column; align-items: flex-end; gap: 2px;
    flex-shrink: 0; padding-left: 16px; border-left: 2px solid var(--du-border);
  }
  .deck-hero .dh-stat-num { font-size: 28px; font-weight: 800; color: var(--brand-red); line-height: 1; font-variant-numeric: tabular-nums; }
  .deck-hero .dh-stat-label { font-size: 10px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase; color: var(--du-ink-3); }
  @media (max-width: 600px) {
    .deck-hero { padding: 16px 18px; gap: 14px; }
    .deck-hero .dh-stat { padding-left: 12px; }
    .deck-hero .dh-stat-num { font-size: 22px; }
  }
  .deck-toolbar {
    display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap;
    margin: 16px 0 18px; padding: 12px 16px;
    background: var(--du-surface); border: 1px solid var(--du-border); border-radius: 10px;
  }
  .deck-toolbar .dt-stats { font-size: 13px; color: var(--du-ink-3); font-weight: 500; }
  .deck-toolbar .dt-stats strong { color: var(--du-ink); font-weight: 700; }
  .deck-search { position: relative; flex: 1; min-width: 180px; max-width: 320px; }
  .deck-search input {
    width: 100%; padding: 9px 12px 9px 32px; border: 1px solid var(--du-border); border-radius: 7px;
    font-size: 14px; background: var(--du-surface-2); color: var(--du-ink);
  }
  .deck-search input:focus { outline: none; border-color: var(--du-ink-3); }
  .deck-search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--du-ink-3); }
  .deck-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .deck-card {
    position: relative; background: var(--du-surface); border: 1px solid var(--du-border); border-radius: 10px;
    padding: 14px 12px 26px; cursor: pointer; overflow: hidden;
    display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center;
    min-height: 148px;
    transition: transform .18s cubic-bezier(.2,.8,.2,1), box-shadow .18s, border-color .18s;
  }
  .deck-card::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: var(--deck-accent, var(--brand-red)); opacity: .85;
  }
  .deck-card:hover, .deck-card:focus-visible {
    transform: translateY(-3px); border-color: var(--deck-accent, var(--brand-red));
    box-shadow: 0 12px 28px -16px rgba(0,0,0,.22), 0 3px 10px -6px rgba(0,0,0,.1); z-index: 2;
    outline: none;
  }
  .deck-card:focus-visible { box-shadow: 0 0 0 3px var(--deck-accent, var(--brand-red)); }
  .deck-card .dc-jp { font-family: 'Noto Sans JP', sans-serif; font-size: 28px; font-weight: 700; color: var(--du-ink); line-height: 1.1; margin-top: 4px; }
  .deck-card .dc-kana { font-family: 'Noto Sans JP', sans-serif; font-size: 13px; font-weight: 500; color: var(--deck-accent, var(--brand-red)); letter-spacing: 0.04em; }
  .deck-card .dc-meaning {
    font-size: 13px; color: var(--du-ink-2); font-weight: 600; line-height: 1.25;
    padding-top: 7px; margin-top: 5px; border-top: 1px solid var(--du-border); width: 100%;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden; word-break: break-word;
  }
  .deck-card .dc-audio {
    position: absolute; top: 6px; right: 6px; width: 32px; height: 32px; border-radius: 50%;
    border: 1px solid var(--du-border); background: var(--du-surface); color: var(--du-ink);
    display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
    transition: all .15s; z-index: 2;
  }
  .deck-card .dc-audio svg { width: 14px; height: 14px; }
  .deck-card .dc-audio:hover { background: var(--deck-accent, var(--brand-red)); color: #fff; border-color: var(--deck-accent, var(--brand-red)); transform: scale(1.08); }
  .deck-card .dc-audio.playing { background: var(--deck-accent, var(--brand-red)); color: #fff; border-color: var(--deck-accent, var(--brand-red)); animation: pulse 0.9s infinite; }
  .deck-card .dc-len {
    position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%);
    font-size: 8.5px; font-weight: 700; letter-spacing: 0.18em; color: var(--du-ink-3);
    text-transform: uppercase; opacity: .45; transition: opacity .15s; pointer-events: none;
    white-space: nowrap;
  }
  .deck-card:hover .dc-len, .deck-card:focus-visible .dc-len { opacity: .75; }
  .deck-empty, .deck-empty-filter {
    grid-column: 1 / -1; text-align: center; padding: 60px 20px;
    color: var(--du-ink-3); font-style: italic; font-size: 14px;
  }
  .deck-empty-filter strong { font-style: normal; color: var(--du-ink-2); }
  @media (max-width: 600px) {
    .deck-grid { grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); }
    .deck-card { min-height: 132px; padding: 14px 10px 24px; }
    .deck-card .dc-jp { font-size: 24px; }
    .deck-card .dc-audio { width: 36px; height: 36px; top: 4px; right: 4px; }
    .deck-card .dc-len { opacity: .6; }
  }

  /* deck modal (example sentences) */
  .deck-modal-backdrop {
    position: fixed; inset: 0; background: rgba(20,20,20,.55); backdrop-filter: blur(3px);
    display: none; align-items: center; justify-content: center; z-index: 9000; padding: 24px;
  }
  .deck-modal-backdrop.open { display: flex; }
  .deck-modal {
    background: var(--du-surface); border-radius: 14px; max-width: 620px; width: 100%;
    padding: 30px 32px; position: relative; max-height: 90vh; overflow-y: auto;
    box-shadow: 0 40px 80px -24px rgba(0,0,0,.45); animation: deckRise .26s cubic-bezier(.2,.8,.2,1);
  }
  .deck-modal::before { content: ""; position: absolute; top: 0; left: 24px; right: 24px; height: 4px; background: var(--deck-accent, var(--brand-red)); border-radius: 0 0 4px 4px; }
  @keyframes deckRise { from { opacity: 0; transform: translateY(16px) scale(.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
  .deck-modal-close {
    position: absolute; top: 12px; right: 12px; width: 30px; height: 30px; border: none; border-radius: 50%;
    background: var(--du-surface-2); color: var(--du-ink); cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
  }
  .deck-modal-close:hover { background: var(--du-ink); color: var(--du-surface); }
  .deck-modal-head { display: flex; align-items: flex-end; gap: 18px; padding-bottom: 16px; border-bottom: 1px solid var(--du-border); margin-bottom: 18px; }
  .deck-modal-head .dm-jp { font-family: 'Noto Sans JP', sans-serif; font-size: 64px; font-weight: 700; color: var(--du-ink); line-height: .9; white-space: nowrap; }
  .deck-modal-head .dm-info { display: flex; flex-direction: column; gap: 3px; padding-bottom: 4px; }
  .deck-modal-head .dm-cat { font-size: 10.5px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--deck-accent, var(--brand-red)); }
  .deck-modal-head .dm-kana { font-family: 'Noto Sans JP', sans-serif; font-size: 19px; color: var(--du-ink-2); font-weight: 500; }
  .deck-modal-head .dm-romaji { font-size: 13px; font-style: italic; color: var(--du-ink-3); letter-spacing: 0.03em; }
  .deck-modal-head .dm-arti { font-size: 15px; font-weight: 600; color: var(--du-ink); margin-top: 3px; }
  .deck-modal-head .dm-headaudio {
    margin-left: auto; flex-shrink: 0; width: 36px; height: 36px; border-radius: 50%;
    border: 1px solid var(--du-border); background: var(--du-surface); color: var(--du-ink); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; transition: all .15s; align-self: center;
  }
  .deck-modal-head .dm-headaudio:hover { background: var(--deck-accent, var(--brand-red)); color: #fff; border-color: var(--deck-accent, var(--brand-red)); }
  .deck-modal-head .dm-headaudio.playing { background: var(--deck-accent, var(--brand-red)); color: #fff; border-color: var(--deck-accent, var(--brand-red)); animation: pulse 0.9s infinite; }
  .deck-modal-label { font-size: 10px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--du-ink-3); margin-bottom: 10px; display: flex; align-items: center; gap: 10px; }
  .deck-modal-label::after { content: ""; flex: 1; height: 1px; background: var(--du-border); }
  .deck-ex-list { display: flex; flex-direction: column; gap: 10px; }
  .deck-ex { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; background: var(--du-surface-2); border-radius: 8px; border-left: 3px solid var(--deck-accent, var(--brand-red)); }
  .deck-ex .de-num { font-size: 10px; font-weight: 700; letter-spacing: 0.16em; color: var(--deck-accent, var(--brand-red)); padding-top: 5px; min-width: 20px; }
  .deck-ex .de-text { flex: 1; min-width: 0; }
  .deck-ex .de-jp { font-family: 'Noto Sans JP', sans-serif; font-size: 19px; font-weight: 500; line-height: 1.45; color: var(--du-ink); margin-bottom: 4px; }
  .deck-ex .de-jp .hi { color: var(--deck-accent, var(--brand-red)); font-weight: 700; }
  .deck-ex .de-kana { font-family: 'Noto Sans JP', sans-serif; font-size: 13px; color: var(--du-ink-3); line-height: 1.4; margin-bottom: 4px; }
  .deck-ex .de-id { font-size: 13.5px; color: var(--du-ink-2); line-height: 1.5; font-style: italic; }
  .deck-ex .de-play {
    flex-shrink: 0; width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--du-border);
    background: var(--du-surface); color: var(--du-ink); cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
    transition: all .15s; margin-top: 2px;
  }
  .deck-ex .de-play:hover { background: var(--deck-accent, var(--brand-red)); color: #fff; border-color: var(--deck-accent, var(--brand-red)); transform: scale(1.08); }
  .deck-ex .de-play.playing { background: var(--deck-accent, var(--brand-red)); color: #fff; border-color: var(--deck-accent, var(--brand-red)); animation: pulse 0.9s infinite; }
  .deck-ex-empty { font-size: 13px; color: var(--du-ink-3); font-style: italic; }
  .deck-modal-nav {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--du-border);
  }
  .deck-modal-nav button {
    display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px;
    border: 1px solid var(--du-border); background: var(--du-surface); color: var(--du-ink);
    border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all .15s;
    font-family: inherit;
  }
  .deck-modal-nav button:hover:not(:disabled) {
    background: var(--deck-accent, var(--brand-red)); color: #fff; border-color: var(--deck-accent, var(--brand-red));
  }
  .deck-modal-nav button:disabled { opacity: .35; cursor: not-allowed; }
  .deck-modal-nav .dm-counter {
    font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--du-ink-3); font-variant-numeric: tabular-nums;
  }
  @media (max-width: 600px) {
    .deck-modal-head .dm-jp { font-size: 44px; }
    .deck-modal { padding: 24px 18px; }
    .deck-modal-nav button { padding: 8px 10px; font-size: 12px; }
  }

  /* JLPT-style quiz / assignment paper */
  .quiz-container.quiz-paper {
    max-width: 1006px;
    margin: 0 auto;
    padding: 0;
    background: #fff;
    border: 0;
    border-radius: 0;
    box-shadow: none;
    font-family: var(--font-body);
  }
  .quiz-paper-tabs {
    display: flex;
    align-items: center;
    gap: 24px;
    margin: 2px 0 20px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .quiz-paper-tabs::-webkit-scrollbar { display: none; }
  .quiz-paper-tab {
    appearance: none;
    border: 0;
    background: transparent;
    color: #777;
    border-radius: 24px;
    padding: 11px 14px;
    font: 500 24px/1 var(--font-body);
    white-space: nowrap;
    cursor: default;
  }
  .quiz-paper-tab.active {
    background: #202020;
    color: #fff;
    padding: 14px 17px;
    font-weight: 800;
  }
  .quiz-paper-tab:disabled {
    color: #b8b8b8;
    cursor: not-allowed;
  }
  .quiz-paper-section {
    position: relative;
    border: 1px solid #d8d8d8;
    border-radius: 6px;
    padding: 38px 16px;
    margin: 0 0 36px;
  }
  .quiz-section-label {
    position: absolute;
    top: -25px;
    left: 11px;
    background: #fff;
    border: 1px solid #d8d8d8;
    border-radius: 7px;
    padding: 10px 16px;
    color: #161a1d;
    font-size: 24px;
    font-weight: 800;
  }
  /* JLPT-style section: kotak label "Section N" tab di atas border kiri,
     mondai instruction big font sebagai konten utama. Match desain JLPT
     real test (Todai pattern). */
  .jlpt-section {
    position: relative;
    border: 1px solid #2a2a2a;
    border-radius: 4px;
    padding: 28px 18px 22px;
    margin: 12px 0 26px;
    background: #fff;
  }
  .jlpt-section-tab {
    position: absolute;
    top: -16px; left: 16px;
    display: inline-block;
    padding: 5px 14px;
    background: #fff;
    border: 1px solid #2a2a2a;
    border-radius: 4px;
    font-size: 14px;
    font-weight: 800;
    color: #1a1a1a;
    letter-spacing: 0.02em;
  }
  .jlpt-mondai {
    font-size: clamp(15px, 1.8vw, 18px);
    font-weight: 600;
    line-height: 1.85;
    color: #111;
    font-family: 'Noto Sans JP', sans-serif;
  }
  .jlpt-mondai strong { font-weight: 800; }
  /* Dokkai: passage bacaan di atas grup soal (reading / 文章の文法) */
  .quiz-passage {
    margin: 4px 0 18px;
    padding: 18px 20px;
    background: #fffdf7;
    border: 1px solid var(--du-border, #ece9e3);
    border-left: 4px solid #B20024;
    border-radius: 10px;
    font-family: 'Noto Sans JP', serif;
    font-size: clamp(15px, 1.7vw, 17px);
    line-height: 2;
    color: #1B1410;
    white-space: normal;
  }
  /* 情報検索: passage berformat pengumuman (judul + baris label：nilai)
     dirender sebagai flyer ala lembar soal JLPT — bingkai hitam, judul
     center, tabel info. Deteksi format di renderQuizPassage(). */
  .quiz-notice {
    background: #fff;
    border: 2px solid #2a2a2a;
    border-left: 2px solid #2a2a2a;
    border-radius: 4px;
    padding: 16px 18px;
    max-width: 560px;
    margin-left: auto;
    margin-right: auto;
    line-height: 1.8;
  }
  .quiz-notice-title {
    text-align: center;
    font-weight: 800;
    font-size: clamp(16px, 2vw, 19px);
    padding-bottom: 10px;
    margin-bottom: 12px;
    border-bottom: 2px solid #2a2a2a;
  }
  .quiz-notice-rows {
    width: 100%;
    border-collapse: collapse;
  }
  .quiz-notice-rows th,
  .quiz-notice-rows td {
    border-bottom: 1px solid #e5e0d8;
    vertical-align: top;
  }
  .quiz-notice-rows tr:last-child th,
  .quiz-notice-rows tr:last-child td {
    border-bottom: none;
  }
  .quiz-notice-rows th {
    text-align: left;
    font-weight: 600;
    white-space: nowrap;
    width: 1%;
    padding: 7px 14px 7px 0;
  }
  .quiz-notice-rows td {
    padding: 7px 0;
  }
  .quiz-notice-rows .quiz-notice-sub {
    font-weight: 700;
    padding-top: 12px;
  }
  @media (max-width: 480px) {
    .quiz-notice-rows th { white-space: normal; width: auto; }
  }
  /* Question prompt image (di atas opsi) */
  .quiz-q-image {
    margin: 12px 0 16px;
    text-align: center;
  }
  .quiz-q-image img {
    max-width: 100%;
    max-height: 320px;
    border-radius: 8px;
    border: 1px solid var(--du-border, #ece9e3);
  }
  /* Grid 2x2 opsi gambar (JLPT pattern: pilih gambar 1/2/3/4) */
  .quiz-options-image-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
    margin: 12px 0;
  }
  .quiz-image-option {
    position: relative;
    padding: 24px 12px 12px;
    background: #fff;
    border: 2px solid #2a2a2a;
    border-radius: 6px;
    cursor: pointer;
    transition: border-color .15s, transform .12s, box-shadow .15s;
    font: inherit;
    text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    min-height: 180px;
  }
  .quiz-image-option:hover:not(.disabled) {
    border-color: var(--brand-red);
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(200, 16, 46, .12);
  }
  .quiz-image-option.disabled { cursor: default; opacity: .85; }
  .quiz-image-option.correct {
    border-color: #15803d; background: #f0fdf4;
  }
  .quiz-image-option.wrong {
    border-color: #b91c1c; background: #fef2f2;
  }
  .qio-num {
    position: absolute;
    top: 6px; left: 10px;
    font-size: 18px;
    font-weight: 800;
    color: #1a1a1a;
  }
  .quiz-image-option.correct .qio-num { color: #15803d; }
  .quiz-image-option.wrong .qio-num { color: #b91c1c; }
  .qio-img {
    max-width: 100%; max-height: 180px;
    object-fit: contain;
    border-radius: 4px;
  }
  .qio-text {
    font-size: 18px; font-weight: 700; color: #1a1a1a;
    padding: 24px 8px;
  }
  .qio-caption {
    font-size: 12px; color: #525252; margin-top: auto;
    font-family: 'Noto Sans JP', sans-serif;
  }
  @media (max-width: 600px) {
    .quiz-options-image-grid { gap: 10px; }
    .quiz-image-option { min-height: 140px; padding: 22px 8px 10px; }
    .qio-img { max-height: 120px; }
  }
  .quiz-instruction {
    color: #111820;
    font-size: clamp(20px, 2.3vw, 25px);
    line-height: 1.35;
    font-weight: 800;
    letter-spacing: 0;
  }
  .quiz-paper-list {
    display: grid;
    gap: 34px;
  }
  .quiz-paper-item {
    display: grid;
    gap: 22px;
  }
  .quiz-question.quiz-paper-question {
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 10px;
    margin: 0;
    color: #111820;
    font-size: clamp(20px, 2.1vw, 24px);
    line-height: 1.45;
    font-weight: 800;
    letter-spacing: 0;
  }
  .quiz-paper-number { font-weight: 900; }
  /* Soal label JLPT-style: "1ばん", "れい", dst. Render kalau q.q ada
     (admin isi text body) — sebagai prefix sebelum text. */
  .quiz-paper-label {
    display: inline-block;
    padding: 4px 12px;
    background: #1a1a1a;
    color: #fff;
    border-radius: 4px;
    font-size: 14px;
    font-weight: 800;
    font-family: 'Noto Sans JP', sans-serif;
    margin-right: 8px;
    flex-shrink: 0;
  }
  /* Kalau q.q kosong (mayoritas soal listening JLPT), render label saja
     — gak ada question text body. Bold, padding cukup, sebelum image grid. */
  .quiz-paper-label-only {
    display: inline-block;
    padding: 5px 14px;
    background: #1a1a1a;
    color: #fff;
    border-radius: 4px;
    font-size: 16px;
    font-weight: 800;
    font-family: 'Noto Sans JP', sans-serif;
    margin: 16px 0 10px;
  }
  .quiz-q-text { font-family: 'Noto Sans JP', sans-serif; }
  .quiz-paper-jp,
  .quiz-paper-question u {
    text-decoration: underline;
    text-underline-offset: 3px;
    text-decoration-thickness: 1px;
  }
  /* Listening JLPT-style: hidden transcript revealed post-answer */
  .quiz-q-listen-btn {
    display: inline-flex; align-items: center; gap: 6px;
    margin: 6px 0 14px;
    padding: 8px 14px;
    background: #1a1a1a; color: #fff;
    border: none; border-radius: 999px;
    font: inherit; font-size: 13px; font-weight: 600;
    cursor: pointer;
    transition: background .15s, transform .12s;
  }
  .quiz-q-listen-btn:hover { background: var(--brand-red); }
  .quiz-q-listen-btn:active { transform: scale(0.97); }
  .quiz-q-listen-btn.playing { background: var(--brand-red); animation: pulse 0.9s infinite; }
  .quiz-listen-transcript {
    margin-top: 14px;
    font-size: 13px;
  }
  .quiz-listen-transcript > summary {
    cursor: pointer;
    font-weight: 600; color: #4a4a4a;
    list-style: none;
    user-select: none;
  }
  .quiz-listen-transcript > summary::before {
    content: "▾ "; color: #6a6a6a;
  }
  .quiz-listen-transcript[open] > summary::before { content: "▴ "; }
  .quiz-listen-transcript > pre {
    margin: 8px 0 0;
    padding: 10px 14px;
    background: #fff;
    border: 1px solid #e5e5e5;
    border-radius: 6px;
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 14px; line-height: 1.7;
    white-space: pre-wrap; word-break: break-word;
  }

  /* Listening tab: centralized audio player — light theme JLPT-style.
     Cream background dengan border merah brand, match dashboard. */
  .quiz-listening-player {
    position: sticky; top: 12px; z-index: 5;
    margin: 0 0 24px;
    padding: 18px 20px 16px;
    background: #fff;
    color: #1a1a1a;
    border: 1px solid #e5e7eb;
    border-top: 3px solid var(--brand-red);
    border-radius: 12px;
    box-shadow: 0 4px 12px rgba(20, 20, 30, .06);
  }
  /* ── Dialog Contoh — chat-bubble redesign ─────────────────────────
     Tiap pembicara punya avatar + bubble berwarna di sisinya sendiri
     (kiri/kanan), narator jadi kartu "Situasi" di atas, terjemahan bisa
     tap-to-reveal. Highlight per-kata (gk-word) tetap dari aligned TTS. */
  .grammar-karaoke {
    margin: 12px 0 0;
    background: #fff;
    border: 1px solid #f0e5de;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 1px 0 rgba(27,20,16,0.04), 0 12px 32px rgba(27,20,16,0.05);
  }
  /* toolbar */
  .gk-toolbar {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 12px 14px;
    background: #fffbf7;
    border-bottom: 1px solid #f4ece6;
  }
  .gk-play {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--brand-red); color: #fff; border: none;
    padding: 9px 16px; border-radius: 11px;
    font-size: 13px; font-weight: 800; cursor: pointer; white-space: nowrap;
    box-shadow: 0 3px 0 #b81e18;
    transition: transform .08s, box-shadow .08s;
  }
  .gk-play:hover { transform: translateY(-1px); box-shadow: 0 4px 0 #b81e18; }
  .gk-play:active { transform: translateY(2px); box-shadow: 0 1px 0 #b81e18; }
  .gk-play:disabled { opacity: .6; cursor: default; transform: none; box-shadow: 0 3px 0 #b81e18; }
  .gk-seg { display: inline-flex; background: #f4ece6; border-radius: 10px; padding: 3px; gap: 2px; }
  .gk-seg-btn {
    border: 0; cursor: pointer; font: inherit;
    background: transparent; color: #9a8a82;
    font-weight: 800; font-size: 11.5px; padding: 5px 9px; border-radius: 8px;
    transition: all .12s;
  }
  .gk-seg-btn.is-on { background: #fff; color: #1b1410; box-shadow: 0 1px 3px rgba(27,20,16,0.12); }
  .gk-tool-div { width: 1px; height: 20px; background: #eee2db; margin: 0 1px; }
  .gk-arti-toggle {
    border: 0; cursor: pointer; font: inherit; white-space: nowrap;
    background: #1b1410; color: #fff;
    font-weight: 800; font-size: 11.5px; padding: 7px 12px; border-radius: 9px;
    transition: all .12s;
  }
  .grammar-karaoke[data-arti="off"] .gk-arti-toggle { background: #f4ece6; color: #9a8a82; }
  .gk-status { font-size: 11.5px; color: #9a8a82; margin-left: auto; }
  /* scene setter (narator → "Situasi") */
  .gk-transcript { padding: 12px 14px 4px; }
  .gk-scene {
    text-align: center; max-width: 540px; margin: 0 auto 12px;
    padding-bottom: 10px; border-bottom: 1px dashed #ece0d8;
  }
  .gk-scene-tag {
    display: inline-block; font-size: 9px; font-weight: 900; letter-spacing: 0.14em;
    color: #b89a55; background: #fbf3e2; padding: 2px 9px; border-radius: 999px;
    text-transform: uppercase; margin-bottom: 6px;
    font-family: 'Noto Sans JP', sans-serif;
  }
  .gk-scene-line { cursor: pointer; border-radius: 8px; padding: 3px 8px; transition: background .15s ease; }
  .gk-scene-line:hover { background: rgba(178,0,36,0.04); }
  .gk-scene-line.gk-line-active { background: rgba(178,0,36,0.07); }
  .gk-scene-line .gk-text { font-size: 15px; color: #5a4a42; line-height: 1.45; }
  .gk-scene-line .gk-line-id { margin-top: 2px; color: #9a8a82; font-size: 12px; }
  /* conversation bubbles */
  .gk-text { font-family: 'Noto Sans JP', sans-serif; }
  .gk-bubbles { display: flex; flex-direction: column; }
  .gk-line { display: flex; gap: 8px; align-items: flex-end; margin-bottom: 8px; }
  .gk-side-right { flex-direction: row-reverse; }
  .gk-avatar {
    flex: 0 0 30px; width: 30px; height: 30px; border-radius: 50%;
    background: var(--sp, var(--brand-red)); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Noto Sans JP', sans-serif; font-weight: 900; font-size: 12px;
    box-shadow: 0 2px 6px rgba(27,20,16,0.12); margin-bottom: 1px;
    transition: box-shadow .2s ease;
  }
  .gk-line.gk-line-active .gk-avatar { box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--sp, var(--brand-red)); }
  .gk-bubble-col { max-width: 80%; display: flex; flex-direction: column; }
  .gk-side-right .gk-bubble-col { align-items: flex-end; }
  .gk-name { font-size: 10px; font-weight: 800; color: var(--sp-deep, var(--brand-red)); margin-bottom: 1px; padding: 0 4px; letter-spacing: 0.02em; }
  .gk-bubble {
    background: var(--sp-bubble, #fff);
    border: 1.5px solid #f0e5de;
    border-radius: 13px 13px 13px 4px;
    padding: 7px 10px;
    transition: border-color .2s ease, box-shadow .2s ease, transform .2s ease;
  }
  .gk-side-right .gk-bubble { border-radius: 13px 13px 4px 13px; }
  .gk-line.gk-line-active .gk-bubble {
    border-color: var(--sp, var(--brand-red));
    box-shadow: 0 4px 12px color-mix(in srgb, var(--sp, var(--brand-red)) 15%, transparent);
    transform: translateY(-1px);
  }
  .gk-bubble-main { display: flex; align-items: flex-start; gap: 7px; }
  .gk-bubble-main .gk-text { flex: 1; min-width: 0; font-size: 15.5px; line-height: 1.5; color: #1b1410; }
  .gk-line-play {
    flex: 0 0 25px; width: 25px; height: 25px; border-radius: 7px; border: 0; cursor: pointer;
    background: var(--sp-soft, #ffe7e5); color: var(--sp, var(--brand-red));
    display: flex; align-items: center; justify-content: center;
    transition: filter .15s ease, background .15s ease, color .15s ease; margin-top: 1px;
  }
  .gk-line-play:hover { filter: brightness(0.96); }
  .gk-line.gk-line-active .gk-line-play { background: var(--sp, var(--brand-red)); color: #fff; }
  /* arti reveal */
  .gk-arti { margin-top: 4px; }
  .gk-reveal {
    display: inline-flex; align-items: center; gap: 5px;
    border: 0; background: transparent; cursor: pointer; padding: 0;
    color: var(--sp, var(--brand-red)); font-weight: 800; font-size: 11.5px;
    font-family: inherit; letter-spacing: 0.01em;
  }
  /* arti modes — scoped ke bubble (scene selalu tampil). */
  .grammar-karaoke[data-arti="always"] .gk-bubbles .gk-reveal { display: none; }
  .grammar-karaoke[data-arti="off"] .gk-bubbles .gk-reveal,
  .grammar-karaoke[data-arti="off"] .gk-bubbles .gk-line-id { display: none; }
  .grammar-karaoke[data-arti="tap"] .gk-bubbles .gk-line-id { display: none; }
  .grammar-karaoke[data-arti="tap"] .gk-bubbles .gk-line.gk-revealed .gk-line-id { display: block; animation: gkReveal .28s ease; }
  .grammar-karaoke[data-arti="tap"] .gk-bubbles .gk-line.gk-revealed .gk-reveal { display: none; }
  @keyframes gkReveal { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; transform: none; } }
  /* word-level karaoke highlight (dari aligned TTS) */
  .gk-punct { color: inherit; }
  .gk-word { border-radius: 4px; padding: 0 1px; transition: color .1s, background .1s; }
  .gk-word.gk-done { color: #1a1a1a; }
  .gk-word.gk-active { color: #fff; background: var(--sp, var(--brand-red)); padding: 1px 3px; }
  .qlp-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
  }
  .qlp-title {
    font-size: 12px; font-weight: 800;
    letter-spacing: .06em; text-transform: uppercase;
    color: var(--brand-red);
  }
  .qlp-track-label {
    font-size: 12px; color: #6b7280;
  }
  .qlp-track-label strong { color: #1a1a1a; font-weight: 800; font-size: 14px; }
  .qlp-controls {
    display: flex; align-items: center; justify-content: center;
    gap: 14px;
    margin: 8px 0 12px;
  }
  .qlp-btn {
    display: inline-flex; align-items: center; justify-content: center;
    background: #f9fafb;
    color: #1a1a1a;
    border: 1px solid #e5e7eb;
    border-radius: 999px;
    cursor: pointer;
    transition: background .12s, transform .08s, border-color .12s, color .12s;
    font: inherit; font-weight: 700;
  }
  .qlp-btn:hover { background: #f3f4f6; border-color: #d1d5db; color: #000; }
  .qlp-btn:active { transform: scale(0.94); }
  .qlp-btn:disabled { opacity: .35; cursor: not-allowed; }
  .qlp-skip { width: 46px; height: 46px; font-size: 12px; }
  .qlp-step { width: 38px; height: 38px; font-size: 16px; }
  .qlp-play {
    width: 60px; height: 60px; font-size: 22px;
    background: var(--brand-red);
    color: #fff;
    border-color: transparent;
    box-shadow: 0 4px 10px rgba(200, 16, 46, .25);
  }
  .qlp-play:hover {
    background: #d72121;
    color: #fff;
    border-color: transparent;
    box-shadow: 0 6px 14px rgba(200, 16, 46, .35);
  }
  .qlp-bar-wrap {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 8px;
  }
  .qlp-bar {
    flex: 1; height: 4px;
    -webkit-appearance: none; appearance: none;
    background: #e5e7eb;
    border-radius: 999px;
    outline: none;
    cursor: pointer;
    accent-color: var(--brand-red);
  }
  .qlp-bar::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 14px; height: 14px;
    background: var(--brand-red); border-radius: 50%;
    cursor: pointer;
    box-shadow: 0 2px 4px rgba(0,0,0,.15);
  }
  .qlp-bar::-moz-range-thumb {
    width: 14px; height: 14px;
    background: var(--brand-red); border-radius: 50%;
    border: none; cursor: pointer;
  }
  .qlp-time {
    font-size: 12px; color: #6b7280;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  /* Jeda antar dialog — countdown text. */
  .qlp-jeda {
    min-height: 18px;
    text-align: center;
    font-size: 12px;
    color: var(--brand-red);
    margin: 4px 0 6px;
    font-style: italic;
    font-weight: 600;
  }
  .qlp-tracklist {
    display: flex; flex-wrap: wrap; gap: 6px;
    padding-top: 10px;
    border-top: 1px solid #e5e7eb;
  }
  .qlp-track {
    min-width: 30px; height: 30px;
    padding: 0 10px;
    background: #f9fafb;
    color: #4b5563;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    font: inherit; font-size: 12px; font-weight: 700;
    cursor: pointer;
    transition: background .12s, color .12s, border-color .12s;
  }
  .qlp-track:hover { background: #f3f4f6; color: #1a1a1a; }
  .qlp-track.active {
    background: var(--brand-red); color: #fff;
    border-color: transparent;
    box-shadow: 0 2px 6px rgba(200, 16, 46, .25);
  }
  .qlp-track.done {
    color: #15803d;
    background: #f0fdf4;
    border-color: #bbf7d0;
  }
  @media (max-width: 700px) {
    .quiz-listening-player { padding: 14px 14px 12px; border-radius: 12px; }
    .qlp-controls { gap: 12px; }
    .qlp-play { width: 56px; height: 56px; font-size: 20px; }
    .qlp-skip { width: 42px; height: 42px; }
    .qlp-step { width: 34px; height: 34px; }
  }
  .quiz-paper-item.is-listening-active {
    box-shadow: 0 0 0 3px rgba(255, 35, 35, .14);
    border-radius: 8px;
    transition: box-shadow .25s;
  }
  .quiz-paper .quiz-options {
    display: grid;
    gap: 11px;
  }
  .quiz-paper .quiz-option {
    min-height: 59px;
    padding: 16px;
    background: #efefef;
    border: 0;
    border-left: 0;
    border-radius: 6px;
    box-shadow: none;
    color: #111820;
    font-size: 20px;
    font-weight: 800;

  }
  .quiz-paper .quiz-option:hover:not(.disabled) {
    background: #e4e4e4;
    border: 0;
    transform: none;
    box-shadow: none;
  }
  .quiz-paper .quiz-option-letter {
    width: auto;
    height: auto;

    background: transparent;

    border-radius: 0;

  }
  .quiz-paper .quiz-option.correct {
    background: #e4f7e8;
    color: var(--success);
  }
  .quiz-paper .quiz-option.wrong {
    background: #fde8e8;
    color: var(--danger);
  }
  .quiz-paper .quiz-option.correct .quiz-option-letter,
  .quiz-paper .quiz-option.wrong .quiz-option-letter {
    background: transparent;
    color: inherit;
  }
  .quiz-paper .quiz-explanation {
    margin-top: -8px;
    border-radius: 6px;

  }
  .quiz-feedback .quiz-next-btn { display: none; }
  .quiz-paper-actions {
    display: flex;
    align-items: center;
    justify-content: space-between;

    margin-top: 34px;
    padding-top: 22px;

  @media (max-width: 700px) {
    .quiz-paper-tab { font-size: 20px; }
    .quiz-paper-tab.active { padding: 12px 16px; }
    .quiz-paper-section { padding: 32px 14px 28px; }
    .quiz-section-label { font-size: 20px; }
    .quiz-paper .quiz-option { min-height: 54px; font-size: 18px; }
    .quiz-paper-actions { align-items: stretch; flex-direction: column; }
  }

  /* ── Daftar Kanji (mirror Daftar Kosakata pattern) ── */
  .kanji-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    gap: 10px;
    padding: 12px 0 4px;
  }
  .kanji-tile {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px;
    min-height: 110px;
    padding: 12px 8px 10px;
    background: var(--surface-white, #fff);
    border: 1px solid var(--du-border, #ece9e3);
    border-radius: 12px;
    cursor: pointer;
    transition: border-color .15s, transform .12s, box-shadow .15s;
    font: inherit;
    color: inherit;
    text-align: center;
  }
  .kanji-tile:hover {
    border-color: var(--brand-red);
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(200, 16, 46, .08);
  }
  .kanji-tile-char {
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 42px; font-weight: 700; line-height: 1;
    color: #1a1a1a;
  }
  .kanji-tile-meaning {
    font-size: 11px; color: #6b6b6b;
    line-height: 1.2;
    max-width: 100%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .kanji-tile-level {
    font-size: 9px; font-weight: 800;
    color: var(--brand-red); letter-spacing: .04em;
  }

  @keyframes kanjiFade { from { opacity: 0; } to { opacity: 1; } }
  .kanji-detail-modal {
    background: #fff;
    border-radius: 16px;
    width: 100%; max-width: 720px;
    max-height: 90vh;
    overflow-y: auto;
    padding: 0;

  }
  .kanji-detail-head {

    padding: 24px 28px 20px;

  .kanji-detail-stroke {

  .kanji-detail-info { flex: 1; min-width: 0; }

  .kanji-detail-meaning {

  .kanji-detail-chips {

  .kanji-chip {

  .kanji-detail-readings {

  .kanji-reading-row {

<script>
// ═══════════════════════════════════════════════
// AUTH GUARD — self-hosted API session
// ═══════════════════════════════════════════════
let session = JSON.parse(localStorage.getItem('ez_user') || 'null');
if (!session) {
  window.location.replace('login.html?next=welcome.html');
}
// NOTE: authoritative session check (ezGetMe) now lives inside the init IIFE
// below so we can guarantee it finishes before any rendering decision. The
// old parallel version raced the render path — a stale localStorage ez_user +
// expired refresh cookie could flash paywall before the redirect fired.

// ═══════════════════════════════════════════════
// CONTENT DATA — source of truth is the admin CMS (/api/courses/:slug).
// Courses/modules/lessons are hydrated per-enrolled-course on load.
// Quiz questions are lazy-loaded on demand (first "Mulai Kuis" click).
// Flashcards remain static JSON (out of CMS scope for now).
// ═══════════════════════════════════════════════
let COURSE_CONTENT = {};
let QUIZ_DATA = {};
let FLASHCARD_DATA = {};

// Migration stored lesson content as: body + '\n\n<div class="jp">...</div>'.
// Split it back into the {body, jp} pair the dashboard renders with.
function splitJpFromContent(content) {
  if (!content) return { body: '', jp: '' };
  const m = content.match(/^([\s\S]*?)\s*<div class="jp">([\s\S]*?)<\/div>\s*$/);
  if (m) return { body: m[1].trim(), jp: m[2].trim() };
  return { body: content, jp: '' };
}

function transformCourseFromApi(apiCourse) {
  return {
    name: apiCourse.title || apiCourse.slug,
    tagline: apiCourse.description || '',
    price: '',
    modules: (apiCourse.modules || []).map((m, mi) => ({
      id: m.slug,
      num: String(mi + 1).padStart(2, '0'),
      title: m.title,
      titleEn: m.title_en || '',
      jfTopic: m.jf_topic || '',
      cefrLevel: m.cefr_level || '',
      sectionName: (m.section_name && m.section_name.trim()) || '',
      totalMinutes: m.total_minutes || null,
      scenario: m.scenario || '',
      candoStatements: Array.isArray(m.cando_statements) ? m.cando_statements : [],
      skillDistribution: (m.skill_distribution && typeof m.skill_distribution === 'object') ? m.skill_distribution : {},
      quizSpec: (m.quiz_spec && typeof m.quiz_spec === 'object') ? m.quiz_spec : {},
      vocabulary: Array.isArray(m.vocabulary) ? m.vocabulary : [],
      grammar: Array.isArray(m.grammar) ? m.grammar : [],
      lessons: (m.lessons || []).map((l) => {
        const { body, jp } = splitJpFromContent(l.content || '');
        return {
          id: l.slug,
          apiId: l.id, // UUID — needed to lazy-load quiz questions
          title: l.title,
          type: l.type || 'text',
          duration: l.duration_minutes ? `${l.duration_minutes} min` : '',
          durationMinutes: Number(l.duration_minutes) || 0,
          body,
          jp,
          vocabulary: Array.isArray(l.vocabulary) ? l.vocabulary : [],
          grammar: Array.isArray(l.grammar) ? l.grammar : [],

function normalizeQuizCategory(value) {
  return QUIZ_CATEGORY_META[value] ? value : 'vocabulary';
}

// Migration stored quiz prompts as "q\n\njp" (or just "q" if no jp). Split
// back, then match the shape the existing quiz engine expects.
// Note: the `correct` index is intentionally absent here — the API never
// reveals which option is right. pickQuizAnswer() resolves it per click via
// POST /api/lessons/:id/quiz/check, and finishQuiz() scores authoritatively
// via /quiz-attempt.
function transformQuestionFromApi(apiQ) {
  const prompt = apiQ.question || '';
  const parts = prompt.split(/\n\n/);
  const q = parts[0] || '';
  const jp = parts.slice(1).join('\n\n').trim() || '';
  const sorted = (apiQ.options || []).slice().sort((a, b) => (a.sort_order ?? 0) - (b.sort_order ?? 0));
  const options = sorted.map((o) => o.option_text);
  const optionImages = sorted.map((o) => o.image_url || o.imageUrl || '');
  const optionIds = sorted.map((o) => o.id);
  return {
    q, jp, options, optionIds, optionImages,
    correct: -1,
    explain: apiQ.explanation || '',
    questionId: apiQ.id,
    category: normalizeQuizCategory(apiQ.question_category || apiQ.questionCategory),
    sectionNumber: Number(apiQ.section_number || apiQ.sectionNumber) || 1,
    sectionLabel: apiQ.section_label || apiQ.sectionLabel || `Section ${Number(apiQ.section_number || apiQ.sectionNumber) || 1}`,
    sectionInstruction: apiQ.section_instruction || apiQ.sectionInstruction || '',
    audioScript: apiQ.audio_script || apiQ.audioScript || '',
    passage: apiQ.passage || '',
    imageUrl: apiQ.image_url || apiQ.imageUrl || '',
  };
}

async function hydrateEnrolledCourses() {
  const enrolled = getEnrolledCourses();
  const missing = enrolled.filter((slug) => !COURSE_CONTENT[slug]);
  if (missing.length === 0) return;
  const results = await Promise.allSettled(
    missing.map((slug) =>
      fetch(`/api/courses/${encodeURIComponent(slug)}`, { credentials: 'include' })
        .then((r) => (r.ok ? r.json() : null))
    )
  );
  missing.forEach((slug, i) => {
    const r = results[i];
    if (r.status !== 'fulfilled' || !r.value?.course) return;
    COURSE_CONTENT[slug] = transformCourseFromApi(r.value.course);
  });
}

// Quiz status — fetched dari /quiz-status endpoint sebelum render
// landing card. Cached 60s di memory supaya retry / re-navigate ke
// lesson yang sama feels instant. Cache di-invalidate setelah
// startQuizAttempt / finishQuiz (status pasti berubah).
const _quizStatusCache = new Map();
// 15s TTL — admin update lesson meta (cooldown_hours, passing_score_pct,
// questions_per_attempt) di prod harus visible ke student dalam ~15s.
// Trade-off vs 60s sebelumnya: lebih sering hit server tapi data fresh.
const QUIZ_STATUS_TTL = 15 * 1000;

function invalidateQuizStatus(lessonApiId) {
  if (lessonApiId) _quizStatusCache.delete(lessonApiId);
}

async function fetchQuizStatus(lessonApiId, opts = {}) {
  const cached = _quizStatusCache.get(lessonApiId);
  if (!opts.force && cached && (Date.now() - cached.ts) < QUIZ_STATUS_TTL) {
    return cached.data;
  }
  try {
    const r = await window.ezApi(`/progress/lesson/${encodeURIComponent(lessonApiId)}/quiz-status`);
    if (!r.ok) return null;
    const data = await r.json();
    _quizStatusCache.set(lessonApiId, { ts: Date.now(), data });
    return data;
  } catch (err) {
    console.warn('fetchQuizStatus failed:', err?.message || err);
    return null;
  }
}

function findLesson(courseSlug, moduleId, lessonId) {
  const course = COURSE_CONTENT[courseSlug];
  if (!course) return null;
  const mod = course.modules.find((m) => m.id === moduleId);
  if (!mod) return null;
  return mod.lessons.find((l) => l.id === lessonId) || null;
}

// Single source of truth: server (user_enrollments table). localStorage is a
// cache so the rest of the UI can stay sync. syncEnrollmentsFromServer() is
// called on page load (and again after a new enrollment) to keep the cache
// fresh — never trust localStorage alone for access decisions.
function getEnrolledCourses() {
  try { return JSON.parse(localStorage.getItem('ez_courses') || '[]'); }
  catch { return []; }
}
async function syncEnrollmentsFromServer() {
  if (typeof window.ezApi !== 'function') return getEnrolledCourses();
  try {
    const res = await window.ezApi('/enrollments/me');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const slugs = (data.enrollments || []).map(e => e.slug).filter(Boolean);
    localStorage.setItem('ez_courses', JSON.stringify(slugs));
    return slugs;
  } catch (err) {
    // Let the caller decide what to do about expired sessions — otherwise we
    // silently fall back to (possibly empty) localStorage and render the
    // paywall even though the real problem is "please log in again."
    if (err && err.message === 'AUTH_EXPIRED') throw err;
    // Offline / server hiccup — fall back to whatever we had cached so the
    // dashboard still renders. Access is revalidated on next successful sync.
    return getEnrolledCourses();
  }
}
function getProgress() {
  try { return JSON.parse(localStorage.getItem('ez_progress') || '{}'); }
  catch { return {}; }
}
function setProgress(obj) {
  localStorage.setItem('ez_progress', JSON.stringify(obj));
  _scheduleCloudPush();
}

// ── Sync progres lintas device (blob per user, mirror kanji_progress) ──
// Progres + skor kuis disimpan di localStorage (per-device) lalu di-push ke
// /api/learning-state supaya ikut akun. Boot menarik blob & union-merge.
let _cloudPushTimer = null;
function _scheduleCloudPush() {
  if (typeof window.ezApi !== 'function') return;
  clearTimeout(_cloudPushTimer);
  _cloudPushTimer = setTimeout(pushLearningStateToCloud, 1200);
}
async function pushLearningStateToCloud() {
  if (typeof window.ezApi !== 'function') return;
  try {
    const progress = getProgress();
    const quizScores = JSON.parse(localStorage.getItem('ez_quiz_scores') || '{}');
    await window.ezApi('/learning-state', {
      method: 'PUT',
      body: JSON.stringify({ progress, quizScores }),
    });
  } catch {}
}
function _mergeProgress(a, b) {
  const out = JSON.parse(JSON.stringify(a || {}));
  for (const c in (b || {})) out[c] = Object.assign({}, out[c], b[c]);
  return out;
}
function _mergeQuizScores(a, b) {
  const out = { ...(a || {}) };
  for (const k in (b || {})) out[k] = Math.max(out[k] || 0, b[k] || 0);
  return out;
}
// Tarik blob server saat boot, union-merge dengan localStorage (completion
// monoton — sekali selesai tetap selesai), lalu push balik supaya item
// lokal-only ikut naik ke cloud. Gagal/offline → diam, pakai localStorage.
// Return true bila localStorage berubah (caller bisa re-render tanda ✓).
async function syncLearningStateFromServer() {
  if (typeof window.ezApi !== 'function') return false;
  try {
    const res = await window.ezApi('/learning-state');
    if (!res.ok) return false;
    const cloud = await res.json();
    const beforeP = localStorage.getItem('ez_progress') || '{}';
    const afterP = JSON.stringify(_mergeProgress(cloud.progress || {}, getProgress()));
    localStorage.setItem('ez_progress', afterP);
    const beforeQ = localStorage.getItem('ez_quiz_scores') || '{}';
    const afterQ = JSON.stringify(_mergeQuizScores(cloud.quizScores || {}, JSON.parse(beforeQ)));
    localStorage.setItem('ez_quiz_scores', afterQ);
    _scheduleCloudPush();
    return beforeP !== afterP || beforeQ !== afterQ;
  } catch {}
  return false;
}

const DAILY_GOAL_XP = 30;

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function yesterdayStr() {
  const d = new Date(Date.now() - 86400000);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function getStats() {
  try {
    const s = JSON.parse(localStorage.getItem('ez_stats') || '{}');
    return { xp: s.xp || 0, streak: s.streak || 0, lastActive: s.lastActive || null, dailyXP: s.dailyXP || 0, dailyDate: s.dailyDate || null };
  } catch { return { xp: 0, streak: 0, lastActive: null, dailyXP: 0, dailyDate: null }; }
}
function saveStats(s) { localStorage.setItem('ez_stats', JSON.stringify(s)); }

function tickActivityAndStreak() {
  const s = getStats();
  const today = todayStr();
  if (s.lastActive === today) return s;
  if (s.lastActive === yesterdayStr()) s.streak = (s.streak || 0) + 1;
  else s.streak = 1;
  s.lastActive = today;
  if (s.dailyDate !== today) { s.dailyXP = 0; s.dailyDate = today; }
  saveStats(s);
  return s;
}

function addXP(amount, reason) {
  const s = tickActivityAndStreak();
  s.xp = (s.xp || 0) + amount;
  s.dailyXP = (s.dailyXP || 0) + amount;
  saveStats(s);
  showXPToast(amount, reason);
}

function fireConfetti() {
  const colors = ['var(--brand-red)', '#e11d48', '#16a34a', '#f59e0b', '#3b82f6', '#8b5cf6'];
  for (let i = 0; i < 60; i++) {
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    p.style.left = Math.random() * 100 + 'vw';
    p.style.background = colors[Math.floor(Math.random() * colors.length)];
    p.style.animationDelay = (Math.random() * 0.5) + 's';
    p.style.animationDuration = (2.5 + Math.random() * 1.5) + 's';
    if (Math.random() > 0.5) p.style.borderRadius = '50%';
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 4500);
  }
}

function showCompletion({ title, message, xp, continueLabel, onContinue, onSecondary, secondaryLabel }) {
  const overlay = document.createElement('div');
  overlay.className = 'completion-overlay show';
  overlay.innerHTML = `
    <div class="completion-modal">
      <div class="check-circle">✓</div>
      <h2>${title}</h2>
      <p>${message}</p>
      <div class="completion-actions">
        ${secondaryLabel ? `<button class="btn-secondary" id="completion-sec">${secondaryLabel}</button>` : ''}
        <button class="btn-primary" id="completion-cont">${continueLabel || 'Lanjut'}</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  fireConfetti();
  overlay.querySelector('#completion-cont').onclick = () => {
    overlay.remove();
    if (onContinue) onContinue();
  };
  const secBtn = overlay.querySelector('#completion-sec');
  if (secBtn) secBtn.onclick = () => {
    overlay.remove();
    if (onSecondary) onSecondary();
  };
}

// PRONUNCIATION (Web Speech API)
// ═══════════════════════════════════════════════
function speakJapanese(text, btn) {
  if (!('speechSynthesis' in window)) { alert('Browser kamu tidak mendukung audio TTS.'); return; }
  // Stop ElevenLabs audio yang lagi jalan (kalau ada) supaya tidak
  // overlap dengan Web Speech — bug user-report: bentrok 2 voice
  // bareng di vocab card.
  if (typeof _ttsCurrentAudio !== 'undefined' && _ttsCurrentAudio) {
    try { _ttsCurrentAudio.pause(); _ttsCurrentAudio.src = ''; } catch {}
    _ttsCurrentAudio = null;
  }
  const plain = text.replace(/<[^>]*>/g, '');
  const u = new SpeechSynthesisUtterance(plain);
  u.lang = 'ja-JP';
  u.rate = 0.9;
  if (btn) btn.classList.add('playing');
  u.onend = () => { if (btn) btn.classList.remove('playing'); };
  u.onerror = () => { if (btn) btn.classList.remove('playing'); };
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}
window.speakJapanese = speakJapanese;

function fmtCooldown(hoursLeft) {
  if (hoursLeft <= 0) return '0 jam';
  const totalMin = Math.ceil(hoursLeft * 60);
  if (totalMin < 60) return `${totalMin} menit`;
  const h = Math.floor(totalMin / 60);
  const m = totalMin % 60;
  return m === 0 ? `${h} jam` : `${h} jam ${m} menit`;
}

function fmtNextAt(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleString('id-ID', {
    day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit',
  });
}

function renderQuizLandingCard(container, key, lessonTitle, status) {
  const last = status.lastAttempt;
