window.replayKanjiStrokes = (char) => fetchAndPlayKanjiStrokes(char);

function fetchAndPlayKanjiStrokes(char) {
  const wrap = document.getElementById('kd-stroke');
  if (!wrap) return;
  const code = char.codePointAt(0).toString(16).padStart(5, '0');
  fetch(`https://raw.githubusercontent.com/KanjiVG/kanjivg/master/kanji/${code}.svg`)
    .then((r) => { if (!r.ok) throw new Error('not found'); return r.text(); })
    .then((svgText) => {
      const doc = new DOMParser().parseFromString(svgText, 'image/svg+xml');
      const strokes = [...doc.querySelectorAll('path[id*="-s"]')].map((p) => p.getAttribute('d'));
      if (strokes.length === 0) return;
      playKanjiStrokeAnim(wrap, strokes);
    })
    .catch(() => { /* keep static char visible */ });
}

// Port dari app/kanji.html:runKdAnim — dashed stroke reveal sequentially.
function playKanjiStrokeAnim(wrap, strokes) {
  if (_kanjiStrokeTimer) { clearTimeout(_kanjiStrokeTimer); _kanjiStrokeTimer = null; }
  const MS = 460;
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('viewBox', '0 0 109 109');
  strokes.forEach((d) => {
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', d);
    p.style.cssText = 'fill:none;stroke:#1a1a1a;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;opacity:0.1';
    svg.appendChild(p);
  });
  // Replace static char + replay button with animated SVG, then add replay back.
  const replayBtn = wrap.querySelector('.kanji-replay-btn');
  wrap.innerHTML = '';
  wrap.appendChild(svg);
  if (replayBtn) wrap.appendChild(replayBtn);

  const paths = svg.querySelectorAll('path');
  paths.forEach((p) => {
    const len = p.getTotalLength();
    p.style.strokeDasharray = len;
    p.style.strokeDashoffset = len;
    p.style.transition = 'none';
  });

  let i = 0;
  function next() {
    if (i >= paths.length) {
      if (paths.length > 0) {
        const last = paths[paths.length - 1];
        last.style.transition = 'stroke .15s,opacity .15s';
        last.style.stroke = '#1a1a1a'; last.style.opacity = '1';
      }
      return;
    }
    if (i > 0) {
      const prev = paths[i - 1];
      prev.style.transition = 'stroke .15s,opacity .15s';
      prev.style.stroke = '#1a1a1a'; prev.style.opacity = '1';
    }
    const p = paths[i];
    p.style.stroke = '#C41B1B'; p.style.opacity = '1';
    p.style.transition = `stroke-dashoffset ${MS}ms cubic-bezier(.4,0,.2,1)`;
    p.style.strokeDashoffset = '0';
    i++;
    _kanjiStrokeTimer = setTimeout(next, MS + 80);
  }
  _kanjiStrokeTimer = setTimeout(next, 200);
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

// Sanitize rich-text content dari admin/Notion sebelum render via innerHTML.
// Allowlist tag formatting yang dipakai rich-text editor admin (B/I/U/EM/
// STRONG/BR/P/SPAN/DIV/UL/OL/LI/H2/H3/BLOCKQUOTE/CODE) — strip semua tag
// lain (script, img, iframe, link, on*= handlers, style=, dll). Anti-XSS
// untuk q.q, q.options, q.explain, q.audioScript, kanji mnemonic.
const _SANITIZE_ALLOWED = new Set([
  'B', 'I', 'U', 'EM', 'STRONG', 'BR', 'P', 'SPAN', 'DIV',
  'UL', 'OL', 'LI', 'H2', 'H3', 'BLOCKQUOTE', 'CODE', 'PRE', 'A',
]);
// Khusus tag A: cuma boleh href (https/http only, no javascript:).
function sanitizeHtml(input) {
  const tmp = document.createElement('div');
  tmp.innerHTML = String(input ?? '');
  const walk = (node) => {
    const kids = [...node.childNodes];
    for (const child of kids) {
      if (child.nodeType !== 1) continue; // text/comment node — biarkan
      const tag = child.tagName;
      if (!_SANITIZE_ALLOWED.has(tag)) {
        // Replace element dengan plain text content (drop tag, keep text).
        const text = document.createTextNode(child.textContent || '');
        child.replaceWith(text);
        continue;
      }
      // Strip semua attribute kecuali href di tag A (dengan validasi).
      const attrs = [...child.attributes];
      for (const attr of attrs) {
        if (tag === 'A' && attr.name === 'href') {
          const url = String(attr.value || '').trim();
          if (!/^https?:\/\//i.test(url)) child.removeAttribute('href');
          else child.setAttribute('rel', 'noopener noreferrer');
        } else {
          child.removeAttribute(attr.name);
        }
      }
      walk(child);
    }
  };
  walk(tmp);
  return tmp.innerHTML;
}

function formatDurationLong(minutes) {
  const n = Number(minutes);
  if (!n || n <= 0) return '';
  if (n < 60) return `${Math.round(n)} menit`;
  const h = Math.floor(n / 60);
  const rem = Math.round(n - h * 60);
  return rem === 0 ? `${h} jam` : `${h} jam ${rem} menit`;
}

// Compact duration for the sidebar — "9 mnt", "1 jam 15 mnt". Empty if 0.
function formatDurationCompact(minutes) {
  const n = Math.max(0, Number(minutes) || 0);
  if (n === 0) return '';
  if (n < 60) return `${n} mnt`;
  const h = Math.floor(n / 60);
  const m = n % 60;
  return m === 0 ? `${h} jam` : `${h} jam ${m} mnt`;
}

// ── Karaoke dialog player (Todai-style) ───────────────────────────
// Full transcript keliatan; karakter yang lagi diucapin di-highlight
// ngikutin audio. Timing dari /api/tts/aligned (alignment per-karakter
// ElevenLabs). Lazy: audio + alignment baru di-fetch pas user klik play.
window.__gk = window.__gk || {};

// Stop + buang semua karaoke player (dipanggil pas pindah lesson supaya
// audio lama gak terus main; key g0/g1 di-reuse antar render).
function gkStopAll() {
  for (const k of Object.keys(window.__gk)) {
    const st = window.__gk[k];
    if (st) {
      st.stopped = true;
      if (st._gap) { clearTimeout(st._gap); st._gap = null; }
      if (st.audio) { try { st.audio.pause(); } catch {} st.audio.src = ''; }
    }
    delete window.__gk[k];
  }
}

// Stop SATU karaoke player tanpa membuang state (segments cache tetap).
// Dipakai saat dialog block ditutup (collapse) atau dialog lain dibuka
// supaya hanya 1 audio aktif pada satu waktu.
function gkStopOne(key) {
  const st = window.__gk[key];
  if (!st) return;
  st.stopped = true;
  if (st._gap) { clearTimeout(st._gap); st._gap = null; }
  if (st.audio) { try { st.audio.pause(); } catch {} st.audio = null; }
  st.playOnce = false;
  if (st.playBtn) st.playBtn.textContent = st.ended ? '↻ Ulangi' : '▶ Putar dialog';
  gkSyncActiveLine(key, -1);
}

// Toggle collapse block grammar (contoh / dialog). Untuk dialog (mengandung
// audio) berlaku mutex: opening satu dialog auto-tutup dialog lain + stop
// audionya. Section contoh (tanpa audio) toggle bebas, tidak kena mutex.
window.grammarBlockToggle = (btn) => {
  const block = btn.closest('.grammar-collapsible');
  if (!block) return;
  const isDialog = block.classList.contains('grammar-dialog-block');
  const isCollapsed = block.hasAttribute('data-collapsed');
  if (isCollapsed) {
    if (isDialog) {
      // Mutex: tutup dialog lain + stop audio mereka.
      document.querySelectorAll('.grammar-dialog-block:not([data-collapsed])').forEach((other) => {
        if (other === block) return;
        other.setAttribute('data-collapsed', '1');
        const kara = other.querySelector('.grammar-karaoke');
        if (kara && kara.id) gkStopOne(kara.id.replace(/^gk-/, ''));
      });
    }
    block.removeAttribute('data-collapsed');
  } else {
    block.setAttribute('data-collapsed', '1');
    if (isDialog) {
      const kara = block.querySelector('.grammar-karaoke');
      if (kara && kara.id) gkStopOne(kara.id.replace(/^gk-/, ''));
    }
  }
};

function parseDialogLinesFE(text) {
  const lines = String(text || '').split('\n').map((l) => l.trim()).filter(Boolean);
  const SPK = /^([A-Za-z0-9]{1,12}|男|女|男性|女性|男の人|女の人):\s*(.+)$/;
  const turns = [];
  for (const line of lines) {
    const m = line.match(SPK);
    if (m) turns.push({ speaker: m[1], text: m[2].trim() });
    else if (turns.length) turns[turns.length - 1].text += ' ' + line;
    else turns.push({ speaker: '', text: line });
  }
  const names = resolveSpeakerNames(turns);
  for (const t of turns) {
    if (names[t.speaker]) t.displayName = names[t.speaker];
  }
  return turns;
}

// Auto-deteksi nama tokoh dari teks dialog supaya label "A"/"B" (kode TTS) bisa
// di-render sebagai nama asli (mis. 田中, 山田) di sisi siswa. Admin tetap pakai
// N/A/B karena ElevenLabs butuh prefix itu untuk routing suara narrator/cewe/cowo.
// Strategi:
//  1. Self-intro: "私は○○です" → kode pembicara itu = ○○.
//  2. Address-elimination: tiap pembicara menyebut "○○さん" = menyapa lawan
//     bicara, jadi nama mereka sendiri = nama yang TIDAK mereka sebut.
// Kalau tidak resolvable → kode tetap dipakai apa adanya.
function resolveSpeakerNames(turns) {
  const out = {};
  if (!Array.isArray(turns) || turns.length === 0) return out;
  // Class hanya kanji + katakana (exclude hiragana) supaya "田中さん" tidak
  // ke-greedy-match jadi "田中さん..." — nama-nama Jepang lazimnya kanji/katakana.
  const NAME_RE = /([一-鿿゠-ヿ]{1,8})さん/g;
  const SELF_RE_G = /(?:私|わたし|僕|ぼく)は([一-鿿゠-ヿ]{1,8})(?:さん|です|と申します|といいます|と言います)/g;
  const SELF_RE = /(?:私|わたし|僕|ぼく)は([一-鿿゠-ヿ]{1,8})(?:さん|です|と申します|といいます|と言います)/;
  const allText = turns.map((t) => t.text).join(' ');
  const fromSan = Array.from(allText.matchAll(NAME_RE)).map((m) => m[1]);
  const fromSelf = Array.from(allText.matchAll(SELF_RE_G)).map((m) => m[1]);
  const uniqueNames = Array.from(new Set([...fromSan, ...fromSelf]));
  if (uniqueNames.length === 0) return out;
  for (const t of turns) {
    if (!t.speaker || t.speaker === 'N') continue;
    const m = t.text.match(SELF_RE);
    if (m && uniqueNames.includes(m[1])) out[t.speaker] = m[1];
  }
  const nonNarrators = Array.from(new Set(turns.map((t) => t.speaker).filter((c) => c && c !== 'N')));
  for (const code of nonNarrators) {
    if (out[code]) continue;
    const myLines = turns.filter((t) => t.speaker === code).map((t) => t.text).join(' ');
    const mentioned = uniqueNames.filter((n) => myLines.includes(n));
    const taken = new Set(Object.values(out));
    const candidates = uniqueNames.filter((n) => !mentioned.includes(n) && !taken.has(n));
    if (candidates.length === 1) out[code] = candidates[0];
  }
  // Fallback narrator-order: kalau masih ada speaker tanpa nama tapi narrator
  // menyebut N nama (urutan kemunculan) yang cocok jumlahnya dengan jumlah
  // speaker non-N, assign berdasar urutan. Heuristik longgar tapi cocok dgn
  // konvensi dialog JLPT (narrator perkenalkan tokoh sesuai urutan bicara).
  const unresolvedCount = nonNarrators.filter((c) => !out[c]).length;
  if (unresolvedCount > 0) {
    const narratorText = turns.filter((t) => t.speaker === 'N').map((t) => t.text).join(' ');
    const narratorNames = [];
    const nrRe = /([一-鿿゠-ヿ]{1,8})さん/g;
    let nm;
    while ((nm = nrRe.exec(narratorText)) !== null) {
      if (!narratorNames.includes(nm[1])) narratorNames.push(nm[1]);
    }
    if (narratorNames.length === nonNarrators.length) {
      for (let i = 0; i < nonNarrators.length; i++) {
        const code = nonNarrators[i];
        if (!out[code]) out[code] = narratorNames[i];
      }
    }
  }
  return out;
}

// Palet warna per pembicara (dipakai bergiliran sesuai urutan kemunculan):
// speaker pertama = merah brand (kiri), kedua = indigo (kanan), dst.
const GK_PALETTES = [
  { color: '#E4322B', deep: '#B81E18', soft: '#FFE7E5', bubble: '#FFFFFF' }, // red
  { color: '#3E5C9A', deep: '#2C447A', soft: '#E9EEF8', bubble: '#F3F6FC' }, // indigo
  { color: '#1F8A6B', deep: '#156B52', soft: '#E2F3ED', bubble: '#F1F9F6' }, // teal
  { color: '#9A4F8E', deep: '#763C6D', soft: '#F6E9F4', bubble: '#FBF3FA' }, // plum
];
const GK_PLAY_TRI = '<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';
const GK_EYE_SVG = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>';

// Map kode pembicara non-narator → { side, pal } (urutan kemunculan).
function gkSpeakerStyles(rows) {
  const codes = [];
  rows.forEach((r) => { const s = r.speaker; if (s && s !== 'N' && !codes.includes(s)) codes.push(s); });
  const map = {};
  codes.forEach((c, i) => {
    map[c] = { side: i % 2 === 0 ? 'left' : 'right', pal: GK_PALETTES[i % GK_PALETTES.length] };
  });
  return map;
}
function gkVars(pal) {
  return `--sp:${pal.color};--sp-deep:${pal.deep};--sp-soft:${pal.soft};--sp-bubble:${pal.bubble};`;
}
function gkAvatarText(name) {
  const s = String(name || '').trim();
  if (!s) return '？';
  return s.length <= 2 ? s : s.slice(0, 2);
}

// Default mode terjemahan + kecepatan: disimpan global di localStorage (semua
// dialog di halaman ikut). Default arti = "tap" (active recall), speed = 1×.
function gkGetArtiMode() {
  try { const v = localStorage.getItem('ez_dialog_arti'); if (v === 'always' || v === 'off' || v === 'tap') return v; } catch (e) {}
  return 'tap';
}
function gkGetSpeed() {
  try { const v = parseFloat(localStorage.getItem('ez_dialog_speed')); if (v === 0.75 || v === 1 || v === 1.25) return v; } catch (e) {}
  return 1;
}
function gkArtiLabel(mode) {
  return mode === 'always' ? 'Arti: selalu' : mode === 'off' ? 'Arti: off' : 'Arti: tap';
}

// Narator (speaker 'N') → kartu "Situasi" di atas. Tetap clickable (punya
// segment audio sendiri) + terjemahan selalu tampil (tidak kena mode tap).
function gkSceneHtml(rows, key) {
  const body = rows.map((r) => `
    <div class="gk-scene-line" data-line-index="${r.index}" onclick="window.grammarKaraokeJumpTo('${key}',${r.index})" title="Putar baris ini">
      <div class="gk-text">${r.inner}</div>
      ${r.idText ? `<div class="gk-line-id">${escapeHtml(r.idText)}</div>` : ''}
    </div>`).join('');
  return `<div class="gk-scene"><div class="gk-scene-tag">場面 · Situasi</div>${body}</div>`;
}
// Satu baris percakapan → chat bubble (avatar + nama + bubble berwarna di
// sisi pembicara). Tombol putar per-baris + reveal arti (mode tap).
function gkBubbleHtml(r, key, styles) {
  const sp = styles[r.speaker] || { side: 'left', pal: GK_PALETTES[0] };
  const avatar = gkAvatarText(r.displayName || r.speaker);
  const name = escapeHtml(r.displayName || r.speaker || '');
  const arti = r.idText
    ? `<div class="gk-arti"><button type="button" class="gk-reveal" onclick="window.gkRevealArti(this)">${GK_EYE_SVG} Lihat arti</button><div class="gk-line-id">${escapeHtml(r.idText)}</div></div>`
    : '';
  return `
    <div class="gk-line gk-side-${sp.side}" data-line-index="${r.index}" style="${gkVars(sp.pal)}">
      <div class="gk-avatar">${escapeHtml(avatar)}</div>
      <div class="gk-bubble-col">
        ${name ? `<div class="gk-name">${name}</div>` : ''}
        <div class="gk-bubble">
          <div class="gk-bubble-main">
            <div class="gk-text">${r.inner}</div>
            <button type="button" class="gk-line-play" title="Putar baris ini" onclick="window.grammarKaraokeJumpTo('${key}',${r.index})">${GK_PLAY_TRI}</button>
          </div>
          ${arti}
        </div>
      </div>
    </div>`;
}
// Susun transcript: scene (narator) di atas + bubble percakapan. rows[i] =
// { speaker, displayName, inner, idText, index }. index = segment index audio.
function gkComposeHtml(rows, key, styles) {
  const sceneRows = rows.filter((r) => r.speaker === 'N');
  const lineRows = rows.filter((r) => r.speaker !== 'N');
  const scene = sceneRows.length ? gkSceneHtml(sceneRows, key) : '';
  const bubbles = lineRows.map((r) => gkBubbleHtml(r, key, styles)).join('');
  return scene + `<div class="gk-bubbles">${bubbles}</div>`;
}

// Cycle mode arti (tap → selalu → off) — global untuk semua dialog di halaman.
window.gkCycleArti = (key, btn) => {
  const next = { tap: 'always', always: 'off', off: 'tap' }[gkGetArtiMode()] || 'tap';
  try { localStorage.setItem('ez_dialog_arti', next); } catch (e) {}
  document.querySelectorAll('.grammar-karaoke').forEach((el) => el.setAttribute('data-arti', next));
  document.querySelectorAll('.gk-arti-toggle').forEach((b) => { b.textContent = gkArtiLabel(next); });
};
// Set kecepatan playback — global; aktif live untuk player yang sedang load.
window.gkSetSpeed = (key, rate, btn) => {
  const r = parseFloat(rate) || 1;
  try { localStorage.setItem('ez_dialog_speed', String(r)); } catch (e) {}
  document.querySelectorAll('.grammar-karaoke').forEach((el) => {
    el.setAttribute('data-speed', String(r));
    el.querySelectorAll('.gk-speed .gk-seg-btn').forEach((b) => b.classList.toggle('is-on', parseFloat(b.dataset.v) === r));
  });
  for (const k of Object.keys(window.__gk)) {
    const st = window.__gk[k];
    if (st) { st.rate = r; if (st.audio) { try { st.audio.playbackRate = r; } catch (e) {} } }
  }
};
// Reveal terjemahan satu bubble (mode tap).
window.gkRevealArti = (btn) => {
  const line = btn && btn.closest('.gk-line');
  if (line) line.classList.add('gk-revealed');
};

// Map line index → terjemahan Indonesia (kalau dialogIdText ada). Parsing
// pakai parseDialogLinesFE juga supaya struktur N/A/B paralel; index match
// dgn line dialog Jepang (asumsi AI translator menghasilkan baris yg sama
// jumlah & urutannya).
function parseDialogIdMap(dialogIdText) {
  const map = {};
  if (!dialogIdText) return map;
  const turns = parseDialogLinesFE(dialogIdText);
  turns.forEach((t, i) => { if (t.text) map[i] = t.text; });
  return map;
}

// Static transcript (semua text keliatan) sebelum audio di-load: narator →
// kartu Situasi, sisanya → chat bubble. Struktur identik dgn versi audio
// supaya layout tidak loncat saat audio selesai load.
function renderKaraokeStatic(text, key, dialogIdText) {
  const turns = parseDialogLinesFE(text);
  const idMap = parseDialogIdMap(dialogIdText);
  const styles = gkSpeakerStyles(turns);
  const rows = turns.map((t, i) => ({
    speaker: t.speaker,
    displayName: t.displayName || t.speaker,
    inner: escapeHtml(t.text),
    idText: idMap[i] || '',
    index: i,
  }));
  return gkComposeHtml(rows, key, styles);
}

function grammarKaraokeHtml(dialogText, key, dialogIdText) {
  const arti = gkGetArtiMode();
  const speed = gkGetSpeed();
  const speeds = [0.75, 1, 1.25];
  return `
    <div class="grammar-karaoke" id="gk-${key}" data-dialog="${escapeHtml(dialogText)}" data-dialog-id="${escapeHtml(dialogIdText || '')}" data-arti="${arti}" data-speed="${speed}">
      <div class="gk-toolbar">
        <button type="button" class="gk-play" onclick="window.grammarKaraokePlay('${key}')">▶ Putar dialog</button>
        <div class="gk-seg gk-speed">
          ${speeds.map((v) => `<button type="button" class="gk-seg-btn${v === speed ? ' is-on' : ''}" data-v="${v}" onclick="window.gkSetSpeed('${key}',${v},this)">${v}×</button>`).join('')}
        </div>
        <span class="gk-tool-div"></span>
        <button type="button" class="gk-arti-toggle" onclick="window.gkCycleArti('${key}',this)">${gkArtiLabel(arti)}</button>
        <span class="gk-status"></span>
      </div>
      <div class="gk-transcript">${renderKaraokeStatic(dialogText, key, dialogIdText)}</div>
    </div>
  `;
}

// Jump ke segment tertentu (klik per-baris). Kalau segments belum ke-load,
// trigger initial load lewat grammarKaraokePlay dgn flag jumpTo. Setelah
// segment selesai, TIDAK auto-advance (playOnce mode).
window.grammarKaraokeJumpTo = async (key, li) => {
  const li2 = Number(li);
  if (!Number.isInteger(li2) || li2 < 0) return;
  let st = window.__gk[key];
  if (st && st.segments) {
    // Sudah loaded: stop yg sedang berjalan + play single segment.
    if (st.audio) { try { st.audio.pause(); } catch {} st.audio = null; }
    if (st._gap) { clearTimeout(st._gap); st._gap = null; }
    st.stopped = false; st.ended = false; st.playOnce = true;
    if (st.playBtn) st.playBtn.textContent = '❚❚ Jeda';
    if (li2 >= st.segments.length) return;
    gkPlaySegment(key, li2);
    return;
  }
  // Belum loaded: minta grammarKaraokePlay load dulu dgn target jump.
  const el = document.getElementById('gk-' + key);
  if (!el) return;
  el.dataset.jumpTo = String(li2);
  window.grammarKaraokePlay(key);
};

// Putar segment ke-si secara berurutan. Tiap segment audio sendiri +
// waktu karakter RELATIF ke awal segment → highlight akurat, gak ada
// drift/offset estimation. Jeda ~450ms antar segment.
function gkPlaySegment(key, si) {
  const st = window.__gk[key];
  if (!st || st.stopped) return;
  const segs = st.segments;
  if (si >= segs.length) {
    st.curSeg = 0; st.audio = null; st.ended = true; st.playOnce = false;
    if (st.playBtn) st.playBtn.textContent = '↻ Ulangi';
    st.spans.flat().forEach((sp) => sp && sp.classList.remove('gk-active'));
    gkSyncActiveLine(key, -1);
    return;
  }
  st.curSeg = si; st.ended = false;
  // Tandai segment sebelumnya 'done', segment ini + sesudahnya reset.
  st.spans.forEach((arr, idx) => arr.forEach((sp) => {
    if (!sp) return;
    sp.classList.remove('gk-active');
    sp.classList.toggle('gk-done', idx < si);
  }));
  gkSyncActiveLine(key, si);
  const seg = segs[si];
  const audio = new Audio('data:' + (seg.content_type || 'audio/mpeg') + ';base64,' + seg.audio_base64);
  st.audio = audio;
  try { audio.playbackRate = st.rate || 1; } catch (e) {}
  const times = (st.wordTimes && st.wordTimes[si]) || [];
  const spans = st.spans[si] || [];
  audio.addEventListener('timeupdate', () => {
    const tt = audio.currentTime;
    for (let j = 0; j < spans.length; j++) {
      const sp = spans[j]; const t = times[j];
      if (!sp || !t) continue;
      if (tt >= t[1]) { sp.classList.add('gk-done'); sp.classList.remove('gk-active'); }
      else if (tt >= t[0]) { sp.classList.add('gk-active'); sp.classList.remove('gk-done'); }
      else { sp.classList.remove('gk-active', 'gk-done'); }
    }
  });
  audio.addEventListener('ended', () => {
    spans.forEach((sp) => sp && (sp.classList.add('gk-done'), sp.classList.remove('gk-active')));
    if (st.stopped) return;
    // playOnce: dipanggil dari grammarKaraokeJumpTo — jangan auto-advance.
    if (st.playOnce) {
      st.playOnce = false; st.ended = true; st.audio = null;
      if (st.playBtn) st.playBtn.textContent = '↻ Ulangi';
      gkSyncActiveLine(key, -1);
      return;
    }
    st._gap = setTimeout(() => gkPlaySegment(key, si + 1), 450);
  });
  const p = audio.play(); if (p && p.catch) p.catch(() => {});
}

// Sync class .gk-line-active ke baris/narator dgn data-line-index === activeSi
// (atau bersihkan semua kalau activeSi < 0).
function gkSyncActiveLine(key, activeSi) {
  const root = document.getElementById('gk-' + key);
  if (!root) return;
  const tap = root.getAttribute('data-arti') === 'tap';
  root.querySelectorAll('[data-line-index]').forEach((el) => {
    const li = Number(el.dataset.lineIndex);
    const on = activeSi >= 0 && li === activeSi;
    el.classList.toggle('gk-line-active', on);
    // Mode tap: mendengar suatu baris otomatis reveal artinya (cek pemahaman).
    if (on && tap && el.classList.contains('gk-line')) el.classList.add('gk-revealed');
  });
}

window.grammarKaraokePlay = async (key) => {
  const el = document.getElementById('gk-' + key);
  if (!el) return;
  let st = window.__gk[key];
  // Sudah ke-load: toggle play/pause/replay.
  if (st && st.segments) {
    if (st.audio && !st.audio.paused) {
      st.stopped = true;
      if (st._gap) { clearTimeout(st._gap); st._gap = null; }
      st.audio.pause();
      if (st.playBtn) st.playBtn.textContent = '▶ Putar dialog';
    } else if (st.ended || !st.audio) {
      st.stopped = false; st.ended = false;
      if (st.playBtn) st.playBtn.textContent = '❚❚ Jeda';
      gkPlaySegment(key, 0);
    } else {
      st.stopped = false;
      if (st.playBtn) st.playBtn.textContent = '❚❚ Jeda';
      const p = st.audio.play(); if (p && p.catch) p.catch(() => {});
    }
    return;
  }
  // Pertama kali: fetch alignment + audio per segment, render, lalu play.
  const dialog = el.dataset.dialog || '';
  const statusEl = el.querySelector('.gk-status');
  const playBtn = el.querySelector('.gk-play');
  const transcript = el.querySelector('.gk-transcript');
  if (statusEl) statusEl.textContent = 'Memuat… (pertama kali ~5-10 detik)';
  if (playBtn) playBtn.disabled = true;
  try {
    const r = await fetch('/api/tts/aligned?text=' + encodeURIComponent(dialog));
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    const segs = (data && data.segments) || [];
    if (!segs.length) throw new Error('no segments');
    // Resolve nama tokoh sekali dari teks dialog (sama logikanya dengan
    // renderKaraokeStatic) → seg.speaker (kode A/B/N) di-label sebagai nama.
    const nameMap = resolveSpeakerNames(parseDialogLinesFE(dialog));
    // Terjemahan Indonesia (kalau ada) — paralel per-baris dgn dialog Jepang.
    const idMap = parseDialogIdMap(el.dataset.dialogId || '');
    // Render span per-kata (words[] dari backend, partikel udah ke-pisah).
    // Pemisah (start null = spasi/tanda baca) render polos, gak di-highlight.
    const renderInner = (seg, si) => {
      let wi = 0;
      return (seg.words || []).map((w) => {
        if (w.start == null) return `<span class="gk-punct">${escapeHtml(w.text)}</span>`;
        return `<span class="gk-word" data-k="${si}_${wi++}">${escapeHtml(w.text)}</span>`;
      }).join('');
    };
    // Bangun bubble (struktur sama dgn renderKaraokeStatic) — span per-kata
    // sebagai inner supaya highlight aligned tetap jalan di dalam bubble.
    const styles = gkSpeakerStyles(segs);
    const rows = segs.map((seg, si) => ({
      speaker: seg.speaker,
      displayName: nameMap[seg.speaker] || seg.speaker,
      inner: renderInner(seg, si),
      idText: idMap[si] || '',
      index: si,
    }));
    transcript.innerHTML = gkComposeHtml(rows, key, styles);
    const spans = segs.map((seg, si) =>
      (seg.words || []).filter((w) => w.start != null)
        .map((_, idx) => transcript.querySelector(`.gk-word[data-k="${si}_${idx}"]`)));
    const wordTimes = segs.map((seg) =>
      (seg.words || []).filter((w) => w.start != null).map((w) => [w.start, w.end]));
    st = { segments: segs, spans, wordTimes, curSeg: 0, audio: null, stopped: false, ended: false, playOnce: false, playBtn, rate: parseFloat(el.dataset.speed) || 1 };
    window.__gk[key] = st;
    if (statusEl) statusEl.textContent = '';
    if (playBtn) { playBtn.disabled = false; playBtn.textContent = '❚❚ Jeda'; }
    // Kalau klik per-baris yg trigger initial load, lompat ke segment target
    // dgn playOnce. Kalau bukan, putar dari segment 0 (full play).
    const jumpToRaw = el.dataset.jumpTo;
    if (jumpToRaw != null) {
      delete el.dataset.jumpTo;
      const ji = Number(jumpToRaw);
      if (Number.isInteger(ji) && ji >= 0 && ji < segs.length) {
        st.playOnce = true;
        gkPlaySegment(key, ji);
        return;
      }
    }
    gkPlaySegment(key, 0);
  } catch (e) {
    if (statusEl) statusEl.textContent = 'Audio tidak tersedia';
    if (playBtn) playBtn.disabled = false;
  }
};

function renderLessonExtras(lesson) {
  const vocab = renderLessonVocab(lesson);
  const grammar = renderLessonGrammar(lesson);
  if (!vocab && !grammar) return '';
  return `<div class="lesson-extras">${vocab}${grammar}</div>`;
}

// ── DECK (kosakata cards) ─────────────────────────────────────────
const DECK_COLORS = {
  sun: '#E8A23E', moon: '#6B7BA3', fire: '#D04E2A', water: '#3B7BB8',
  tree: '#5A8C4A', gold: '#C9A227', earth: '#8C6B3F',
  day: '#C8102E', time: '#5E4B8B', week: '#1F8A5B', general: '#C8102E',
};
const AUDIO_SVG = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19" fill="currentColor"></polygon><path d="M15.5 8.5a5 5 0 0 1 0 7"></path></svg>';

function deckAccent(item) {
  const raw = (item && item.accentColor != null) ? String(item.accentColor).trim() : '';
  if (raw && /^#?[0-9a-fA-F]{3,8}$/.test(raw.replace(/^#/, ''))) {
    return raw.startsWith('#') ? raw : ('#' + raw);
  }
  const cat = String((item && item.category) || '').toLowerCase();
  return DECK_COLORS[cat] || 'var(--brand-red)';
}

function deckHighlight(jpPlain, highlight, fallbackWord) {
  const esc = escapeHtml(jpPlain || '');
  const term = ((highlight && highlight.trim()) || (fallbackWord && fallbackWord.trim()) || '').trim();
  if (!term) return esc;
  const escTerm = escapeHtml(term);
  const i = esc.indexOf(escTerm);
  if (i < 0) return esc;
  return esc.slice(0, i) + '<span class="hi">' + escTerm + '</span>' + esc.slice(i + escTerm.length);
}

// Plays via the cached server TTS endpoint; falls back to browser Web Speech.
// Global current audio + flag — supaya 2 click TTS tidak overlap dan
// fallback (Web Speech) ga jalan bareng kalau ElevenLabs audio sudah
// mulai play. Bug: dua-duanya bunyi pas autoplay race (audio play
// resolve LATE, fallback udah trigger Web Speech duluan).
let _ttsCurrentAudio = null;

function _stopAllTts() {
  // Stop ElevenLabs audio yang masih aktif (kalau ada).
  if (_ttsCurrentAudio) {
    try { _ttsCurrentAudio.pause(); _ttsCurrentAudio.src = ''; } catch {}
    _ttsCurrentAudio = null;
  }
  // Cancel browser Web Speech yang lagi ngomong / antri.
  try {
    if (window.speechSynthesis && (window.speechSynthesis.speaking || window.speechSynthesis.pending)) {
      window.speechSynthesis.cancel();
    }
  } catch {}
}

// TTS cache version untuk browser cache invalidation. Backend kasih
// version (e.g. "v6") via /api/tts/version. Append ke URL param `v` →
// kalau settings_version berubah, browser cache (max-age 1yr) auto miss
// karena URL beda. Init lazy on first call.
let _ttsCacheVersion = '';
let _ttsCacheVersionFetched = false;
async function _initTtsVersion() {
  if (_ttsCacheVersionFetched) return;
  _ttsCacheVersionFetched = true;
  try {
    const r = await fetch('/api/tts/version');
    if (r.ok) {
      const d = await r.json();
      _ttsCacheVersion = String(d.version || '');
    }
  } catch {}
}
function ttsUrl(text) {
  const base = '/api/tts?text=' + encodeURIComponent(text);
  return _ttsCacheVersion ? base + '&v=' + encodeURIComponent(_ttsCacheVersion) : base;
}
// Fire-and-forget di module init.
_initTtsVersion();

// Play TTS contoh kalimat grammar (teks di data-tts attribute).
window.playGrammarExampleTts = (btn) => {
  if (!btn) return;
  playTTS(btn.dataset.tts || '', btn);
};

function playTTS(text, btn) {
  const plain = String(text || '').replace(/<[^>]*>/g, '').trim();
  if (!plain) return;
  // Hentiin semua TTS yang lagi jalan sebelum mulai baru (anti bentrok).
  _stopAllTts();
  if (btn) {
    document.querySelectorAll('.dc-audio.playing,.de-play.playing,.dm-headaudio.playing,.ge-play.playing').forEach((b) => b.classList.remove('playing'));
    btn.classList.add('playing');
  }
  let elevenStarted = false;
  let fallbackTriggered = false;
  const stop = () => { if (btn) btn.classList.remove('playing'); };
  const fallback = (reason) => {
    // Jangan fallback kalau ElevenLabs udah benar-benar mulai play
    // (race: play() promise reject after audio actually playing
    // karena autoplay quirk, atau onerror fires post-playback).
    if (elevenStarted || fallbackTriggered) return;
    fallbackTriggered = true;
    stop();
    try { speakJapanese(plain, btn); } catch (e) { /* noop */ }
  };
  try {
    const a = new Audio(ttsUrl(plain));
    _ttsCurrentAudio = a;
    a.onplaying = () => { elevenStarted = true; };
    a.onended = () => {
      stop();
      if (_ttsCurrentAudio === a) _ttsCurrentAudio = null;
    };
    a.onerror = () => fallback('error');
    const p = a.play();
    if (p && typeof p.then === 'function') {
      p.then(() => { elevenStarted = true; }).catch(() => fallback('play-reject'));
    }
  } catch (e) { fallback('throw'); }
}
window.playTTS = playTTS;

// Putar dialog satu soal listening (per-question). Pelengkap centralized
// player di top section — kasih student fleksibilitas play dialog
// spesifik tanpa nge-navigate tracklist player.
window.playQuizQuestionDialog = (qi, btn) => {
  const q = quizState?.questions?.[qi];
  const script = q?.audioScript ? String(q.audioScript).trim() : '';
  if (!script) return;
  playTTS(script, btn);
};
window.playDeckAudio = (idx, btn) => {
  const it = (window.__deckData || [])[idx];
  if (!it) return;
  // Pakai teks Jepang utama (kanji), bukan kana.
  playTTS(it.japanese || it.reading || '', btn);
};
window.playDeckExample = (idx, exIdx, btn) => {
  const it = (window.__deckData || [])[idx];
  if (!it) return;
  const ex = (it.examples || [])[exIdx];
  if (!ex) return;
  // Pakai kalimat Jepang utama (kanji), bukan kana — prosodi lebih natural.
  playTTS(String(ex.japanese || ex.reading || '').replace(/<[^>]*>/g, ''), btn);
};

window.filterDeck = (q) => {
  const term = String(q || '').trim().toLowerCase();
  let visible = 0;
  document.querySelectorAll('#deck-grid .deck-card').forEach((c) => {
    const match = !term || (c.dataset.deckSearch || '').includes(term);
    c.style.display = match ? '' : 'none';
    if (match) visible++;
  });
  const cnt = document.getElementById('deck-visible-count');
  if (cnt) cnt.textContent = visible;
  const empty = document.getElementById('deck-empty-filter');
  if (empty) {
    if (visible === 0 && term) {
      empty.innerHTML = `Tidak ada kata yang cocok dengan <strong>"${escapeHtml(term)}"</strong>.`;
      empty.hidden = false;
    } else {
      empty.hidden = true;
    }
  }
};

// Grammar task — siswa membuat kalimat memakai pola grammar lalu mengucapkannya.
// Ucapan direkam (MediaRecorder) → transkrip ElevenLabs STT (/api/grammar-task/
// transcribe) → kalimat dinilai AI (/api/grammar-task/evaluate). Kalau mic tak
// didukung / izin ditolak / STT nonaktif, siswa mengetik kalimatnya.
let _gtRec = null; // { key, btn, recorder, chunks, stream, stopRequested, discarded }

function _gtSttSupported() {
  return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
}
// Cari elemen gt-* dalam popup kalau terbuka, else seluruh dokumen — supaya
// popup tidak bentrok dengan render full-page tugas (id gt-* bisa dobel).
function _gtScope() { return document.querySelector('.gt-popup-overlay') || document; }

// Total kalimat yang harus diselesaikan (jumlah per pola, min 1).
function gtTotalRequired(items) {
  let total = 0;
  (items || []).forEach((it) => { total += Math.max(1, Number(it.requiredCount) || 1); });
  return total;
}

// Bangun HTML kartu tugas (dipakai full-page render & popup modal).
function gtCardsHtml(items, sttOn) {
  const slotHtml = (pi, si, count) => {
    const key = `${pi}-${si}`;
    const slotLabel = (count > 1 && si > 0) ? ` data-slot-label="Kalimat ${si + 1}"` : '';
    if (sttOn) {
      // Mode bicara: push-to-talk + transkrip read-only (tanpa textbox). Textarea
      // tetap disertakan tapi disembunyikan — hanya muncul sebagai fallback ketik
      // kalau mic ditolak / STT nonaktif (lihat _gtTypeState).
      return `
        <div class="gt-slot"${slotLabel}>
          <div class="gt-slot__mic-row">
            <button type="button" class="gt-mic" id="gt-mic-${key}" onpointerdown="gtStartRecord(${pi}, ${si}, this, event)" onpointerup="gtStopRecord(${pi}, ${si}, this, event)" onpointercancel="gtStopRecord(${pi}, ${si}, this, event)" oncontextmenu="return false" aria-label="Tahan untuk merekam ucapan">🎤 Tahan untuk bicara</button>
            <span class="gt-status" id="gt-status-${key}"></span>
          </div>
          <div class="gt-said gt-said--empty" id="gt-said-${key}" data-text="" lang="ja" aria-live="polite">Tahan tombol lalu ucapkan kalimatmu — teksnya muncul di sini.</div>
          <textarea id="gt-input-${key}" lang="ja" rows="2" placeholder="例：私は毎日日本語を勉強します。" hidden></textarea>
          <button type="button" class="gt-check" onclick="gtCheck(${pi}, ${si}, this)">Periksa</button>
          <div class="gt-result" id="gt-result-${key}" hidden></div>
        </div>`;
    }
    // Mode ketik (mic tak didukung): textarea biasa.
    return `
      <div class="gt-slot"${slotLabel}>
        <div class="gt-slot__mic-row">
          <span class="gt-status" id="gt-status-${key}"></span>
        </div>
        <textarea id="gt-input-${key}" lang="ja" rows="2" placeholder="例：私は毎日日本語を勉強します。"></textarea>
        <button type="button" class="gt-check" onclick="gtCheck(${pi}, ${si}, this)">Periksa</button>
        <div class="gt-result" id="gt-result-${key}" hidden></div>
      </div>`;
  };
  if (!items || items.length === 0) {
    return '<div class="deck-empty">Belum ada pola grammar untuk tugas ini.</div>';
  }
  return items.map((it, pi) => {
    const count = Math.max(1, Number(it.requiredCount) || 1);
    const pattern = escapeHtml(it.pattern || '');
    const meaning = escapeHtml(it.meaning || '');
    const example = it.example ? escapeHtml(it.example) : '';
    const instruction = it.instruction && it.instruction.trim()
      ? escapeHtml(it.instruction.trim())
      : `Buat ${count} kalimat memakai pola ini, lalu ucapkan atau ketik.`;
    const hint = sttOn ? 'Tahan 🎤 lalu ucapkan kalimatmu, lepas saat selesai.' : 'Ketik kalimatmu dalam bahasa Jepang.';
    let slots = '';
    for (let si = 0; si < count; si++) slots += slotHtml(pi, si, count);
    return `
    <article class="gt-card">
      <div class="gt-card__chip">文法 · Pola ${pi + 1}</div>
      <div class="gt-card__pattern" lang="ja">${pattern}</div>
      ${meaning ? `<div class="gt-card__meaning">${meaning}</div>` : ''}
      ${example ? `<div class="gt-card__example">
        <button type="button" class="gt-card__example-audio" aria-label="Dengar contoh" onclick="gtPlayExample(${pi}, this)">🔊</button>
        <span lang="ja">${example}</span>
      </div>` : ''}
      <div class="gt-callout"><strong>Tugas:</strong> ${instruction}</div>
      <p class="gt-help">${hint}</p>
      ${slots}
    </article>`;
  }).join('');
}

function renderGrammarTaskLesson(course, module, lesson, nav) {

  const intro = (lesson.body && lesson.body.trim())
    ? lesson.body
    : 'Kerjakan tugas tiap pola grammar di bawah: buat kalimat sesuai instruksi, lalu ucapkan (atau ketik). Kalimatmu dinilai otomatis.';

// ── Popup tugas grammar (muncul otomatis setelah pelajaran pemicu selesai,
// atau via tombol "Kerjakan Tugas"). Reuse gtCardsHtml + handler gt* ──
function closeGrammarTaskPopup() {
  document.querySelectorAll('.gt-popup-overlay').forEach((el) => el.remove());
  document.body.style.overflow = '';
  try { _stopAllTts(); } catch {}
  // Maneko-chan balik tampil hanya kalau lesson aktif bukan quiz/grammar_task.
  updateTutorVisibility();
}

function openGrammarTaskPopup(course, taskMod, taskLesson, onDone) {
  const items = Array.isArray(taskLesson.grammarTask) ? taskLesson.grammarTask : [];
  const sttOn = _gtSttSupported();
  window.__gtData = items;
  window.__gtLessonId = taskLesson.apiId;
  window.__gtState = { passed: {}, total: gtTotalRequired(items), evalDisabled: false, isDone: false, hasNext: false, isPopup: true };
  window.__gtPopupCtx = { moduleId: taskMod.id, lessonKey: `${taskMod.id}:${taskLesson.id}`, onDone: (typeof onDone === 'function' ? onDone : null) };

  const overlay = document.createElement('div');
  overlay.className = 'gt-popup-overlay';
  overlay.innerHTML = `
    <div class="gt-popup" role="dialog" aria-modal="true" aria-labelledby="gt-popup-title">
      <button type="button" class="gt-popup__close" aria-label="Tutup" onclick="gtPopupDismiss()">×</button>
      <header class="gt-popup__header">
        <div class="gt-popup__eyebrow">作文 · Tugas Grammar</div>
        <h2 id="gt-popup-title" class="gt-popup__title">${escapeHtml(taskLesson.title || 'Tugas Grammar')}</h2>
        <p class="gt-popup__desc">Buat kalimat sesuai instruksi tiap pola, lalu ucapkan atau ketik. Kalimatmu dinilai otomatis.</p>
      </header>
      ${gtCardsHtml(items, sttOn)}
      <div id="gt-progress-hint"></div>
      <div class="gt-footer__actions">
        <button type="button" class="gt-btn gt-btn--ghost" onclick="gtPopupDismiss()">Nanti saja</button>
        <button type="button" class="gt-btn gt-btn--primary" id="gt-complete-btn" onclick="gtPopupComplete()"></button>
      </div>
    </div>`;
  overlay.addEventListener('click', (ev) => { if (ev.target === overlay) gtPopupDismiss(); });
  document.body.appendChild(overlay);
  document.body.style.overflow = 'hidden';
  setTutorHidden(true); // popup tugas = sedang dinilai, sembunyikan Maneko-chan
  if (!window.__gtPopupEscWired) {
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && document.querySelector('.gt-popup-overlay')) gtPopupDismiss();
    });
    window.__gtPopupEscWired = true;
  }
  gtUpdateComplete();
}

// Tutup tanpa menyelesaikan — task tetap "belum selesai", tetap lanjut.
window.gtPopupDismiss = () => {
  const ctx = window.__gtPopupCtx;
  closeGrammarTaskPopup();
  window.__gtPopupCtx = null;
  if (ctx && ctx.onDone) ctx.onDone();
  try { if (window.AISenpai && AISenpai._started) AISenpai.refresh(); } catch {}
};

// Selesaikan tugas: tandai task lesson selesai + XP, tutup, lanjut.
window.gtPopupComplete = () => {
  const ctx = window.__gtPopupCtx;
  if (ctx) {
    const allProgress = getProgress();
    const cp = allProgress[currentState.course] || {};
    const wasDone = !!cp[ctx.lessonKey];
    cp[ctx.lessonKey] = true;
    allProgress[currentState.course] = cp;
    setProgress(allProgress);
    if (!wasDone) addXP(10, 'tugas grammar selesai');
  }
  closeGrammarTaskPopup();
  window.__gtPopupCtx = null;
  if (ctx && ctx.onDone) ctx.onDone();
  try { if (window.AISenpai && AISenpai._started) AISenpai.refresh(); } catch {}
};

// Buka popup untuk task tertentu dari tombol "Kerjakan Tugas" di pelajaran pemicu.
window.gtOpenTaskPopup = (moduleId, lessonId) => {
  const course = COURSE_CONTENT[currentState.course];
  const m = course.modules.find((x) => x.id === moduleId);
  const l = m && m.lessons.find((x) => x.id === lessonId);
  if (!m || !l) return;
  openGrammarTaskPopup(course, m, l, () => { renderLesson(); });
};

function gtUpdateComplete() {
  const st = window.__gtState;
  if (!st) return;
  const scope = _gtScope();
  const btn = scope.querySelector('#gt-complete-btn');
  if (!btn) return;
  const passedCount = Object.values(st.passed).filter(Boolean).length;
  const done = st.isDone || st.evalDisabled || st.total === 0 || passedCount >= st.total;
  btn.disabled = !done;
  btn.style.opacity = done ? '' : '0.5';
  btn.style.cursor = done ? '' : 'not-allowed';
  let normalLabel;
  if (st.isPopup) {
    normalLabel = 'Selesai ✓';
  } else {
    normalLabel = st.isDone ? (st.hasNext ? 'Lanjut →' : 'Selesai ✓') : (st.hasNext ? 'Tandai Selesai & Lanjut →' : 'Tandai Selesai ✓');
  }
  btn.textContent = done ? normalLabel : 'Selesaikan semua kalimat dulu';
  const hint = scope.querySelector('#gt-progress-hint');
  if (hint) {
    hint.textContent = (st.evalDisabled || st.total === 0) ? '' : `${passedCount} / ${st.total} kalimat selesai`;
  }
}

window.gtPlayExample = (idx, btn) => {
  const it = (window.__gtData || [])[idx];
  if (!it || !it.example) return;
  playTTS(String(it.example).replace(/<[^>]*>/g, ''), btn);
};

// Push-to-talk: tahan tombol untuk merekam, lepas untuk berhenti & transkrip.
// Tiap mulai rekam baru me-reset teks slot (tidak menumpuk transkrip lama).
function _gtResetBtn(btn) {
  if (!btn) return;
  btn.classList.remove('recording');
  btn.textContent = '🎤 Tahan untuk bicara';
}

// Buang rekaman yang sedang berjalan tanpa men-transkrip (mis. saat user mulai
// menahan tombol lain). Hasil onstop diabaikan lewat flag `discarded`.
function _gtCancelActive() {
  const rec = _gtRec;
  if (!rec) return;
  rec.discarded = true;
  try { if (rec.recorder && rec.recorder.state === 'recording') rec.recorder.stop(); } catch {}
  try { if (rec.stream) rec.stream.getTracks().forEach((t) => t.stop()); } catch {}
  _gtResetBtn(rec.btn);
  _gtRec = null;
}

// Kalimat slot: mode bicara menyimpan transkrip read-only di .gt-said; mode ketik
// (atau fallback saat mic gagal) memakai textarea #gt-input.
function _gtGetSentence(key, scope) {
  scope = scope || _gtScope();
  const ta = scope.querySelector(`#gt-input-${key}`);
  if (ta && !ta.hidden) return String(ta.value || '').trim();
  const said = scope.querySelector(`#gt-said-${key}`);
  if (said) return String(said.dataset.text || '').trim();
  return ta ? String(ta.value || '').trim() : '';
}
function _gtSetSaid(key, text, scope) {
  scope = scope || _gtScope();
  const said = scope.querySelector(`#gt-said-${key}`);
  if (!said) return;
  text = String(text || '');
  said.dataset.text = text;
  if (text) { said.textContent = text; said.classList.remove('gt-said--empty'); }
  else { said.textContent = 'Tahan tombol lalu ucapkan kalimatmu — teksnya muncul di sini.'; said.classList.add('gt-said--empty'); }
}
// Tampilkan transkrip (sembunyikan textarea). No-op untuk slot mode-ketik.
function _gtSpeakState(key, scope) {
  scope = scope || _gtScope();
  const said = scope.querySelector(`#gt-said-${key}`);
  if (!said) return;
  said.hidden = false;
  const ta = scope.querySelector(`#gt-input-${key}`);
  if (ta) ta.hidden = true;
}
// Fallback: mic ditolak / STT nonaktif → tampilkan textarea ketik.
function _gtTypeState(key, scope) {
  scope = scope || _gtScope();
  const said = scope.querySelector(`#gt-said-${key}`);
  if (!said) return;
  said.hidden = true;
  const ta = scope.querySelector(`#gt-input-${key}`);
  if (ta) { ta.hidden = false; try { ta.focus(); } catch {} }
}

window.gtStartRecord = async (pi, si, btn, ev) => {
  if (ev && ev.cancelable) ev.preventDefault();
  if (!_gtSttSupported()) return;
  const key = `${pi}-${si}`;
  // Reset: rekaman lain yang masih jalan dibuang, teks + hasil slot ini dibersihkan.
  if (_gtRec) _gtCancelActive();
  const scope = _gtScope();
  const status = scope.querySelector(`#gt-status-${key}`);
  const input = scope.querySelector(`#gt-input-${key}`);
  const result = scope.querySelector(`#gt-result-${key}`);
  _gtSpeakState(key, scope);
  if (input) input.value = '';
  _gtSetSaid(key, '', scope);
  if (result) result.hidden = true;

  const rec = { key, btn, recorder: null, chunks: [], stream: null, stopRequested: false, discarded: false };
  _gtRec = rec;
  // Pointer capture supaya pointerup tetap diterima walau jari/mouse geser keluar tombol.
  try { if (ev && ev.pointerId != null && btn.setPointerCapture) btn.setPointerCapture(ev.pointerId); } catch {}
  btn.classList.add('recording');
  btn.textContent = '● Merekam…';
  if (status) status.textContent = 'Merekam… lepas tombol saat selesai bicara.';

  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    if (_gtRec === rec) _gtRec = null;
    _gtResetBtn(btn);
    if (status) status.textContent = 'Akses mikrofon ditolak — ketik kalimatmu saja.';
    _gtTypeState(key, scope);
    return;
  }
  // User sudah melepas / membatalkan sebelum izin mic selesai → jangan rekam.
  if (_gtRec !== rec || rec.stopRequested || rec.discarded) {
    stream.getTracks().forEach((t) => t.stop());
    if (_gtRec === rec) { _gtRec = null; _gtResetBtn(btn); if (status) status.textContent = 'Terlalu singkat — tahan tombol lalu bicara.'; }
    return;
  }
  rec.stream = stream;
  const recorder = new MediaRecorder(stream);
  rec.recorder = recorder;
  recorder.ondataavailable = (e) => { if (e.data && e.data.size) rec.chunks.push(e.data); };
  recorder.onstop = () => _gtFinishRecord(rec);
  recorder.start();
};

window.gtStopRecord = (pi, si, btn, ev) => {
  if (ev) {
    if (ev.cancelable) ev.preventDefault();
    try { if (ev.pointerId != null && btn.releasePointerCapture && btn.hasPointerCapture && btn.hasPointerCapture(ev.pointerId)) btn.releasePointerCapture(ev.pointerId); } catch {}
  }
  const rec = _gtRec;
  if (!rec || rec.key !== `${pi}-${si}`) return;
  rec.stopRequested = true;
  if (rec.recorder && rec.recorder.state === 'recording') {
    try { rec.recorder.stop(); } catch {}
  }
  // Kalau recorder belum siap (masih menunggu izin mic), flag stopRequested
  // di atas akan membatalkannya begitu getUserMedia selesai.
};

async function _gtFinishRecord(rec) {
  const scope = _gtScope();
  const status = scope.querySelector(`#gt-status-${rec.key}`);
  if (rec.stream) rec.stream.getTracks().forEach((t) => t.stop());
  _gtResetBtn(rec.btn);
  if (rec.discarded) { if (_gtRec === rec) _gtRec = null; return; }
  if (status) status.textContent = 'Mentranskrip…';
  const blob = new Blob(rec.chunks, { type: (rec.recorder && rec.recorder.mimeType) || 'audio/webm' });
  const fd = new FormData();
  fd.append('audio', blob, 'speech.webm');
  try {
    const res = await window.ezApi('/grammar-task/transcribe', { method: 'POST', body: fd });
    if (res.status === 503) { if (status) status.textContent = 'Transkripsi otomatis nonaktif — ketik kalimatmu saja.'; _gtTypeState(rec.key, scope); return; }
    if (!res.ok) { if (status) status.textContent = 'Gagal mentranskrip — tahan tombol untuk rekam ulang.'; return; }
    const data = await res.json();
    _gtSpeakState(rec.key, scope);
    _gtSetSaid(rec.key, data.text || '', scope); // replace, bukan append → tidak menumpuk
    if (status) status.textContent = data.text ? 'Transkrip selesai — periksa, atau rekam ulang bila kurang pas.' : 'Tidak ada teks terdeteksi — coba rekam lagi.';
  } catch (e) {
    if (status) status.textContent = 'Gagal mentranskrip — tahan tombol untuk rekam ulang.';
  } finally {
    if (_gtRec === rec) _gtRec = null;
  }
}

window.gtCheck = async (pi, si, btn) => {
  const it = (window.__gtData || [])[pi];
  const key = `${pi}-${si}`;
  const scope = _gtScope();
  const result = scope.querySelector(`#gt-result-${key}`);
  if (!it || !result) return;
  const sentence = _gtGetSentence(key, scope);
  const showResult = (cls, html) => { result.hidden = false; result.className = `gt-result${cls ? ' ' + cls : ''}`; result.innerHTML = html; };
  if (!sentence) { showResult('gt-result--error', '<div class="gt-result-body" style="padding-left:0;">Ucapkan atau ketik kalimatmu dulu.</div>'); return; }
  btn.disabled = true;
  const oldLabel = btn.textContent;
  btn.textContent = 'Memeriksa…';
  try {
    const res = await window.ezApi('/grammar-task/evaluate', {
      method: 'POST',
      body: JSON.stringify({ lessonId: window.__gtLessonId, grammarId: it.id, sentence }),
    });
    if (res.status === 503) {
      if (window.__gtState) { window.__gtState.evalDisabled = true; gtUpdateComplete(); }
      showResult('', '<div class="gt-result-body" style="padding-left:0;color:var(--du-ink-3);">Penilaian AI belum aktif. Kamu tetap bisa menandai pelajaran ini selesai.</div>');
      return;
    }
    if (!res.ok) { showResult('gt-result--error', '<div class="gt-result-body" style="padding-left:0;">Gagal memeriksa, coba lagi.</div>'); return; }
    const d = await res.json();
    const ok = d.correct && d.usesPattern;
    if (window.__gtState) { window.__gtState.passed[key] = !!ok; gtUpdateComplete(); }
    const corr = d.correction ? `
      <div style="margin-top:10px;display:flex;align-items:flex-start;gap:8px;">
        <button class="dc-audio" type="button" style="position:static;flex:none;" aria-label="Dengar koreksi" onclick="speakJapanese(${JSON.stringify(String(d.correction)).replace(/"/g, '&quot;')}, this)">${AUDIO_SVG}</button>
        <div><div style="font-size:11px;color:var(--du-ink-4);font-weight:700;letter-spacing:.08em;">KOREKSI</div><div lang="ja" style="font-size:15px;">${escapeHtml(d.correction)}</div></div>
      </div>` : '';
    showResult(ok ? 'gt-result--success' : 'gt-result--error', `
      <div class="gt-result-head">
        <span class="gt-result-icon" aria-hidden="true">${ok ? '✓' : '!'}</span>
        <span class="gt-result-title">${ok ? 'Bagus!' : 'Belum tepat'}</span>
      </div>
      <div class="gt-result-body">
        ${d.feedback ? escapeHtml(d.feedback) : ''}
        ${corr}
      </div>`);
  } catch (e) {
    showResult('gt-result--error', '<div class="gt-result-body" style="padding-left:0;">Gagal memeriksa, coba lagi.</div>');
  } finally {
    btn.disabled = false;
    btn.textContent = oldLabel;
  }
};

// Kanji lesson — render grid karakter; klik → openKanjiDetail modal
// (yang sudah ada, dipakai juga oleh "Daftar Kanji" sidebar). API mengirim
// lesson.kanji = array kanji_items penuh, jadi populate _kanjiByIdCache

  const { prev, next, isDone } = nav || {};
  const items = Array.isArray(lesson.kanji) ? lesson.kanji : [];
  for (const k of items) {

          <button type="button" class="kanji-tile" onclick="openKanjiDetail('${escapeHtml(k.id)}')"
                  data-kanji="${escapeHtml(`${k.character} ${k.on_reading || ''} ${k.kun_reading || ''} ${k.meaning_id || ''}`.toLowerCase())}">
            <span class="kanji-tile-level">${escapeHtml(k.jlpt_level || '')}</span>
            <span class="kanji-tile-char">${escapeHtml(k.character)}</span>

    <p class="lesson-breadcrumb">${course.name} · Modul <span>${module.num}</span> · KANJI</p>
    <h1 class="lesson-title">${escapeHtml(lesson.title)}</h1>
    <p class="lesson-subtitle">${escapeHtml(module.title)}${lesson.duration ? ' — ' + escapeHtml(lesson.duration) : ''}</p>
    <div class="deck-hero">
      <div>
        <div class="dh-eyebrow">漢字 · KANJI</div>
        <div class="dh-body">${escapeHtml(intro)}</div>
      </div>
      <div class="dh-stat" aria-label="${items.length} kanji">
        <div class="dh-stat-num">${items.length}</div>
        <div class="dh-stat-label">kanji</div>
      </div>
    </div>
    ${tilesHtml}
    <div class="lesson-footer">
      <button class="btn-secondary" ${!prev ? 'disabled' : ''} onclick="${prev ? `selectLesson('${prev.m.id}','${prev.l.id}')` : ''}">← Sebelumnya</button>
      <button class="btn-primary" onclick="markCompleteAndNext()">
        ${isDone ? (next ? 'Lanjut →' : 'Selesai ✓') : (next ? 'Tandai Selesai & Lanjut →' : 'Tandai Selesai ✓')}

window.openDeckModal = (idx) => {
  const data = window.__deckData || [];
  const it = data[idx];
  if (!it) return;
  const back = document.getElementById('deck-modal-backdrop');
  const modal = document.getElementById('deck-modal');
  if (!back || !modal) return;
  const wasOpen = back.classList.contains('open');
  if (!wasOpen) {
    window.__deckModalReturnFocus = document.activeElement;
  }
  window.__deckModalIdx = idx;
  modal.style.setProperty('--deck-accent', deckAccent(it));
  modal.querySelector('.dm-jp').textContent = it.japanese || '';
  modal.querySelector('.dm-cat').textContent = (it.category || 'kosakata').toUpperCase();
  modal.querySelector('.dm-kana').textContent = it.reading || '';
  modal.querySelector('.dm-romaji').textContent = it.romaji || '';
  modal.querySelector('.dm-arti').textContent = it.indonesian || '';
  const headAudio = modal.querySelector('.dm-headaudio');
  headAudio.onclick = () => playDeckAudio(idx, headAudio);
  const list = document.getElementById('deck-ex-list');
  const examples = Array.isArray(it.examples) ? it.examples : [];
  list.innerHTML = examples.length === 0
    ? '<div class="deck-ex-empty">Belum ada contoh kalimat untuk kata ini.</div>'
    : examples.map((ex, i) => {
        const plain = String(ex.japanese || '').replace(/<[^>]*>/g, '');
        return `<div class="deck-ex">
          <div class="de-num">${String(i + 1).padStart(2, '0')}</div>
          <div class="de-text">
            <div class="de-jp" lang="ja">${deckHighlight(plain, ex.highlight, it.japanese)}</div>
            ${ex.reading ? `<div class="de-kana" lang="ja">${escapeHtml(ex.reading)}</div>` : ''}
            ${ex.indonesian ? `<div class="de-id">${escapeHtml(ex.indonesian)}</div>` : ''}
          </div>
          <button class="de-play" type="button" aria-label="Dengar kalimat" onclick="playDeckExample(${idx}, ${i}, this)">${AUDIO_SVG}</button>
        </div>`;
      }).join('');
  const prevBtn = document.getElementById('deck-modal-prev');
  const nextBtn = document.getElementById('deck-modal-next');
  const counter = document.getElementById('deck-modal-counter');
  if (prevBtn) prevBtn.disabled = idx <= 0;
  if (nextBtn) nextBtn.disabled = idx >= data.length - 1;
  if (counter) counter.textContent = `${idx + 1} / ${data.length}`;
  back.classList.add('open');
  if (!wasOpen) {
    // Focus the modal so screen readers announce it; keyboard nav (← →/Esc) is wired globally.
    setTimeout(() => modal.focus(), 0);
  }
};

window.deckModalStep = (delta) => {
  const data = window.__deckData || [];
  const cur = typeof window.__deckModalIdx === 'number' ? window.__deckModalIdx : 0;
  const target = cur + delta;
  if (target < 0 || target >= data.length) return;
  // Stop any audio that was playing for the previous card.
  document.querySelectorAll('.de-play.playing,.dm-headaudio.playing').forEach((b) => b.classList.remove('playing'));
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  window.openDeckModal(target);
};

window.closeDeckModal = () => {
  const back = document.getElementById('deck-modal-backdrop');
  if (back) back.classList.remove('open');
  document.querySelectorAll('.de-play.playing,.dm-headaudio.playing,.dc-audio.playing').forEach((b) => b.classList.remove('playing'));
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  const ret = window.__deckModalReturnFocus;
  window.__deckModalReturnFocus = null;
  if (ret && typeof ret.focus === 'function') {
    try { ret.focus(); } catch (e) { /* noop */ }
  }
};

// Tugas grammar yang dikaitkan ke pelajaran pemicu (popupAfterLessonId) hanya
// tampil sebagai popup → disembunyikan dari daftar, navigasi, & hitungan progres.
function gtIsPopupTask(l) {
  return !!(l && l.type === 'grammar_task' && l.popupAfterLessonId);
}
function visibleLessons(m) {
  return (m.lessons || []).filter((l) => !gtIsPopupTask(l));
}
// Cari tugas-popup (grammar_task) yang dipicu oleh lesson tertentu (by apiId).
function gtPendingTaskFor(course, lesson) {
  if (!lesson || !lesson.apiId) return null;
  for (const m of course.modules) {
    for (const l of m.lessons) {
      if (gtIsPopupTask(l) && l.popupAfterLessonId === lesson.apiId) {
        const prog = getProgress()[currentState.course] || {};
        return { taskMod: m, taskLesson: l, done: !!prog[`${m.id}:${l.id}`] };
      }
    }
  }
  return null;
}

// Sembunyikan tutor Maneko-chan saat siswa sedang dinilai (pelajaran quiz /
// grammar_task + popup tugas grammar) — jangan sampai tutor AI dipakai bantu
// menjawab soal. Cukup display:none di kontainer #ai-senpai; state chat &
// mode panel tetap utuh.
window.__tutorHidden = false;
function setTutorHidden(hidden) {
  window.__tutorHidden = !!hidden;
  const el = document.getElementById('ai-senpai');
  if (el) el.style.display = hidden ? 'none' : '';
}
function updateTutorVisibility() {
  // Popup tugas grammar lagi kebuka → tetap sembunyi apa pun lesson aktifnya.
  if (document.querySelector('.gt-popup-overlay')) { setTutorHidden(true); return; }
  const course = COURSE_CONTENT[currentState.course];
  const module = course?.modules?.find((m) => m.id === currentState.moduleId);
  const lesson = module?.lessons?.find((l) => l.id === currentState.lessonId);
  setTutorHidden(!!lesson && (lesson.type === 'quiz' || lesson.type === 'grammar_task'));
}

function renderLesson() {
  gkStopAll(); // stop karaoke dialog dari lesson sebelumnya
  const course = COURSE_CONTENT[currentState.course];
  const module = course.modules.find(m => m.id === currentState.moduleId);
  const lesson = module.lessons.find(l => l.id === currentState.lessonId);
  updateTutorVisibility();
  const progress = getProgress()[currentState.course] || {};
  const key = `${module.id}:${lesson.id}`;
  const isDone = !!progress[key];

  const allLessons = course.modules.flatMap(m => visibleLessons(m).map(l => ({ m, l })));
  const idx = allLessons.findIndex(x => x.m.id === module.id && x.l.id === lesson.id);
  const prev = allLessons[idx - 1];
  const next = allLessons[idx + 1];

  // Quiz lesson → langsung pakai renderQuizLesson (landing card + cooldown
  // gating + start attempt). Legacy "Siap untuk kuis" landing card di-replace
  // sama renderQuizLandingCard yang lebih informatif (pool size, last attempt,
  // passing threshold, countdown cooldown).
  if (lesson.type === 'quiz') {
    renderQuizLesson(document.getElementById('main-content'), currentState.course, module.id, lesson.id);
    return;
  }

  // Deck — interactive vocab cards (design: "Kosakata" handoff)
  if (lesson.type === 'deck') {
    renderDeckLesson(course, module, lesson, { prev, next, isDone });
    return;
  }

  // Kanji — grid karakter, klik buka detail modal (stroke + mnemonic + compound)
  if (lesson.type === 'kanji') {
    renderKanjiLesson(course, module, lesson, { prev, next, isDone });
    return;
  }

  // Grammar task — siswa buat kalimat pakai pola grammar, ucapkan (STT), dinilai AI
  if (lesson.type === 'grammar_task') {
    renderGrammarTaskLesson(course, module, lesson, { prev, next, isDone });
    return;
  }

  // Regular lesson (video/text) — only render the player for actual video lessons.
  // The placeholder signals that a video will live here; click action stays a
  // friendly "coming soon" until Bunny Stream playback is wired up.
  const videoBlock = lesson.type === 'video' ? `
    <div class="video-player">
      <span class="video-soon">Segera tersedia</span>
      <button class="play-btn" onclick="alert('Video pelajaran akan segera tersedia di sini.')">▶</button>
      <span class="video-meta">${lesson.type.toUpperCase()} · ${lesson.duration.toUpperCase()}</span>
    </div>
  ` : '';

  // Show module intro panel only on the first lesson of a module (orientation).
  const isFirstOfModule = module.lessons[0]?.id === lesson.id;
  const introBlock = isFirstOfModule ? renderModuleIntro(module) : '';

  // When the intro panel is rendered, the first lesson's body duplicates the
  // same info (importer-generated markdown). Skip the body block to avoid
  // showing both.
  const bodyBlock = introBlock ? '' : `
    <div class="lesson-body">
      <h2>Catatan Pelajaran ${lesson.jp ? `<button class="pronounce-btn" style="vertical-align:middle;font-size:11px;" onclick="window.speakLessonJP(this)">🔊 Putar Jepang</button>` : ''}</h2>
      <p>${lesson.body}</p>
      ${lesson.jp ? `<div class="jp" id="lesson-jp">${lesson.jp}</div>` : ''}
      <p style="color:#999;font-size:13px;margin-top:18px;">Materi lengkap: video tutorial, contoh audio, dan worksheet PDF tersedia saat belajar.</p>
    </div>
  `;

  // Banner tugas grammar terkait (popup) — pelajaran ini jadi pemicunya.
  const pend = gtPendingTaskFor(course, lesson);
  const taskBanner = !pend ? '' : (pend.done
    ? `<div style="margin:14px 0;padding:10px 14px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;font-size:13px;color:#166534;">
         ✓ Tugas grammar untuk pelajaran ini sudah selesai.
         <button type="button" class="btn-secondary" style="margin-left:8px;padding:4px 12px;font-size:12px;" onclick="gtOpenTaskPopup('${pend.taskMod.id}','${pend.taskLesson.id}')">Kerjakan ulang</button>
       </div>`
    : `<div style="margin:14px 0;padding:12px 16px;background:#ecfdf5;border:1px solid #6ee7b7;border-radius:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;">
         <div style="flex:1;min-width:180px;font-size:14px;color:#065f46;">📝 Ada <strong>tugas grammar</strong> untuk pelajaran ini — <strong>belum selesai</strong>.</div>
         <button type="button" class="btn-primary" style="padding:8px 18px;" onclick="gtOpenTaskPopup('${pend.taskMod.id}','${pend.taskLesson.id}')">Kerjakan Tugas</button>
       </div>`);

  document.getElementById('main-content').innerHTML = `
    <p class="lesson-breadcrumb">${course.name} · Modul <span>${module.num}</span> · ${lesson.type.toUpperCase()}</p>
    <h1 class="lesson-title">${lesson.title}</h1>
    <p class="lesson-subtitle">${module.title} — ${lesson.duration}</p>

    ${taskBanner}

    ${introBlock}

    ${videoBlock}

    ${bodyBlock}

    ${renderLessonExtras(lesson)}

    ${renderLessonMaterials(module, lesson)}

    <div class="lesson-footer">
      <button class="btn-secondary" ${!prev ? 'disabled' : ''} onclick="${prev ? `selectLesson('${prev.m.id}','${prev.l.id}')` : ''}">
        ← Sebelumnya
      </button>
      <button class="btn-primary" onclick="markCompleteAndNext()">
        ${isDone ? (next ? 'Lanjut →' : 'Selesai ✓') : (next ? 'Tandai Selesai & Lanjut →' : 'Tandai Selesai ✓')}
      </button>
    </div>
  `;
}

// Sidebar accordion state — persists across renderSidebar() so user choices
// don't snap shut on every navigation. Sections default to CLOSED; user
// clicks to open one (mutex — at most one section open globally). Modules
// also mutex within their section. On the first render of a course, the
// section + module of the current lesson auto-open; afterwards the user
// is fully in control (clicking the open module collapses it cleanly).
const _expandedSections = new Set();
const _expandedModules = new Set();

window.selectLesson = (moduleId, lessonId) => {
  // Cleanup lesson-scoped state sebelum pindah — listening player + kanji
  // detail overlay + kanji stroke timer + kanji modal stale state.
  // Tanpa ini, audio terus jalan / modal stack / timer fight pas ganti
  // lesson via sidebar.
  try { destroyAllListeningPlayers(); } catch {}
  try { window.closeKanjiDetail?.(); } catch {}
  if (typeof _kanjiStrokeTimer !== 'undefined' && _kanjiStrokeTimer) {
    clearTimeout(_kanjiStrokeTimer); _kanjiStrokeTimer = null;
  }

  // Picking a lesson auto-opens its section + module; close sibling modules
  // in the same section (module-level mutex). Other sections stay closed.
  const sec = _sectionOfModule(moduleId);
  _expandedSections.clear();
  _expandedSections.add(sec);
  for (const otherId of [..._expandedModules]) {
    if (otherId !== moduleId && _sectionOfModule(otherId) === sec) {
      _expandedModules.delete(otherId);
    }
  }
  _expandedModules.add(moduleId);
  currentState.moduleId = moduleId;
  currentState.lessonId = lessonId;
  renderSidebar();
  renderLesson();
  closeSidebar();
  window.scrollTo({ top: 0, behavior: 'auto' });
};

const SIDEBAR_KEY = 'eznihongo:sidebarCollapsed';
const isDesktop = () => window.innerWidth >= 861;
function applySidebarCollapse(collapsed) {
  const layout = document.querySelector('.learning-layout');
  if (!layout) return;
  layout.classList.toggle('sidebar-collapsed', collapsed);
  const btn = document.getElementById('sidebar-toggle');
  const btnLabel = btn && btn.querySelector('span');
  if (btnLabel) btnLabel.textContent = collapsed ? 'Menu' : 'Tutup';
  if (btn) btn.setAttribute('aria-label', collapsed ? 'Buka menu' : 'Tutup menu');
  const handle = document.getElementById('sidebar-handle');
  if (handle) {
    const label = collapsed ? 'Buka sidebar' : 'Tutup sidebar';
    handle.setAttribute('aria-label', label);
    handle.setAttribute('title', label);
  }
}
window.applySidebarCollapse = applySidebarCollapse;

window.toggleSidebar = () => {
  // Desktop: collapse/expand persistent sidebar. Mobile: drawer.
  if (isDesktop()) {
    const cur = localStorage.getItem(SIDEBAR_KEY) === '1';
    const next = !cur;
    localStorage.setItem(SIDEBAR_KEY, next ? '1' : '0');
    applySidebarCollapse(next);
    return;
  }
  const sb = document.getElementById('sidebar');
  const bd = document.getElementById('sidebar-backdrop');
  if (!sb) return;
  const isOpen = sb.classList.toggle('mobile-open');
  if (bd) bd.classList.toggle('show', isOpen);
  document.body.style.overflow = isOpen ? 'hidden' : '';
};

window.closeSidebar = () => {
  const sb = document.getElementById('sidebar');
  const bd = document.getElementById('sidebar-backdrop');
  if (sb) sb.classList.remove('mobile-open');
  if (bd) bd.classList.remove('show');
  document.body.style.overflow = '';
};

// Sync state when crossing the desktop breakpoint.
window.addEventListener('resize', () => {
  if (isDesktop()) {
    closeSidebar();
    applySidebarCollapse(localStorage.getItem(SIDEBAR_KEY) === '1');
  }
});

window.toggleModule = (moduleId) => {
  // Mutex within the parent section: opening one module collapses the others
  // in the same section. Toggle the current one if already open.
  const sec = _sectionOfModule(moduleId);
  const wasOpen = _expandedModules.has(moduleId);
  for (const otherId of [..._expandedModules]) {
    if (_sectionOfModule(otherId) === sec) _expandedModules.delete(otherId);
  }
  if (!wasOpen) _expandedModules.add(moduleId);
  renderSidebar();
};

window.toggleSidebarSection = (name) => {
  // Mutex at section level: opening one closes others (and resets their
  // open modules). Clicking the already-open section collapses it.
  const wasOpen = _expandedSections.has(name);
  _expandedSections.clear();
  // Collapsing a section also collapses its open module, to avoid leaving
  // stale state when the user re-opens it later.
  for (const otherId of [..._expandedModules]) {
    if (_sectionOfModule(otherId) !== name || wasOpen) {
      _expandedModules.delete(otherId);
    }
  }
  if (!wasOpen) _expandedSections.add(name);
  renderSidebar();
};

window.markCompleteAndNext = () => {
  const course = COURSE_CONTENT[currentState.course];
  const key = `${currentState.moduleId}:${currentState.lessonId}`;
  const allProgress = getProgress();
  const courseProgress = allProgress[currentState.course] || {};
  const wasAlreadyDone = !!courseProgress[key];
  courseProgress[key] = true;
  allProgress[currentState.course] = courseProgress;
  setProgress(allProgress);

  if (!wasAlreadyDone) addXP(10, 'lesson selesai');

  // Navigasi & hitungan progres pakai lesson terlihat saja (tugas-popup yang
  // tersembunyi tidak ikut dihitung — ia overlay terikat pelajaran pemicunya).
  const allLessons = course.modules.flatMap(m => visibleLessons(m).map(l => ({ m, l })));
  const idx = allLessons.findIndex(x => x.m.id === currentState.moduleId && x.l.id === currentState.lessonId);
  const next = allLessons[idx + 1];

  // Check if this was the last lesson of the module
  const currentModule = course.modules.find(m => m.id === currentState.moduleId);
  const curModVisible = visibleLessons(currentModule);
  const moduleDoneLessons = curModVisible.filter(l => courseProgress[`${currentModule.id}:${l.id}`]).length;
  const justFinishedModule = !wasAlreadyDone && moduleDoneLessons === curModVisible.length;

  // Check if entire course completed
  const totalLessons = course.modules.reduce((s, m) => s + visibleLessons(m).length, 0);
  const totalDone = course.modules.reduce((s, m) => s + visibleLessons(m).filter(l => courseProgress[`${m.id}:${l.id}`]).length, 0);
  const courseComplete = !wasAlreadyDone && totalDone === totalLessons;

  const advance = () => {
    if (next) {
      currentState.moduleId = next.m.id;
      currentState.lessonId = next.l.id;
    }
    renderSidebar();
    renderLesson();
    window.scrollTo({ top: 0, behavior: 'auto' });
    try { if (window.AISenpai && AISenpai._started) AISenpai.refresh(); } catch {}
  };

  const finalize = () => {
    if (courseComplete) {
      showCompletion({
        title: '🎌 Selamat! Kelas Selesai',
        message: `Kamu telah menyelesaikan semua materi ${course.name}. 素晴らしい！`,
        xp: 50,
        continueLabel: 'Tutup',
        onContinue: advance,
      });
      addXP(50, 'kelas selesai');
    } else if (justFinishedModule) {
      showCompletion({
        title: 'Bab Selesai!',
        message: `Kamu sudah tamatkan "${currentModule.title}". Lanjut ke materi berikutnya?`,
        xp: 15,
        continueLabel: 'Lanjut →',
        onContinue: advance,
      });
      addXP(15, 'bab selesai');
    } else {
      advance();
    }
  };

  // Kalau pelajaran yang baru diselesaikan punya tugas grammar terkait (popup)
  // yang belum selesai → munculkan popup dulu, lanjut setelah ditutup/selesai.
  const curLesson = currentModule.lessons.find(l => l.id === currentState.lessonId);
  const pend = curLesson ? gtPendingTaskFor(course, curLesson) : null;
  if (pend && !pend.done) {
    openGrammarTaskPopup(course, pend.taskMod, pend.taskLesson, finalize);
  } else {
    finalize();
  }
};

function renderCourseTabs(activeSlug) {
  const enrolled = getEnrolledCourses();
  // Tabs show the full catalog (CMS) plus any enrolled slugs that somehow
  // aren't in the CMS list (edge case — unpublished course user still has
  // access to). Non-enrolled tabs get a lock icon + upgrade flow.
  const cmsList = Array.isArray(_cmsCourses) ? _cmsCourses : [];
  const entries = [];
  const seen = new Set();
  for (const c of cmsList) {
    if (!c.slug) continue;
    seen.add(c.slug);
    entries.push({ slug: c.slug, name: c.title || c.slug.toUpperCase(), tagline: c.tagline || c.description || '' });
  }
  for (const slug of enrolled) {
    if (seen.has(slug)) continue;
    const c = COURSE_CONTENT[slug];
    entries.push({ slug, name: c?.name || slug.toUpperCase(), tagline: c?.tagline || '' });
  }
  const tabs = entries.map(({ slug, name, tagline }) => {
    const isEnrolled = enrolled.includes(slug);
    const isActive = slug === activeSlug;
    const classes = ['course-tab'];
    if (isActive) classes.push('active');
    if (!isEnrolled) classes.push('locked');
    const lockIcon = !isEnrolled ? '<span class="lock-icon">🔒</span>' : '';
    const title = tagline ? `${name} — ${tagline}` : name;
    return `<button class="${classes.join(' ')}" onclick="switchCourse('${slug}')" title="${title}">${slug.toUpperCase()}${lockIcon}</button>`;
  }).join('');
  const nav = document.getElementById('course-tabs');
  if (nav) nav.innerHTML = tabs;
}

window.switchCourse = async (slug) => {
  const enrolled = getEnrolledCourses();
  if (!enrolled.includes(slug)) {
    // Route through the universal checkout page. detail.html handles
    // not-found / not-available states — keeps this guard simple.
    window.location.href = `courses/detail.html?slug=${encodeURIComponent(slug)}`;
    return;
  }
  if (slug === currentState.course) { closeSidebar(); return; }
  currentState.moduleId = null;
  currentState.lessonId = null;
  history.replaceState({}, '', `welcome.html?course=${slug}`);
  renderLearning(slug);
  closeSidebar();
};

// Maskot Maneki-neko mengambang di pojok kanan-bawah. State machine:
// idle → peek (chip) → toast (kartu) → digest (grup) → expanded (chat).

// streak via /api/stats/me). Chat real ke /api/tutor/chat (Claude); riwayat
// di sessionStorage. Mount ke <body> supaya selamat dari re-render #app-root.

  reminders: [],
  chat: [],
  typing: false,
  _started: false,

  PALETTE: { body:'#FFFFFF', stroke:'#1B1410', inEar:'#FFB7AE', patch:'#F2B544', collar:'#C8102E', collarStroke:'#a50d26', bell:'#F2B544', bellStroke:'#B07300' },

  esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); },

      : `<path d="M36 46 Q40 ${blink ? 46.4 : 42} 44 46" stroke="${p.stroke}" stroke-width="2.2" fill="none" stroke-linecap="round"/><path d="M56 46 Q60 ${blink ? 46.4 : 42} 64 46" stroke="${p.stroke}" stroke-width="2.2" fill="none" stroke-linecap="round"/>`;

      <path d="M50 55 Q47 60 44 58 M50 55 Q53 60 56 58" stroke="#1B1410" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <ellipse cx="33" cy="56" rx="3.4" ry="1.8" fill="#FFB7AE" opacity="0.65"/>

      <circle cx="50" cy="72" r="4.2" fill="${p.bell}" stroke="${p.stroke}" stroke-width="1.6"/>

      <g transform="translate(36,80) rotate(-12)">

        <ellipse cx="-3.5" cy="-2.6" rx="3.4" ry="1.2" fill="#FFE08A" opacity="0.9"/>
        <text x="0" y="3.2" text-anchor="middle" font-size="8.8" font-weight="900" fill="${p.stroke}" font-family="'Noto Sans JP',sans-serif">福</text>
      </g>
      <g style="transform-origin:72px 56px;animation:${isWave ? 'senpaiPaw 1.05s ease-in-out infinite' : 'none'};">
        <g transform="translate(72,56) rotate(${pawRotate})">
          <ellipse cx="0" cy="0" rx="8" ry="9" fill="${p.body}" stroke="${p.stroke}" stroke-width="2.2"/>
          <ellipse cx="0" cy="2" rx="3.2" ry="2.2" fill="#FFB7AE" opacity="0.85"/>
          <ellipse cx="-3.5" cy="-3" rx="1.2" ry="1.4" fill="#FFB7AE" opacity="0.85"/>
          <ellipse cx="0" cy="-4" rx="1.2" ry="1.4" fill="#FFB7AE" opacity="0.85"/>
          <ellipse cx="3.5" cy="-3" rx="1.2" ry="1.4" fill="#FFB7AE" opacity="0.85"/>
