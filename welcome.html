          Tiap attempt, sistem ambil <strong>${status.questionsPerAttempt}</strong> soal acak dari pool <strong>${status.poolSize}</strong> — jadi soal bisa beda tiap retry.
        </p>
        <p style="color:#525252;font-size:13px;line-height:1.6;margin:0 0 22px;">
          ${cooldownNote}
        </p>
        ${lastBlock}
        <div style="margin-top:24px;text-align:center;">
          ${ctaButton}
        </div>
      </div>
      ${navFooter}
    </div>
  `;
}

function escapeAttr(s) { return String(s).replace(/'/g, '&#39;').replace(/"/g, '&quot;'); }

window.startQuizAttempt = async (key) => {
  const [slug, mId, lId] = key.split(':');
  const lesson = findLesson(slug, mId, lId);
  if (!lesson?.apiId) return;
  const main = document.getElementById('main-content');
  main.innerHTML = `<div class="quiz-container"><p style="color:#485f84;">Memulai kuis...</p></div>`;
  invalidateQuizStatus(lesson.apiId);
  try {
    const r = await window.ezApi(`/progress/lesson/${encodeURIComponent(lesson.apiId)}/quiz/start`, {
      method: 'POST',
    });
    if (r.status === 429) {
      // Cooldown race condition — re-render landing dgn status terbaru.
      const status = await fetchQuizStatus(lesson.apiId);
      if (status) renderQuizLandingCard(main, key, lesson.title || 'Kuis', status);
      return;
    }
    if (!r.ok) {
      const errData = await r.json().catch(() => ({}));
      main.innerHTML = `<div class="quiz-container"><p style="color:#b91c1c;">Gagal mulai: ${errData.error || r.status}</p></div>`;
      return;
    }
    const data = await r.json();
    const questions = (data.questions || []).map(transformQuestionFromApi);
    if (questions.length === 0) {
      main.innerHTML = `<div class="quiz-container"><p>Kuis ini belum punya soal.</p></div>`;
      return;
    }
    QUIZ_DATA[key] = questions;
    quizState = {
      key,
      questions,
      idx: 0,
      correct: 0,
      answered: false,
      selected: -1,
      answers: [],
      answeredByIndex: {},
      correctByIndex: {},
      selectedByIndex: {},
      activeCategory: firstQuizCategoryWithQuestions(questions),
      attemptToken: data.attemptToken,
      passingScorePct: data.passingScorePct,
    };
    renderQuizQuestion(main);
  } catch (err) {
    main.innerHTML = `<div class="quiz-container"><p style="color:#b91c1c;">Network error: ${err?.message || err}</p></div>`;
  }
};

function firstQuizCategoryWithQuestions(questions) {
  return ['vocabulary', 'grammar', 'reading', 'listening'].find((cat) =>
    questions.some((q) => normalizeQuizCategory(q.category) === cat)
  ) || 'vocabulary';
}

function quizQuestionsByCategory(questions, category) {
  return questions
    .map((q, index) => ({ q, index }))
    .filter((item) => normalizeQuizCategory(item.q.category) === category);
}

function renderQuizCategoryTabs(questions) {
  // Sembunyikan tab kategori yang ga punya soal — bukan disabled, langsung
  // ga di-render. Tab cuma muncul kalau ada konten.
  return ['vocabulary', 'grammar', 'reading', 'listening']
    .map((cat) => ({
      cat,
      meta: QUIZ_CATEGORY_META[cat],
      count: questions.filter((q) => normalizeQuizCategory(q.category) === cat).length,
    }))
    .filter((t) => t.count > 0)
    .map(({ cat, meta, count }) => {
      const active = quizState.activeCategory === cat;
      return `
        <button class="quiz-paper-tab ${active ? 'active' : ''}" type="button"
          onclick="window.setQuizCategory('${cat}')">
          ${meta.label} ${count}
        </button>
      `;
    }).join('');
}

function renderQuizSections(categoryItems) {
  const sections = [];
  const byKey = new Map();
  categoryItems.forEach((item) => {
    const sectionNumber = Number(item.q.sectionNumber) || 1;
    const key = String(sectionNumber);
    if (!byKey.has(key)) {
      const meta = QUIZ_CATEGORY_META[normalizeQuizCategory(item.q.category)] || QUIZ_CATEGORY_META.vocabulary;
      const section = {
        number: sectionNumber,
        label: item.q.sectionLabel || `Section ${sectionNumber}`,
        instruction: item.q.sectionInstruction || meta.defaultInstruction,
        items: [],
      };
      byKey.set(key, section);
      sections.push(section);
    }
    byKey.get(key).items.push(item);
  });

  return sections.map((section) => {
    const isListening = section.items.some(
      (item) => normalizeQuizCategory(item.q.category) === 'listening'
    );
    const playerHtml = isListening
      ? renderListeningPlayer(section.items, section.number)
      : '';
    // JLPT-style section header: kotak label "Section N" floating di atas
    // border, mondai instruction big font di bawahnya. Drop class
    // .quiz-paper-section yang bikin double-border conflict.
    const labelText = section.label || `Section ${section.number}`;
    const instructionText = (section.instruction || '').trim()
      || (QUIZ_CATEGORY_META[normalizeQuizCategory(section.items[0]?.q?.category)]?.defaultInstruction || '');
    // Passage (dokkai / 文章の文法): dirender SEKALI di atas grup soal yang
    // memakai bacaan sama — per-grup, bukan per-section, karena satu mondai
    // bisa berisi beberapa bacaan (短文) dan sampling per-attempt bisa
    // menyisakan subset soal (passage denormalized per soal).
    let prevPassage = null;
    const itemsHtml = section.items.map((item, i) => {
      const passage = (item.q.passage || '').trim();
      const passageHtml = passage && passage !== prevPassage
        ? renderQuizPassage(passage)
        : '';
      prevPassage = passage || prevPassage;
      return passageHtml + renderQuizPaperItem(item.q, item.index, section.number, i + 1);
    }).join('');
    return `
      ${playerHtml}
      <section class="jlpt-section">
        <span class="jlpt-section-tab">${sanitizeHtml(labelText)}</span>
        ${instructionText ? `<div class="jlpt-mondai">${sanitizeHtml(instructionText)}</div>` : ''}
      </section>
      <div class="quiz-paper-list" data-section-number="${section.number}">
        ${itemsHtml}
      </div>
    `;
  }).join('');
}

// Passage dokkai. Passage berformat pengumuman (情報検索: baris pertama =
// judul tanpa "：", ≥2 baris berikutnya "label：nilai") dirender sebagai
// flyer JLPT (judul center + tabel); selain itu (prose 短文/中文,
// 文章の文法) tetap blok teks <br>-joined seperti semula. Deteksi by
// content, bukan label section, supaya soal manual ikut kebagian.
function renderQuizPassage(passage) {
  const lines = passage.split('\n').map((l) => l.trim()).filter(Boolean);
  const isNotice = lines.length >= 3
    && !lines[0].includes('：')
    && lines.slice(1).filter((l) => l.includes('：')).length >= 2;
  if (!isNotice) {
    return `<div class="quiz-passage" lang="ja">${sanitizeHtml(passage).replace(/\n/g, '<br>')}</div>`;
  }
  const rows = lines.slice(1).map((line) => {
    const sep = line.indexOf('：');
    if (sep === -1) {
      return `<tr><td colspan="2" class="quiz-notice-sub">${sanitizeHtml(line)}</td></tr>`;
    }
    const label = line.slice(0, sep).trim();
    const value = line.slice(sep + 1).trim();
    return `<tr><th>${sanitizeHtml(label)}</th><td>${sanitizeHtml(value)}</td></tr>`;
  }).join('');
  return `
    <div class="quiz-passage quiz-notice" lang="ja">
      <div class="quiz-notice-title">${sanitizeHtml(lines[0])}</div>
      <table class="quiz-notice-rows">${rows}</table>
    </div>
  `;
}

// Centralized JLPT-style listening player. Satu player per section: muter
// semua dialog (audio_script) section secara berurutan via single <audio>
// dengan src swap. Track-list bisa di-klik buat lompat; play/pause + skip
// ±10s + progress bar bekerja di track yang lagi aktif.
function renderListeningPlayer(sectionItems, sectionNumber) {
  const tracks = sectionItems
    .map((item, idx) => ({
      qi: item.index,
      orderInSection: idx + 1,
      script: (item.q.audioScript || '').trim(),
    }))
    .filter((t) => t.script);
  if (tracks.length === 0) return '';
  const sectionKey = `s${sectionNumber}`;
  // Embed JSON via escapeHtml — handles &, <, >, ", ' all in one shot. Reader
  // di initListeningPlayers cukup baca el.dataset.tracks (browser udah
  // unescape) lalu JSON.parse.
  const tracksJs = escapeHtml(JSON.stringify(tracks));
  return `
    <div class="quiz-listening-player" id="qlp-${sectionKey}" data-section-key="${sectionKey}" data-tracks="${tracksJs}">
      <div class="qlp-head">
        <span class="qlp-title">🎧 Audio listening</span>
        <span class="qlp-track-label">Dialog <strong class="qlp-current-num">1</strong> / ${tracks.length}</span>
      </div>
      <div class="qlp-controls">
        <button type="button" class="qlp-btn qlp-step qlp-prev" aria-label="Dialog sebelumnya" onclick="window.listeningJump('${sectionKey}', -1, true)">⏮</button>
        <button type="button" class="qlp-btn qlp-skip" aria-label="Mundur 10 detik" onclick="window.listeningSkip('${sectionKey}', -10)">−10s</button>
        <button type="button" class="qlp-btn qlp-play" aria-label="Putar / jeda" onclick="window.listeningTogglePlay('${sectionKey}')">▶</button>
        <button type="button" class="qlp-btn qlp-skip" aria-label="Maju 10 detik" onclick="window.listeningSkip('${sectionKey}', 10)">+10s</button>
        <button type="button" class="qlp-btn qlp-step qlp-next" aria-label="Dialog berikutnya" onclick="window.listeningJump('${sectionKey}', 1, true)">⏭</button>
      </div>
      <div class="qlp-bar-wrap">
        <input type="range" class="qlp-bar" min="0" max="100" value="0" step="0.1" aria-label="Posisi audio"
          oninput="window.listeningSeek('${sectionKey}', this.value)" />
        <span class="qlp-time"><span class="qlp-cur-time">00:00</span> / <span class="qlp-total-time">00:00</span></span>
      </div>
      <div class="qlp-jeda" aria-live="polite"></div>
      <div class="qlp-tracklist">
        ${tracks.map((t, i) => `
          <button type="button" class="qlp-track ${i === 0 ? 'active' : ''}" data-track-index="${i}"
            onclick="window.listeningJump('${sectionKey}', ${i}, false)"
            title="Dialog ${sectionNumber}.${t.orderInSection}">${sectionNumber}.${t.orderInSection}</button>
        `).join('')}
      </div>
    </div>
  `;
}

// Per-section player state (audio element + current track index + tracks).
// Re-built on every quiz render; old players get teardown via destroyAll().
window.__listeningPlayers = window.__listeningPlayers || {};

function destroyAllListeningPlayers() {
  for (const key of Object.keys(window.__listeningPlayers)) {
    const p = window.__listeningPlayers[key];
    if (p?.audio) {
      try { p.audio.pause(); } catch {}
      p.audio.src = '';
    }
    if (p?._jedaTimer) { clearTimeout(p._jedaTimer); p._jedaTimer = null; }
    delete window.__listeningPlayers[key];
  }
}

function fmtTime(s) {
  if (!isFinite(s) || s < 0) s = 0;
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return `${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
}

function initListeningPlayers() {
  destroyAllListeningPlayers();
  document.querySelectorAll('.quiz-listening-player').forEach((el) => {
    const key = el.dataset.sectionKey;
    let tracks;
    try {
      tracks = JSON.parse(el.dataset.tracks || '[]');
    } catch { tracks = []; }
    if (!tracks.length) return;
    const audio = new Audio();
    audio.preload = 'none';
    const state = { el, audio, tracks, currentIdx: 0, isPlaying: false };
    window.__listeningPlayers[key] = state;
    audio.addEventListener('timeupdate', () => updateListeningUI(key));
    audio.addEventListener('loadedmetadata', () => updateListeningUI(key));
    audio.addEventListener('ended', () => {
      if (state.currentIdx < state.tracks.length - 1) {
        // Jeda 5 detik antar dialog ala JLPT real test — kasih siswa
        // waktu baca opsi sebelum dialog berikutnya jalan. Track count
        // tetap progress (1.1 done) tapi audio belum mulai.
        state.isPlaying = false;
        updateListeningUI(key);
        // Show countdown di UI selama jeda.
        const countdownEl = el.querySelector('.qlp-jeda');
        let secsLeft = 5;
        const tick = () => {
          if (!window.__listeningPlayers[key] || window.__listeningPlayers[key] !== state) return; // di-destroy
          if (countdownEl) countdownEl.textContent = `Lanjut dialog ${state.currentIdx + 2} dalam ${secsLeft}s…`;
          secsLeft--;
          if (secsLeft < 0) {
            if (countdownEl) countdownEl.textContent = '';
            window.listeningJump(key, state.currentIdx + 1, true);
            return;
          }
          state._jedaTimer = setTimeout(tick, 1000);
        };
        // Clear timer lama (kalau user manual skip in the middle of jeda)
        if (state._jedaTimer) clearTimeout(state._jedaTimer);
        tick();
      } else {
        state.isPlaying = false;
        updateListeningUI(key);
      }
    });
    audio.addEventListener('play', () => { state.isPlaying = true; updateListeningUI(key); });
    audio.addEventListener('pause', () => { state.isPlaying = false; updateListeningUI(key); });
    loadListeningTrack(key, 0, false);
  });
}

function loadListeningTrack(key, idx, autoplay) {
  const s = window.__listeningPlayers[key];
  if (!s) return;
  if (idx < 0 || idx >= s.tracks.length) return;
  s.currentIdx = idx;
  const t = s.tracks[idx];
  s.audio.src = ttsUrl(t.script);
  updateListeningUI(key);
  if (autoplay) {
    const p = s.audio.play();
    if (p && typeof p.catch === 'function') p.catch(() => {});
  }
}

function updateListeningUI(key) {
  const s = window.__listeningPlayers[key];
  if (!s) return;
  const { el, audio, tracks, currentIdx, isPlaying } = s;
  const playBtn = el.querySelector('.qlp-play');
  if (playBtn) playBtn.textContent = isPlaying ? '❚❚' : '▶';
  const curNum = el.querySelector('.qlp-current-num');
  if (curNum) curNum.textContent = currentIdx + 1;
  const cur = el.querySelector('.qlp-cur-time');
  const tot = el.querySelector('.qlp-total-time');
  const bar = el.querySelector('.qlp-bar');
  const dur = audio.duration || 0;
  const ct = audio.currentTime || 0;
  if (cur) cur.textContent = fmtTime(ct);
  if (tot) tot.textContent = fmtTime(dur);
  if (bar && dur > 0) bar.value = (ct / dur) * 100;
  else if (bar) bar.value = 0;
  el.querySelectorAll('.qlp-track').forEach((b, i) => {
    b.classList.toggle('active', i === currentIdx);
    b.classList.toggle('done', i < currentIdx);
  });
  const prev = el.querySelector('.qlp-prev');
  const next = el.querySelector('.qlp-next');
  if (prev) prev.disabled = currentIdx === 0;
  if (next) next.disabled = currentIdx >= tracks.length - 1;
  document.querySelectorAll('.quiz-paper-item.is-listening-active').forEach((node) => {
    node.classList.remove('is-listening-active');
  });
  const activeTrack = tracks[currentIdx];
  if (activeTrack) {
    const node = document.querySelector(`.quiz-paper-item[data-question-index="${activeTrack.qi}"]`);
    if (node && isPlaying) node.classList.add('is-listening-active');
  }
}

window.listeningTogglePlay = (key) => {
  const s = window.__listeningPlayers[key];
  if (!s) return;
  if (s.audio.paused) {
    const p = s.audio.play();
    if (p && typeof p.catch === 'function') p.catch(() => {});
  } else {
    s.audio.pause();
  }
};

window.listeningSkip = (key, delta) => {
  const s = window.__listeningPlayers[key];
  if (!s) return;
  const dur = s.audio.duration || 0;
  if (!dur) return;
  s.audio.currentTime = Math.max(0, Math.min(dur, s.audio.currentTime + delta));
};

window.listeningSeek = (key, pct) => {
  const s = window.__listeningPlayers[key];
  if (!s) return;
  const dur = s.audio.duration || 0;
  if (!dur) return;
  s.audio.currentTime = (Number(pct) / 100) * dur;
};

// idx kalau bertanda relatif (true) → currentIdx + idx; else absolute index.
window.listeningJump = (key, idx, relative) => {
  const s = window.__listeningPlayers[key];
  if (!s) return;
  // Skip jeda countdown kalau user navigasi manual / auto-advance trigger.
  if (s._jedaTimer) { clearTimeout(s._jedaTimer); s._jedaTimer = null; }
  const jedaEl = s.el.querySelector('.qlp-jeda');
  if (jedaEl) jedaEl.textContent = '';
  const target = relative ? s.currentIdx + idx : Number(idx);
  if (target < 0 || target >= s.tracks.length) return;
  const wasPlaying = !s.audio.paused;
  loadListeningTrack(key, target, wasPlaying || relative);
  const activeTrack = s.tracks[target];
  if (activeTrack) {
    const node = document.querySelector(`.quiz-paper-item[data-question-index="${activeTrack.qi}"]`);
    if (node) node.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
};

function renderQuizPaperItem(q, qi, sectionNumber = 1, questionNumber = qi + 1) {
  const letters = ['1', '2', '3', '4', '5'];
  const answered = !!quizState.answeredByIndex?.[qi];
  const selected = quizState.selectedByIndex?.[qi];
  const isListening = normalizeQuizCategory(q.category) === 'listening';
  const hasAudioScript = isListening && q.audioScript && q.audioScript.trim();

  // Listening: transcript hidden sampai siswa menjawab. Player di top
  // section (renderListeningPlayer) yang nge-handle pemutarannya.
  // Non-listening: tetap inline JP + tombol Dengar.
  // Element selalu dibuat (display:none kalau belum dijawab) supaya
  // pickQuizAnswer bisa toggle tanpa re-render full article.
  const transcriptBlock = hasAudioScript ? `
    <details class="quiz-listen-transcript" id="quiz-transcript-${qi}" ${answered ? 'open' : ''} ${answered ? '' : 'style="display:none"'}>
      <summary>Transkrip percakapan</summary>
      <pre lang="ja">${escapeHtml(q.audioScript)}</pre>
    </details>` : '';

  const inlineJp = !isListening && q.jp
    ? `<span class="quiz-paper-jp">${sanitizeHtml(q.jp)}</span>`
    : '';

  // Tombol per-soal di-hapus per user request: konfllict sama
  // centralized player utama di top section (kepencet barengan = audio
  // bentrok). Cukup 1 player utama yang auto-advance dialog. User
  // boleh klik tracklist (1.1, 1.2, dst) buat lompat ke dialog
  // tertentu.
  const perQuestionAudio = '';

  // Question prompt image (opsional). Render di atas opsi.
  const questionImage = q.imageUrl
    ? `<div class="quiz-q-image"><img src="${escapeHtml(q.imageUrl)}" alt="Gambar soal ${sectionNumber}.${questionNumber}" loading="lazy" /></div>`
    : '';

  // Detect mode: kalau MAYORITAS opsi punya image_url → render grid 2x2
  // image. Kalau cuma sebagian / tidak ada → render text-only stack
  // (current default).
  const optionImages = Array.isArray(q.optionImages) ? q.optionImages : [];
  const imagedCount = optionImages.filter(Boolean).length;
  const useImageGrid = imagedCount >= Math.max(2, Math.floor(q.options.length / 2));

  const optionsHtml = useImageGrid
    ? `<div class="quiz-options-image-grid" id="quiz-options-${qi}">
        ${q.options.map((opt, i) => {
          const img = optionImages[i];
          const stateCls = `${answered ? 'disabled' : ''} ${answered && i === q.correct ? 'correct' : ''} ${answered && i === selected && i !== q.correct ? 'wrong' : ''}`;
          return `
            <button class="quiz-image-option ${stateCls}" data-idx="${i}"
              onclick="window.pickQuizAnswer(${qi}, ${i})">
              <span class="qio-num">${letters[i]}</span>
              ${img
                ? `<img class="qio-img" src="${escapeHtml(img)}" alt="Pilihan ${letters[i]}" loading="lazy" />`
                : `<span class="qio-text">${escapeHtml(opt)}</span>`}
              ${opt && img ? `<span class="qio-caption">${escapeHtml(opt)}</span>` : ''}
            </button>`;
        }).join('')}
      </div>`
    : `<div class="quiz-options" id="quiz-options-${qi}">
        ${q.options.map((opt, i) => `
          <button class="quiz-option ${answered ? 'disabled' : ''} ${answered && i === q.correct ? 'correct' : ''} ${answered && i === selected && i !== q.correct ? 'wrong' : ''}"
            data-idx="${i}" onclick="window.pickQuizAnswer(${qi}, ${i})">
            <span class="quiz-option-letter">${letters[i]}</span>
            <span>${escapeHtml(opt)}</span>
          </button>
        `).join('')}
      </div>`;

  // q.q / q.explain dari admin rich-text editor (boleh <b>/<i>/<u> tapi
  // ga boleh <script>). q.options dari plain-text input → escape full.
  // Render header soal JLPT-style:
  //   - `q.q` admin-controlled (kosong = ga render text body, cuma label
  //     "1ばん" / "れい" auto)
  //   - Default label: "1ばん" untuk soal aktual JLPT-feel. Admin bisa
  //     override dgn ngetik di field question (e.g. "れい:" untuk contoh).
  const qText = String(q.q || '').trim();
  const defaultLabel = `${questionNumber}ばん`;
  // Listening JLPT: kalau teks pertanyaan persis ada di audio script
  // (= dibacakan narator), sembunyikan sampai dijawab — di ujian asli
  // pertanyaan hanya didengar, tidak dicetak. Reveal bareng transkrip
  // di pickQuizAnswer. Soal listening lama (pertanyaan meta Indonesia,
  // bukan bagian script) tetap tampil.
  const qTextPlain = qText.replace(/<[^>]*>/g, '').trim();
  const qSpoken = hasAudioScript && qTextPlain && q.audioScript.includes(qTextPlain);
  const hideQText = qSpoken && !answered;
  const headerHtml = qText
    ? `<h2 class="quiz-question quiz-paper-question">
         <span class="quiz-paper-label">${defaultLabel}</span>
         <span class="quiz-q-text" id="quiz-qtext-${qi}" ${hideQText ? 'style="display:none"' : ''}>${sanitizeHtml(qText)}</span>
         ${hideQText ? '<span class="quiz-q-text quiz-q-spoken-hint" id="quiz-qhint-' + qi + '" style="color:var(--ink-500,#737373);font-style:italic;">🎧 Dengarkan pertanyaannya di audio</span>' : ''}
         ${inlineJp}
       </h2>`
    : `<div class="quiz-paper-label-only">${defaultLabel}</div>`;

  return `
    <article class="quiz-paper-item" data-question-index="${qi}">
      ${headerHtml}
      ${questionImage}
      ${perQuestionAudio}
      ${optionsHtml}
      <div class="quiz-feedback" id="quiz-feedback-${qi}">
        ${answered ? `<div class="quiz-explanation"><strong>${quizState.correctByIndex[qi] ? '✓ Benar!' : '✗ Belum tepat'}</strong> — ${sanitizeHtml(q.explain || 'Jawaban kamu sudah dicatat.')}</div>` : ''}
      </div>
      ${transcriptBlock}
    </article>
  `;
}

function renderQuizQuestion(container) {
  const { questions } = quizState;
  const total = questions.length;
  const activeItems = quizQuestionsByCategory(questions, quizState.activeCategory);

  container.innerHTML = `
    <div class="quiz-container quiz-paper">
      <div class="quiz-paper-tabs" role="tablist" aria-label="Kategori kuis">
        ${renderQuizCategoryTabs(questions)}
      </div>

      ${activeItems.length ? renderQuizSections(activeItems) : '<div class="empty">Belum ada soal di kategori ini.</div>'}

      <div class="quiz-paper-actions">
        <div class="quiz-progress-text" id="quiz-paper-progress">Terjawab 0 / ${total}</div>
        <button class="quiz-next-btn" id="quiz-finish-btn" onclick="finishQuiz()" disabled>Lihat Hasil</button>
      </div>
    </div>
  `;
  updateQuizPaperProgress();
  initListeningPlayers();
}

window.setQuizCategory = (category) => {
  if (!quizState) return;
  const next = normalizeQuizCategory(category);
  if (!quizState.questions.some((q) => normalizeQuizCategory(q.category) === next)) return;
  quizState.activeCategory = next;
  renderQuizQuestion(document.getElementById('main-content'));
};

window.pickQuizAnswer = async (questionIndex, optionIndex) => {
  const qi = typeof optionIndex === 'number' ? questionIndex : quizState.idx;
  const i = typeof optionIndex === 'number' ? optionIndex : questionIndex;
  if (quizState.answeredByIndex?.[qi]) return;
  quizState.answeredByIndex[qi] = true;
  quizState.answered = true;
  quizState.selected = i;
  quizState.selectedByIndex[qi] = i;
  quizState.idx = qi;
  const q = quizState.questions[qi];

  // Disable options + show transient loading while the server tells us if
  // the pick was right. The lesson API never sent is_correct, so we can't
  // grade locally.
  document.querySelectorAll(`#quiz-options-${qi} .quiz-option`).forEach((btn) => btn.classList.add('disabled'));
  const feedback = document.getElementById(`quiz-feedback-${qi}`);
  feedback.innerHTML = `<div class="quiz-explanation">Memeriksa…</div>`;

  // Record the answer for the final /quiz-attempt round-up.
  if (q.questionId && q.optionIds?.[i]) {
    quizState.answers.push({ questionId: q.questionId, optionId: q.optionIds[i] });
  }

  let correctOptionIndex = typeof q.correct === 'number' ? q.correct : -1;
  let isCorrect = correctOptionIndex === i;
  let correctOptionId = null;
  try {
    const [slug, mId, lId] = (quizState.key || '').split(':');
    const lessonApiId = findLesson(slug, mId, lId)?.apiId;
    if (lessonApiId && q.questionId && q.optionIds?.[i]) {
      const r = await fetch(
        `/api/lessons/${encodeURIComponent(lessonApiId)}/quiz/check`,
        {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ questionId: q.questionId, optionId: q.optionIds[i] }),
        }
      );
      if (r.ok) {
        const data = await r.json();
        isCorrect = !!data.isCorrect;
        correctOptionId = data.correctOptionId || null;
        if (data.explanation) q.explain = data.explanation;
      }
    }
  } catch (err) {
    console.warn('quiz/check failed:', err?.message || err);
  }

  q.correct = correctOptionId && q.optionIds ? q.optionIds.indexOf(correctOptionId) : correctOptionIndex;
  if (isCorrect) {
    quizState.correctByIndex[qi] = true;
    quizState.correct++;
  }

  document.querySelectorAll(`#quiz-options-${qi} .quiz-option`).forEach((btn, bi) => {
    if (bi === q.correct) btn.classList.add('correct');
    if (bi === i && !isCorrect) btn.classList.add('wrong');
  });

  const isLast = quizState.idx === quizState.questions.length - 1;
  feedback.innerHTML = `
    <div class="quiz-explanation">
      <strong>${isCorrect ? '✓ Benar!' : '✗ Belum tepat'}</strong> — ${sanitizeHtml(q.explain || 'Jawaban kamu sudah dicatat.')}
    </div>
    <button class="quiz-next-btn" onclick="window.nextQuizQuestion()">
      ${isLast ? 'Lihat Hasil →' : 'Soal Berikutnya →'}
    </button>
  `;

  const transcriptEl = document.getElementById(`quiz-transcript-${qi}`);
  if (transcriptEl) {
    transcriptEl.style.display = '';
    transcriptEl.open = true;
  }
  // Reveal teks pertanyaan listening yang tadinya audio-only.
  const qTextEl = document.getElementById(`quiz-qtext-${qi}`);
  if (qTextEl) qTextEl.style.display = '';
  const qHintEl = document.getElementById(`quiz-qhint-${qi}`);
  if (qHintEl) qHintEl.remove();

  if (isCorrect) addXP(5, 'jawaban benar');
  updateQuizPaperProgress();
};

function updateQuizPaperProgress() {
  if (!quizState) return;
  const answered = Object.keys(quizState.answeredByIndex || {}).length;
  const total = quizState.questions.length;
  const progress = document.getElementById('quiz-paper-progress');
  const finishBtn = document.getElementById('quiz-finish-btn');
  if (progress) progress.textContent = `Terjawab ${answered} / ${total}`;
  if (finishBtn) finishBtn.disabled = answered < total;
}

window.nextQuizQuestion = () => {
  if (quizState.idx < quizState.questions.length - 1) {
    quizState.idx++;
    quizState.answered = false;
    quizState.selected = -1;
    renderQuizQuestion(document.getElementById('main-content'));
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } else {
    finishQuiz();
  }
};

async function finishQuiz() {
  destroyAllListeningPlayers();
  const { questions, correct, key, answers, attemptToken, passingScorePct } = quizState;
  const clientTotal = questions.length;
  const main = document.getElementById('main-content');
  main.innerHTML = `
    <div class="quiz-container">
      <div class="quiz-results">
        <h2>Menyimpan hasil...</h2>
        <div class="score-circle">…</div>
      </div>
    </div>
  `;

  let score = correct;
  let total = clientTotal;
  let passing = passingScorePct || 70;
  let serverPassed = null;
  let nextAttemptAt = null;
  let cooldownHours = 12;
  try {
    const [slug, mId, lId] = key.split(':');
    const lesson = findLesson(slug, mId, lId);
    const lessonApiId = lesson?.apiId;
    invalidateQuizStatus(lessonApiId);
    if (lessonApiId && typeof window.ezApi === 'function') {
      const res = await window.ezApi(`/progress/lesson/${encodeURIComponent(lessonApiId)}/quiz-attempt`, {
        method: 'POST',
        body: JSON.stringify({ attemptToken, answers }),
      });
      if (res.ok) {
        const data = await res.json();
        if (typeof data.score === 'number' && typeof data.total === 'number' && data.total > 0) {
          score = data.score;
          total = data.total;
        }
        if (typeof data.passingScorePct === 'number') passing = data.passingScorePct;
        if (typeof data.passed === 'boolean') serverPassed = data.passed;
        if (data.nextAttemptAt) nextAttemptAt = data.nextAttemptAt;
        if (typeof data.cooldownHours === 'number') cooldownHours = data.cooldownHours;
        if (typeof data.removedFromPool === 'number') {
          quizState.removedFromPool = data.removedFromPool;
        }
      }
    }
  } catch (err) {
    console.warn('quiz-attempt submission failed:', err?.message || err);
  }

  const pct = total > 0 ? Math.round((score / total) * 100) : 0;
  const passed = serverPassed != null ? serverPassed : pct >= passing;
  const bonusXP = passed ? 20 : 10;

  // Save best score localStorage (UI-only, server is source of truth).
  const scores = JSON.parse(localStorage.getItem('ez_quiz_scores') || '{}');
  scores[key] = Math.max(scores[key] || 0, pct);
  localStorage.setItem('ez_quiz_scores', JSON.stringify(scores));
  _scheduleCloudPush();

  // Mark lesson done if passed (unlock next).
  if (passed) {
    const [slug, mId, lId] = key.split(':');
    const allProgress = getProgress();
    const cp = allProgress[slug] || {};
    cp[`${mId}:${lId}`] = true;
    allProgress[slug] = cp;
    setProgress(allProgress);
  }
  addXP(bonusXP, passed ? 'lulus kuis' : 'mencoba kuis');
  if (passed) fireConfetti();

  // Per-kategori breakdown — kasih siswa info materi mana yg lemah.
  const byCategory = { vocabulary: [0, 0], grammar: [0, 0], reading: [0, 0], listening: [0, 0] };
  for (let i = 0; i < questions.length; i++) {
    const cat = normalizeQuizCategory(questions[i].category);
    byCategory[cat][1] += 1;
    if (quizState.correctByIndex?.[i]) byCategory[cat][0] += 1;
  }
  const catBlock = ['vocabulary', 'grammar', 'reading', 'listening']
    .filter((c) => byCategory[c][1] > 0)
    .map((c) => {
      const [right, n] = byCategory[c];
      const label = QUIZ_CATEGORY_META[c]?.label || c;
      const ok = right === n;
      return `<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #eee;">
        <span>${label}</span>
        <strong style="color:${ok ? '#15803d' : '#525252'};">${right} / ${n}</strong>
      </div>`;
    }).join('');

  const removedNote = quizState.removedFromPool
    ? `<p style="color:#92400e;font-size:13px;margin:8px 0;background:#fef3c7;padding:8px 12px;border-radius:6px;text-align:left;">⚠️ ${quizState.removedFromPool} soal dari attempt-mu di-update admin saat mengerjakan, jadi tidak dihitung. Total disesuaikan jadi ${total} soal.</p>`
    : '';
  const noCooldownResult = (cooldownHours || 0) <= 0;
  const cooldownLine = nextAttemptAt && !noCooldownResult
    ? `<p style="color:#525252;font-size:13px;margin:14px 0 6px;">Bisa coba lagi pada <strong>${fmtNextAt(nextAttemptAt)}</strong> (${cooldownHours} jam dari sekarang).</p>`
    : (noCooldownResult
      ? `<p style="color:#15803d;font-size:13px;margin:14px 0 6px;">Tanpa cooldown — bisa retake kapan saja.</p>`
      : '');

  main.innerHTML = `
    <div class="quiz-container">
      <div class="quiz-results">
        <div class="trophy">${passed ? '🏆' : '💪'}</div>
        <h2>${passed ? 'Lulus!' : 'Belum Lulus'}</h2>
        <p class="subtitle">${passed
          ? 'Materi berikutnya sudah ke-unlock.'
          : (noCooldownResult
            ? `Skor minimal lulus: ${passing}%. Coba lagi sekarang.`
            : `Skor minimal lulus: ${passing}%. Coba lagi setelah ${cooldownHours} jam.`)}</p>
        <div class="score-circle">${pct}%</div>
        <p style="color:#485f84;margin:0 0 12px;">Benar ${score} dari ${total} soal</p>
        ${catBlock ? `<div style="background:#f9fafb;border-radius:8px;padding:10px 16px;margin:12px 0;text-align:left;font-size:14px;">${catBlock}</div>` : ''}
        ${removedNote}
        ${cooldownLine}
        <div class="quiz-results-btns">
          <button class="btn-primary" onclick="window.continueAfterQuiz()">${passed ? 'Lanjut ke materi →' : 'Kembali ke pelajaran'}</button>
        </div>
      </div>
    </div>
  `;
  renderSidebar();
}

window.retryQuiz = () => {
  // Cooldown enforced server-side. Klik retry → re-render landing card,
  // backend balik cooldown info kalau belum waktunya.
  const [slug, mId, lId] = quizState.key.split(':');
  renderQuizLesson(document.getElementById('main-content'), slug, mId, lId);
};

window.continueAfterQuiz = () => {
  const [slug, mId, lId] = quizState.key.split(':');
  const course = COURSE_CONTENT[slug];
  const allLessons = course.modules.flatMap(m => m.lessons.map(l => ({ m, l })));
  const idx = allLessons.findIndex(x => x.m.id === mId && x.l.id === lId);
  const next = allLessons[idx + 1];
  if (next) {
    currentState.moduleId = next.m.id;
    currentState.lessonId = next.l.id;
    renderSidebar();
    renderLesson();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } else {
    renderLesson();
  }
};

async function handleNewEnrollment() {
  const params = new URLSearchParams(window.location.search);
  const newCourse = params.get('new');
  if (!newCourse) return null;

  // Checkout page already POSTed /api/enrollments. Re-sync to pick up the new
  // row — localStorage is just a mirror. If the server says we're not enrolled
  // (e.g. payment failed), we bail without showing the success banner.
  const enrolled = await syncEnrollmentsFromServer();
  if (!enrolled.includes(newCourse)) {
    history.replaceState({}, '', 'welcome.html');
    return null;
  }

  // Resolve display name — prefer local content, fall back to CMS.
  let displayName = COURSE_CONTENT[newCourse]?.name;
  if (!displayName) {
    try {
      const courses = await fetchCmsCourses();
      const cms = courses.find(c => c.slug === newCourse);
      displayName = cms?.title || newCourse.toUpperCase();
    } catch { displayName = newCourse.toUpperCase(); }
  }

  const banner = document.getElementById('success-banner');
  const nameEl = document.getElementById('new-course-name');
  if (nameEl) nameEl.textContent = displayName;
  if (banner) {
    banner.classList.add('show');
    setTimeout(() => banner.classList.remove('show'), 6000);
  }

  history.replaceState({}, '', `welcome.html?course=${encodeURIComponent(newCourse)}`);
  return newCourse;
}

function logout() {
  if (typeof ezLogout === 'function') { ezLogout(); return; }
  localStorage.removeItem('ez_user');
  localStorage.removeItem('ez_courses');
  window.location.href = 'index.html';
}

function getTimeGreeting() {
  const h = new Date().getHours();
  if (h >= 5 && h < 11)  return { jp: 'おはようございます', id: 'Selamat pagi',  msg: 'Mari mulai hari dengan bahasa Jepang.',         kanji: '朝', period: 'PAGI'    };
  if (h >= 11 && h < 15) return { jp: 'こんにちは',        id: 'Selamat siang', msg: 'Istirahat sejenak — luangkan waktu belajar.',    kanji: '昼', period: 'SIANG'   };
  if (h >= 15 && h < 18) return { jp: 'こんにちは',        id: 'Selamat sore',  msg: 'Sore yang baik untuk review pelajaran.',         kanji: '夕', period: 'SORE'    };
  if (h >= 18 && h < 22) return { jp: 'こんばんは',        id: 'Selamat malam', msg: 'Akhiri hari dengan progress baru.',              kanji: '夜', period: 'MALAM'   };
  return                        { jp: 'お疲れ様です',      id: 'Sudah larut',    msg: 'Jaga kesehatan ya — belajar sebentar saja.',     kanji: '深', period: 'DINI HARI' };
}

function getUserName() {
  if (!session || !session.email) return 'teman';
  const local = session.email.split('@')[0];
  const clean = local.replace(/[._-]+/g, ' ').trim();
  return clean.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
}

function greetingBannerHtml() {
  const g = getTimeGreeting();
  const name = getUserName();
  const now = new Date();
  const hh = String(now.getHours()).padStart(2, '0');
  const mm = String(now.getMinutes()).padStart(2, '0');

  // Resume CTA — only on the in-course dashboard, when we know the user's
  // current lesson. Shortens the path from "open dashboard" to "actually study".
  let resume = '';
  const course = currentState.course && COURSE_CONTENT[currentState.course];
  if (course && currentState.moduleId && currentState.lessonId) {
    const mod = course.modules.find(m => m.id === currentState.moduleId);
    const lesson = mod && mod.lessons.find(l => l.id === currentState.lessonId);
    if (lesson) {
      const progress = getProgress()[currentState.course] || {};
      const isDone = !!progress[`${mod.id}:${lesson.id}`];
      const label = isDone ? 'Buka kembali' : 'Lanjut belajar';
      resume = `<button class="greeting-resume" type="button"
        onclick="selectLesson('${mod.id}','${lesson.id}')"
        aria-label="${label}: ${escapeHtml(lesson.title)}">
        <span class="gr-label">${label}</span>
        <span class="gr-title">${escapeHtml(lesson.title)}</span>
        <span aria-hidden="true">→</span>
      </button>`;
    }
  }

  return `
    <div class="greeting-banner">
      <div>
        <h1 class="greeting-jp">${g.jp}、<span class="name">${name}</span><span class="san">さん</span></h1>
        <p class="greeting-id">${g.id} — ${g.msg}</p>
        ${resume}

      <div class="greeting-time">
        <div class="gt-kanji">${g.kanji}</div>
        <div class="gt-label">${g.period}</div>
        <div class="gt-clock">${hh}<span class="gt-colon">:</span>${mm}</div>
      </div>
    </div>
  `;
}

function recoLessonChip(rec) {
  // API mengembalikan UUID backend (rec.id). Model konten frontend pakai slug
  // sebagai id (l.id = slug) dan menyimpan UUID di l.apiId — selectLesson
  // butuh (moduleSlug, lessonSlug). Cocokkan via apiId lalu pakai slug.
  const course = COURSE_CONTENT[currentState.course];
  let mod = null, les = null;
  if (course) {
    for (const m of course.modules) {
      const l = m.lessons.find((l) => l.apiId === rec.id);
      if (l) { mod = m; les = l; break; }
    }
  }
  const title = escapeHtml(rec.title || (les && les.title) || 'Pelajaran');
  if (mod && les) {
    return `<button type="button" class="reco-lesson"
        onclick="selectLesson('${mod.id}','${les.id}')"
        style="display:block;width:100%;text-align:left;border:1px solid #F0E0DA;background:#fffafb;border-radius:10px;padding:9px 12px;margin-bottom:6px;cursor:pointer;font-size:13px;color:#1B1410;font-weight:600;">
        ${title}<span aria-hidden="true" style="float:right;color:#8a7d66;">→</span>
      </button>`;
  }
  return `<div style="border:1px solid #F0E0DA;background:#fffafb;border-radius:10px;padding:9px 12px;margin-bottom:6px;font-size:13px;color:#5b4f42;font-weight:600;">${title}</div>`;

function recoPanelHtml(data) {
  if (!data || !data.hasData) return '';
  const cats = (Array.isArray(data.categories) ? data.categories.slice() : [])

  const bars = cats.map(recoCategoryBar).join('');

  const lessons = lessonsArr.map(recoLessonChip).join('');

let _cmsCourses = null;
async function fetchCmsCourses() {
  if (_cmsCourses) return _cmsCourses;
  try {
    const res = await fetch('/api/courses');
    if (!res.ok) return (_cmsCourses = []);
    const data = await res.json();
    return (_cmsCourses = Array.isArray(data.courses) ? data.courses : []);
  } catch { return (_cmsCourses = []); }
}

function renderPaywallCard(c) {
  const slug = c.slug;
  const title = c.title || (typeof slug === 'string' ? slug.toUpperCase() : 'Kelas');
  const priceLabel = c.price_label
    || (c.price_idr ? 'Rp ' + Number(c.price_idr).toLocaleString('id-ID') : '');
  const available = c.is_available !== false;
  const href = `courses/detail.html?slug=${encodeURIComponent(slug)}`;
  if (!available) {
    return `
      <div class="mini-plan disabled" aria-disabled="true" title="Segera hadir">
        <div class="level">${(slug || '').toUpperCase()}</div>
        <div class="plan-name">${title}</div>
        <div class="plan-price">${priceLabel}</div>
        <div class="plan-status">Segera hadir</div>
      </div>
    `;
  }
  return `
    <a href="${href}" class="mini-plan">
      <div class="level">${(slug || '').toUpperCase()}</div>
      <div class="plan-name">${title}</div>
      <div class="plan-price">${priceLabel}</div>
    </a>
  `;
}

function renderPaywall() {
  // Init already awaited fetchCmsCourses, so _cmsCourses is populated here
  // in the common path. If for some reason it's not (network hiccup), we
  // still render the shell and let the fallback fetch fill in below.
  const cmsList = Array.isArray(_cmsCourses) ? _cmsCourses : [];
  const plansHtml = cmsList.map(renderPaywallCard).join('');
  const loggedInEmail = (session && session.email) || '';

  document.getElementById('app-root').innerHTML = `
    <main class="paywall">
      <div class="paywall-inner">
        <div class="paywall-lock">🔒</div>
        <h1>Kamu belum memiliki akses kelas</h1>
        <p>Untuk mulai belajar, pilih kelas dan selesaikan pembayaran terlebih dahulu. Sekali bayar, akses konten 1 tahun penuh.</p>
        ${loggedInEmail ? `<p style="font-size:13px;color:#8a7d66;margin-top:-10px;margin-bottom:20px;">Login sebagai <strong>${loggedInEmail}</strong> · <a href="#" onclick="event.preventDefault(); window.ezLogout();" style="color:var(--brand-red);">Ganti akun</a></p>` : ''}
        <a href="index.html#pricing" class="paywall-cta">Pilih Kelas Sekarang →</a>

        <div class="paywall-plans" id="paywall-plans">
          ${plansHtml}
        </div>
      </div>
    </main>
  `;
  document.getElementById('sidebar-toggle')?.classList.remove('visible');
  closeSidebar();

  if (cmsList.length === 0) {
    fetchCmsCourses().then(courses => {
      if (!courses || courses.length === 0) return;
      const target = document.getElementById('paywall-plans');
      if (!target) return;
      target.innerHTML = courses.map(renderPaywallCard).join('');
    });
  }
}

function renderLearning(courseSlug) {
  const course = COURSE_CONTENT[courseSlug];
  // Stub when the course doesn't hydrate (API down, unpublished, not yet
  // populated) or has no modules yet (admin created shell, hasn't added
  // content). User is enrolled in both cases — don't bounce them to paywall.
  if (!course || course.modules.length === 0) return renderCmsOnlyCourseStub(courseSlug);

  if (!currentState.moduleId) {
    const progress = getProgress()[courseSlug] || {};
    let found = false;
    for (const m of course.modules) {
      for (const l of m.lessons) {
        const key = `${m.id}:${l.id}`;
        if (!progress[key]) {
          currentState.moduleId = m.id;
          currentState.lessonId = l.id;
          found = true;
          break;
        }
      }
      if (found) break;
    }
    if (!found) {
      currentState.moduleId = course.modules[0].id;
      currentState.lessonId = course.modules[0].lessons[0].id;
    }
  }
  currentState.course = courseSlug;

  document.getElementById('app-root').innerHTML = `
    ${greetingBannerHtml()}
    <div id="reco-panel"></div>
    <div class="learning-layout">
      <aside class="sidebar" id="sidebar"></aside>
      <main class="main-content" id="main-content"></main>
    </div>
    <button class="sidebar-handle" id="sidebar-handle" type="button" aria-label="Tutup sidebar" title="Tutup sidebar" onclick="toggleSidebar()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </button>
  `;

  renderSidebar();
  renderLesson();
  loadRecommendations();
  document.getElementById('sidebar-toggle')?.classList.add('visible');
  if (isDesktop()) {
    applySidebarCollapse(localStorage.getItem(SIDEBAR_KEY) === '1');
  }
}

function renderSidebar() {
  const course = COURSE_CONTENT[currentState.course];
  const progress = getProgress()[currentState.course] || {};

  // Preserve sidebar scroll across re-render. innerHTML swap di bawah
  // ngedestroy .sidebar-scroll lama → tanpa restore ini, klik section/Bab
  // di bawah viewport snap balik ke atas.
  const prevScroll = document.querySelector('.sidebar-scroll');
  const savedScrollTop = prevScroll ? prevScroll.scrollTop : 0;

  // Reset expanded state on course change so stale IDs from a previous course
  // don't leak. Default behaviour depends on whether the user has any progress
  // in this course:
  //   - First-timer (no completed lesson) → everything collapsed, clean view.
  //   - Returning student → auto-open the section + Bab containing the
  //     next-to-study lesson (currentState.moduleId is already resolved by
  //     renderLearning() to point there), so the sidebar lands on "lanjut di
  //     mana".
  if (_lastSeededCourse !== currentState.course) {
    _lastSeededCourse = currentState.course;
    _expandedSections.clear();
    _expandedModules.clear();
    const hasStudied = Object.values(progress).some((v) => v);
    if (hasStudied && currentState.moduleId) {
      _expandedSections.add(_sectionOfModule(currentState.moduleId));
      _expandedModules.add(currentState.moduleId);
    }
  }

  const totalLessons = course.modules.reduce((s, m) => s + m.lessons.length, 0);
  const doneLessons = Object.values(progress).filter(v => v).length;
  const pct = Math.round((doneLessons / totalLessons) * 100);

  const TYPE_LABEL = { video: 'Video', quiz: 'Kuis', text: 'Bacaan', deck: 'Kosakata', kanji: 'Kanji' };
  // SVG icons compact-style ala Udemy (play / question / book / cards / kanji).
  const TYPE_ICON = {
    video: '<svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>',
    quiz: '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
    text: '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>',
    deck: '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 9h18M9 21V9"/></svg>',
    kanji: '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>',
  };
  const CHECK_SVG = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>';

  // Group modules by section_name in their order of appearance. Modules with
  // no section fall into "Lainnya" — only added if it actually has content.
  const sectionBuckets = [];
  const sectionByName = new Map();
  for (const m of course.modules) {
    const secName = (m.sectionName && m.sectionName.trim()) || 'Lainnya';
    let bucket = sectionByName.get(secName);
    if (!bucket) {
      bucket = { name: secName, modules: [] };
      sectionByName.set(secName, bucket);
      sectionBuckets.push(bucket);
    }
    bucket.modules.push(m);
  }

  // Global Udemy-style lesson number across all modules in the course.
  const lessonNumber = new Map();
  {
    let n = 0;
    for (const m of course.modules) {
      for (const l of visibleLessons(m)) {
        n += 1;
        lessonNumber.set(`${m.id}:${l.id}`, n);
      }
    }
  }

  const renderModuleHtml = (m) => {
    const lessons = visibleLessons(m);
    const moduleDur = lessons.reduce((n, l) => n + (l.durationMinutes || 0), 0);
    const moduleDone = lessons.filter((l) => progress[`${m.id}:${l.id}`]).length;
    const moduleTotal = lessons.length;

    const lessonsHtml = lessons.map(l => {
      const key = `${m.id}:${l.id}`;
      const isDone = !!progress[key];
      const isCurrent = m.id === currentState.moduleId && l.id === currentState.lessonId;
      const typeKey = (l.type || 'text').toLowerCase();
      const typeLabel = TYPE_LABEL[typeKey] || typeKey.toUpperCase();
      const typeIcon = TYPE_ICON[typeKey] || TYPE_ICON.text;
      const num = lessonNumber.get(key);
      const durTxt = formatDurationCompact(l.durationMinutes);
      const aria = `${l.title}, ${typeLabel}${durTxt ? ', ' + durTxt : ''}${isDone ? ', selesai' : ''}${isCurrent ? ', sedang dibuka' : ''}`;
      return `

              <span class="lesson-duration">${escapeHtml(durTxt || typeLabel)}</span>
            </div>
          </div>
        </li>
      `;
    }).join('');

    const isOpen = _expandedModules.has(m.id);
    const metaParts = [`${moduleDone} / ${moduleTotal}`];
    if (moduleDur) metaParts.push(formatDurationCompact(moduleDur));
    return `
      <div class="module ${isOpen ? 'open' : ''}" data-module="${m.id}">
        <button class="module-header" type="button" aria-expanded="${isOpen ? 'true' : 'false'}" onclick="toggleModule('${m.id}')">

            <span class="m-meta">${escapeHtml(metaParts.join(' | '))}</span>
          </div>
          <svg class="m-caret" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div class="lessons"><ul class="lessons-inner">${lessonsHtml}</ul></div>
      </div>
    `;
  };

  // Untagged courses still get the section wrapper for visual consistency
  // (Udemy always wraps in section blocks). All untagged modules end up in
  // "Lainnya".
  const modulesHtml = sectionBuckets.map((b) => {
    const sectionDone = b.modules.reduce((n, m) =>
      n + m.lessons.filter((l) => progress[`${m.id}:${l.id}`]).length, 0);
    const sectionTotal = b.modules.reduce((n, m) => n + m.lessons.length, 0);
    const sectionDurMin = b.modules.reduce((n, m) =>
      n + m.lessons.reduce((mm, l) => mm + (l.durationMinutes || 0), 0), 0);
    const isSecOpen = _expandedSections.has(b.name);
    const safeName = b.name.replace(/'/g, "\\'");
    const metaParts = [`${sectionDone} / ${sectionTotal}`];
    if (sectionDurMin) metaParts.push(formatDurationCompact(sectionDurMin));
    return `
      <div class="sidebar-section ${isSecOpen ? 'open' : ''}" data-section="${escapeHtml(b.name)}">
        <button class="sidebar-section-header" type="button"
                aria-expanded="${isSecOpen ? 'true' : 'false'}"
                onclick="toggleSidebarSection('${escapeHtml(safeName)}')">
          <div class="ss-info">
            <span class="ss-name">${escapeHtml(b.name)}</span>
            <span class="ss-meta">${escapeHtml(metaParts.join(' | '))}</span>
          </div>
          <svg class="ss-caret" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div class="sidebar-section-body">
          ${b.modules.map(renderModuleHtml).join('')}
        </div>
      </div>
    `;
  }).join('');

  const enrolled = getEnrolledCourses();
  // Merge enrolled (hydrated) courses with CMS-listed courses so non-enrolled
  // courses still appear in the picker with an "Upgrade" CTA. Source of truth
  // for the unified list: CMS — enrolled courses are always a subset.
  const cmsList = Array.isArray(_cmsCourses) ? _cmsCourses : [];
  const pickerEntries = [];
  const seen = new Set();
  for (const c of cmsList) {
    if (!c.slug) continue;
    seen.add(c.slug);
    pickerEntries.push({ slug: c.slug, name: c.title || c.slug.toUpperCase() });
  }
  for (const slug of Object.keys(COURSE_CONTENT)) {
    if (seen.has(slug)) continue;
    pickerEntries.push({ slug, name: COURSE_CONTENT[slug].name });
  }
  const courseOptionsHtml = pickerEntries.map(({ slug, name }) => {
    const isEnrolled = enrolled.includes(slug);
    const isActive = slug === currentState.course;
    const classes = ['course-option'];
    if (isActive) classes.push('active');
    if (!isEnrolled) classes.push('locked');

      ? '<span class="opt-status">✓ Aktif</span>'

    const aria = isActive
      ? `${name}, kelas aktif`

  const session = JSON.parse(localStorage.getItem('ez_user') || 'null');
  const email = session?.email || '';

  document.getElementById('sidebar').innerHTML = `
    <button class="sidebar-close" type="button" aria-label="Tutup menu" onclick="closeSidebar()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="6" y1="18" x2="18" y2="6"/></svg>
    </button>

    <div class="course-picker" id="course-picker">
      <button class="course-picker-bar" type="button" onclick="toggleCoursePicker()">
        <span class="course-picker-level">${currentState.course.toUpperCase()}</span>

      <div class="course-picker-list">${courseOptionsHtml}</div>
    </div>

    <div class="sidebar-scroll">
      <div class="sidebar-header">
        <div class="sidebar-header-top">
          <span class="sidebar-course-badge">${currentState.course.toUpperCase()}</span>
          <h3>Progress Kelas</h3>
        </div>
        <div class="progress-card">
          <div class="progress-row">
            <span class="progress-pct">${pct}%</span>
            <span class="progress-sub">${doneLessons} dari ${totalLessons} materi</span>
          </div>
          <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
        </div>
      </div>
      <div class="module-filter">
        <svg class="mf-ico" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="search" id="module-filter-input" placeholder="Cari modul..." oninput="filterModules(this.value)" autocomplete="off" />
      </div>
      <div class="modules-list">${modulesHtml}</div>
      <div class="modules-empty" id="modules-empty" style="display:none;">Tidak ada modul yang cocok.</div>
      <div class="sidebar-quicklinks">
        <button class="quicklink" type="button" onclick="openVocabList()">
          <span class="ql-ico">📒</span>
          <span class="ql-text">Daftar Kosakata</span>
          <span class="ql-arr">→</span>
        </button>
        <button class="quicklink" type="button" onclick="openKanjiList()">
          <span class="ql-ico">📝</span>

          <span class="ql-arr">→</span>

        <button class="quicklink" type="button" onclick="openMateri()">
          <span class="ql-ico">📚</span>
          <span class="ql-text">Materi &amp; Referensi</span>
          <span class="ql-arr">→</span>
        </button>
        <button class="quicklink" type="button" onclick="openHelp()">

// Daftar Kosakata — per-level vocab reference, read from the `/api/notion-vocab`
// cache (admin manually refreshes via the admin button; reads never trigger a
// Notion fetch). Falls back to the DB-aggregated view (vocab grouped by deck
// lesson) when the cache is empty, and to the bundled flashcard set as a last
// resort. When the response carries `sections`, render a 2-level accordion
// (section → Bab → kosakata) with mutex behaviour at both levels.
window.openVocabList = async () => {
  closeSidebar();
  const slug = currentState.course;
  const course = COURSE_CONTENT[slug];
  const main = document.getElementById('main-content');
  if (!main) return;

  // 1) Try the Notion-backed cache. Response can be either:
  //    { sections: [{ name, bab: [{ kode, name, vocab: [...] }] }] }
  //    { bab: [...] }                                                ← flat
  let sectionsView = null;
  let renderable = [];
  let sourceLabel = '';
  let lastSyncedAt = null;
  try {
    const res = await fetch(`/api/notion-vocab?slug=${encodeURIComponent(slug)}`);
    if (res.ok) {
      const data = await res.json();
      lastSyncedAt = data.fetchedAt || null;
      const mapVocab = (vocab) => (vocab || []).map((v, i) => ({
        id: v.id || ('notion-' + i),
        japanese: v.japanese || '',
        reading: v.reading || '',
        indonesian: v.indonesian || '',
        category: v.category || '',
        note: v.note || '',
        sort: i,
      }));
      if (Array.isArray(data.sections) && data.sections.length > 0) {
        sectionsView = data.sections.map((s, si) => ({
          key: 'sec-' + si,
          name: s.name || '(tanpa nama)',
          bab: (s.bab || []).map((b, bi) => ({
            key: 'bab-' + si + '-' + bi,
            kode: b.kode || '',
            name: b.name || '(tanpa judul)',
            items: mapVocab(b.vocab),
          })),
        })).filter((s) => s.bab.length > 0);
        if (sectionsView.length === 0) sectionsView = null;
        else sourceLabel = 'Notion';
      } else if (Array.isArray(data.bab) && data.bab.length > 0) {
        renderable = data.bab.map((b) => ({
          key: 'notion:' + b.id,
          title: [b.kode, b.name].filter(Boolean).join(' — ') || b.name || '(tanpa judul)',
          items: mapVocab(b.vocab),
        })).filter((g) => g.items.length > 0);
        if (renderable.length > 0) sourceLabel = 'Notion';
      }
    }
  } catch { /* network/parse — fall through to DB fallback */ }

  // 2) Fallback: vocab grouped by deck-lesson from CMS DB.
  if (!sectionsView && renderable.length === 0 && course && Array.isArray(course.modules)) {
    const vocabToBab = new Map();
    const babOrder = [];
    const seenBab = new Set();
    for (const m of course.modules) {
      for (const l of (m.lessons || [])) {
        if (l.type !== 'deck') continue;
        const babKey = `${m.id}:${l.id}`;
        if (!seenBab.has(babKey)) { seenBab.add(babKey); babOrder.push({ babKey, babTitle: l.title }); }
        for (const d of (l.deck || [])) {
          if (d.id) vocabToBab.set(d.id, { babKey, babTitle: l.title });
        }
      }
    }
    const seenVocab = new Set();
    const allVocab = [];
    for (const m of course.modules) {
      for (const v of (m.vocabulary || [])) {
        if (!v || !v.id || seenVocab.has(v.id)) continue;
        seenVocab.add(v.id);
        allVocab.push({
          id: v.id,
          japanese: v.japanese || '', reading: v.reading || '',
          indonesian: v.indonesian || '', category: v.category || '',
          note: v.note || '', sort: v.sort_order ?? 0,
        });
      }
    }
    const groupByKey = new Map();
    const groups = [];
    for (const { babKey, babTitle } of babOrder) {
      const g = { key: babKey, title: babTitle, items: [] };
      groupByKey.set(babKey, g);
      groups.push(g);
    }
    const orphan = { key: '__orphan', title: 'Belum dipasang ke Bab', items: [] };
    for (const v of allVocab) {
      const bab = vocabToBab.get(v.id);
      if (bab && groupByKey.has(bab.babKey)) groupByKey.get(bab.babKey).items.push(v);
      else orphan.items.push(v);
    }
    for (const g of groups) g.items.sort((a, b) => (a.sort - b.sort) || a.japanese.localeCompare(b.japanese));
    orphan.items.sort((a, b) => (a.sort - b.sort) || a.japanese.localeCompare(b.japanese));
    if (orphan.items.length) groups.push(orphan);
    renderable = groups.filter((g) => g.items.length > 0);
    if (renderable.length > 0) sourceLabel = 'cache lokal';
  }

  // Flashcard fallback when CMS has zero vocab at all
  if (!sectionsView && renderable.length === 0) {
    if (!FLASHCARD_DATA || Object.keys(FLASHCARD_DATA).length === 0) {
      try { await loadFlashcardData(); } catch {}
    }
    const fc = (FLASHCARD_DATA && FLASHCARD_DATA[slug]) || [];
    const byCat = {};
    for (const c of fc) (byCat[c.category || 'Umum'] ||= []).push(c);
    for (const [cat, arr] of Object.entries(byCat)) {
      renderable.push({
        key: 'fc:' + cat,
        title: cat,
        items: arr.map((c, i) => ({
          id: 'fc-' + cat + '-' + i,
          japanese: c.front || '', reading: c.reading || '',
          indonesian: c.back || '', category: '', note: '', sort: i,
        })),
      });
    }
  }

  const total = sectionsView
    ? sectionsView.reduce((s, sec) => s + sec.bab.reduce((bs, b) => bs + b.items.length, 0), 0)
    : renderable.reduce((s, g) => s + g.items.length, 0);
  const courseName = course?.name || slug.toUpperCase();
  const levelChip = slug.toUpperCase();
  if (total === 0) {
    main.innerHTML = `
      <p class="lesson-breadcrumb">${escapeHtml(courseName)} · KOSAKATA</p>
      <h1 class="lesson-title">📒 Kosakata <span class="vocab-level-chip">${escapeHtml(levelChip)}</span></h1>
      <p class="lesson-subtitle" style="margin-top:12px;">Belum ada kosakata untuk kelas ini.</p>
    `;
    window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }

  const babCount = sectionsView
    ? sectionsView.reduce((n, s) => n + s.bab.length, 0)
    : renderable.filter((g) => !g.key.startsWith('fc:') && g.key !== '__orphan').length;
  const subtitleParts = [`${total} kata`];
  if (babCount > 0) subtitleParts.push(`${babCount} Bab`);
  if (sectionsView) subtitleParts.push(`${sectionsView.length} Bagian`);
  let syncNote = '';
  if (sourceLabel === 'Notion' && lastSyncedAt) {
    const ts = new Date(lastSyncedAt);
    const hh = String(ts.getHours()).padStart(2, '0');
    const mm = String(ts.getMinutes()).padStart(2, '0');
    syncNote = `<span class="vocab-source-note" title="Disinkron oleh admin dari Notion">⟳ ${hh}:${mm} · Notion</span>`;
  }

  const vocabRowHtml = (v) => `
    <tr data-vocab="${escapeHtml(`${v.japanese} ${v.reading} ${v.indonesian} ${v.category}`.toLowerCase())}">
      <td class="jp-cell">${escapeHtml(v.japanese)}</td>
      <td class="reading-cell">${escapeHtml(v.reading)}</td>
      <td>${escapeHtml(v.indonesian)}</td>
      <td>${v.category ? `<span class="vocab-cat">${escapeHtml(v.category)}</span>` : ''}</td>
      <td class="vocab-note">${escapeHtml(v.note)}</td>
    </tr>`;

  const bodyHtml = sectionsView ? `
    <div class="vocab-sections">
      ${sectionsView.map((s, si) => {
        const sectionKata = s.bab.reduce((n, b) => n + b.items.length, 0);
        const openSec = si === 0;
        return `
        <div class="vocab-section ${openSec ? 'open' : ''}" data-section="${escapeHtml(s.key)}">
          <button class="vocab-section-toggle" type="button"
                  aria-expanded="${openSec ? 'true' : 'false'}"
                  onclick="window.toggleVocabSection('${s.key}')">
            <span class="vs-name">${escapeHtml(s.name)}</span>
            <span class="vs-count">${s.bab.length} Bab · ${sectionKata} kata</span>
            <svg class="vs-caret" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="vocab-section-body">
            ${s.bab.map((b) => `
              <div class="vocab-bab vocab-list-group" data-bab="${escapeHtml(b.key)}">
                <button class="vocab-bab-toggle" type="button"
                        aria-expanded="false"
                        onclick="window.toggleVocabBab('${b.key}')">
                  ${b.kode ? `<span class="vb-kode">${escapeHtml(b.kode)}</span>` : ''}
                  <span class="vb-name">${escapeHtml(b.name)}</span>
                  <span class="vb-count">${b.items.length} kata</span>
                  <svg class="vb-caret" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><polyline points="9 6 15 12 9 18"/></svg>
                </button>
                <div class="vocab-bab-body">
                  <div style="overflow-x:auto;">
                    <table class="vocab-table">
                      <thead><tr><th>日本語</th><th>Reading</th><th>Arti</th><th>Kategori</th><th>Catatan</th></tr></thead>
                      <tbody>${b.items.map(vocabRowHtml).join('')}</tbody>
                    </table>
                  </div>
                </div>
              </div>`).join('')}
          </div>
        </div>`;
      }).join('')}
    </div>` : `
    <div class="lesson-extras">
      ${renderable.map((g) => `
        <div class="lesson-extra-card vocab-list-group">
          <h3>📚 ${escapeHtml(g.title)} <span class="vocab-group-count">(${g.items.length})</span></h3>
          <div style="overflow-x:auto;">
            <table class="vocab-table">
              <thead><tr><th>日本語</th><th>Reading</th><th>Arti</th><th>Kategori</th><th>Catatan</th></tr></thead>
              <tbody>${g.items.map(vocabRowHtml).join('')}</tbody>
            </table>
          </div>
        </div>`).join('')}
    </div>`;

  main.innerHTML = `
    <p class="lesson-breadcrumb">${escapeHtml(courseName)} · KOSAKATA</p>
    <h1 class="lesson-title">📒 Kosakata <span class="vocab-level-chip">${escapeHtml(levelChip)}</span></h1>
    <p class="lesson-subtitle">${subtitleParts.join(' · ')}. ${syncNote}</p>
    <div class="module-filter" style="margin:14px 0 18px;">
      <svg class="mf-ico" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="search" id="vocab-list-filter" placeholder="Cari kosakata..." oninput="window.filterVocabList(this.value)" autocomplete="off" />
    </div>
    ${bodyHtml}
  `;
  window.scrollTo({ top: 0, behavior: 'smooth' });
};

window.filterVocabList = (q) => {
  const query = String(q ?? '').trim().toLowerCase();
  const sectionsMode = !!document.querySelector('#main-content .vocab-section');
  document.querySelectorAll('#main-content .vocab-list-group').forEach((group) => {
    let visible = 0;
    group.querySelectorAll('tbody tr').forEach((tr) => {
      const show = !query || (tr.getAttribute('data-vocab') || '').includes(query);
      tr.style.display = show ? '' : 'none';
      if (show) visible++;
    });
    group.style.display = visible === 0 ? 'none' : '';
    if (sectionsMode) {
      // While searching: auto-open Bab that have matches. When cleared:
      // collapse all so the user sees the section-level overview again.
      const babBtn = group.querySelector('.vocab-bab-toggle');
      if (query && visible > 0) {
        group.classList.add('open');
        if (babBtn) babBtn.setAttribute('aria-expanded', 'true');
      } else if (!query) {
        group.classList.remove('open');
        if (babBtn) babBtn.setAttribute('aria-expanded', 'false');
      }
    }
  });
  if (sectionsMode) {
    document.querySelectorAll('#main-content .vocab-section').forEach((sec, i) => {
      const hasMatch = Array.from(sec.querySelectorAll('.vocab-list-group')).some((g) => g.style.display !== 'none');
      sec.style.display = hasMatch ? '' : 'none';
      const secBtn = sec.querySelector('.vocab-section-toggle');
      if (query) {
        if (hasMatch) {
          sec.classList.add('open');
          if (secBtn) secBtn.setAttribute('aria-expanded', 'true');
        }
      } else {
        // Search cleared: only the first section stays open (default).
        if (i === 0) {
          sec.classList.add('open');
          if (secBtn) secBtn.setAttribute('aria-expanded', 'true');
        } else {
          sec.classList.remove('open');
          if (secBtn) secBtn.setAttribute('aria-expanded', 'false');
        }
      }
    });
  }
};

// Section / Bab accordion — only one section open at a time; within the active
// section, only one Bab open at a time. Toggling the currently-open one
// collapses it (so the user can collapse everything if they want).
window.toggleVocabSection = (key) => {
  const sec = document.querySelector(`#main-content .vocab-section[data-section="${key}"]`);
  if (!sec) return;
  const wasOpen = sec.classList.contains('open');
  document.querySelectorAll('#main-content .vocab-section').forEach((s) => {
    s.classList.remove('open');
    const btn = s.querySelector('.vocab-section-toggle');
    if (btn) btn.setAttribute('aria-expanded', 'false');
    s.querySelectorAll('.vocab-bab.open').forEach((b) => {
      b.classList.remove('open');
      const bbtn = b.querySelector('.vocab-bab-toggle');
      if (bbtn) bbtn.setAttribute('aria-expanded', 'false');
    });
  });
  if (!wasOpen) {
    sec.classList.add('open');
    const btn = sec.querySelector('.vocab-section-toggle');
    if (btn) btn.setAttribute('aria-expanded', 'true');
  }
};

window.toggleVocabBab = (key) => {
  const bab = document.querySelector(`#main-content .vocab-bab[data-bab="${key}"]`);
  if (!bab) return;
  const wasOpen = bab.classList.contains('open');
  const sec = bab.closest('.vocab-section');
  if (sec) {
    sec.querySelectorAll('.vocab-bab.open').forEach((b) => {
      if (b !== bab) {
        b.classList.remove('open');
        const btn = b.querySelector('.vocab-bab-toggle');
        if (btn) btn.setAttribute('aria-expanded', 'false');
      }
    });
  }
  bab.classList.toggle('open', !wasOpen);
  const btn = bab.querySelector('.vocab-bab-toggle');
  if (btn) btn.setAttribute('aria-expanded', wasOpen ? 'false' : 'true');
};

// ── Daftar Kanji (mirror Daftar Kosakata + detail modal dengan stroke
// animation dari KanjiVG). Source: GET /api/kanji?slug=<n5..n1>.
// Cache kanji per slug di memory supaya navigasi balik ke list cepat.
const _kanjiListCache = new Map(); // slug -> { fetchedAt, data }
const _kanjiByIdCache = new Map(); // id -> full kanji row (untuk detail)

window.openKanjiList = async () => {
  closeSidebar();
  const slug = currentState.course;
  const course = COURSE_CONTENT[slug];
  const main = document.getElementById('main-content');
  if (!main) return;

  let data = null;
  const cached = _kanjiListCache.get(slug);
  if (cached && (Date.now() - cached.fetchedAt) < 5 * 60 * 1000) {
    data = cached.data;
  } else {
    try {
      const res = await fetch(`/api/kanji?slug=${encodeURIComponent(slug)}`);
      if (res.ok) {
        data = await res.json();
        _kanjiListCache.set(slug, { fetchedAt: Date.now(), data });
      }
    } catch { /* fall through to empty state */ }
  }

  const courseName = course?.name || slug.toUpperCase();
  const levelChip = slug.toUpperCase();

  // Normalize shape: API returns { sections } atau { bab }, keduanya berisi
  // `kanji` per Bab. Index semua row ke _kanjiByIdCache untuk detail.
  const indexBab = (bab) => {
    for (const b of bab || []) {
      for (const k of b.kanji || []) {
        if (k.id) _kanjiByIdCache.set(k.id, k);
      }
    }
  };
  const sections = data?.sections;
  if (sections) for (const s of sections) indexBab(s.bab);
  else if (data?.bab) indexBab(data.bab);

  const totalKanji = data?.totalKanji ?? 0;

  if (!data || totalKanji === 0) {
    main.innerHTML = `
      <p class="lesson-breadcrumb">${escapeHtml(courseName)} · KANJI</p>
      <h1 class="lesson-title">📝 Daftar Kanji <span class="vocab-level-chip">${escapeHtml(levelChip)}</span></h1>
      <p class="lesson-subtitle" style="margin-top:12px;">
        Daftar kanji belum di-isi admin untuk kelas ini.
      </p>`;
    window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }

  const tileHtml = (k) => `
    <button type="button" class="kanji-tile" onclick="openKanjiDetail('${escapeHtml(k.id)}')"
            data-kanji="${escapeHtml(`${k.character} ${k.on_reading || ''} ${k.kun_reading || ''} ${k.meaning_id || ''}`.toLowerCase())}">
      <span class="kanji-tile-level">${escapeHtml(k.jlpt_level || '')}</span>
      <span class="kanji-tile-char">${escapeHtml(k.character)}</span>
      <span class="kanji-tile-meaning">${escapeHtml(k.meaning_id || '')}</span>
    </button>`;

  const renderBab = (b, key) => `
    <div class="vocab-bab vocab-list-group" data-bab="${escapeHtml(key)}">
      <button class="vocab-bab-toggle" type="button" aria-expanded="false" onclick="window.toggleVocabBab('${key}')">
        ${b.kode ? `<span class="vb-kode">${escapeHtml(b.kode)}</span>` : ''}
        <span class="vb-name">${escapeHtml(b.name || '(tanpa judul)')}</span>
        <span class="vb-count">${(b.kanji || []).length} kanji</span>
        <svg class="vb-caret" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><polyline points="9 6 15 12 9 18"/></svg>
      </button>
      <div class="vocab-bab-body">
        <div class="kanji-grid">${(b.kanji || []).map(tileHtml).join('')}</div>
      </div>
    </div>`;

  let bodyHtml = '';
  if (sections) {
    bodyHtml = `<div class="vocab-sections">
      ${sections.map((s, si) => {
        const key = 'sec-k-' + si;
        const openSec = si === 0;
        const totalSec = s.bab.reduce((n, b) => n + (b.kanji?.length || 0), 0);
        return `
          <div class="vocab-section ${openSec ? 'open' : ''}" data-section="${key}">
            <button class="vocab-section-toggle" type="button" aria-expanded="${openSec ? 'true' : 'false'}" onclick="window.toggleVocabSection('${key}')">
              <span class="vs-name">${escapeHtml(s.name || '(tanpa nama)')}</span>
              <span class="vs-count">${s.bab.length} Bab · ${totalSec} kanji</span>
              <svg class="vs-caret" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
            <div class="vocab-section-body">
              ${s.bab.map((b, bi) => renderBab(b, `bab-k-${si}-${bi}`)).join('')}
            </div>
          </div>`;
      }).join('')}
    </div>`;
  } else {
    bodyHtml = `<div class="lesson-extras">
      ${(data.bab || []).map((b, bi) => `

window.filterKanjiList = (q) => {
  const query = String(q ?? '').trim().toLowerCase();
  const sectionsMode = !!document.querySelector('#main-content .vocab-section');
  document.querySelectorAll('#main-content .vocab-list-group').forEach((group) => {
    let visible = 0;
    group.querySelectorAll('.kanji-tile').forEach((tile) => {
      const show = !query || (tile.getAttribute('data-kanji') || '').includes(query);
      tile.style.display = show ? '' : 'none';
      if (show) visible++;
    });
    group.style.display = visible === 0 ? 'none' : '';
    if (sectionsMode) {
      const babBtn = group.querySelector('.vocab-bab-toggle');
      if (query && visible > 0) {
        group.classList.add('open');
        if (babBtn) babBtn.setAttribute('aria-expanded', 'true');
      } else if (!query) {
        group.classList.remove('open');
        if (babBtn) babBtn.setAttribute('aria-expanded', 'false');
      }
    }
  });
  if (sectionsMode) {
    document.querySelectorAll('#main-content .vocab-section').forEach((sec, i) => {
      const hasMatch = Array.from(sec.querySelectorAll('.vocab-list-group')).some((g) => g.style.display !== 'none');
      sec.style.display = hasMatch ? '' : 'none';
      const secBtn = sec.querySelector('.vocab-section-toggle');
      if (query && hasMatch) {
        sec.classList.add('open');
        if (secBtn) secBtn.setAttribute('aria-expanded', 'true');
      } else if (!query) {
        if (i === 0) {
          sec.classList.add('open');
          if (secBtn) secBtn.setAttribute('aria-expanded', 'true');
        } else {
          sec.classList.remove('open');
          if (secBtn) secBtn.setAttribute('aria-expanded', 'false');
        }
      }
    });
  }
};
