// QUIZ ENGINE
// ═══════════════════════════════════════════════
let quizState = null;

function getQuizKey(courseSlug, moduleId, lessonId) {
  return `${courseSlug}:${moduleId}:${lessonId}`;
}

function renderQuizLesson(container, courseSlug, moduleId, lessonId) {
  const key = getQuizKey(courseSlug, moduleId, lessonId);
  const questions = QUIZ_DATA[key];
  if (!questions || questions.length === 0) {
    container.innerHTML = `<div class="quiz-container"><p style="color:#485f84;">Kuis belum tersedia.</p></div>`;
    return;
  }
  quizState = { key, questions, idx: 0, correct: 0, answered: false, selected: -1, answers: [] };
  renderQuizQuestion(container);
}

function renderQuizQuestion(container) {
  const { questions, idx } = quizState;
  const total = questions.length;
  const q = questions[idx];
  const letters = ['A', 'B', 'C', 'D', 'E'];
  const pctProgress = Math.round(((idx) / total) * 100);

  container.innerHTML = `
    <div class="quiz-container">
      <div class="quiz-progress-wrap">
        <div class="quiz-progress-bar"><div class="quiz-progress-fill" style="width:${pctProgress}%"></div></div>
        <span class="quiz-progress-text">Soal ${idx + 1} / ${total}</span>
      </div>
      <h2 class="quiz-question">
        ${q.q}
        ${q.jp ? `<span class="jp">${q.jp} <button class="pronounce-btn" onclick="speakJapanese('${q.jp}', this)">🔊 Dengar</button></span>` : ''}
      </h2>
      <div class="quiz-options" id="quiz-options">
        ${q.options.map((opt, i) => `
          <button class="quiz-option" data-idx="${i}" onclick="window.pickQuizAnswer(${i})">
            <span class="quiz-option-letter">${letters[i]}</span>
            <span>${opt}</span>
          </button>
        `).join('')}
      </div>
      <div id="quiz-feedback"></div>
    </div>
  `;
}

window.pickQuizAnswer = async (i) => {
  if (quizState.answered) return;
  quizState.answered = true;
  quizState.selected = i;
  const q = quizState.questions[quizState.idx];

  // Disable options + show transient loading while the server tells us if
  // the pick was right. The lesson API never sent is_correct, so we can't
  // grade locally.
  document.querySelectorAll('.quiz-option').forEach((btn) => btn.classList.add('disabled'));
  const feedback = document.getElementById('quiz-feedback');
  feedback.innerHTML = `<div class="quiz-explanation">Memeriksa…</div>`;

  // Record the answer for the final /quiz-attempt round-up.
  if (q.questionId && q.optionIds?.[i]) {
    quizState.answers.push({ questionId: q.questionId, optionId: q.optionIds[i] });
  }

  let isCorrect = false;
  let correctOptionId = null;
  try {
    const [slug, mId, lId] = (quizState.key || '').split(':');
    const lessonApiId = findLesson(slug, mId, lId)?.apiId;
    if (lessonApiId && q.questionId && q.optionIds?.[i]) {
      const r = await fetch(
        `/api/lessons/${encodeURIComponent(lessonApiId)}/quiz/check`,
        {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ questionId: q.questionId, optionId: q.optionIds[i] }),
        }
      );
      if (r.ok) {
        const data = await r.json();
        isCorrect = !!data.isCorrect;
        correctOptionId = data.correctOptionId || null;
        if (data.explanation) q.explain = data.explanation;
      }
    }
  } catch (err) {
    console.warn('quiz/check failed:', err?.message || err);
  }

  q.correct = correctOptionId && q.optionIds ? q.optionIds.indexOf(correctOptionId) : -1;
  if (isCorrect) quizState.correct++;

  document.querySelectorAll('.quiz-option').forEach((btn, bi) => {
    if (bi === q.correct) btn.classList.add('correct');
    if (bi === i && !isCorrect) btn.classList.add('wrong');
  });

  const isLast = quizState.idx === quizState.questions.length - 1;
  feedback.innerHTML = `
    <div class="quiz-explanation">
      <strong>${isCorrect ? '✓ Benar!' : '✗ Belum tepat'}</strong> — ${q.explain}
    </div>
    <button class="quiz-next-btn" onclick="window.nextQuizQuestion()">
      ${isLast ? 'Lihat Hasil →' : 'Soal Berikutnya →'}
    </button>
  `;

  if (isCorrect) addXP(5, 'jawaban benar');
};

window.nextQuizQuestion = () => {
  if (quizState.idx < quizState.questions.length - 1) {
    quizState.idx++;
    quizState.answered = false;
    quizState.selected = -1;
    renderQuizQuestion(document.getElementById('main-content'));
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } else {
    finishQuiz();
  }
};

async function finishQuiz() {
  const { questions, correct, key, answers } = quizState;
  const clientTotal = questions.length;

  // Show a brief "Menyimpan..." state so the UI doesn't feel frozen while we
  // POST. Falls back to client-computed score if the server is unreachable —
  // user shouldn't be stuck with no result just because their internet
  // hiccuped.
  const main = document.getElementById('main-content');
  main.innerHTML = `
    <div class="quiz-container">
      <div class="quiz-results">
        <h2>Menyimpan hasil...</h2>
        <div class="score-circle">…</div>
      </div>
    </div>
  `;

  let score = correct;
  let total = clientTotal;
  try {
    const [slug, mId, lId] = key.split(':');
    const lesson = findLesson(slug, mId, lId);
    const lessonApiId = lesson?.apiId;
    if (lessonApiId && typeof window.ezApi === 'function') {
      const res = await window.ezApi(`/progress/lesson/${encodeURIComponent(lessonApiId)}/quiz-attempt`, {
        method: 'POST',
        body: JSON.stringify({ answers }),
      });
      if (res.ok) {
        const data = await res.json();
        if (typeof data.score === 'number' && typeof data.total === 'number' && data.total > 0) {
          score = data.score;
          total = data.total;
        }
      }
    }
  } catch (err) {
    // AUTH_EXPIRED or network error — keep client-side score so the user still sees a result.
    console.warn('quiz-attempt submission failed:', err?.message || err);
  }

  const pct = Math.round((score / total) * 100);
  const passed = pct >= 70;
  const bonusXP = passed ? 20 : 10;

  // save best score
  const scores = JSON.parse(localStorage.getItem('ez_quiz_scores') || '{}');
  scores[key] = Math.max(scores[key] || 0, pct);
  localStorage.setItem('ez_quiz_scores', JSON.stringify(scores));

  // mark lesson as done if passed
  if (passed) {
    const [slug, mId, lId] = key.split(':');
    const allProgress = getProgress();
    const cp = allProgress[slug] || {};
    cp[`${mId}:${lId}`] = true;
    allProgress[slug] = cp;
    setProgress(allProgress);
  }

  addXP(bonusXP, passed ? 'lulus kuis' : 'mencoba kuis');
  if (passed) fireConfetti();

  document.getElementById('main-content').innerHTML = `
    <div class="quiz-container">
      <div class="quiz-results">
        <div class="trophy">${passed ? '🏆' : '💪'}</div>
        <h2>${passed ? 'Lulus!' : 'Coba Lagi'}</h2>
        <p class="subtitle">${passed ? 'Pemahaman kamu sudah cukup bagus.' : 'Minimal 70% untuk lulus. Ayo ulang!'}</p>
        <div class="score-circle">${pct}%</div>
        <p style="color:#485f84;margin:0 0 12px;">Benar ${score} dari ${total} soal</p>
        <div class="quiz-results-btns">
          <button class="btn-secondary" onclick="window.retryQuiz()">Ulang Kuis</button>
          <button class="btn-primary" onclick="window.continueAfterQuiz()">${passed ? 'Lanjut →' : 'Kembali ke Materi'}</button>
        </div>
      </div>
    </div>
  `;
  renderSidebar();
}

window.retryQuiz = () => {
  const [slug, mId, lId] = quizState.key.split(':');
  renderQuizLesson(document.getElementById('main-content'), slug, mId, lId);
};

window.continueAfterQuiz = () => {
  const [slug, mId, lId] = quizState.key.split(':');
  const course = COURSE_CONTENT[slug];
  const allLessons = course.modules.flatMap(m => m.lessons.map(l => ({ m, l })));
  const idx = allLessons.findIndex(x => x.m.id === mId && x.l.id === lId);
  const next = allLessons[idx + 1];
  if (next) {
    currentState.moduleId = next.m.id;
    currentState.lessonId = next.l.id;
    renderSidebar();
    renderLesson();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } else {
    renderLesson();
  }
};

async function handleNewEnrollment() {
  const params = new URLSearchParams(window.location.search);
  const newCourse = params.get('new');
  if (!newCourse) return null;

  // Checkout page already POSTed /api/enrollments. Re-sync to pick up the new
  // row — localStorage is just a mirror. If the server says we're not enrolled
  // (e.g. payment failed), we bail without showing the success banner.
  const enrolled = await syncEnrollmentsFromServer();
  if (!enrolled.includes(newCourse)) {
    history.replaceState({}, '', 'welcome.html');
    return null;
  }

  // Resolve display name — prefer local content, fall back to CMS.
  let displayName = COURSE_CONTENT[newCourse]?.name;
  if (!displayName) {
    try {
      const courses = await fetchCmsCourses();
      const cms = courses.find(c => c.slug === newCourse);
      displayName = cms?.title || newCourse.toUpperCase();
    } catch { displayName = newCourse.toUpperCase(); }
  }

  const banner = document.getElementById('success-banner');
  const nameEl = document.getElementById('new-course-name');
  if (nameEl) nameEl.textContent = displayName;
  if (banner) {
    banner.classList.add('show');
    setTimeout(() => banner.classList.remove('show'), 6000);
  }

  history.replaceState({}, '', `welcome.html?course=${encodeURIComponent(newCourse)}`);
  return newCourse;
}

function logout() {
  if (typeof ezLogout === 'function') { ezLogout(); return; }
  localStorage.removeItem('ez_user');
  localStorage.removeItem('ez_courses');
  window.location.href = 'index.html';
}

function getTimeGreeting() {
  const h = new Date().getHours();
  if (h >= 5 && h < 11)  return { jp: 'おはようございます', id: 'Selamat pagi',  msg: 'Mari mulai hari dengan bahasa Jepang.',         kanji: '朝', period: 'PAGI'    };
  if (h >= 11 && h < 15) return { jp: 'こんにちは',        id: 'Selamat siang', msg: 'Istirahat sejenak — luangkan waktu belajar.',    kanji: '昼', period: 'SIANG'   };
  if (h >= 15 && h < 18) return { jp: 'こんにちは',        id: 'Selamat sore',  msg: 'Sore yang baik untuk review pelajaran.',         kanji: '夕', period: 'SORE'    };
  if (h >= 18 && h < 22) return { jp: 'こんばんは',        id: 'Selamat malam', msg: 'Akhiri hari dengan progress baru.',              kanji: '夜', period: 'MALAM'   };
  return                        { jp: 'お疲れ様です',      id: 'Sudah larut',    msg: 'Jaga kesehatan ya — belajar sebentar saja.',     kanji: '深', period: 'DINI HARI' };
}

function getUserName() {
  if (!session || !session.email) return 'teman';
  const local = session.email.split('@')[0];
  const clean = local.replace(/[._-]+/g, ' ').trim();
  return clean.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
}

function greetingBannerHtml() {
  const g = getTimeGreeting();
  const name = getUserName();
  const now = new Date();
  const hh = String(now.getHours()).padStart(2, '0');
  const mm = String(now.getMinutes()).padStart(2, '0');

  // Resume CTA — only on the in-course dashboard, when we know the user's
  // current lesson. Shortens the path from "open dashboard" to "actually study".
  let resume = '';
  const course = currentState.course && COURSE_CONTENT[currentState.course];
  if (course && currentState.moduleId && currentState.lessonId) {
    const mod = course.modules.find(m => m.id === currentState.moduleId);
    const lesson = mod && mod.lessons.find(l => l.id === currentState.lessonId);
    if (lesson) {
      const progress = getProgress()[currentState.course] || {};
      const isDone = !!progress[`${mod.id}:${lesson.id}`];
      const label = isDone ? 'Buka kembali' : 'Lanjut belajar';
      resume = `<button class="greeting-resume" type="button"
        onclick="selectLesson('${mod.id}','${lesson.id}')"
        aria-label="${label}: ${escapeHtml(lesson.title)}">
        <span class="gr-label">${label}</span>
        <span class="gr-title">${escapeHtml(lesson.title)}</span>
        <span aria-hidden="true">→</span>
      </button>`;
    }
  }

  return `
    <div class="greeting-banner">
      <div>
        <h1 class="greeting-jp">${g.jp}、<span class="name">${name}</span><span class="san">さん</span></h1>
        <p class="greeting-id">${g.id} — ${g.msg}</p>
        ${resume}
      </div>
      <div class="greeting-time">
        <div class="gt-kanji">${g.kanji}</div>
        <div class="gt-label">${g.period}</div>
        <div class="gt-clock">${hh}<span class="gt-colon">:</span>${mm}</div>
      </div>
    </div>
  `;
}

function refreshGreetingBanner() {
  const existing = document.querySelector('.greeting-banner');
  if (existing) existing.outerHTML = greetingBannerHtml();
}

let _cmsCourses = null;
async function fetchCmsCourses() {
  if (_cmsCourses) return _cmsCourses;
  try {
    const res = await fetch('/api/courses');
    if (!res.ok) return (_cmsCourses = []);
    const data = await res.json();
    return (_cmsCourses = Array.isArray(data.courses) ? data.courses : []);
  } catch { return (_cmsCourses = []); }
}

function renderPaywallCard(c) {
  const slug = c.slug;
  const title = c.title || (typeof slug === 'string' ? slug.toUpperCase() : 'Kelas');
  const priceLabel = c.price_label
    || (c.price_idr ? 'Rp ' + Number(c.price_idr).toLocaleString('id-ID') : '');
  const available = c.is_available !== false;
  const href = `courses/detail.html?slug=${encodeURIComponent(slug)}`;
  if (!available) {
    return `
      <div class="mini-plan disabled" aria-disabled="true" title="Segera hadir">
        <div class="level">${(slug || '').toUpperCase()}</div>
        <div class="plan-name">${title}</div>
        <div class="plan-price">${priceLabel}</div>
        <div class="plan-status">Segera hadir</div>
      </div>
    `;
  }
  return `
    <a href="${href}" class="mini-plan">
      <div class="level">${(slug || '').toUpperCase()}</div>
      <div class="plan-name">${title}</div>
      <div class="plan-price">${priceLabel}</div>
    </a>
  `;
}

function renderPaywall() {
  // Init already awaited fetchCmsCourses, so _cmsCourses is populated here
  // in the common path. If for some reason it's not (network hiccup), we
  // still render the shell and let the fallback fetch fill in below.
  const cmsList = Array.isArray(_cmsCourses) ? _cmsCourses : [];
  const plansHtml = cmsList.map(renderPaywallCard).join('');
  const loggedInEmail = (session && session.email) || '';

  document.getElementById('app-root').innerHTML = `
    <main class="paywall">
      <div class="paywall-inner">
        <div class="paywall-lock">🔒</div>
        <h1>Kamu belum memiliki akses kelas</h1>
        <p>Untuk mulai belajar, pilih kelas dan selesaikan pembayaran terlebih dahulu. Sekali bayar, akses konten 1 tahun penuh.</p>
        ${loggedInEmail ? `<p style="font-size:13px;color:#8a7d66;margin-top:-10px;margin-bottom:20px;">Login sebagai <strong>${loggedInEmail}</strong> · <a href="#" onclick="event.preventDefault(); window.ezLogout();" style="color:var(--brand-red);">Ganti akun</a></p>` : ''}
        <a href="index.html#pricing" class="paywall-cta">Pilih Kelas Sekarang →</a>

        <div class="paywall-plans" id="paywall-plans">
          ${plansHtml}

      if (!target) return;

function renderLearning(courseSlug) {
  const course = COURSE_CONTENT[courseSlug];
  // Stub when the course doesn't hydrate (API down, unpublished, not yet
  // populated) or has no modules yet (admin created shell, hasn't added
  // content). User is enrolled in both cases — don't bounce them to paywall.
  if (!course || course.modules.length === 0) return renderCmsOnlyCourseStub(courseSlug);

  if (!currentState.moduleId) {
    const progress = getProgress()[courseSlug] || {};
    let found = false;
    for (const m of course.modules) {
      for (const l of m.lessons) {
        const key = `${m.id}:${l.id}`;
        if (!progress[key]) {
          currentState.moduleId = m.id;
          currentState.lessonId = l.id;
          found = true;
          break;
        }
      }
      if (found) break;
    }
    if (!found) {
      currentState.moduleId = course.modules[0].id;
      currentState.lessonId = course.modules[0].lessons[0].id;
    }
  }
  currentState.course = courseSlug;

  document.getElementById('app-root').innerHTML = `
    ${greetingBannerHtml()}
    <div class="learning-layout">
      <aside class="sidebar" id="sidebar"></aside>
      <main class="main-content" id="main-content"></main>

    </button>
  `;

  renderSidebar();
  renderLesson();
  renderRightPanel();
  document.getElementById('sidebar-toggle')?.classList.add('visible');
  if (isDesktop()) {
    applySidebarCollapse(localStorage.getItem(SIDEBAR_KEY) === '1');
  }
}

// Pro Tips — shown in right panel, cycleable via click.
// Hoisted to module scope so cycleTip() below can read length without magic numbers.
const PRO_TIPS = [
  { t: 'Belajar Efektif', d: 'Review materi kemarin selama 5 menit sebelum mulai bab baru — memori jangka panjang terbentuk dari pengulangan, bukan maraton.' },
  { t: 'Shadowing', d: 'Ulangi audio bahasa Jepang sambil meniru ritme & intonasinya. Teknik ini dipakai penerjemah profesional.' },
  { t: 'Kanji Trick', d: 'Pelajari radikal (bagian kanji) dulu — satu radikal bisa jadi kunci untuk puluhan kanji lain.' },
  { t: 'Konsistensi', d: '15 menit setiap hari > 2 jam seminggu sekali. Otak butuh tidur untuk mengunci memori baru.' },
  { t: 'Memo Vocab', d: 'Kelompokkan kosakata per tema (dapur, kantor, transport) — otak jauh lebih mudah mengingat kalau ada konteks.' },
  { t: 'Pitch Accent', d: 'Dengarkan pengucapan native 3x sebelum mengulang. Pitch bahasa Jepang beda karakter dengan stress di English.' },

  { t: 'Immersion Ringan', d: 'Ganti playlist background jadi Jepang (city-pop, anime OST). Telinga lama-lama adaptasi ritme bahasa.' },
];
// User-controlled tip index. Null = auto (derived from lesson idx).
let currentTipIndex = null;
// Track last lesson shown — lesson changes reset auto-tip rotation.
let _tipLessonSignature = null;

window.cycleTip = () => {
  const active = currentTipIndex ?? 0;
  currentTipIndex = (active + 1) % PRO_TIPS.length;
  renderRightPanel();
};

function renderRightPanel() {
  const panel = document.getElementById('right-panel');
  if (!panel) return;
  const course = COURSE_CONTENT[currentState.course];
  const module = course.modules.find(m => m.id === currentState.moduleId);
  const lesson = module?.lessons.find(l => l.id === currentState.lessonId);
  if (!module || !lesson) { panel.innerHTML = ''; return; }

  const allLessons = course.modules.flatMap(m => m.lessons.map(l => ({ m, l })));
  const idx = allLessons.findIndex(x => x.m.id === module.id && x.l.id === lesson.id);
  const next = allLessons[idx + 1];
  const progress = getProgress()[currentState.course] || {};
  const totalLessons = allLessons.length;
  const doneLessons = Object.values(progress).filter(v => v).length;
  const pct = Math.round((doneLessons / totalLessons) * 100);
  const TYPE_LABEL = { video: 'Video', quiz: 'Kuis', text: 'Bacaan', deck: 'Kosakata' };

  // Tip selection: if user hasn't clicked yet for this lesson, default
  // to lesson-indexed tip (varies naturally as they navigate). If they
  // clicked cycleTip(), respect their choice until lesson changes.
  const sig = `${module.id}:${lesson.id}`;
  if (sig !== _tipLessonSignature) {
    currentTipIndex = null;
    _tipLessonSignature = sig;
  }
  const tipIdx = currentTipIndex ?? (idx % PRO_TIPS.length);
  const tip = PRO_TIPS[tipIdx];
  const dotsHtml = PRO_TIPS.map((_, i) =>
    `<span class="rp-tip-dot ${i === tipIdx ? 'active' : ''}"></span>`
  ).join('');

  const nextBlock = next ? `
    <div class="rp-card rp-next">
      <div class="rp-eyebrow">Selanjutnya</div>
      <div class="rp-next-title">${next.l.title}</div>
      <div class="rp-next-meta">
        <span class="lesson-type-badge badge-${(next.l.type||'text')}">${TYPE_LABEL[next.l.type] || 'Materi'}</span>
        <span class="rp-dot">·</span>
        <span>${next.l.duration || ''}</span>
      </div>
      <button class="rp-next-btn" onclick="selectLesson('${next.m.id}','${next.l.id}')">Buka →</button>
    </div>
  ` : `
    <div class="rp-card rp-next rp-done">
      <div class="rp-eyebrow">Selesai</div>
      <div class="rp-next-title">🎌 Ini bab terakhir</div>
      <div class="rp-next-meta"><span>Buka Daftar Kosakata untuk mengulang</span></div>
    </div>
  `;

  panel.innerHTML = `
    ${nextBlock}
    <div class="rp-card rp-tip" onclick="cycleTip()" role="button" tabindex="0"
         aria-label="Klik untuk tip berikutnya"
         onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();cycleTip()}">
      <div class="rp-tip-head">
        <div class="rp-eyebrow">💡 Pro Tip</div>
        <span class="rp-tip-hint" aria-hidden="true">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
          </svg>
          Klik
        </span>
      </div>
      <div class="rp-tip-body" data-tip-idx="${tipIdx}">
        <div class="rp-tip-title">${tip.t}</div>
        <p class="rp-tip-desc">${tip.d}</p>
      </div>
      <div class="rp-tip-dots" aria-hidden="true">${dotsHtml}</div>
    </div>
  `;
}

function renderSidebar() {
  const course = COURSE_CONTENT[currentState.course];
  const progress = getProgress()[currentState.course] || {};

  // Reset expanded state on course change so stale IDs from a previous
  // course don't leak. Default = everything collapsed; user opens what they
  // want. `selectLesson` still pops open the relevant section + module when
  // the user actively navigates via the resume CTA or right-panel "Buka →".
  if (_lastSeededCourse !== currentState.course) {
    _lastSeededCourse = currentState.course;
    _expandedSections.clear();
    _expandedModules.clear();
  }

  const totalLessons = course.modules.reduce((s, m) => s + m.lessons.length, 0);
  const doneLessons = Object.values(progress).filter(v => v).length;
  const pct = Math.round((doneLessons / totalLessons) * 100);

  const TYPE_LABEL = { video: 'Video', quiz: 'Kuis', text: 'Bacaan', deck: 'Kosakata' };
  // SVG icons compact-style ala Udemy (play / question / book / cards).
  const TYPE_ICON = {
    video: '<svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>',
    quiz: '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
    text: '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>',
    deck: '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M3 9h18M9 21V9"/></svg>',
  };
  const CHECK_SVG = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>';

  // Group modules by section_name in their order of appearance. Modules with
  // no section fall into "Lainnya" — only added if it actually has content.
  const sectionBuckets = [];
  const sectionByName = new Map();
  for (const m of course.modules) {
    const secName = (m.sectionName && m.sectionName.trim()) || 'Lainnya';
    let bucket = sectionByName.get(secName);
    if (!bucket) {
      bucket = { name: secName, modules: [] };
      sectionByName.set(secName, bucket);
      sectionBuckets.push(bucket);
    }
    bucket.modules.push(m);
  }

  // Global Udemy-style lesson number across all modules in the course.
  const lessonNumber = new Map();
  {
    let n = 0;
    for (const m of course.modules) {
      for (const l of m.lessons) {
        n += 1;
        lessonNumber.set(`${m.id}:${l.id}`, n);
      }
    }
  }

  const renderModuleHtml = (m) => {
    const moduleDur = m.lessons.reduce((n, l) => n + (l.durationMinutes || 0), 0);
    const moduleDone = m.lessons.filter((l) => progress[`${m.id}:${l.id}`]).length;
    const moduleTotal = m.lessons.length;

    const lessonsHtml = m.lessons.map(l => {
      const key = `${m.id}:${l.id}`;
      const isDone = !!progress[key];
      const isCurrent = m.id === currentState.moduleId && l.id === currentState.lessonId;
      const typeKey = (l.type || 'text').toLowerCase();
      const typeLabel = TYPE_LABEL[typeKey] || typeKey.toUpperCase();
      const typeIcon = TYPE_ICON[typeKey] || TYPE_ICON.text;
      const num = lessonNumber.get(key);
      const durTxt = formatDurationCompact(l.durationMinutes);
      const aria = `${l.title}, ${typeLabel}${durTxt ? ', ' + durTxt : ''}${isDone ? ', selesai' : ''}${isCurrent ? ', sedang dibuka' : ''}`;
      return `
        <li class="lesson-item ${isCurrent ? 'current' : ''} ${isDone ? 'done' : ''}"
            role="button" tabindex="0" aria-label="${escapeHtml(aria)}" aria-current="${isCurrent ? 'page' : 'false'}"
            onclick="selectLesson('${m.id}', '${l.id}')"
            onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();selectLesson('${m.id}','${l.id}')}">
          <span class="lesson-check" aria-hidden="true">${isDone ? CHECK_SVG : ''}</span>
          <div class="lesson-info">
            <div class="lesson-title-text">${num}. ${escapeHtml(l.title)}</div>
            <div class="lesson-meta-row">
              <span class="lesson-type-ico" aria-hidden="true">${typeIcon}</span>
              <span class="lesson-duration">${escapeHtml(durTxt || typeLabel)}</span>
            </div>
          </div>
        </li>
      `;
    }).join('');

    const isOpen = _expandedModules.has(m.id);
    const metaParts = [`${moduleDone} / ${moduleTotal}`];
    if (moduleDur) metaParts.push(formatDurationCompact(moduleDur));
    return `
      <div class="module ${isOpen ? 'open' : ''}" data-module="${m.id}">
        <button class="module-header" type="button" aria-expanded="${isOpen ? 'true' : 'false'}" onclick="toggleModule('${m.id}')">
          <div class="m-info">
            <span class="m-name">${escapeHtml(m.title)}</span>
            <span class="m-meta">${escapeHtml(metaParts.join(' | '))}</span>
          </div>
          <svg class="m-caret" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div class="lessons"><ul class="lessons-inner">${lessonsHtml}</ul></div>
      </div>
    `;
  };

  // Untagged courses still get the section wrapper for visual consistency
  // (Udemy always wraps in section blocks). All untagged modules end up in
  // "Lainnya".
  const modulesHtml = sectionBuckets.map((b) => {
    const sectionDone = b.modules.reduce((n, m) =>
      n + m.lessons.filter((l) => progress[`${m.id}:${l.id}`]).length, 0);
    const sectionTotal = b.modules.reduce((n, m) => n + m.lessons.length, 0);
    const sectionDurMin = b.modules.reduce((n, m) =>
      n + m.lessons.reduce((mm, l) => mm + (l.durationMinutes || 0), 0), 0);
    const isSecOpen = _expandedSections.has(b.name);
    const safeName = b.name.replace(/'/g, "\\'");
    const metaParts = [`${sectionDone} / ${sectionTotal}`];
    if (sectionDurMin) metaParts.push(formatDurationCompact(sectionDurMin));
    return `
      <div class="sidebar-section ${isSecOpen ? 'open' : ''}" data-section="${escapeHtml(b.name)}">
        <button class="sidebar-section-header" type="button"
                aria-expanded="${isSecOpen ? 'true' : 'false'}"
                onclick="toggleSidebarSection('${escapeHtml(safeName)}')">
          <div class="ss-info">
            <span class="ss-name">${escapeHtml(b.name)}</span>
            <span class="ss-meta">${escapeHtml(metaParts.join(' | '))}</span>
          </div>
          <svg class="ss-caret" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div class="sidebar-section-body">
          ${b.modules.map(renderModuleHtml).join('')}
        </div>
      </div>
    `;
  }).join('');

  const enrolled = getEnrolledCourses();
  // Merge enrolled (hydrated) courses with CMS-listed courses so non-enrolled
  // courses still appear in the picker with an "Upgrade" CTA. Source of truth
  // for the unified list: CMS — enrolled courses are always a subset.
  const cmsList = Array.isArray(_cmsCourses) ? _cmsCourses : [];
  const pickerEntries = [];

// Daftar Kosakata — per-level vocab reference, read from the `/api/notion-vocab`
// cache (admin manually refreshes via the admin button; reads never trigger a
// Notion fetch). Falls back to the DB-aggregated view (vocab grouped by deck
// lesson) when the cache is empty, and to the bundled flashcard set as a last
// resort. When the response carries `sections`, render a 2-level accordion
// (section → Bab → kosakata) with mutex behaviour at both levels.
window.openVocabList = async () => {
  closeSidebar();
  const slug = currentState.course;
  const course = COURSE_CONTENT[slug];
  const main = document.getElementById('main-content');
  if (!main) return;

  // 1) Try the Notion-backed cache. Response can be either:
  //    { sections: [{ name, bab: [{ kode, name, vocab: [...] }] }] }
  //    { bab: [...] }                                                ← flat
  let sectionsView = null;
  let renderable = [];
  let sourceLabel = '';
  let lastSyncedAt = null;
  try {
    const res = await fetch(`/api/notion-vocab?slug=${encodeURIComponent(slug)}`);
    if (res.ok) {
      const data = await res.json();
      lastSyncedAt = data.fetchedAt || null;
      const mapVocab = (vocab) => (vocab || []).map((v, i) => ({
        id: v.id || ('notion-' + i),
        japanese: v.japanese || '',
        reading: v.reading || '',
        indonesian: v.indonesian || '',
        category: v.category || '',
        note: v.note || '',
        sort: i,
      }));
      if (Array.isArray(data.sections) && data.sections.length > 0) {
        sectionsView = data.sections.map((s, si) => ({
          key: 'sec-' + si,
          name: s.name || '(tanpa nama)',
          bab: (s.bab || []).map((b, bi) => ({
            key: 'bab-' + si + '-' + bi,
            kode: b.kode || '',
            name: b.name || '(tanpa judul)',
            items: mapVocab(b.vocab),
          })),
        })).filter((s) => s.bab.length > 0);
        if (sectionsView.length === 0) sectionsView = null;
        else sourceLabel = 'Notion';
      } else if (Array.isArray(data.bab) && data.bab.length > 0) {
        renderable = data.bab.map((b) => ({
          key: 'notion:' + b.id,
          title: [b.kode, b.name].filter(Boolean).join(' — ') || b.name || '(tanpa judul)',
          items: mapVocab(b.vocab),
        })).filter((g) => g.items.length > 0);
        if (renderable.length > 0) sourceLabel = 'Notion';
      }
    }
  } catch { /* network/parse — fall through to DB fallback */ }

  // 2) Fallback: vocab grouped by deck-lesson from CMS DB.
  if (!sectionsView && renderable.length === 0 && course && Array.isArray(course.modules)) {
    const vocabToBab = new Map();
    const babOrder = [];
    const seenBab = new Set();
    for (const m of course.modules) {
      for (const l of (m.lessons || [])) {
        if (l.type !== 'deck') continue;
        const babKey = `${m.id}:${l.id}`;
        if (!seenBab.has(babKey)) { seenBab.add(babKey); babOrder.push({ babKey, babTitle: l.title }); }
        for (const d of (l.deck || [])) {
          if (d.id) vocabToBab.set(d.id, { babKey, babTitle: l.title });
        }
      }
    }
    const seenVocab = new Set();
    const allVocab = [];
    for (const m of course.modules) {
      for (const v of (m.vocabulary || [])) {
        if (!v || !v.id || seenVocab.has(v.id)) continue;
        seenVocab.add(v.id);
        allVocab.push({
          id: v.id,
          japanese: v.japanese || '', reading: v.reading || '',
          indonesian: v.indonesian || '', category: v.category || '',
          note: v.note || '', sort: v.sort_order ?? 0,
        });
      }
    }
    const groupByKey = new Map();
    const groups = [];
    for (const { babKey, babTitle } of babOrder) {
      const g = { key: babKey, title: babTitle, items: [] };
      groupByKey.set(babKey, g);
      groups.push(g);
    }
    const orphan = { key: '__orphan', title: 'Belum dipasang ke Bab', items: [] };
    for (const v of allVocab) {
      const bab = vocabToBab.get(v.id);
      if (bab && groupByKey.has(bab.babKey)) groupByKey.get(bab.babKey).items.push(v);
      else orphan.items.push(v);
    }
    for (const g of groups) g.items.sort((a, b) => (a.sort - b.sort) || a.japanese.localeCompare(b.japanese));
    orphan.items.sort((a, b) => (a.sort - b.sort) || a.japanese.localeCompare(b.japanese));
    if (orphan.items.length) groups.push(orphan);
    renderable = groups.filter((g) => g.items.length > 0);
    if (renderable.length > 0) sourceLabel = 'cache lokal';
  }

  // Flashcard fallback when CMS has zero vocab at all
  if (!sectionsView && renderable.length === 0) {
    if (!FLASHCARD_DATA || Object.keys(FLASHCARD_DATA).length === 0) {
      try { await loadFlashcardData(); } catch {}
    }
    const fc = (FLASHCARD_DATA && FLASHCARD_DATA[slug]) || [];
    const byCat = {};
    for (const c of fc) (byCat[c.category || 'Umum'] ||= []).push(c);
    for (const [cat, arr] of Object.entries(byCat)) {
      renderable.push({
        key: 'fc:' + cat,
        title: cat,
        items: arr.map((c, i) => ({
          id: 'fc-' + cat + '-' + i,
          japanese: c.front || '', reading: c.reading || '',
          indonesian: c.back || '', category: '', note: '', sort: i,
        })),
      });
    }
  }

  const total = sectionsView
    ? sectionsView.reduce((s, sec) => s + sec.bab.reduce((bs, b) => bs + b.items.length, 0), 0)
    : renderable.reduce((s, g) => s + g.items.length, 0);
  const courseName = course?.name || slug.toUpperCase();
  const levelChip = slug.toUpperCase();
  if (total === 0) {
    main.innerHTML = `
      <p class="lesson-breadcrumb">${escapeHtml(courseName)} · KOSAKATA</p>
      <h1 class="lesson-title">📒 Kosakata <span class="vocab-level-chip">${escapeHtml(levelChip)}</span></h1>
      <p class="lesson-subtitle" style="margin-top:12px;">Belum ada kosakata untuk kelas ini.</p>
    `;
    window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }

  const babCount = sectionsView
    ? sectionsView.reduce((n, s) => n + s.bab.length, 0)
    : renderable.filter((g) => !g.key.startsWith('fc:') && g.key !== '__orphan').length;
  const subtitleParts = [`${total} kata`];
  if (babCount > 0) subtitleParts.push(`${babCount} Bab`);
  if (sectionsView) subtitleParts.push(`${sectionsView.length} Bagian`);
  let syncNote = '';
  if (sourceLabel === 'Notion' && lastSyncedAt) {
    const ts = new Date(lastSyncedAt);
    const hh = String(ts.getHours()).padStart(2, '0');
    const mm = String(ts.getMinutes()).padStart(2, '0');
    syncNote = `<span class="vocab-source-note" title="Disinkron oleh admin dari Notion">⟳ ${hh}:${mm} · Notion</span>`;
  }

  const vocabRowHtml = (v) => `
    <tr data-vocab="${escapeHtml(`${v.japanese} ${v.reading} ${v.indonesian} ${v.category}`.toLowerCase())}">
      <td class="jp-cell">${escapeHtml(v.japanese)}</td>
      <td class="reading-cell">${escapeHtml(v.reading)}</td>
      <td>${escapeHtml(v.indonesian)}</td>
      <td>${v.category ? `<span class="vocab-cat">${escapeHtml(v.category)}</span>` : ''}</td>
      <td class="vocab-note">${escapeHtml(v.note)}</td>
    </tr>`;

  const bodyHtml = sectionsView ? `
    <div class="vocab-sections">
      ${sectionsView.map((s, si) => {
        const sectionKata = s.bab.reduce((n, b) => n + b.items.length, 0);
        const openSec = si === 0;
        return `
        <div class="vocab-section ${openSec ? 'open' : ''}" data-section="${escapeHtml(s.key)}">
          <button class="vocab-section-toggle" type="button"
                  aria-expanded="${openSec ? 'true' : 'false'}"
                  onclick="window.toggleVocabSection('${s.key}')">
            <span class="vs-name">${escapeHtml(s.name)}</span>
            <span class="vs-count">${s.bab.length} Bab · ${sectionKata} kata</span>
            <svg class="vs-caret" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="vocab-section-body">
            ${s.bab.map((b) => `
              <div class="vocab-bab vocab-list-group" data-bab="${escapeHtml(b.key)}">
                <button class="vocab-bab-toggle" type="button"
                        aria-expanded="false"
                        onclick="window.toggleVocabBab('${b.key}')">
                  ${b.kode ? `<span class="vb-kode">${escapeHtml(b.kode)}</span>` : ''}
                  <span class="vb-name">${escapeHtml(b.name)}</span>
                  <span class="vb-count">${b.items.length} kata</span>
                  <svg class="vb-caret" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><polyline points="9 6 15 12 9 18"/></svg>
                </button>
                <div class="vocab-bab-body">
                  <div style="overflow-x:auto;">
                    <table class="vocab-table">
                      <thead><tr><th>日本語</th><th>Reading</th><th>Arti</th><th>Kategori</th><th>Catatan</th></tr></thead>
                      <tbody>${b.items.map(vocabRowHtml).join('')}</tbody>
                    </table>
                  </div>
                </div>
              </div>`).join('')}
          </div>
        </div>`;
      }).join('')}
    </div>` : `
    <div class="lesson-extras">
      ${renderable.map((g) => `
        <div class="lesson-extra-card vocab-list-group">
          <h3>📚 ${escapeHtml(g.title)} <span class="vocab-group-count">(${g.items.length})</span></h3>
          <div style="overflow-x:auto;">
            <table class="vocab-table">
              <thead><tr><th>日本語</th><th>Reading</th><th>Arti</th><th>Kategori</th><th>Catatan</th></tr></thead>
              <tbody>${g.items.map(vocabRowHtml).join('')}</tbody>
            </table>
          </div>
        </div>`).join('')}
    </div>`;

  main.innerHTML = `
    <p class="lesson-breadcrumb">${escapeHtml(courseName)} · KOSAKATA</p>
    <h1 class="lesson-title">📒 Kosakata <span class="vocab-level-chip">${escapeHtml(levelChip)}</span></h1>
    <p class="lesson-subtitle">${subtitleParts.join(' · ')}. ${syncNote}</p>
    <div class="module-filter" style="margin:14px 0 18px;">
      <svg class="mf-ico" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="search" id="vocab-list-filter" placeholder="Cari kosakata..." oninput="window.filterVocabList(this.value)" autocomplete="off" />
    </div>
    ${bodyHtml}
  `;
  window.scrollTo({ top: 0, behavior: 'smooth' });
};

window.filterVocabList = (q) => {
  const query = String(q ?? '').trim().toLowerCase();
  const sectionsMode = !!document.querySelector('#main-content .vocab-section');
  document.querySelectorAll('#main-content .vocab-list-group').forEach((group) => {
    let visible = 0;
    group.querySelectorAll('tbody tr').forEach((tr) => {
      const show = !query || (tr.getAttribute('data-vocab') || '').includes(query);
      tr.style.display = show ? '' : 'none';
      if (show) visible++;
    });
    group.style.display = visible === 0 ? 'none' : '';
    if (sectionsMode) {
      // While searching: auto-open Bab that have matches. When cleared:
      // collapse all so the user sees the section-level overview again.
      const babBtn = group.querySelector('.vocab-bab-toggle');
      if (query && visible > 0) {
        group.classList.add('open');
        if (babBtn) babBtn.setAttribute('aria-expanded', 'true');
      } else if (!query) {
        group.classList.remove('open');
        if (babBtn) babBtn.setAttribute('aria-expanded', 'false');
      }
    }
  });
  if (sectionsMode) {
    document.querySelectorAll('#main-content .vocab-section').forEach((sec, i) => {
      const hasMatch = Array.from(sec.querySelectorAll('.vocab-list-group')).some((g) => g.style.display !== 'none');
      sec.style.display = hasMatch ? '' : 'none';
      const secBtn = sec.querySelector('.vocab-section-toggle');
      if (query) {
        if (hasMatch) {
          sec.classList.add('open');
          if (secBtn) secBtn.setAttribute('aria-expanded', 'true');
        }
      } else {
        // Search cleared: only the first section stays open (default).
        if (i === 0) {
          sec.classList.add('open');
          if (secBtn) secBtn.setAttribute('aria-expanded', 'true');
        } else {
          sec.classList.remove('open');
          if (secBtn) secBtn.setAttribute('aria-expanded', 'false');
        }
      }
    });
  }
};

// Section / Bab accordion — only one section open at a time; within the active
// section, only one Bab open at a time. Toggling the currently-open one
// collapses it (so the user can collapse everything if they want).
window.toggleVocabSection = (key) => {
  const sec = document.querySelector(`#main-content .vocab-section[data-section="${key}"]`);
  if (!sec) return;
  const wasOpen = sec.classList.contains('open');
  document.querySelectorAll('#main-content .vocab-section').forEach((s) => {
    s.classList.remove('open');
    const btn = s.querySelector('.vocab-section-toggle');
    if (btn) btn.setAttribute('aria-expanded', 'false');
    s.querySelectorAll('.vocab-bab.open').forEach((b) => {
      b.classList.remove('open');
      const bbtn = b.querySelector('.vocab-bab-toggle');
      if (bbtn) bbtn.setAttribute('aria-expanded', 'false');
    });
  });
  if (!wasOpen) {
    sec.classList.add('open');
    const btn = sec.querySelector('.vocab-section-toggle');
    if (btn) btn.setAttribute('aria-expanded', 'true');
  }
};

window.toggleVocabBab = (key) => {
  const bab = document.querySelector(`#main-content .vocab-bab[data-bab="${key}"]`);
  if (!bab) return;
  const wasOpen = bab.classList.contains('open');
  const sec = bab.closest('.vocab-section');
  if (sec) {
    sec.querySelectorAll('.vocab-bab.open').forEach((b) => {
      if (b !== bab) {
        b.classList.remove('open');
        const btn = b.querySelector('.vocab-bab-toggle');
        if (btn) btn.setAttribute('aria-expanded', 'false');
      }
    });
  }
  bab.classList.toggle('open', !wasOpen);
  const btn = bab.querySelector('.vocab-bab-toggle');
  if (btn) btn.setAttribute('aria-expanded', wasOpen ? 'false' : 'true');
};

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function formatDurationLong(minutes) {
  const n = Number(minutes);
  if (!n || n <= 0) return '';
  if (n < 60) return `${Math.round(n)} menit`;
  const h = Math.floor(n / 60);
  const rem = Math.round(n - h * 60);
  return rem === 0 ? `${h} jam` : `${h} jam ${rem} menit`;
}

// Compact duration for the sidebar — "9 mnt", "1 jam 15 mnt". Empty if 0.
function formatDurationCompact(minutes) {
  const n = Math.max(0, Number(minutes) || 0);
  if (n === 0) return '';
  if (n < 60) return `${n} mnt`;
  const h = Math.floor(n / 60);
  const m = n % 60;
  return m === 0 ? `${h} jam` : `${h} jam ${m} mnt`;
}

function renderModuleIntro(module) {
  const hasCando = Array.isArray(module.candoStatements) && module.candoStatements.length > 0;
  const hasScenario = !!(module.scenario && module.scenario.trim());
  const durationText = formatDurationLong(module.totalMinutes);
  if (!hasCando && !hasScenario && !module.cefrLevel && !durationText && !module.jfTopic && !module.titleEn) {
    return '';
  }

  const pills = [];
  if (module.cefrLevel) pills.push(`<span class="pill pill-accent">CEFR ${escapeHtml(module.cefrLevel)}</span>`);
  if (durationText) pills.push(`<span class="pill">⏱ ${escapeHtml(durationText)}</span>`);
  if (module.jfTopic) pills.push(`<span class="pill">${escapeHtml(module.jfTopic)}</span>`);

  return `
    <div class="module-intro">
      <div class="module-intro-eyebrow">Modul ${escapeHtml(module.num)}</div>
      <h2>${escapeHtml(module.title)}</h2>
      ${module.titleEn ? `<p class="module-intro-sub">${escapeHtml(module.titleEn)}</p>` : ''}
      ${pills.length ? `<div class="module-intro-meta">${pills.join('')}</div>` : ''}
      ${hasCando ? `
        <div class="module-intro-section-title">Setelah modul ini kamu akan bisa:</div>
        <ul class="cando-list">
          ${module.candoStatements.map((c) => `<li>${escapeHtml(c)}</li>`).join('')}
        </ul>
      ` : ''}
      ${hasScenario ? `
        <div class="module-intro-section-title">Skenario</div>
        <div class="scenario-box">${escapeHtml(module.scenario)}</div>
      ` : ''}
    </div>
  `;
}

function renderLessonVocab(lesson) {
  const rows = Array.isArray(lesson.vocabulary) ? lesson.vocabulary : [];
  if (rows.length === 0) return '';
  const sorted = rows.slice().sort((a, b) => (a.sort_order ?? 0) - (b.sort_order ?? 0));
  return `
    <div class="lesson-extra-card">
      <h3>📚 Kosakata di pelajaran ini (${sorted.length})</h3>
      <div style="overflow-x:auto;">
        <table class="vocab-table">
          <thead>
            <tr>
              <th>日本語</th>
              <th>Reading</th>
              <th>Arti</th>
              <th>Kategori</th>
              <th>Catatan</th>
            </tr>
          </thead>
          <tbody>
            ${sorted.map((v) => `
              <tr>
                <td class="jp-cell">${escapeHtml(v.japanese || '')}</td>
                <td class="reading-cell">${escapeHtml(v.reading || '')}</td>
                <td>${escapeHtml(v.indonesian || '')}</td>
                <td>${v.category ? `<span class="vocab-cat">${escapeHtml(v.category)}</span>` : ''}</td>
                <td class="vocab-note">${escapeHtml(v.note || '')}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

function renderLessonGrammar(lesson) {
  const rows = Array.isArray(lesson.grammar) ? lesson.grammar : [];
  if (rows.length === 0) return '';
  const sorted = rows.slice().sort((a, b) => (a.sort_order ?? 0) - (b.sort_order ?? 0));
  return `
    <div class="lesson-extra-card">
      <h3>📖 Grammar di pelajaran ini (${sorted.length})</h3>
      <div class="grammar-list">
        ${sorted.map((g) => `
          <div class="grammar-card">
            <div class="grammar-pattern">${escapeHtml(g.pattern || '')}</div>
            ${g.meaning ? `<div class="grammar-meaning">${escapeHtml(g.meaning)}</div>` : ''}
            ${g.example ? `<div class="grammar-example">${escapeHtml(g.example)}</div>` : ''}
            ${g.notes ? `<div class="grammar-notes">${escapeHtml(g.notes)}</div>` : ''}
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function renderLessonExtras(lesson) {
  const vocab = renderLessonVocab(lesson);
  const grammar = renderLessonGrammar(lesson);
  if (!vocab && !grammar) return '';
  return `<div class="lesson-extras">${vocab}${grammar}</div>`;
}

// ── DECK (kosakata cards) ─────────────────────────────────────────
const DECK_COLORS = {
  sun: '#E8A23E', moon: '#6B7BA3', fire: '#D04E2A', water: '#3B7BB8',
  tree: '#5A8C4A', gold: '#C9A227', earth: '#8C6B3F',
  day: '#C8102E', time: '#5E4B8B', week: '#1F8A5B', general: '#C8102E',
};
const AUDIO_SVG = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19" fill="currentColor"></polygon><path d="M15.5 8.5a5 5 0 0 1 0 7"></path></svg>';

function deckAccent(item) {
  const raw = (item && item.accentColor != null) ? String(item.accentColor).trim() : '';
  if (raw && /^#?[0-9a-fA-F]{3,8}$/.test(raw.replace(/^#/, ''))) {
    return raw.startsWith('#') ? raw : ('#' + raw);
  }
  const cat = String((item && item.category) || '').toLowerCase();
  return DECK_COLORS[cat] || 'var(--brand-red)';
}

function deckHighlight(jpPlain, highlight, fallbackWord) {
  const esc = escapeHtml(jpPlain || '');
  const term = ((highlight && highlight.trim()) || (fallbackWord && fallbackWord.trim()) || '').trim();
  if (!term) return esc;
  const escTerm = escapeHtml(term);
  const i = esc.indexOf(escTerm);
  if (i < 0) return esc;
  return esc.slice(0, i) + '<span class="hi">' + escTerm + '</span>' + esc.slice(i + escTerm.length);
}

// Plays via the cached server TTS endpoint; falls back to browser Web Speech.
function playTTS(text, btn) {
  const plain = String(text || '').replace(/<[^>]*>/g, '').trim();
  if (!plain) return;
  if (btn) {
    document.querySelectorAll('.dc-audio.playing,.de-play.playing,.dm-headaudio.playing').forEach((b) => b.classList.remove('playing'));
    btn.classList.add('playing');
  }
  const stop = () => { if (btn) btn.classList.remove('playing'); };
  const fallback = () => { stop(); try { speakJapanese(plain, btn); } catch (e) { /* noop */ } };
  try {
    const a = new Audio('/api/tts?text=' + encodeURIComponent(plain));
    a.onended = stop;
    a.onerror = fallback;
    const p = a.play();
    if (p && typeof p.catch === 'function') p.catch(fallback);
  } catch (e) { fallback(); }
}
window.playTTS = playTTS;
window.playDeckAudio = (idx, btn) => {
  const it = (window.__deckData || [])[idx];
  if (!it) return;
  playTTS(it.reading || it.japanese || '', btn);
};
window.playDeckExample = (idx, exIdx, btn) => {
  const it = (window.__deckData || [])[idx];
  if (!it) return;
  const ex = (it.examples || [])[exIdx];
  if (!ex) return;
  playTTS(String(ex.japanese || '').replace(/<[^>]*>/g, ''), btn);
};

function renderDeckLesson(course, module, lesson, nav) {
  const { prev, next, isDone } = nav;
  const items = Array.isArray(lesson.deck) ? lesson.deck : [];
  window.__deckData = items;

  if (!window.__deckEscWired) {
    document.addEventListener('keydown', (e) => {
      const back = document.getElementById('deck-modal-backdrop');
      const open = back && back.classList.contains('open');
      if (!open) return;
      if (e.key === 'Escape') { window.closeDeckModal && window.closeDeckModal(); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); window.deckModalStep && window.deckModalStep(-1); }
      else if (e.key === 'ArrowRight') { e.preventDefault(); window.deckModalStep && window.deckModalStep(1); }
    });
    window.__deckEscWired = true;
  }

  const intro = (lesson.body && lesson.body.trim())
    ? lesson.body
    : 'Klik kartu untuk melihat contoh kalimat, atau klik tombol speaker untuk mendengar pengucapan.';
  const exampleCount = items.reduce((n, it) => n + (Array.isArray(it.examples) ? it.examples.length : 0), 0);
  const heroBlock = items.length > 0 ? `
    <div class="deck-hero">
      <div>
        <div class="dh-eyebrow">単語 · KOSAKATA</div>
        <div class="dh-body">${escapeHtml(intro)}</div>

      <div class="dh-stat" aria-label="${items.length} kata, ${exampleCount} contoh kalimat">
        <div class="dh-stat-num">${items.length}</div>
        <div class="dh-stat-label">kata${exampleCount ? ` · ${exampleCount} contoh` : ''}</div>
      </div>
    </div>` : '';

  const toolbar = items.length > 0 ? `
    <div class="deck-toolbar">
      <div class="dt-stats"><strong id="deck-visible-count">${items.length}</strong> dari <strong>${items.length}</strong> kata</div>
      <div class="deck-search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg>
        <input type="search" placeholder="Cari kata atau arti..." oninput="filterDeck(this.value)" autocomplete="off" />
      </div>
    </div>` : '';

  const cardsHtml = items.length === 0
    ? '<div class="deck-empty">Belum ada kosakata di deck ini.</div>'
    : `<div class="deck-grid" id="deck-grid">${items.map((it, idx) => {
        const search = ((it.japanese || '') + ' ' + (it.reading || '') + ' ' + (it.romaji || '') + ' ' + (it.indonesian || '')).toLowerCase();
        const jp = escapeHtml(it.japanese || '');
        const arti = escapeHtml(it.indonesian || '');
        return `<div class="deck-card" role="button" tabindex="0" aria-label="${jp}${arti ? ' — ' + arti : ''}. Tekan Enter untuk lihat contoh kalimat." data-deck-search="${escapeHtml(search)}" style="--deck-accent:${deckAccent(it)};" onclick="openDeckModal(${idx})" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openDeckModal(${idx})}">
          <button class="dc-audio" type="button" aria-label="Dengar pengucapan ${jp}" onclick="event.stopPropagation();playDeckAudio(${idx}, this)">${AUDIO_SVG}</button>
          <div class="dc-jp" lang="ja">${jp}</div>
          ${it.reading ? `<div class="dc-kana" lang="ja">${escapeHtml(it.reading)}</div>` : ''}
          <div class="dc-meaning">${arti}</div>
          <span class="dc-len" aria-hidden="true">Klik untuk contoh</span>
        </div>`;
      }).join('')}<div class="deck-empty-filter" id="deck-empty-filter" hidden></div></div>`;

  document.getElementById('main-content').innerHTML = `
    <p class="lesson-breadcrumb">${course.name} · Modul <span>${module.num}</span> · KOSAKATA</p>
    <h1 class="lesson-title">${lesson.title}</h1>
    <p class="lesson-subtitle">${module.title}${lesson.duration ? ' — ' + lesson.duration : ''}</p>
    ${heroBlock}
    ${toolbar}
    ${cardsHtml}
    <div class="deck-modal-backdrop" id="deck-modal-backdrop" onclick="if(event.target===this)closeDeckModal()">
      <div class="deck-modal" id="deck-modal" role="dialog" aria-modal="true" aria-labelledby="deck-modal-jp" tabindex="-1">
        <button class="deck-modal-close" type="button" aria-label="Tutup" onclick="closeDeckModal()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"></path></svg>
        </button>
        <div class="deck-modal-head">
          <div class="dm-jp" lang="ja" id="deck-modal-jp"></div>
          <div class="dm-info">
            <div class="dm-cat"></div>
            <div class="dm-kana" lang="ja"></div>
            <div class="dm-romaji"></div>
            <div class="dm-arti"></div>
          </div>
          <button class="dm-headaudio" type="button" aria-label="Dengar kata">${AUDIO_SVG}</button>

        <div class="deck-ex-list" id="deck-ex-list"></div>
        <div class="deck-modal-nav">
          <button type="button" id="deck-modal-prev" aria-label="Kata sebelumnya (←)" onclick="window.deckModalStep(-1)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>

      <button class="btn-secondary" ${!prev ? 'disabled' : ''} onclick="${prev ? `selectLesson('${prev.m.id}','${prev.l.id}')` : ''}">← Sebelumnya</button>
      <button class="btn-primary" onclick="markCompleteAndNext()">
        ${isDone ? (next ? 'Lanjut →' : 'Selesai ✓') : (next ? 'Tandai Selesai & Lanjut →' : 'Tandai Selesai ✓')}
      </button>
    </div>
  `;
}

window.filterDeck = (q) => {
  const term = String(q || '').trim().toLowerCase();
  let visible = 0;
  document.querySelectorAll('#deck-grid .deck-card').forEach((c) => {
    const match = !term || (c.dataset.deckSearch || '').includes(term);
    c.style.display = match ? '' : 'none';
    if (match) visible++;
  });
  const cnt = document.getElementById('deck-visible-count');
  if (cnt) cnt.textContent = visible;
  const empty = document.getElementById('deck-empty-filter');
  if (empty) {
    if (visible === 0 && term) {
      empty.innerHTML = `Tidak ada kata yang cocok dengan <strong>"${escapeHtml(term)}"</strong>.`;
      empty.hidden = false;
    } else {
      empty.hidden = true;
    }
  }
};

window.openDeckModal = (idx) => {
  const data = window.__deckData || [];
  const it = data[idx];
  if (!it) return;
  const back = document.getElementById('deck-modal-backdrop');
  const modal = document.getElementById('deck-modal');
  if (!back || !modal) return;
  const wasOpen = back.classList.contains('open');
  if (!wasOpen) {
    window.__deckModalReturnFocus = document.activeElement;
  }
  window.__deckModalIdx = idx;
  modal.style.setProperty('--deck-accent', deckAccent(it));
  modal.querySelector('.dm-jp').textContent = it.japanese || '';
  modal.querySelector('.dm-cat').textContent = (it.category || 'kosakata').toUpperCase();
  modal.querySelector('.dm-kana').textContent = it.reading || '';
  modal.querySelector('.dm-romaji').textContent = it.romaji || '';
  modal.querySelector('.dm-arti').textContent = it.indonesian || '';
  const headAudio = modal.querySelector('.dm-headaudio');
  headAudio.onclick = () => playDeckAudio(idx, headAudio);
  const list = document.getElementById('deck-ex-list');
  const examples = Array.isArray(it.examples) ? it.examples : [];
  list.innerHTML = examples.length === 0
    ? '<div class="deck-ex-empty">Belum ada contoh kalimat untuk kata ini.</div>'
    : examples.map((ex, i) => {
        const plain = String(ex.japanese || '').replace(/<[^>]*>/g, '');
        return `<div class="deck-ex">
          <div class="de-num">${String(i + 1).padStart(2, '0')}</div>
          <div class="de-text">
            <div class="de-jp" lang="ja">${deckHighlight(plain, ex.highlight, it.japanese)}</div>
            ${ex.indonesian ? `<div class="de-id">${escapeHtml(ex.indonesian)}</div>` : ''}
          </div>
          <button class="de-play" type="button" aria-label="Dengar kalimat" onclick="playDeckExample(${idx}, ${i}, this)">${AUDIO_SVG}</button>
        </div>`;
      }).join('');
  const prevBtn = document.getElementById('deck-modal-prev');
  const nextBtn = document.getElementById('deck-modal-next');
  const counter = document.getElementById('deck-modal-counter');
  if (prevBtn) prevBtn.disabled = idx <= 0;
  if (nextBtn) nextBtn.disabled = idx >= data.length - 1;
  if (counter) counter.textContent = `${idx + 1} / ${data.length}`;
  back.classList.add('open');
  if (!wasOpen) {
    // Focus the modal so screen readers announce it; keyboard nav (← →/Esc) is wired globally.
    setTimeout(() => modal.focus(), 0);
  }
};

window.deckModalStep = (delta) => {
  const data = window.__deckData || [];
  const cur = typeof window.__deckModalIdx === 'number' ? window.__deckModalIdx : 0;
  const target = cur + delta;
  if (target < 0 || target >= data.length) return;
  // Stop any audio that was playing for the previous card.
  document.querySelectorAll('.de-play.playing,.dm-headaudio.playing').forEach((b) => b.classList.remove('playing'));
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  window.openDeckModal(target);
};

window.closeDeckModal = () => {
  const back = document.getElementById('deck-modal-backdrop');
  if (back) back.classList.remove('open');
  document.querySelectorAll('.de-play.playing,.dm-headaudio.playing,.dc-audio.playing').forEach((b) => b.classList.remove('playing'));
  if (window.speechSynthesis) window.speechSynthesis.cancel();
  const ret = window.__deckModalReturnFocus;
  window.__deckModalReturnFocus = null;
  if (ret && typeof ret.focus === 'function') {
    try { ret.focus(); } catch (e) { /* noop */ }
  }
};

function renderLesson() {
  const course = COURSE_CONTENT[currentState.course];
  const module = course.modules.find(m => m.id === currentState.moduleId);
  const lesson = module.lessons.find(l => l.id === currentState.lessonId);
  const progress = getProgress()[currentState.course] || {};
  const key = `${module.id}:${lesson.id}`;
  const isDone = !!progress[key];

  const allLessons = course.modules.flatMap(m => m.lessons.map(l => ({ m, l })));
  const idx = allLessons.findIndex(x => x.m.id === module.id && x.l.id === lesson.id);
  const prev = allLessons[idx - 1];
  const next = allLessons[idx + 1];

  // Handle interactive quiz
  if (lesson.type === 'quiz') {
    const quizKey = getQuizKey(currentState.course, module.id, lesson.id);
    const scores = JSON.parse(localStorage.getItem('ez_quiz_scores') || '{}');
    const bestScore = scores[quizKey] || 0;

    document.getElementById('main-content').innerHTML = `
      <p class="lesson-breadcrumb">${course.name} · Modul <span>${module.num}</span> · KUIS</p>
      <h1 class="lesson-title">${lesson.title}</h1>
      <p class="lesson-subtitle">${module.title} — ${lesson.duration}</p>

      <div class="quiz-container">
        <div style="text-align:center;padding:20px 0;">
          <div style="font-size:48px;margin-bottom:12px;">📝</div>
          <h2 style="font-size:22px;font-weight:800;margin:0 0 8px;">Siap untuk kuis?</h2>
          <p style="color:#485f84;margin:0 0 20px;">${lesson.body || 'Tes pemahaman kamu di bab ini.'}</p>
          ${bestScore > 0 ? `<div style="display:inline-block;padding:8px 18px;background:var(--brand-red-soft);color:var(--brand-red);border-radius:999px;font-weight:700;font-size:13px;margin-bottom:20px;">Skor terbaik: ${bestScore}%</div><br/>` : ''}
          <button class="btn-primary" id="quiz-start-btn" onclick="window.startQuizNow()">
            ${bestScore > 0 ? 'Ulang Kuis →' : 'Mulai Kuis →'}
          </button>
        </div>
      </div>

      <div class="lesson-footer" style="margin-top:20px;">
        <button class="btn-secondary" ${!prev ? 'disabled' : ''} onclick="${prev ? `selectLesson('${prev.m.id}','${prev.l.id}')` : ''}">
          ← Sebelumnya
        </button>
      </div>
    `;
    return;
  }

  // Deck — interactive vocab cards (design: "Kosakata" handoff)
  if (lesson.type === 'deck') {
    renderDeckLesson(course, module, lesson, { prev, next, isDone });
    return;
  }

  // Regular lesson (video/text) — only render the player for actual video lessons.
  // The placeholder signals that a video will live here; click action stays a
  // friendly "coming soon" until Bunny Stream playback is wired up.
  const videoBlock = lesson.type === 'video' ? `
    <div class="video-player">
      <span class="video-soon">Segera tersedia</span>
      <button class="play-btn" onclick="alert('Video pelajaran akan segera tersedia di sini.')">▶</button>
      <span class="video-meta">${lesson.type.toUpperCase()} · ${lesson.duration.toUpperCase()}</span>
    </div>
  ` : '';

  // Show module intro panel only on the first lesson of a module (orientation).
  const isFirstOfModule = module.lessons[0]?.id === lesson.id;
  const introBlock = isFirstOfModule ? renderModuleIntro(module) : '';

  // When the intro panel is rendered, the first lesson's body duplicates the
  // same info (importer-generated markdown). Skip the body block to avoid
  // showing both.
  const bodyBlock = introBlock ? '' : `
    <div class="lesson-body">
      <h2>Catatan Pelajaran ${lesson.jp ? `<button class="pronounce-btn" style="vertical-align:middle;font-size:11px;" onclick="window.speakLessonJP(this)">🔊 Putar Jepang</button>` : ''}</h2>
      <p>${lesson.body}</p>
      ${lesson.jp ? `<div class="jp" id="lesson-jp">${lesson.jp}</div>` : ''}
      <p style="color:#999;font-size:13px;margin-top:18px;">Materi lengkap: video tutorial, contoh audio, dan worksheet PDF tersedia saat belajar.</p>
    </div>
  `;

  document.getElementById('main-content').innerHTML = `
    <p class="lesson-breadcrumb">${course.name} · Modul <span>${module.num}</span> · ${lesson.type.toUpperCase()}</p>
    <h1 class="lesson-title">${lesson.title}</h1>
    <p class="lesson-subtitle">${module.title} — ${lesson.duration}</p>

    ${introBlock}

    ${videoBlock}

    ${bodyBlock}

    ${renderLessonExtras(lesson)}

    ${renderLessonTabs(module, lesson)}

    <div class="lesson-footer">
      <button class="btn-secondary" ${!prev ? 'disabled' : ''} onclick="${prev ? `selectLesson('${prev.m.id}','${prev.l.id}')` : ''}">
        ← Sebelumnya
      </button>
      <button class="btn-primary" onclick="markCompleteAndNext()">
        ${isDone ? (next ? 'Lanjut →' : 'Selesai ✓') : (next ? 'Tandai Selesai & Lanjut →' : 'Tandai Selesai ✓')}
      </button>
    </div>
  `;
}

window.switchLessonTab = (tab) => {
  document.querySelectorAll('#lesson-tabs .tab-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === tab);
  });
  document.querySelectorAll('#lesson-tabs .tab-pane').forEach(p => {
    p.classList.toggle('active', p.dataset.pane === tab);
  });
};

let _noteSaveTimer = null;
window.saveLessonNote = (key, value) => {
  const status = document.getElementById('note-status');
  if (status) { status.textContent = 'Menyimpan...'; status.classList.add('saving'); }
  clearTimeout(_noteSaveTimer);
  _noteSaveTimer = setTimeout(() => {
    try { localStorage.setItem(key, value); } catch(e) {}
    if (status) { status.textContent = 'Tersimpan ✓'; status.classList.remove('saving'); status.classList.add('saved'); }
  }, 400);
};

window.startQuizNow = async () => {
  const btn = document.getElementById('quiz-start-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Memuat kuis...'; }
  const questions = await ensureQuizLoaded(currentState.course, currentState.moduleId, currentState.lessonId);
  if (!questions || questions.length === 0) {
    const main = document.getElementById('main-content');
    const container = main?.querySelector('.quiz-container');
    if (container) {
      container.innerHTML = `<p style="color:#485f84;text-align:center;padding:40px 20px;">Kuis belum tersedia untuk bab ini.</p>`;
    }
    return;
  }
  renderQuizLesson(document.getElementById('main-content'), currentState.course, currentState.moduleId, currentState.lessonId);
  window.scrollTo({ top: 0, behavior: 'smooth' });
};

window.speakLessonJP = (btn) => {
  const el = document.getElementById('lesson-jp');
  if (!el) return;
  const text = el.textContent || '';
  speakJapanese(text, btn);
};

// Sidebar accordion state — persists across renderSidebar() so user choices
// don't snap shut on every navigation. Sections default to CLOSED; user
// clicks to open one (mutex — at most one section open globally). Modules
// also mutex within their section. On the first render of a course, the
// section + module of the current lesson auto-open; afterwards the user
// is fully in control (clicking the open module collapses it cleanly).
const _expandedSections = new Set();
const _expandedModules = new Set();
let _lastSeededCourse = null;

function _sectionOfModule(moduleId) {
  const course = COURSE_CONTENT[currentState.course];
  if (!course) return 'Lainnya';
  const mod = course.modules.find((m) => m.id === moduleId);
  return (mod && mod.sectionName && mod.sectionName.trim()) || 'Lainnya';
}

window.selectLesson = (moduleId, lessonId) => {
  // Picking a lesson auto-opens its section + module; close sibling modules
  // in the same section (module-level mutex). Other sections stay closed.
  const sec = _sectionOfModule(moduleId);
  _expandedSections.clear();
  _expandedSections.add(sec);
  for (const otherId of [..._expandedModules]) {
    if (otherId !== moduleId && _sectionOfModule(otherId) === sec) {
      _expandedModules.delete(otherId);
    }
  }
  _expandedModules.add(moduleId);
  currentState.moduleId = moduleId;
  currentState.lessonId = lessonId;
  renderSidebar();
  renderLesson();
  renderRightPanel();
  closeSidebar();
  window.scrollTo({ top: 0, behavior: 'smooth' });
};

const SIDEBAR_KEY = 'eznihongo:sidebarCollapsed';
const isDesktop = () => window.innerWidth >= 861;
function applySidebarCollapse(collapsed) {
  const layout = document.querySelector('.learning-layout');
  if (!layout) return;
  layout.classList.toggle('sidebar-collapsed', collapsed);
  const btn = document.getElementById('sidebar-toggle');
  const btnLabel = btn && btn.querySelector('span');
  if (btnLabel) btnLabel.textContent = collapsed ? 'Menu' : 'Tutup';
  if (btn) btn.setAttribute('aria-label', collapsed ? 'Buka menu' : 'Tutup menu');
  const handle = document.getElementById('sidebar-handle');
  if (handle) {
    const label = collapsed ? 'Buka sidebar' : 'Tutup sidebar';
    handle.setAttribute('aria-label', label);
    handle.setAttribute('title', label);
  }
}
window.applySidebarCollapse = applySidebarCollapse;

window.toggleSidebar = () => {
  // Desktop: collapse/expand persistent sidebar. Mobile: drawer.
  if (isDesktop()) {
    const cur = localStorage.getItem(SIDEBAR_KEY) === '1';
    const next = !cur;
    localStorage.setItem(SIDEBAR_KEY, next ? '1' : '0');
    applySidebarCollapse(next);
    return;
  }
  const sb = document.getElementById('sidebar');
  const bd = document.getElementById('sidebar-backdrop');
  if (!sb) return;
  const isOpen = sb.classList.toggle('mobile-open');
  if (bd) bd.classList.toggle('show', isOpen);
  document.body.style.overflow = isOpen ? 'hidden' : '';
};

window.closeSidebar = () => {
  const sb = document.getElementById('sidebar');
  const bd = document.getElementById('sidebar-backdrop');
  if (sb) sb.classList.remove('mobile-open');
  if (bd) bd.classList.remove('show');
  document.body.style.overflow = '';
};

// Sync state when crossing the desktop breakpoint.
window.addEventListener('resize', () => {
  if (isDesktop()) {
    closeSidebar();
    applySidebarCollapse(localStorage.getItem(SIDEBAR_KEY) === '1');
  }
});

window.toggleModule = (moduleId) => {
  // Mutex within the parent section: opening one module collapses the others
  // in the same section. Toggle the current one if already open.
  const sec = _sectionOfModule(moduleId);
  const wasOpen = _expandedModules.has(moduleId);
  for (const otherId of [..._expandedModules]) {
    if (_sectionOfModule(otherId) === sec) _expandedModules.delete(otherId);
  }
  if (!wasOpen) _expandedModules.add(moduleId);
  renderSidebar();
};

window.toggleSidebarSection = (name) => {
  // Mutex at section level: opening one closes others (and resets their
  // open modules). Clicking the already-open section collapses it.
  const wasOpen = _expandedSections.has(name);
  _expandedSections.clear();
  // Collapsing a section also collapses its open module, to avoid leaving
  // stale state when the user re-opens it later.
  for (const otherId of [..._expandedModules]) {
    if (_sectionOfModule(otherId) !== name || wasOpen) {
      _expandedModules.delete(otherId);
    }
  }
  if (!wasOpen) _expandedSections.add(name);
  renderSidebar();
};

window.markCompleteAndNext = () => {
  const course = COURSE_CONTENT[currentState.course];
  const key = `${currentState.moduleId}:${currentState.lessonId}`;
  const allProgress = getProgress();
  const courseProgress = allProgress[currentState.course] || {};
  const wasAlreadyDone = !!courseProgress[key];
  courseProgress[key] = true;
  allProgress[currentState.course] = courseProgress;
  setProgress(allProgress);

  if (!wasAlreadyDone) addXP(10, 'lesson selesai');

  const allLessons = course.modules.flatMap(m => m.lessons.map(l => ({ m, l })));
  const idx = allLessons.findIndex(x => x.m.id === currentState.moduleId && x.l.id === currentState.lessonId);
  const next = allLessons[idx + 1];

  // Check if this was the last lesson of the module
  const currentModule = course.modules.find(m => m.id === currentState.moduleId);
  const moduleDoneLessons = currentModule.lessons.filter(l => courseProgress[`${currentModule.id}:${l.id}`]).length;
  const justFinishedModule = !wasAlreadyDone && moduleDoneLessons === currentModule.lessons.length;

  // Check if entire course completed
  const totalLessons = course.modules.reduce((s, m) => s + m.lessons.length, 0);
  const totalDone = Object.values(courseProgress).filter(v => v).length;
  const courseComplete = !wasAlreadyDone && totalDone === totalLessons;

  const advance = () => {
    if (next) {
      currentState.moduleId = next.m.id;
      currentState.lessonId = next.l.id;
    }
    renderSidebar();
    renderLesson();
    renderRightPanel();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  if (courseComplete) {
    showCompletion({
      title: '🎌 Selamat! Kelas Selesai',
      message: `Kamu telah menyelesaikan semua materi ${course.name}. 素晴らしい！`,
      xp: 50,
      continueLabel: 'Tutup',
      onContinue: advance,
    });
    addXP(50, 'kelas selesai');
  } else if (justFinishedModule) {
    showCompletion({
      title: 'Bab Selesai!',
      message: `Kamu sudah tamatkan "${currentModule.title}". Lanjut ke materi berikutnya?`,
      xp: 15,
      continueLabel: 'Lanjut →',
      onContinue: advance,
    });
    addXP(15, 'bab selesai');
  } else {
    advance();
  }
};

function renderCourseTabs(activeSlug) {
  const enrolled = getEnrolledCourses();
  // Tabs show the full catalog (CMS) plus any enrolled slugs that somehow
  // aren't in the CMS list (edge case — unpublished course user still has
  // access to). Non-enrolled tabs get a lock icon + upgrade flow.
  const cmsList = Array.isArray(_cmsCourses) ? _cmsCourses : [];
  const entries = [];
  const seen = new Set();
  for (const c of cmsList) {
    if (!c.slug) continue;
    seen.add(c.slug);
    entries.push({ slug: c.slug, name: c.title || c.slug.toUpperCase(), tagline: c.tagline || c.description || '' });
  }
  for (const slug of enrolled) {
    if (seen.has(slug)) continue;
    const c = COURSE_CONTENT[slug];
    entries.push({ slug, name: c?.name || slug.toUpperCase(), tagline: c?.tagline || '' });
  }
  const tabs = entries.map(({ slug, name, tagline }) => {
    const isEnrolled = enrolled.includes(slug);
    const isActive = slug === activeSlug;
    const classes = ['course-tab'];
    if (isActive) classes.push('active');
    if (!isEnrolled) classes.push('locked');
    const lockIcon = !isEnrolled ? '<span class="lock-icon">🔒</span>' : '';
    const title = tagline ? `${name} — ${tagline}` : name;
    return `<button class="${classes.join(' ')}" onclick="switchCourse('${slug}')" title="${title}">${slug.toUpperCase()}${lockIcon}</button>`;
  }).join('');
  const nav = document.getElementById('course-tabs');
  if (nav) nav.innerHTML = tabs;
}

window.switchCourse = async (slug) => {
  const enrolled = getEnrolledCourses();
  if (!enrolled.includes(slug)) {
    // Route through the universal checkout page. detail.html handles
    // not-found / not-available states — keeps this guard simple.
    window.location.href = `courses/detail.html?slug=${encodeURIComponent(slug)}`;
    return;
  }
  if (slug === currentState.course) { closeSidebar(); return; }
  currentState.moduleId = null;
  currentState.lessonId = null;
  history.replaceState({}, '', `welcome.html?course=${slug}`);
  renderLearning(slug);
  closeSidebar();
};

// ═══════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════
(async () => {
  if (!session) return;

  // Authoritative session check BEFORE rendering. Guarantees the rest of init
  // sees a valid server-side session — or redirects cleanly to login. Without
  // this the paywall would flash whenever localStorage ez_user outlived its
  // refresh cookie (e.g. admin revoked access, or user cleared cookies only).
  let verifiedUser = null;
  try { verifiedUser = await window.ezGetMe(); } catch { verifiedUser = null; }
  if (!verifiedUser) {
    location.replace('login.html?next=welcome.html');
    return;
  }
  // Pick up the freshly-mirrored ez_user so email/avatar reflect the actual
  // logged-in account (not whoever was cached before).
  const mirrored = JSON.parse(localStorage.getItem('ez_user') || 'null');
  if (mirrored) session = mirrored;

  const userEmailEl = document.getElementById('user-email');
  if (userEmailEl) userEmailEl.textContent = session.email;

  try {
    // Pull enrollments first — the hydrator only fetches course content for
    // slugs the user actually has access to. Flashcards are static and the
    // CMS course list (used by sidebar picker / course tabs to show
    // upgrade CTAs for non-enrolled courses) can load in parallel.
    await syncEnrollmentsFromServer();
    await Promise.all([hydrateEnrolledCourses(), fetchCmsCourses()]);
    // handleNewEnrollment may resync enrollments (e.g. if user just landed
    // from checkout). Re-hydrate in case it discovered a newly-paid course.
    await handleNewEnrollment();
    await hydrateEnrolledCourses();
  } catch (err) {
    // Auth died between the ezGetMe check above and this sync (rare, but
    // possible if the refresh cookie was invalidated mid-load). Bounce to
    // login rather than rendering the paywall — paywall = "go buy a course",
    // which is wrong messaging when the real issue is session expiry.
    if (err && err.message === 'AUTH_EXPIRED') {
      location.replace('login.html?next=welcome.html');
      return;
    }
    const root = document.getElementById('app-root');
    if (root) {
      root.innerHTML = `
        <div style="padding:60px 20px;text-align:center;color:#666;max-width:500px;margin:0 auto;">
          <h2 style="color:#1a1a1a;margin-bottom:12px;">Gagal memuat materi</h2>
          <p style="margin-bottom:20px;">Coba refresh halaman, atau cek koneksi internet kamu.</p>
          <button onclick="location.reload()" style="padding:10px 20px;background:#1a1a1a;color:#fff;border:none;border-radius:8px;cursor:pointer;">Refresh</button>
          <p style="font-size:12px;color:#999;margin-top:20px;">${(err && err.message) || err}</p>
        </div>
      `;
    }
    return;
  }

  const enrolled = getEnrolledCourses();
  const params = new URLSearchParams(window.location.search);
  const requested = params.get('course');

  if (enrolled.length === 0) {
    renderPaywall();
  } else {
    const selected = enrolled.includes(requested) ? requested : enrolled[0];
    renderCourseTabs(selected);
    renderLearning(selected);
  }
})();
</script>
