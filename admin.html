  const cells = fields.map((f) => {
    if (f.type === 'textarea') {
      return `<td><textarea name="${f.name}" rows="3" placeholder="${escapeHtml(f.placeholder || '')}" style="${f.style}font-family:var(--font-mono);font-size:11px;">${escapeHtml(item[f.name] || '')}</textarea></td>`;
    }
    return `<td><input name="${f.name}" value="${escapeHtml(item[f.name] || '')}" style="${f.style}" /></td>`;
  }).join('');
  return `
    <tr data-id="${item.id || ''}" data-kind="${kind}">
      ${cells}
      <td><input type="number" name="sortOrder" value="${item.sort_order || 0}" style="width:60px;" /></td>
      <td class="actions">
        <button type="button" class="btn btn-primary" onclick="saveItemRow(this)">Simpan</button>
        ${item.id ? `<button type="button" class="btn btn-danger" onclick="deleteItemRow(this)">×</button>` : `<button type="button" class="btn btn-ghost" onclick="this.closest('tr').remove()">×</button>`}
      </td>
    </tr>
  `;
}

function renderItemTable(kind, items) {
  const fields = kind === 'vocab' ? VOCAB_FIELDS : GRAMMAR_FIELDS;
  const heads = fields.map((f) => `<th>${f.label}</th>`).join('');
  const rows = items.map((it) => itemRowHtml(it, fields, kind)).join('');
  return `
    <table style="font-size:12px;">
      <thead><tr>${heads}<th>#</th><th></th></tr></thead>
      <tbody id="items-body">${rows || ''}</tbody>
    </table>
    ${items.length === 0 ? '<div class="empty" style="padding:20px;">Belum ada item.</div>' : ''}
  `;
}

async function openItemManager(kind, lessonId, lessonTitle, moduleId) {
  let items = [];
  try {
    const d = await api('/admin/modules/' + moduleId);
    const all = kind === 'vocab' ? (d.module?.vocabulary || []) : (d.module?.grammar || []);
    items = all.filter((it) => it.lesson_id === lessonId);
  } catch (err) {
    notify('Gagal load ' + kind + ': ' + err.message, true);
    return;
  }
  const label = kind === 'vocab' ? 'Kosakata' : 'Grammar';
  const safeTitle = escapeHtml(lessonTitle).replace(/'/g, "\\'");
  openModal(`
    <h3>${label}: ${escapeHtml(lessonTitle)}</h3>
    <div class="toolbar">
      <button type="button" class="btn btn-primary" onclick="addItemRow('${kind}')">+ Tambah</button>
      <button type="button" class="btn btn-ghost" onclick="openBulkPaste('${kind}', '${lessonId}', '${safeTitle}', '${moduleId}')">Paste dari Excel (TSV)</button>
      <span style="font-size:12px;color:#737373;font-family:var(--font-body);">${items.length} item</span>
    </div>
    <div id="items-wrap" style="overflow-x:auto;">${renderItemTable(kind, items)}</div>
    <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">Tutup</button></div>
  `);
  // Widen the modal for the table layout; reset on close.
  modalContent.style.maxWidth = '1000px';
  window.__itemCtx = { kind, lessonId, lessonTitle, moduleId };
}

window.manageVocab = (lessonId, lessonTitle, moduleId) => openItemManager('vocab', lessonId, lessonTitle, moduleId);
window.manageGrammar = (lessonId, lessonTitle, moduleId) => openItemManager('grammar', lessonId, lessonTitle, moduleId);

window.addItemRow = (kind) => {
  const fields = kind === 'vocab' ? VOCAB_FIELDS : GRAMMAR_FIELDS;
  const empty = {};
  for (const f of fields) empty[f.name] = '';
  empty.sort_order = document.querySelectorAll('#items-body tr').length;
  const tbody = document.getElementById('items-body');
  tbody.appendChild(el(itemRowHtml(empty, fields, kind)));
};

window.saveItemRow = async (btn) => {
  const tr = btn.closest('tr');
  const id = tr.dataset.id;
  const kind = tr.dataset.kind;
  const ctx = window.__itemCtx || {};
  const fields = kind === 'vocab' ? VOCAB_FIELDS : GRAMMAR_FIELDS;
  const body = {
    moduleId: ctx.moduleId,
    lessonId: ctx.lessonId,
    sortOrder: Number(tr.querySelector('input[name="sortOrder"]').value) || 0,
  };
  for (const f of fields) {
    const input = tr.querySelector(`[name="${f.name}"]`);
    body[f.bodyKey || f.name] = (input && input.value.trim()) || null;
  }
  // Validation
  if (kind === 'vocab' && !body.japanese) { notify('Japanese wajib diisi', true); return; }
  if (kind === 'grammar' && !body.pattern) { notify('Pattern wajib diisi', true); return; }
  const endpoint = kind === 'vocab' ? '/admin/module-vocabulary' : '/admin/module-grammar';
  try {
    if (id) {
      await api(endpoint + '/' + id, { method: 'PUT', body: JSON.stringify(body) });
    } else {
      const d = await api(endpoint, { method: 'POST', body: JSON.stringify(body) });
      const saved = d.vocabulary || d.grammar;
      if (saved && saved.id) tr.dataset.id = saved.id;
      // Swap × button to server-delete variant
      const actionsCell = tr.querySelector('td.actions');
      actionsCell.innerHTML = `
        <button type="button" class="btn btn-primary" onclick="saveItemRow(this)">Simpan</button>
        <button type="button" class="btn btn-danger" onclick="deleteItemRow(this)">×</button>
      `;
    }
    notify('Tersimpan');
    // Refresh counts in the modules table in the background (if visible).
    if (STATE.selectedCourse) loadModulesForCourse(STATE.selectedCourse).then(() => {
      if (STATE.tab === 'modules') renderModules();
    });
  } catch (err) { notify('Gagal simpan: ' + err.message, true); }
};

window.deleteItemRow = async (btn) => {
  const tr = btn.closest('tr');
  const id = tr.dataset.id;
  const kind = tr.dataset.kind;
  if (!id) { tr.remove(); return; }
  if (!confirm('Hapus item ini?')) return;
  const endpoint = kind === 'vocab' ? '/admin/module-vocabulary' : '/admin/module-grammar';
  try {
    await api(endpoint + '/' + id, { method: 'DELETE' });
    tr.remove();
    notify('Dihapus');
    if (STATE.selectedCourse) loadModulesForCourse(STATE.selectedCourse).then(() => {
      if (STATE.tab === 'modules') renderModules();
    });
  } catch (err) { notify('Gagal hapus: ' + err.message, true); }
};

window.openBulkPaste = (kind, lessonId, lessonTitle, moduleId) => {
  // Exclude textarea fields (multi-line, e.g. example_dialog) — TSV gak bisa
  // muat newline per sel. Field itu di-isi manual via tabel editor.
  const fields = (kind === 'vocab' ? VOCAB_FIELDS : GRAMMAR_FIELDS).filter((f) => f.type !== 'textarea');
  const header = fields.map((f) => f.name).join('\t');
  const safeTitle = escapeHtml(lessonTitle).replace(/'/g, "\\'");
  openModal(`
    <h3>Paste ${kind} (TSV) — ${escapeHtml(lessonTitle)}</h3>
    <p style="font-size:12px;color:#525252;font-family:var(--font-body);margin:0 0 10px;">
      Satu baris per item. Kolom dipisah TAB, urutan: <code>${header}</code>.<br>
      Semua item di-assign ke pelajaran ini otomatis.
    </p>
    <div class="field"><textarea id="bulk-tsv" rows="12" style="font-family:monospace;font-size:12px;"></textarea></div>
    <div class="modal-actions">
      <button type="button" class="btn btn-ghost" onclick="manage${kind === 'vocab' ? 'Vocab' : 'Grammar'}('${lessonId}', '${safeTitle}', '${moduleId}')">← Kembali</button>
      <button type="button" class="btn btn-primary" onclick="submitBulk('${kind}', '${lessonId}', '${safeTitle}', '${moduleId}')">Import</button>
    </div>
  `);
};

window.submitBulk = async (kind, lessonId, lessonTitle, moduleId) => {
  const raw = document.getElementById('bulk-tsv').value;
  const fields = (kind === 'vocab' ? VOCAB_FIELDS : GRAMMAR_FIELDS).filter((f) => f.type !== 'textarea');
  const items = raw.split(/\r?\n/).map((line) => {
    if (!line.trim()) return null;
    const cols = line.split('\t');
    const item = { lessonId };
    fields.forEach((f, i) => { item[f.name] = (cols[i] || '').trim() || null; });
    return item;
  }).filter((x) => x && (x[fields[0].name]));
  if (items.length === 0) { notify('Tidak ada baris valid', true); return; }
  const endpoint = kind === 'vocab' ? '/admin/module-vocabulary/bulk' : '/admin/module-grammar/bulk';
  try {
    await api(endpoint, { method: 'POST', body: JSON.stringify({ moduleId, items, replace: false }) });
    notify(items.length + ' item di-import');
    if (kind === 'vocab') manageVocab(lessonId, lessonTitle, moduleId);
    else manageGrammar(lessonId, lessonTitle, moduleId);
    if (STATE.selectedCourse) loadModulesForCourse(STATE.selectedCourse);
  } catch (err) { notify('Gagal import: ' + err.message, true); }
};

// ─────────────────────────────────────────────────────────────
// GRAMMAR TASK ("grammar_task" lesson type) MANAGER
// Pilih pola grammar dari bank modul (module_grammar) ke sebuah tugas.
// Grammar yang sama bisa dipakai di banyak tugas (reusable). Prompt koreksi
// AI editable di bawah (global, dipakai semua tugas).
// ─────────────────────────────────────────────────────────────
function gtmRefreshList() {
  if (STATE.selectedCourse) loadModulesForCourse(STATE.selectedCourse).then(() => {
    if (STATE.tab === 'lessons') renderLessons();
  });
}

function renderGtmTable(items) {
  if (!items || items.length === 0) {
    return '<div class="empty" style="padding:20px;">Belum ada pola grammar di tugas ini. Tambah dari bank di bawah.</div>';
  }
  const rows = items.map((it) => `
    <tr data-gtm-gid="${it.grammar_id}">
      <td style="min-width:130px;"><span lang="ja" style="font-size:16px;font-weight:600;">${escapeHtml(it.pattern || '')}</span><div style="font-size:12px;color:#737373;">${escapeHtml(it.meaning || '')}</div></td>
      <td><textarea rows="2" style="width:100%;min-width:220px;font-size:12px;font-family:var(--font-body);box-sizing:border-box;" placeholder="Perintah tugas untuk pola ini (mis. Buat kalimat tentang kegiatan harianmu). Opsional." onchange="gtmSetInstruction('${it.grammar_id}', this.value)">${escapeHtml(it.instruction || '')}</textarea></td>
      <td><input type="number" min="1" max="10" value="${it.required_count || 1}" style="width:60px;font-size:13px;" onchange="gtmSetCount('${it.grammar_id}', this.value)" /></td>
      <td style="white-space:nowrap;">
        <button class="btn btn-ghost" onclick="gtmMove('${it.grammar_id}', -1)">↑</button>
        <button class="btn btn-ghost" onclick="gtmMove('${it.grammar_id}', 1)">↓</button>
      </td>
      <td class="actions" style="white-space:nowrap;">
        <button class="btn btn-danger" onclick="gtmRemove('${it.grammar_id}')">Keluarkan</button>
      </td>
    </tr>`).join('');
  return `<table style="font-size:13px;">
    <thead><tr><th>Pola / arti</th><th>Instruksi tugas (ke siswa + AI)</th><th>Jml kalimat</th><th>Urut</th><th></th></tr></thead>
    <tbody>${rows}</tbody></table>`;
}

function gtmRerender() {
  const wrap = document.getElementById('gtm-wrap');
  if (wrap) wrap.innerHTML = renderGtmTable(window.__gtmItems || []);
  const c = document.getElementById('gtm-count');
  if (c) c.textContent = (window.__gtmItems || []).length + ' pola';
  const bank = document.getElementById('gtm-bank');
  if (bank) bank.innerHTML = renderGtmBank();
}

function renderGtmBank() {
  const selected = new Set((window.__gtmItems || []).map((x) => x.grammar_id));
  const q = (window.__gtmBankQuery || '').trim().toLowerCase();
  const all = (window.__gtmBank || []).filter((g) => {
    if (selected.has(g.id)) return false;
    if (!q) return true;
    return ((g.pattern || '') + ' ' + (g.meaning || '') + ' ' + (g.example || '')).toLowerCase().includes(q);
  });
  if (all.length === 0) return '<div class="empty" style="padding:14px;">Tidak ada pola grammar lain di modul ini.</div>';
  return all.map((g) => `
    <div style="display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid #f0f0f0;">
      <div style="flex:1;min-width:0;">
        <div lang="ja" style="font-weight:600;">${escapeHtml(g.pattern || '')}</div>
        <div style="font-size:12px;color:#737373;">${escapeHtml(g.meaning || '')}</div>
      </div>
      <button type="button" class="btn btn-primary" style="padding:4px 12px;" onclick="gtmAdd('${g.id}')">+ Tambah</button>
    </div>`).join('');
}

window.gtmBankSearch = (v) => { window.__gtmBankQuery = v || ''; const b = document.getElementById('gtm-bank'); if (b) b.innerHTML = renderGtmBank(); };

async function openGrammarTaskManager(lessonId, lessonTitle, moduleId, courseId) {
  let items = [], bank = [], prompt = '';
  try {
    const d = await api('/admin/lessons/' + lessonId + '/grammar-task-items');
    items = d.items || [];
    const b = await api('/admin/module-grammar?moduleId=' + encodeURIComponent(moduleId));
    bank = b.grammar || [];
    const p = await api('/admin/settings/grammar-eval-prompt');
    prompt = p.value || '';
  } catch (err) { notify('Gagal load tugas grammar: ' + err.message, true); return; }
  window.__gtmCtx = { lessonId, lessonTitle, moduleId, courseId: courseId || '' };
  window.__gtmItems = items;
  window.__gtmBank = bank;
  window.__gtmBankQuery = '';
  openModal(`
    <h3>Tugas Grammar: ${escapeHtml(lessonTitle)}</h3>
    <div class="toolbar">
      <span id="gtm-count" style="font-size:12px;color:#737373;font-family:var(--font-body);">${items.length} pola</span>
    </div>
    <div id="gtm-wrap" style="overflow-x:auto;">${renderGtmTable(items)}</div>
    <div style="margin-top:16px;">
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px;">
        <strong style="font-size:13px;white-space:nowrap;">Tambah dari bank grammar</strong>
        <input placeholder="cari pola / arti..." style="flex:1;min-width:160px;font-size:13px;" oninput="gtmBankSearch(this.value)" />
      </div>
      <div id="gtm-bank" style="max-height:260px;overflow-y:auto;background:#fff;border:1px solid #eee;border-radius:8px;">${renderGtmBank()}</div>
    </div>
    <details style="margin-top:18px;border:1px solid #e5e5e5;border-radius:8px;padding:10px 14px;">
      <summary style="cursor:pointer;font-weight:600;font-size:13px;">Prompt Koreksi AI (berlaku untuk SEMUA tugas grammar)</summary>
      <p style="font-size:12px;color:#525252;font-family:var(--font-body);margin:8px 0;">
        Placeholder yang tersedia: <code>{{pattern}}</code> <code>{{meaning}}</code> <code>{{example}}</code> <code>{{sentence}}</code>.
        AI diminta menjawab JSON: <code>{"correct","usesPattern","feedback","correction"}</code>.
      </p>
      <textarea id="gtm-prompt" rows="12" style="width:100%;font-family:monospace;font-size:12px;box-sizing:border-box;">${escapeHtml(prompt)}</textarea>
      <div style="margin-top:8px;text-align:right;"><button type="button" class="btn btn-primary" onclick="gtmSavePrompt()">Simpan Prompt</button></div>
    </details>
    <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">Tutup</button></div>
  `);
  modalContent.style.maxWidth = '1000px';
}
window.manageGrammarTask = (lessonId, lessonTitle, moduleId, courseId) => openGrammarTaskManager(lessonId, lessonTitle, moduleId, courseId);

async function gtmSave() {
  const arr = window.__gtmItems || [];
  await api('/admin/lessons/' + window.__gtmCtx.lessonId + '/grammar-task-items', {
    method: 'PUT',
    body: JSON.stringify({ items: arr.map((x, k) => ({
      grammarId: x.grammar_id, sortOrder: k,
      instruction: x.instruction || null,
      requiredCount: x.required_count || 1,
    })) }),
  });
}

window.gtmSetInstruction = async (grammarId, value) => {
  const it = (window.__gtmItems || []).find((x) => x.grammar_id === grammarId);
  if (it) it.instruction = value;
  try { await gtmSave(); } catch (err) { notify('Gagal simpan instruksi: ' + err.message, true); }
};

window.gtmSetCount = async (grammarId, value) => {
  const it = (window.__gtmItems || []).find((x) => x.grammar_id === grammarId);
  const n = Math.min(10, Math.max(1, Number(value) || 1));
  if (it) it.required_count = n;
  try { await gtmSave(); gtmRefreshList(); } catch (err) { notify('Gagal simpan jumlah: ' + err.message, true); }
};

window.gtmAdd = async (grammarId) => {
  const g = (window.__gtmBank || []).find((x) => x.id === grammarId);
  if (!g) return;
  window.__gtmItems = window.__gtmItems || [];
  window.__gtmItems.push({ grammar_id: g.id, pattern: g.pattern, meaning: g.meaning, example: g.example, instruction: '', required_count: 1, sort_order: window.__gtmItems.length });
  gtmRerender();
  try { await gtmSave(); notify('Ditambahkan'); gtmRefreshList(); }
  catch (err) { notify('Gagal: ' + err.message, true); }
};

window.gtmRemove = async (grammarId) => {
  try {
    await api('/admin/lessons/' + window.__gtmCtx.lessonId + '/grammar-task-items/' + grammarId, { method: 'DELETE' });
    window.__gtmItems = (window.__gtmItems || []).filter((x) => x.grammar_id !== grammarId);
    gtmRerender(); notify('Dikeluarkan'); gtmRefreshList();
  } catch (err) { notify('Gagal: ' + err.message, true); }
};

window.gtmMove = async (grammarId, dir) => {
  const arr = window.__gtmItems || [];
  const i = arr.findIndex((x) => x.grammar_id === grammarId);
  const j = i + dir;
  if (i < 0 || j < 0 || j >= arr.length) return;
  const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
  arr.forEach((x, k) => { x.sort_order = k; });
  gtmRerender();
  try { await gtmSave(); gtmRefreshList(); }
  catch (err) { notify('Gagal urut: ' + err.message, true); }
};

window.gtmSavePrompt = async () => {
  const ta = document.getElementById('gtm-prompt');
  if (!ta) return;
  try {
    await api('/admin/settings/grammar-eval-prompt', { method: 'PUT', body: JSON.stringify({ value: ta.value }) });
    notify('Prompt disimpan');
  } catch (err) { notify('Gagal simpan prompt: ' + err.message, true); }
};

// DECK ("deck" lesson type) MANAGER
// ─────────────────────────────────────────────────────────────
function deckRefreshList() {
  if (STATE.selectedCourse) loadModulesForCourse(STATE.selectedCourse).then(() => {
    if (STATE.tab === 'lessons') renderLessons();
  });
}

function renderDeckTable(items) {
  if (!items || items.length === 0) {
    return '<div class="empty" style="padding:20px;">Belum ada kosakata di deck ini. Tambah dari bank atau buat kata baru.</div>';
  }
  const rows = items.map((it) => {
    return `
    <tr data-deck-vid="${it.vocabulary_id}">
      <td lang="ja" style="font-size:17px;">${escapeHtml(it.japanese || '')}</td>
      <td lang="ja">${escapeHtml(it.reading || '')}</td>
      <td>${escapeHtml(it.romaji || '')}</td>
      <td>${escapeHtml(it.indonesian || '')}</td>
      <td>${escapeHtml(it.category || '')}</td>
      <td><input value="${escapeHtml(it.accent_color || '')}" placeholder="#C8102E" style="width:88px;font-size:11px;" onchange="deckSetColor('${it.vocabulary_id}', this.value)" /></td>
      <td style="white-space:nowrap;">
        <button class="btn btn-ghost" onclick="deckMove('${it.vocabulary_id}', -1)">↑</button>
        <button class="btn btn-ghost" onclick="deckMove('${it.vocabulary_id}', 1)">↓</button>
      </td>
      <td class="actions" style="white-space:nowrap;">
        <button class="btn btn-ghost" onclick="deckManageExamples('${it.vocabulary_id}')">Contoh (${it.example_count || 0})</button>

  }).join('');
  return `<table style="font-size:13px;">
    <thead><tr><th>日本語</th><th>Kana</th><th>Romaji</th><th>Arti</th><th>Kategori</th><th>Warna</th><th>Urut</th><th></th></tr></thead>
    <tbody id="deck-body">${rows}</tbody></table>`;
}

function deckRerender() {
  const wrap = document.getElementById('deck-wrap');
  if (wrap) wrap.innerHTML = renderDeckTable(window.__deckItems || []);
  const c = document.getElementById('deck-count');
  if (c) c.textContent = (window.__deckItems || []).length + ' item';
}

async function openDeckManager(lessonId, lessonTitle, moduleId, courseId) {
  let items = [];
  try {
    const d = await api('/admin/lessons/' + lessonId + '/deck-items');
    items = d.items || [];
  } catch (err) { notify('Gagal load deck: ' + err.message, true); return; }

    <div class="toolbar">
      <button type="button" class="btn btn-primary" onclick="deckImportBab()">↻ Import Bab dari Notion</button>
      <button type="button" class="btn btn-ghost" onclick="deckShowNewWord()">+ Kata baru</button>
      <button type="button" class="btn btn-ghost" onclick="deckShowBank()">+ Dari bank</button>
      <button type="button" class="btn btn-ghost" onclick="deckOpenBulk()">Paste dari Excel (TSV)</button>
      <span id="deck-count" style="font-size:12px;color:#737373;font-family:var(--font-body);">${items.length} item</span>
    </div>
    <div id="deck-panel"></div>
    <div id="deck-wrap" style="overflow-x:auto;">${renderDeckTable(items)}</div>
    <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">Tutup</button></div>

  modalContent.style.maxWidth = '1100px';
}
window.manageDeck = (lessonId, lessonTitle, moduleId, courseId) => openDeckManager(lessonId, lessonTitle, moduleId, courseId);

window.deckMove = async (vid, dir) => {
  const arr = window.__deckItems || [];
  const i = arr.findIndex((x) => x.vocabulary_id === vid);
  const j = i + dir;
  if (i < 0 || j < 0 || j >= arr.length) return;
  const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
  arr.forEach((x, k) => { x.sort_order = k; });
  deckRerender();
  try {
    await api('/admin/lessons/' + window.__deckCtx.lessonId + '/deck-items', {
      method: 'PUT',
      body: JSON.stringify({ items: arr.map((x, k) => ({ vocabularyId: x.vocabulary_id, sortOrder: k, accentColor: x.accent_color || null })) }),
    });
    deckRefreshList();
  } catch (err) { notify('Gagal urut: ' + err.message, true); }
};

window.deckSetColor = async (vid, val) => {
  const it = (window.__deckItems || []).find((x) => x.vocabulary_id === vid);
  const color = (val || '').trim() || null;
  if (it) it.accent_color = color;
  try {
    await api('/admin/lessons/' + window.__deckCtx.lessonId + '/deck-items', {
      method: 'POST',
      body: JSON.stringify({ vocabularyId: vid, sortOrder: it ? it.sort_order : 0, accentColor: color }),
    });
  } catch (err) { notify('Gagal simpan warna: ' + err.message, true); }
};

window.deckRemove = async (vid) => {

// ── TTS preview (ElevenLabs → Web Speech fallback) ──
// Teks tersimpan ada di whitelist /api/tts (vocabulary_examples) → suara
// ElevenLabs. Draft yang belum disimpan kena 403 → fallback Web Speech browser.
let _adminTtsAudio = null;
let _adminTtsVersion = '';
let _adminTtsVersionFetched = false;
async function _adminInitTtsVersion() {
  if (_adminTtsVersionFetched) return;
  _adminTtsVersionFetched = true;
  try { const r = await fetch('/api/tts/version'); if (r.ok) { const d = await r.json(); _adminTtsVersion = String(d.version || ''); } }
  catch {}
}
_adminInitTtsVersion();
function _adminTtsUrl(text) {
  const base = '/api/tts?text=' + encodeURIComponent(text);
  return _adminTtsVersion ? base + '&v=' + encodeURIComponent(_adminTtsVersion) : base;
}
function _adminSpeakJa(text, btn) {
  if (!('speechSynthesis' in window)) { notify('Browser tidak mendukung audio TTS', true); if (btn) btn.classList.remove('playing'); return; }
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ja-JP';
  u.rate = 0.9;
  u.onend = () => { if (btn) btn.classList.remove('playing'); };
  u.onerror = () => { if (btn) btn.classList.remove('playing'); };
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}
function adminPlayTts(text, btn) {
  const plain = String(text || '').replace(/<[^>]*>/g, '').trim();
  if (!plain) { notify('Isi kalimat dulu', true); return; }
  if (_adminTtsAudio) { try { _adminTtsAudio.pause(); _adminTtsAudio.src = ''; } catch {} _adminTtsAudio = null; }
  if (window.speechSynthesis) speechSynthesis.cancel();
  document.querySelectorAll('.tts-preview.playing').forEach((b) => b.classList.remove('playing'));
  if (btn) btn.classList.add('playing');
  let started = false, fellBack = false;
  const stop = () => { if (btn) btn.classList.remove('playing'); };
  const fallback = () => { if (started || fellBack) return; fellBack = true; _adminSpeakJa(plain, btn); };
  try {
    const a = new Audio(_adminTtsUrl(plain));
    _adminTtsAudio = a;
    a.onplaying = () => { started = true; };
    a.onended = () => { stop(); if (_adminTtsAudio === a) _adminTtsAudio = null; };
    a.onerror = () => fallback();
    const p = a.play();
    if (p && typeof p.then === 'function') p.then(() => { started = true; }).catch(() => fallback());
  } catch { fallback(); }
}
window.adminPlayTts = adminPlayTts;

// IG-style crop modal: drag to pan, wheel/slider to zoom. Output is always
// cropped to 4:3 (1200x900 JPEG) so the landing page just displays the image
// as-is. The photo_position DB column stays for backward compat with older
// uploads — new crops send position='' so the image renders centered.
function openCropModal({ imageSrc, onConfirm, onCancel }) {
  const OUT_W = 1200, OUT_H = 900;          // output canvas size (4:3)
  let FRAME_W = 480, FRAME_H = 360;         // measured from DOM after mount

  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,0.85);display:flex;align-items:center;justify-content:center;padding:16px;font-family:var(--font-body);';
  overlay.innerHTML = `
    <div style="background:#1a1a1a;padding:20px;border-radius:12px;max-width:540px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,0.5);">
      <h3 style="color:#fff;margin:0 0 4px;font-size:16px;">Atur posisi & zoom foto</h3>
      <p style="color:#888;margin:0 0 14px;font-size:12px;">Geser untuk ubah posisi, scroll/slider untuk zoom. Area kotak yang disimpan.</p>
      <div data-crop-box style="position:relative;width:480px;max-width:100%;aspect-ratio:4/3;overflow:hidden;background:#000;margin:0 auto;cursor:grab;touch-action:none;border-radius:8px;user-select:none;">
        <img data-crop-img alt="" style="position:absolute;top:0;left:0;transform-origin:0 0;user-select:none;-webkit-user-drag:none;pointer-events:none;max-width:none;" />
      </div>
      <div style="margin:14px 0;display:flex;align-items:center;gap:10px;">
        <span style="font-size:11px;color:#888;">Zoom</span>
        <input data-crop-zoom type="range" min="1" max="4" step="0.01" value="1" style="flex:1;accent-color:#a78bfa;" />
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end;">
        <button data-crop-cancel type="button" style="padding:8px 16px;background:transparent;color:#ccc;border:1px solid #333;border-radius:6px;cursor:pointer;font-size:13px;">Batal</button>
        <button data-crop-confirm type="button" style="padding:8px 18px;background:#7c3aed;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600;" disabled>Gunakan</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);

  const box     = overlay.querySelector('[data-crop-box]');
  const img     = overlay.querySelector('[data-crop-img]');
  const zoomIn  = overlay.querySelector('[data-crop-zoom]');
  const confirm = overlay.querySelector('[data-crop-confirm]');
  const cancel  = overlay.querySelector('[data-crop-cancel]');

  let natW = 0, natH = 0;
  let minScale = 1, scale = 1;
  let tx = 0, ty = 0;

  function apply() {
    img.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`;
  }
  function clamp() {
    const w = natW * scale, h = natH * scale;
    tx = Math.min(0, Math.max(FRAME_W - w, tx));
    ty = Math.min(0, Math.max(FRAME_H - h, ty));
  }

  function measure() {
    const r = box.getBoundingClientRect();
    FRAME_W = r.width;
    FRAME_H = r.height;
  }

  img.addEventListener('load', () => {
    natW = img.naturalWidth;
    natH = img.naturalHeight;
    measure();
    minScale = Math.max(FRAME_W / natW, FRAME_H / natH);
    scale = minScale;
    zoomIn.min = String(minScale);
    zoomIn.max = String(minScale * 4);
    zoomIn.value = String(minScale);
    tx = (FRAME_W - natW * scale) / 2;
    ty = (FRAME_H - natH * scale) / 2;
    clamp(); apply();
    confirm.disabled = false;
  });
  window.addEventListener('resize', () => {
    if (!natW) return;
    measure();
    minScale = Math.max(FRAME_W / natW, FRAME_H / natH);
    if (scale < minScale) scale = minScale;
    zoomIn.min = String(minScale);
    zoomIn.max = String(minScale * 4);
    clamp(); apply();
  });
  img.addEventListener('error', () => {
    confirm.disabled = true;
    overlay.querySelector('[data-crop-box]').innerHTML = '<div style="color:#ccc;padding:40px;text-align:center;font-size:13px;">Gagal memuat gambar.</div>';
  });
  // Only mark crossOrigin when loading from a different origin (for recrop).
  try {
    const u = new URL(imageSrc, location.href);
    if (u.origin !== location.origin) img.crossOrigin = 'anonymous';
  } catch {}
  img.src = imageSrc;

  // pan via pointer
  let dragging = false, sx = 0, sy = 0, otx = 0, oty = 0;
  box.addEventListener('pointerdown', (e) => {
    dragging = true;
    box.setPointerCapture(e.pointerId);
    box.style.cursor = 'grabbing';
    sx = e.clientX; sy = e.clientY; otx = tx; oty = ty;
  });
  box.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    tx = otx + (e.clientX - sx);
    ty = oty + (e.clientY - sy);
    clamp(); apply();
  });
  const endPan = (e) => {
    if (!dragging) return;
    dragging = false;
    try { box.releasePointerCapture(e.pointerId); } catch {}
    box.style.cursor = 'grab';
  };
  box.addEventListener('pointerup', endPan);
  box.addEventListener('pointercancel', endPan);

  // zoom via slider
  zoomIn.addEventListener('input', () => {
    const ns = parseFloat(zoomIn.value);
    const cx = FRAME_W / 2, cy = FRAME_H / 2;
    const ipx = (cx - tx) / scale, ipy = (cy - ty) / scale;
    scale = ns;
    tx = cx - ipx * scale;
    ty = cy - ipy * scale;
    clamp(); apply();
  });

  // zoom via wheel
  box.addEventListener('wheel', (e) => {
    e.preventDefault();
    const factor = Math.exp(-e.deltaY * 0.0015);
    const ns = Math.max(minScale, Math.min(minScale * 4, scale * factor));
    const rect = box.getBoundingClientRect();
    const px = e.clientX - rect.left, py = e.clientY - rect.top;
    const ipx = (px - tx) / scale, ipy = (py - ty) / scale;
    scale = ns;
    tx = px - ipx * scale;
    ty = py - ipy * scale;
    clamp(); apply();
    zoomIn.value = String(scale);
  }, { passive: false });

  function cleanup() { overlay.remove(); }

  cancel.addEventListener('click', () => { cleanup(); onCancel && onCancel(); });

  confirm.addEventListener('click', () => {
    const canvas = document.createElement('canvas');
    canvas.width = OUT_W; canvas.height = OUT_H;
    const ctx = canvas.getContext('2d');
    // crop box in image coords
    const sX = -tx / scale;
    const sY = -ty / scale;
    const sW = FRAME_W / scale;
    const sH = FRAME_H / scale;
    try {
      ctx.drawImage(img, sX, sY, sW, sH, 0, 0, OUT_W, OUT_H);
      canvas.toBlob((blob) => {
        if (!blob) { notify('Gagal buat foto (mungkin CORS)', true); return; }
        cleanup();
        onConfirm(blob);
      }, 'image/jpeg', 0.92);
    } catch (err) {
      notify('Gagal crop: ' + err.message, true);
    }
  });
}

function photoFieldHtml(currentUrl, inputName, currentPosition = '', positionInputName = 'photoPosition') {
  const pos = currentPosition || '';
  // Older photos may still have a legacy photo_position; honor it in the preview
  // until the admin recrops. New crops always produce centered 4:3 output.
  const previewStyle = `width:180px;aspect-ratio:4/3;border-radius:8px;border:1px solid #e5e5e5;object-fit:cover;object-position:${escapeHtml(pos || 'center')};display:block;`;
  const preview = currentUrl
    ? `<img src="${escapeHtml(currentUrl)}" alt="" style="${previewStyle}" data-photo-preview-img />`
    : `<div data-photo-empty style="width:180px;aspect-ratio:4/3;border-radius:8px;border:1px dashed #d4d4d4;background:#fafafa;display:flex;align-items:center;justify-content:center;color:#999;font-size:12px;">belum ada foto</div>`;
  return `
    <div class="field" data-photo-field>
      <label>Foto</label>
      <div style="display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;">
        <div data-photo-preview>${preview}</div>
        <div style="flex:1;min-width:200px;">
          <input type="hidden" name="${inputName}" value="${escapeHtml(currentUrl || '')}" data-photo-url />
          <input type="hidden" name="${positionInputName}" value="${escapeHtml(pos)}" data-photo-position />
          <input type="file" accept="image/*" data-photo-file style="display:none;" />
          <div style="display:flex;gap:6px;flex-wrap:wrap;">
            <button type="button" class="btn btn-ghost" data-photo-pick style="font-size:12px;padding:6px 12px;">${currentUrl ? 'Ganti foto' : '+ Pilih foto'}</button>
            <button type="button" class="btn btn-ghost" data-photo-recrop style="font-size:12px;padding:6px 12px;${currentUrl ? '' : 'display:none;'}">Crop ulang</button>
          </div>
          <div style="font-size:12px;color:#999;margin-top:6px;" data-photo-status>JPG/PNG/WEBP · max 5MB · otomatis di-crop 4:3.</div>
        </div>
      </div>
    </div>
  `;
}

function attachPhotoUploaders(formEl) {
  formEl.querySelectorAll('[data-photo-field]').forEach((field) => {
    const fileInput = field.querySelector('[data-photo-file]');
    const urlInput  = field.querySelector('[data-photo-url]');
    const posInput  = field.querySelector('[data-photo-position]');
    const status    = field.querySelector('[data-photo-status]');
    const preview   = field.querySelector('[data-photo-preview]');
    const pickBtn   = field.querySelector('[data-photo-pick]');
    const recropBtn = field.querySelector('[data-photo-recrop]');

    const previewStyle = 'width:180px;aspect-ratio:4/3;border-radius:8px;border:1px solid #e5e5e5;object-fit:cover;object-position:center;display:block;';

    async function uploadCroppedBlob(blob) {
      status.textContent = 'Mengunggah...';
      status.style.color = '#999';
      try {
        const file = new File([blob], 'photo.jpg', { type: 'image/jpeg' });
        const url = await uploadImageFile(file);
        urlInput.value = url;
        posInput.value = ''; // crop sudah absolut — position tidak diperlukan
        preview.innerHTML = `<img src="${url}" alt="" style="${previewStyle}" data-photo-preview-img />`;
        pickBtn.textContent = 'Ganti foto';
        if (recropBtn) recropBtn.style.display = '';
        status.textContent = '✓ Foto siap disimpan.';
        status.style.color = '#16a34a';
      } catch (err) {
        status.textContent = '✗ Gagal unggah: ' + err.message;
        status.style.color = '#dc2626';
      }
    }

    if (pickBtn) {
      pickBtn.addEventListener('click', () => fileInput && fileInput.click());
    }
    if (recropBtn) {
      recropBtn.addEventListener('click', () => {
        if (!urlInput.value) return;
        openCropModal({
          imageSrc: urlInput.value,
          onConfirm: (blob) => uploadCroppedBlob(blob),
          onCancel: () => {},
        });
      });
    }
    if (fileInput) {
      fileInput.addEventListener('change', () => {
        const file = fileInput.files?.[0];
        if (!file) return;
        const src = URL.createObjectURL(file);
        openCropModal({
          imageSrc: src,
          onConfirm: async (blob) => {
            URL.revokeObjectURL(src);
            await uploadCroppedBlob(blob);
            fileInput.value = '';
          },
          onCancel: () => {
            URL.revokeObjectURL(src);
            fileInput.value = '';
          },
        });
      });
    }
  });
}

    await api('/discussions/' + id, { method: 'DELETE' });
    await loadDiscussions(); renderDiscussions();
    notify('Komentar dihapus');
  } catch (err) { notify('Gagal hapus: ' + err.message, true); }
};

// ─────────────────────────────────────────────────────────────
// KANJI — per-pelajaran manager (lessons.type = 'kanji'). Pola
// mirror "Kelola Deck": tombol di daftar pelajaran → modal manager
// dengan list kanji untuk pelajaran tsb, form add/edit, import Notion.
// ─────────────────────────────────────────────────────────────
const KANJI_LEVELS = ['N5', 'N4', 'N3', 'N2', 'N1'];
const KANJI_ADMIN_MODAL_WIDTH = '1100px';

function openKanjiModal(html) {
  openModal(html, { className: 'kanji-admin-modal' });
  modalContent.style.maxWidth = KANJI_ADMIN_MODAL_WIDTH;
}

window.manageKanji = (lessonId, lessonTitle, moduleId, courseId) => {
  openKanjiManager({ lessonId, lessonTitle, moduleId, courseId });
};

async function openKanjiManager(ctx) {
  let items = [];
  try {
    const d = await api(`/admin/lessons/${ctx.lessonId}/kanji`);
    items = d.kanji || [];
  } catch (err) {
    notify('Gagal load kanji pelajaran: ' + err.message, true);
  }
  renderKanjiManager(ctx, items);
}

function renderKanjiManager(ctx, items) {
  const titleEsc = escapeHtml(ctx.lessonTitle).replace(/'/g, '&#39;');
  const rows = items.map((k) => `
    <tr>
      <td style="font-family:'Noto Sans JP',sans-serif;font-size:28px;font-weight:700;line-height:1;text-align:center;width:60px;">${escapeHtml(k.character)}</td>
      <td><span class="pill">${escapeHtml(k.jlpt_level)}</span></td>
      <td style="font-family:'Noto Sans JP',sans-serif;">${escapeHtml(k.on_reading || '-')}</td>
      <td style="font-family:'Noto Sans JP',sans-serif;">${escapeHtml(k.kun_reading || '-')}</td>
      <td>${escapeHtml(k.meaning_id || '-')}</td>
      <td style="max-width:220px;font-size:12px;color:#555;">${escapeHtml((k.mnemonic || '').replace(/<[^>]*>/g, '').slice(0, 90))}${(k.mnemonic || '').length > 90 ? '…' : ''}</td>
      <td>${Array.isArray(k.compounds) && k.compounds.length ? k.compounds.length : '-'}</td>
      <td>${k.stroke_count || '-'}</td>
      <td class="actions">
        <button class="btn btn-ghost" onclick='editKanjiItem("${k.id}")'>Edit</button>
        <button class="btn btn-danger" onclick='deleteKanjiItem("${k.id}", "${escapeHtml(k.character).replace(/"/g, '&quot;')}")'>Hapus</button>
      </td>
    </tr>
  `).join('');
  openKanjiModal(`
    <h3>Kelola Kanji — ${escapeHtml(ctx.lessonTitle)}</h3>
    <p style="margin-top:-6px;color:var(--ink-500);font-size:13px;">
      Kanji yang ditambahkan di sini akan tampil sebagai pelajaran tipe Kanji di
      dashboard siswa, plus ke-aggregate ke "📝 Daftar Kanji" sidebar.
    </p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 16px;">
      <button class="btn btn-primary" onclick='openKanjiItemForm(null)'>+ Kanji</button>
      <button class="btn btn-ghost" onclick="openKanjiNotionImport()" title="Import dari Notion DB Kanji (per Bab)">↻ Import Notion</button>
    </div>
    ${items.length === 0
      ? '<div class="empty">Pelajaran ini belum punya kanji. Klik <strong>+ Kanji</strong> atau import dari Notion.</div>'
      : `<div style="overflow-x:auto;"><table><thead><tr>
          <th>Karakter</th><th>Level</th><th>On</th><th>Kun</th><th>Arti</th>
          <th>Mnemonic</th><th>Kombinasi</th><th>Goresan</th><th></th>
        </tr></thead><tbody>${rows}</tbody></table></div>`}
    <div class="modal-actions" style="margin-top:16px;"><button class="btn btn-ghost" onclick="closeModal()">Tutup</button></div>
  `);
  STATE.kanjiManagerCtx = ctx;
  STATE.kanjiManagerItems = items;
}

function kanjiCompoundRowHtml(item) {
  const c = item || {};
  return `
    <tr>
      <td><input name="compoundJapanese" value="${escapeHtml(c.japanese || '')}" lang="ja" placeholder="日本語" style="font-family:'Noto Sans JP',sans-serif;" /></td>
      <td><input name="compoundReading" value="${escapeHtml(c.reading || '')}" lang="ja" placeholder="にほんご" style="font-family:'Noto Sans JP',sans-serif;" /></td>
      <td><input name="compoundIndonesian" value="${escapeHtml(c.indonesian || '')}" placeholder="bahasa Jepang" /></td>
      <td class="actions"><button type="button" class="btn btn-danger" onclick="removeKanjiCompoundRow(this)">×</button></td>
    </tr>`;
}

window.addKanjiCompoundRow = () => {
  const tbody = document.getElementById('kanji-compounds-body');
  if (tbody) tbody.appendChild(el(kanjiCompoundRowHtml({})));
};

window.removeKanjiCompoundRow = (btn) => {
  const tr = btn && btn.closest('tr');
  if (tr) tr.remove();
};

function collectKanjiCompounds(form) {
  return Array.from(form.querySelectorAll('#kanji-compounds-body tr')).map((tr) => ({
    japanese: (tr.querySelector('input[name="compoundJapanese"]')?.value || '').trim(),
    reading: (tr.querySelector('input[name="compoundReading"]')?.value || '').trim(),
    indonesian: (tr.querySelector('input[name="compoundIndonesian"]')?.value || '').trim(),
  })).filter((c) => c.japanese || c.reading || c.indonesian);
}

window.openKanjiItemForm = (id) => {
  const ctx = STATE.kanjiManagerCtx;
  if (!ctx) return;
  const items = STATE.kanjiManagerItems || [];
  const k = id ? items.find((x) => x.id === id) : null;
  const isNew = !k;
  // Default level: derive dari course slug kalau bisa (e.g. courseId/slug n5
  // → N5). Untuk simplenya, fallback ke N5.
  const defaultLevel = (ctx.courseId && KANJI_LEVELS.find((lv) =>
    String(ctx.courseId).toUpperCase().includes(lv)
  )) || 'N5';
  const v = k || {
    character: '', jlpt_level: defaultLevel,
    on_reading: '', kun_reading: '', meaning_id: '',
    mnemonic: '', compounds: [], stroke_count: '', bab_kode: '', sort_order: items.length,
  };
  const compoundRows = (Array.isArray(v.compounds) && v.compounds.length ? v.compounds : [{}])
    .map(kanjiCompoundRowHtml)
    .join('');
  const levelOptions = KANJI_LEVELS.map((lv) =>
    `<option value="${lv}" ${v.jlpt_level === lv ? 'selected' : ''}>${lv}</option>`
  ).join('');
  openKanjiModal(`
    <h3>${isNew ? 'Kanji Baru' : 'Edit Kanji'}</h3>
    <form id="kanji-item-form">
      <div class="field-row">
        <div class="field"><label>Karakter (1 huruf)</label>
          <input name="character" value="${escapeHtml(v.character)}" maxlength="2" required
            lang="ja" style="font-family:'Noto Sans JP',sans-serif;font-size:32px;font-weight:700;text-align:center;" />
        </div>
        <div class="field"><label>Level JLPT</label>
          <select name="jlptLevel">${levelOptions}</select>
        </div>
        <div class="field"><label>Goresan</label>
          <input type="number" name="strokeCount" min="1" max="40" value="${v.stroke_count ?? ''}" placeholder="otomatis dari KanjiVG" />
        </div>
      </div>
      <div class="field-row">
        <div class="field"><label>On'yomi (音読み)</label>
          <input name="onReading" value="${escapeHtml(v.on_reading || '')}" lang="ja"
            style="font-family:'Noto Sans JP',sans-serif;" placeholder="contoh: イチ・イツ" />
        </div>
        <div class="field"><label>Kun'yomi (訓読み)</label>
          <input name="kunReading" value="${escapeHtml(v.kun_reading || '')}" lang="ja"
            style="font-family:'Noto Sans JP',sans-serif;" placeholder="contoh: ひと-" />
        </div>
      </div>
      <div class="field"><label>Arti (Bahasa Indonesia)</label>
        <input name="meaningId" value="${escapeHtml(v.meaning_id || '')}" placeholder="contoh: Satu" />
      </div>
      <div class="field"><label>Mnemonic / cara ingat</label>
        <textarea name="mnemonic" class="rich-text" rows="3"
          placeholder="contoh: 一 = satu garis horizontal, gampang inget angka 1">${escapeHtml(v.mnemonic || '')}</textarea>
      </div>
      <div class="field">
        <label>Kombinasi kosakata</label>
        <div style="overflow-x:auto;">
          <table style="font-size:12px;">
            <thead><tr><th>Kanji / kata</th><th>Kana</th><th>Arti Bahasa Indonesia</th><th></th></tr></thead>
            <tbody id="kanji-compounds-body">${compoundRows}</tbody>
          </table>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;flex-wrap:wrap;">
          <span style="font-size:11px;color:var(--ink-500);">Contoh: 日本語 · にほんご · bahasa Jepang.</span>
          <button type="button" class="btn btn-ghost" onclick="addKanjiCompoundRow()">+ Tambah kombinasi</button>
        </div>
      </div>
      <div class="field-row">
        <div class="field"><label>Kode Bab (opsional)</label>
          <input name="babKode" value="${escapeHtml(v.bab_kode || '')}" placeholder="contoh: N5-01" />
        </div>
        <div class="field"><label>Urutan</label>
          <input type="number" name="sortOrder" value="${v.sort_order || 0}" />
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" onclick="openKanjiManager(STATE.kanjiManagerCtx)">← Kembali</button>
        <button type="submit" class="btn btn-primary">Simpan</button>
      </div>
    </form>
  `);
  const form = document.getElementById('kanji-item-form');
  wireRichToolbarAll(form);
  form.addEventListener('submit', (e) => submitKanjiItem(e, id));
};

window.editKanjiItem = (id) => openKanjiItemForm(id);

async function submitKanjiItem(e, id) {
  e.preventDefault();
  const form = e.target;
  const ctx = STATE.kanjiManagerCtx;
  const body = {
    lessonId: ctx?.lessonId || null,
    character: form.character.value.trim(),
    jlptLevel: form.jlptLevel.value,
    onReading: form.onReading.value.trim() || null,
    kunReading: form.kunReading.value.trim() || null,
    meaningId: form.meaningId.value.trim() || null,
    mnemonic: form.mnemonic.value.trim() || null,
    compounds: collectKanjiCompounds(form),
    strokeCount: form.strokeCount.value === '' ? null : Number(form.strokeCount.value),
    babKode: form.babKode.value.trim() || null,
    sortOrder: Number(form.sortOrder.value) || 0,
  };
  try {
    if (id) await api('/admin/kanji/' + id, { method: 'PUT', body: JSON.stringify(body) });
    else await api('/admin/kanji', { method: 'POST', body: JSON.stringify(body) });
    notify('Kanji tersimpan');
    openKanjiManager(ctx);
  } catch (err) { notify('Gagal simpan: ' + err.message, true); }
}

window.deleteKanjiItem = async (id, character) => {
  if (!confirm(`Hapus kanji ${character} dari pelajaran ini?`)) return;
  try {
    await api('/admin/kanji/' + id, { method: 'DELETE' });
    notify('Kanji dihapus');
    openKanjiManager(STATE.kanjiManagerCtx);
  } catch (err) { notify('Gagal hapus: ' + err.message, true); }
};

window.openKanjiNotionImport = async () => {
  const ctx = STATE.kanjiManagerCtx;
  if (!ctx) return;
  let bab = [];
  try { const d = await api('/admin/notion-bab'); bab = d.bab || []; }
  catch (err) { notify('Gagal load daftar Bab: ' + err.message, true); return; }
  if (bab.length === 0) {
    notify('Belum ada Bab di Notion. Set NOTION_TOKEN + NOTION_BAB_DB_ID di backend/.env.', true);
    return;
  }
  const defaultLevel = (ctx.courseId && KANJI_LEVELS.find((lv) =>
    String(ctx.courseId).toUpperCase().includes(lv)
  )) || 'N5';
  const levelOptions = KANJI_LEVELS.map((lv) =>
    `<option value="${lv}" ${defaultLevel === lv ? 'selected' : ''}>${lv}</option>`
  ).join('');
  const babOptions = bab.map((b) =>
    `<option value="${b.id}">${escapeHtml(b.kode || '')}${b.kode ? ' · ' : ''}${escapeHtml(b.name)}</option>`
  ).join('');
  // Remember last DB ID/URL admin pakai supaya ga ngetik ulang tiap import.
  const lastKanjiDb = localStorage.getItem('ez_admin_kanji_notion_db') || '';
  openKanjiModal(`
    <h3>Import Kanji dari Notion — ${escapeHtml(ctx.lessonTitle)}</h3>
    <p style="color:var(--ink-500);font-size:13px;margin-top:-4px;">
      Tarik karakter + reading + meaning + mnemonic dari Notion DB Kanji
      yang ter-link ke Bab terpilih, langsung masuk ke pelajaran ini.
      Existing kanji (match by character + level) di-update; baru di-insert.
    </p>
    <form id="kanji-import-form">
      <div class="field">
        <label>URL / ID Notion DB Kanji</label>
        <input name="notionKanjiDbId" value="${escapeHtml(lastKanjiDb)}"
          placeholder="https://www.notion.so/xxxxx?v=… atau 32-char ID"
          style="font-family:var(--font-mono);font-size:12px;" />
        <div style="font-size:11px;color:var(--ink-500);margin-top:4px;line-height:1.55;">
          <strong>Cara dapetin URL:</strong> buka DB Kanji di Notion → klik tombol "Share" pojok kanan atas → "Copy link" → paste di sini.<br>
          Pastikan integration Notion-mu sudah di-share ke DB ini (Share → Add connections → pilih integration).<br>
          Boleh kosong <em>kalau</em> env <code>NOTION_KANJI_DB_ID</code> udah di-set di server.
        </div>
      </div>
      <div class="field-row">
        <div class="field"><label>Level JLPT</label>
          <select name="jlptLevel">${levelOptions}</select>
        </div>
      </div>
      <div class="field"><label>Bab (filter)</label>
        <select name="babPageId" required>
          ${babOptions}
          <option value="all">— Atau: import semua row di DB —</option>
        </select>
        <div style="font-size:11px;color:var(--ink-500);margin-top:4px;line-height:1.55;">
          Pilih Bab → backend filter via relation <code>First Lesson</code> di
          DB Kanji (cuma kanji yang First Lesson = Bab terpilih yang di-import).
          Pilih "Atau: import semua" cuma kalau DB Kanji-mu standalone (tanpa
          relation ke Bab).
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" onclick="openKanjiManager(STATE.kanjiManagerCtx)">← Kembali</button>
        <button type="submit" class="btn btn-primary">Import</button>
      </div>
    </form>
  `);
  document.getElementById('kanji-import-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const f = e.target;
    const btn = f.querySelector('button[type=submit]');
    const dbId = (f.notionKanjiDbId && f.notionKanjiDbId.value.trim()) || '';
    // Validasi client: kalau field kosong + env juga belum di-set, kasih pesan
    // yang langsung action-able (bukan kode error "notion_db_required").
    if (!dbId) {
      const proceed = confirm(
        'Field URL/ID Notion DB Kanji kosong.\n\n' +
        'Klik OK untuk tetap coba (kalau env NOTION_KANJI_DB_ID sudah di-set di server),\n' +
        'atau Batal untuk paste URL DB dulu (Notion → DB Kanji → Share → copy link).'
      );
      if (!proceed) { f.notionKanjiDbId?.focus(); return; }
    }
    btn.disabled = true; btn.textContent = 'Importing…';
    if (dbId) localStorage.setItem('ez_admin_kanji_notion_db', dbId);
    try {
      const r = await api(`/admin/lessons/${ctx.lessonId}/import-notion-kanji-bab`, {
        method: 'POST',
        body: JSON.stringify({
          babPageId: f.babPageId.value,
          jlptLevel: f.jlptLevel.value,
          notionKanjiDbId: dbId || undefined,
        }),
      });
      if (r.imported === 0 && r.updated === 0) {
        // Tampilkan diagnostic kalau ada — supaya admin tau properti DB
        // Notion mana yg perlu di-rename biar match.
        const diag = r.diagnostic || {};
        const props = (diag.notionPropertyNames || []).join(', ');
        const detail = [
          `Pages di-scan: ${r.notionPagesScanned ?? 0}.`,
          r.matchedRelationProp ? `Match relation: "${r.matchedRelationProp}".` : '',
          r.usedFallbackUnfiltered ? 'Filter Bab gagal — pakai unfiltered.' : '',
          diag.hint || '',
          props ? `Properti di Notion: ${props}.` : '',
        ].filter(Boolean).join(' ');
        notify(`Import tidak menyimpan apa-apa. ${detail}`, true);
        btn.disabled = false; btn.textContent = 'Import';
        return;
      }
      let warning = '';
      if (r.usedFallbackUnfiltered) {
        warning = ' (filter gagal — import semua row di DB)';
      } else if (r.matchedRelationProp) {
        warning = ` (relation: "${r.matchedRelationProp}")`;
      } else if (r.matchedLevelProp) {
        warning = ` (filter level: "${r.matchedLevelProp}")`;
      }
      notify(`Import selesai: ${r.imported} baru, ${r.updated} di-update (total ${r.total} dari ${r.notionPagesScanned} pages)${warning}.`);
      openKanjiManager(ctx);
    } catch (err) {
      notify('Import gagal: ' + err.message, true);
      btn.disabled = false; btn.textContent = 'Import';
    }
  });
};
</script>
