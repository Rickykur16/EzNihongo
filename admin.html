<script>
// ─────────────────────────────────────────────────────────────
// Bootstrapping & auth
// ─────────────────────────────────────────────────────────────
const root = document.getElementById('root');
const modal = document.getElementById('modal');
const modalContent = document.getElementById('modal-content');

let CURRENT_USER = null;
let STATE = {
  tab: 'courses',
  courses: [],
  selectedCourse: null,
  modules: [],
  selectedModule: null,
  lessons: [],
  users: [],
  discussions: [],
};

function el(html) {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstChild;
}

function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function formatDurationShort(minutes) {
  const n = Number(minutes);
  if (!n || n <= 0) return '-';
  if (n < 60) return `${Math.round(n)}m`;
  const h = Math.floor(n / 60);
  const rem = Math.round(n - h * 60);
  return rem === 0 ? `${h}j` : `${h}j ${rem}m`;
}

// Slug rules: lowercase, digits, hyphens only. No leading/trailing/double hyphens.
const SLUG_REGEX = /^[a-z0-9]+(?:-[a-z0-9]+)*$/;
function slugify(s) {
  return String(s || '')
    .toLowerCase()
    .normalize('NFKD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-+|-+$/g, '')
    .replace(/-{2,}/g, '-');
}

// Wire a form so: (1) typing in title auto-fills slug until slug is touched manually,
// (2) typing in slug live-sanitizes to the allowed charset,
// (3) a preview element (.slug-preview) updates in real time.
function wireSlugAuto(formEl, opts) {
  opts = opts || {};
  if (!formEl) return;
  const slugInput = formEl.querySelector('input[name="slug"]');
  const titleInput = formEl.querySelector('input[name="title"]');
  const preview = formEl.querySelector('.slug-preview');
  if (!slugInput || !titleInput) return;
  // If editing (slug already has a value) treat as touched — don't overwrite on title change.
  let touched = !!slugInput.value.trim();
  const updatePreview = () => {
    if (!preview) return;
    const v = slugInput.value.trim();
    preview.textContent = v ? (opts.previewPrefix || '') + v : '—';
  };
  titleInput.addEventListener('input', () => {
    if (!touched) { slugInput.value = slugify(titleInput.value); updatePreview(); }
  });
  slugInput.addEventListener('input', () => {
    touched = true;
    const cursor = slugInput.selectionStart;
    const before = slugInput.value;
    const clean = before.toLowerCase().replace(/[^a-z0-9-]/g, '');
    if (clean !== before) {
      slugInput.value = clean;
      try { slugInput.setSelectionRange(cursor - (before.length - clean.length), cursor - (before.length - clean.length)); } catch {}
    }
    updatePreview();
  });
  slugInput.addEventListener('blur', () => {
    // Final tidy on blur — collapse dashes / trim.
    slugInput.value = slugify(slugInput.value);
    updatePreview();
  });
  updatePreview();
}

function showLock(message) {
  root.innerHTML = `
    <div class="lock-screen">
      <div class="lock-card">
        <h2 style="margin-top:0;">Akses Admin</h2>
        <p style="color:#525252;font-family:var(--font-body);font-size:14px;line-height:1.5;">${escapeHtml(message)}</p>
        <a href="login.html?next=admin.html" class="btn btn-primary" style="display:inline-block;text-decoration:none;margin-top:8px;">Masuk</a>
      </div>
    </div>
  `;
}

(async () => {
  const user = await ezGetMe();
  if (!user) { showLock('Kamu belum masuk. Silakan masuk dulu.'); return; }
  if (!user.isAdmin) { showLock('Akun ini bukan admin. Hubungi pengelola untuk akses.'); return; }
  CURRENT_USER = user;
  renderApp();
  await loadCourses();
  renderTab();
})();

// ─────────────────────────────────────────────────────────────
// API helpers
// ─────────────────────────────────────────────────────────────
async function api(path, opts) {
  const res = await ezApi(path, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    // Pakai `detail` (user-friendly) kalau ada, fallback ke `error` (kode).
    const msg = data.detail || data.error || ('HTTP ' + res.status);
    const err = new Error(msg);
    err.body = data;
    throw err;
  }
  return data;
}

function openModal(html, opts = {}) {
  modalContent.className = `modal ${opts.className || ''}`.trim();
  modalContent.innerHTML = html;
  modal.classList.add('show');
}
function closeModal() {
  modal.classList.remove('show');
  modalContent.innerHTML = '';
  modalContent.className = 'modal';
  modalContent.style.maxWidth = '';
}

function notify(msg, isErr) {
  const t = el(`<div style="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:${isErr ? '#991b1b' : '#0a0a0a'};color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;z-index:2000;font-family:var(--font-body);">${escapeHtml(msg)}</div>`);
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2400);
}

async function submitCourse(e, id) {
  e.preventDefault();
  const fd = new FormData(e.target);
  const features = (fd.get('features') || '').split('\n').map((s) => s.trim()).filter(Boolean);
  const status = fd.get('courseStatus') || 'draft';
  const slug = slugify(fd.get('slug'));
  if (!SLUG_REGEX.test(slug)) { notify('Slug tidak valid — gunakan huruf kecil, angka, dan tanda hubung.', true); return; }
  const body = {
    slug,
    title: fd.get('title').trim(),
    description: fd.get('description').trim() || null,
    level: fd.get('level').trim() || null,
    thumbnailUrl: fd.get('thumbnailUrl').trim() || null,
    sortOrder: Number(fd.get('sortOrder')) || 0,
    isPublished: status !== 'draft',
    isAvailable: status !== 'coming_soon',
    priceIdr: Number(fd.get('priceIdr')) || null,
    priceLabel: fd.get('priceLabel').trim() || null,
    periodLabel: fd.get('periodLabel').trim() || null,
    tagline: fd.get('tagline').trim() || null,
    features,
    ctaLabel: fd.get('ctaLabel').trim() || null,
    isFeatured: !!fd.get('isFeatured'),
  };
  try {
    if (id) await api('/admin/courses/' + id, { method: 'PUT', body: JSON.stringify(body) });
    else await api('/admin/courses', { method: 'POST', body: JSON.stringify(body) });
    closeModal();
    await loadCourses(); renderCourses();
    notify('Kursus tersimpan');
  } catch (err) { notify('Gagal simpan: ' + err.message, true); }
}
window.deleteCourse = async (id, title) => {
  if (!confirm(`Hapus kursus "${title}"? Modul + pelajaran di dalamnya ikut terhapus.\n\nKursus yang sudah dibeli siswa tidak bisa dihapus — atur ke "Draft" saja.`)) return;
  try {
    await api('/admin/courses/' + id, { method: 'DELETE' });
    await loadCourses(); renderCourses();
    notify('Kursus dihapus');
  } catch (err) { notify('Gagal hapus: ' + err.message, true); }
};

// Populate the section-name datalist with names from Notion's curator cache
// for the active course, plus whatever sections are already used in this
// course's modules. Best-effort: silently fails if endpoint returns 502 etc.
async function populateModuleSectionSuggestions() {
  const dl = document.getElementById('module-section-suggest');
  if (!dl) return;
  const names = new Set();
  for (const mod of STATE.modules || []) {
    if (mod && mod.section_name) names.add(mod.section_name);
  }
  const slug = STATE.selectedCourse;
  if (slug) {
    try {
      const res = await fetch('/api/notion-vocab?slug=' + encodeURIComponent(slug));
      if (res.ok) {
        const data = await res.json();
        for (const s of (data.sections || [])) if (s && s.name) names.add(s.name);
      }
    } catch { /* ignore — datalist just has what we know locally */ }
  }
  dl.innerHTML = [...names].sort().map((n) => `<option value="${escapeHtml(n)}"></option>`).join('');
}

  wireRichToolbarAll(form);
  populateModuleSectionSuggestions();
  form.addEventListener('submit', (e) => submitModule(e, id));
};
async function submitModule(e, id, courseId) {
  e.preventDefault();
  const fd = new FormData(e.target);
  const slug = slugify(fd.get('slug'));
  if (!SLUG_REGEX.test(slug)) { notify('Slug tidak valid — gunakan huruf kecil, angka, dan tanda hubung.', true); return; }

  const cando = (fd.get('candoStatements') || '').split('\n').map((s) => s.trim()).filter(Boolean);
  // skill_distribution + quiz_spec are no longer edited in admin UI (importer
  // fills them). Omit from payload so backend COALESCE keeps existing DB value.

  const body = {
    slug,
    title: fd.get('title').trim(),
    titleEn: fd.get('titleEn').trim() || null,
    description: fd.get('description').trim() || null,
    sortOrder: Number(fd.get('sortOrder')) || 0,
    jfTopic: fd.get('jfTopic').trim() || null,
    cefrLevel: fd.get('cefrLevel').trim() || null,
    scenario: fd.get('scenario').trim() || null,
    sectionName: (fd.get('sectionName') || '').trim(),
    candoStatements: cando,
  };
  try {
    if (id) await api('/admin/modules/' + id, { method: 'PUT', body: JSON.stringify(body) });
    else await api('/admin/modules', { method: 'POST', body: JSON.stringify({ ...body, courseId }) });
    closeModal();
    await loadModulesForCourse(STATE.selectedCourse); renderModules();
    notify('Modul tersimpan');
  } catch (err) { notify('Gagal simpan: ' + err.message, true); }
}

// ─────────────────────────────────────────────────────────────
// SECTION ARRANGER (drag-drop modul antar Section di sidebar)
// ─────────────────────────────────────────────────────────────
// Section ditandakan via `module.section_name`. Modul yg section_name-nya
// null/empty masuk bucket "Lainnya". Section baru dibuat dengan ngetik
// nama di input + drag minimal 1 modul ke situ (section yg ga punya
// modul akan hilang saat re-render kecuali masih ada di session state).

const SA_UNSET = '— Lainnya —';
let _saExtraSections = []; // section yg user buat di session tapi belum ada modulnya

function _saBuckets() {
  const map = new Map();
  for (const m of STATE.modules || []) {
    const sec = (m.section_name && m.section_name.trim()) || SA_UNSET;
    if (!map.has(sec)) map.set(sec, []);
    map.get(sec).push(m);
  }
  // Pastikan extra sections (yg user create tapi belum ada modulnya) tetap muncul.
  for (const name of _saExtraSections) {
    if (!map.has(name)) map.set(name, []);
  }
  // "Lainnya" selalu di paling bawah.
  const entries = [...map.entries()];
  entries.sort((a, b) => {
    if (a[0] === SA_UNSET) return 1;
    if (b[0] === SA_UNSET) return -1;
    return 0;
  });
  return entries;
}

window.openSectionArranger = () => {
  if (!STATE.selectedCourse) { notify('Pilih kursus dulu', true); return; }
  if (!STATE.modules || STATE.modules.length === 0) { notify('Belum ada modul', true); return; }
  _saExtraSections = [];
  openModal(`
    <h3>Atur Section Sidebar</h3>
    <p style="font-size:13px;color:#525252;font-family:var(--font-body);margin:0 0 14px;">
      Drag modul ke kotak Section yg kamu mau. Disimpan otomatis tiap drop. Modul tanpa Section masuk grup "Lainnya" di bawah.
    </p>
    <div class="sa-new">
      <input id="sa-new-name" placeholder="Nama Section baru (eg. Sistem Tulisan & Perkenalan)" />
      <button type="button" class="btn btn-primary" onclick="saAddSection()">+ Tambah</button>
    </div>
    <div id="sa-container"></div>
    <div class="modal-actions" style="margin-top:12px;">
      <button type="button" class="btn btn-ghost" onclick="saCloseAndRefresh()">Tutup</button>
    </div>
  `);
  modalContent.style.maxWidth = '720px';
  _saRender();
};

function _saRender() {
  const container = document.getElementById('sa-container');
  if (!container) return;
  const entries = _saBuckets();
  container.innerHTML = entries.map(([name, modules]) => {
    const safeNameAttr = escapeHtml(name);
    const safeNameJs = name.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    const isUnset = name === SA_UNSET;
    const actions = isUnset
      ? ''
      : `
        <button class="sa-section-action" type="button" title="Ganti nama Section"
                onclick="saRenameSection('${safeNameJs}')" aria-label="Ganti nama">✎</button>
        <button class="sa-section-action sa-section-delete" type="button" title="Hapus Section"
                onclick="saDeleteSection('${safeNameJs}')" aria-label="Hapus">✕</button>`;
    return `
      <div class="sa-section ${isUnset ? 'is-unset' : ''}" data-section="${safeNameAttr}"
           ondragover="saAllowDrop(event)"
           ondragleave="saLeave(event)"
           ondrop="saDrop(event, '${safeNameJs}')">
        <div class="sa-section-head">
          <span class="sa-section-name">${safeNameAttr}</span>
          <span class="sa-section-count">${modules.length} modul</span>
          ${actions}
        </div>
        <div class="sa-modules">
          ${modules.length === 0
            ? '<div class="sa-empty">Drop modul ke sini</div>'
            : modules.map((m) => `
              <div class="sa-module" draggable="true" data-module-id="${m.id}"
                   ondragstart="saDragStart(event, '${m.id}')"
                   ondragend="saDragEnd(event)">
                <span class="sa-grip" aria-hidden="true">⋮⋮</span>
                <span class="sa-module-slug">${escapeHtml(m.slug)}</span>
                <span class="sa-module-title">${escapeHtml(m.title)}</span>
              </div>`).join('')}
        </div>
      </div>
    `;
  }).join('');
}

window.saRenameSection = async (oldName) => {
  if (oldName === SA_UNSET) return;
  const input = prompt('Ganti nama Section "' + oldName + '" jadi:', oldName);
  if (input === null) return;
  const next = input.trim();
  if (!next) { notify('Nama Section ga boleh kosong', true); return; }
  if (next === SA_UNSET) { notify('Nama itu reserved', true); return; }
  if (next === oldName) return;
  const affected = (STATE.modules || []).filter((m) => (m.section_name || '').trim() === oldName);
  // If only a session-extra section (no modules use it yet) → just rename in
  // the extras list, no DB write needed.
  if (affected.length === 0) {
    const i = _saExtraSections.indexOf(oldName);
    if (i >= 0) _saExtraSections[i] = next;
    _saRender();
    notify('Section "' + oldName + '" → "' + next + '"');
    return;
  }
  notify('Update ' + affected.length + ' modul…');
  try {
    for (const m of affected) {
      const r = await api('/admin/modules/' + m.id, {
        method: 'PUT',
        body: JSON.stringify({ sectionName: next }),
      });
      m.section_name = (r?.module && r.module.section_name) || next;
    }
    // Forget the old name from session extras if it was there.
    const i = _saExtraSections.indexOf(oldName);
    if (i >= 0) _saExtraSections.splice(i, 1);
    _saRender();
    notify('Section "' + oldName + '" → "' + next + '" (' + affected.length + ' modul)');
  } catch (err) {
    notify('Gagal rename: ' + err.message, true);
  }
};

window.saDeleteSection = async (name) => {
  if (name === SA_UNSET) return;
  const affected = (STATE.modules || []).filter((m) => (m.section_name || '').trim() === name);
  const msg = affected.length === 0
    ? 'Hapus Section "' + name + '"?'
    : 'Hapus Section "' + name + '"? ' + affected.length + ' modul di dalamnya akan masuk ke "' + SA_UNSET + '".';
  if (!confirm(msg)) return;
  if (affected.length === 0) {
    const i = _saExtraSections.indexOf(name);
    if (i >= 0) _saExtraSections.splice(i, 1);
    _saRender();
    notify('Section "' + name + '" dihapus');
    return;
  }
  notify('Update ' + affected.length + ' modul…');
  try {
    for (const m of affected) {
      const r = await api('/admin/modules/' + m.id, {
        method: 'PUT',
        body: JSON.stringify({ sectionName: '' }),
      });
      m.section_name = (r?.module && r.module.section_name) || null;
    }
    const i = _saExtraSections.indexOf(name);
    if (i >= 0) _saExtraSections.splice(i, 1);
    _saRender();
    notify('Section "' + name + '" dihapus, ' + affected.length + ' modul → Lainnya');
  } catch (err) {
    notify('Gagal hapus: ' + err.message, true);
  }
};

window.saAddSection = () => {
  const input = document.getElementById('sa-new-name');
  const name = (input?.value || '').trim();
  if (!name) { notify('Ketik nama Section dulu', true); return; }
  if (name === SA_UNSET) { notify('Nama itu reserved', true); return; }
  // Sudah ada (entah karena ada modul atau extra)? skip dedup.
  const existing = STATE.modules?.some((m) => (m.section_name || '').trim() === name);
  if (!existing && !_saExtraSections.includes(name)) _saExtraSections.push(name);
  input.value = '';
  _saRender();
  notify('Section "' + name + '" ditambahkan. Drag modul ke situ.');
};

window.saDragStart = (e, moduleId) => {
  e.dataTransfer.setData('moduleId', moduleId);
  e.dataTransfer.effectAllowed = 'move';
  e.target.classList.add('sa-dragging');
};

window.saDragEnd = (e) => {
  e.target.classList.remove('sa-dragging');
  document.querySelectorAll('.sa-section.drag-over').forEach((el) => el.classList.remove('drag-over'));
};

window.saAllowDrop = (e) => {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  e.currentTarget.classList.add('drag-over');
};

window.saLeave = (e) => {
  if (!e.currentTarget.contains(e.relatedTarget)) {
    e.currentTarget.classList.remove('drag-over');
  }
};

window.saDrop = async (e, sectionName) => {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  const moduleId = e.dataTransfer.getData('moduleId');
  if (!moduleId) return;
  const mod = (STATE.modules || []).find((x) => x.id === moduleId);
  if (!mod) return;
  const currentSec = (mod.section_name && mod.section_name.trim()) || SA_UNSET;
  if (currentSec === sectionName) return;
  const newSec = sectionName === SA_UNSET ? '' : sectionName;
  try {
    const r = await api('/admin/modules/' + moduleId, {
      method: 'PUT',
      body: JSON.stringify({ sectionName: newSec }),
    });
    mod.section_name = (r?.module && r.module.section_name) || (newSec || null);
    // Modul udah pindah → kalau section asalnya bukan "Lainnya" dan udah kosong
    // tapi ada di _saExtraSections, biarin (user mungkin mau drop modul lain).
    _saRender();
    notify('"' + mod.title + '" → ' + sectionName);
  } catch (err) {
    notify('Gagal pindahin: ' + err.message, true);
  }
};

window.saCloseAndRefresh = async () => {
  closeModal();
  // Refresh module list di tab Modul biar consistent.
  try { await loadModulesForCourse(STATE.selectedCourse); renderModules(); } catch {}
};

window.deleteModule = async (id, title) => {
  if (!confirm(`Hapus modul "${title}"? Pelajaran di dalamnya ikut terhapus.`)) return;
  try {
    await api('/admin/modules/' + id, { method: 'DELETE' });
    await loadModulesForCourse(STATE.selectedCourse); renderModules();
    notify('Modul dihapus');
  } catch (err) { notify('Gagal hapus: ' + err.message, true); }
};

// LESSONS (module-scoped) + QUIZ
// ─────────────────────────────────────────────────────────────
function renderLessons() {
  const pane = document.querySelector('[data-pane="lessons"]');
  const courseOpts = STATE.courses.map((c) =>
    `<option value="${c.slug}" ${c.slug === STATE.selectedCourse ? 'selected' : ''}>${escapeHtml(c.title)}</option>`
  ).join('');
  const moduleOpts = STATE.modules.map((m) =>
    `<option value="${m.id}" ${m.id === STATE.selectedModule ? 'selected' : ''}>${escapeHtml(m.title)}</option>`
  ).join('');

  let body = '<div class="empty">Pilih kursus + modul dulu.</div>';
  if (STATE.selectedModule) {
    const mod = STATE.modules.find((m) => m.id === STATE.selectedModule);
    STATE.lessons = (mod && mod.lessons) || [];
    if (STATE.lessons.length === 0) {
      body = `
        <div class="toolbar">
          <button class="btn btn-primary" onclick="newLesson('${STATE.selectedModule}')">+ Pelajaran baru</button>
          <button class="btn btn-ghost" onclick="openPelajaranImporter('${STATE.selectedModule}')" title="Pilih pelajaran dari Bab Notion buat di-import sebagai lesson di modul ini">↻ Import Pelajaran dari Notion</button>
        </div>
        <div class="empty">Belum ada pelajaran di modul ini.</div>
      `;
    } else {
      const vocabByLesson = {};
      const grammarByLesson = {};
      (mod.vocabulary || []).forEach((v) => {
        if (!v.lesson_id) return;
        vocabByLesson[v.lesson_id] = (vocabByLesson[v.lesson_id] || 0) + 1;
      });
      (mod.grammar || []).forEach((g) => {
        if (!g.lesson_id) return;
        grammarByLesson[g.lesson_id] = (grammarByLesson[g.lesson_id] || 0) + 1;
      });
      const courseRow = STATE.courses.find((c) => c.slug === STATE.selectedCourse);
      const courseId = courseRow ? courseRow.id : '';
      const rows = STATE.lessons.map((l) => {
        const titleEsc = escapeHtml(l.title).replace(/'/g, "\\'");
        const vocabN = vocabByLesson[l.id] || 0;
        const grammarN = grammarByLesson[l.id] || 0;
        const deckN = Array.isArray(l.deck) ? l.deck.length : 0;
        const kanjiN = Array.isArray(l.kanji) ? l.kanji.length : 0;
        let contentBtns = '';
        if (l.type === 'deck') {
          contentBtns = `<button class="btn btn-ghost" onclick="manageDeck('${l.id}', '${titleEsc}', '${mod.id}', '${courseId}')">Kelola Deck (${deckN})</button>`;
        } else if (l.type === 'kanji') {
          contentBtns = `<button class="btn btn-ghost" onclick="manageKanji('${l.id}', '${titleEsc}', '${mod.id}', '${courseId}')">Kelola Kanji (${kanjiN})</button>`;
        } else if (l.type === 'grammar_task') {
          const gtN = Array.isArray(l.grammarTask) ? l.grammarTask.length : 0;
          contentBtns = `<button class="btn btn-ghost" onclick="manageGrammarTask('${l.id}', '${titleEsc}', '${mod.id}', '${courseId}')">Kelola Tugas Grammar (${gtN})</button>`;
        } else if (l.type !== 'quiz') {
          contentBtns = `<button class="btn btn-ghost" onclick="manageVocab('${l.id}', '${titleEsc}', '${mod.id}')">Vocab (${vocabN})</button>
             <button class="btn btn-ghost" onclick="manageGrammar('${l.id}', '${titleEsc}', '${mod.id}')">Grammar (${grammarN})</button>`;
        }
        const quizBtn = l.type === 'quiz'
          ? `<button class="btn btn-ghost" onclick="manageQuiz('${l.id}', '${titleEsc}')">Kuis</button>
             <button class="btn btn-ghost" onclick="generateQuizAI('${l.id}', '${titleEsc}')" title="Generate soal pakai AI dari materi Bab (preview dulu sebelum simpan)">✨ Generate AI</button>`
          : '';
        return `
        <tr>
          <td><strong>${escapeHtml(l.title)}</strong><br><span class="pill">${escapeHtml(l.slug)}</span></td>
          <td><span class="badge ${l.type === 'quiz' ? 'badge-admin' : (l.type === 'video' || l.type === 'deck' ? 'badge-on' : 'badge-off')}">${escapeHtml(l.type)}</span></td>
          <td>${l.duration_minutes || '-'}</td>
          <td>${l.sort_order}</td>
          <td class="actions">
            <button class="btn btn-ghost" onclick="editLesson('${l.id}')">Edit</button>
            ${contentBtns}
            ${quizBtn}
            <button class="btn btn-danger" onclick="deleteLesson('${l.id}', '${titleEsc}')">Hapus</button>
          </td>
        </tr>
      `;
      }).join('');
      body = `
        <div class="toolbar">
          <button class="btn btn-primary" onclick="newLesson('${STATE.selectedModule}')">+ Pelajaran baru</button>
          <button class="btn btn-ghost" onclick="openPelajaranImporter('${STATE.selectedModule}')" title="Pilih pelajaran dari Bab Notion buat di-import sebagai lesson di modul ini">↻ Import Pelajaran dari Notion</button>
        </div>
        <table><thead><tr><th>Judul / slug</th><th>Tipe</th><th>Durasi (menit)</th><th>Urutan</th><th></th></tr></thead><tbody>${rows}</tbody></table>
      `;
    }
  }

  pane.innerHTML = `
    <h2>Pelajaran &amp; Kuis</h2>
    <div class="toolbar">
      <label style="font-size:13px;color:#525252;font-family:var(--font-body);">Kursus:</label>
      <select id="lesson-course-picker" style="max-width:240px;">
        <option value="">— pilih kursus —</option>${courseOpts}
      </select>
      <label style="font-size:13px;color:#525252;font-family:var(--font-body);">Modul:</label>
      <select id="lesson-module-picker" style="max-width:240px;" ${STATE.modules.length === 0 ? 'disabled' : ''}>
        <option value="">— pilih modul —</option>${moduleOpts}
      </select>
    </div>
    ${body}
  `;
  document.getElementById('lesson-course-picker').addEventListener('change', async (e) => {
    STATE.selectedCourse = e.target.value || null;
    STATE.selectedModule = null;
    if (STATE.selectedCourse) await loadModulesForCourse(STATE.selectedCourse);
    else STATE.modules = [];
    renderLessons();
  });
  document.getElementById('lesson-module-picker').addEventListener('change', (e) => {
    STATE.selectedModule = e.target.value || null;
    renderLessons();
  });
}

// WYSIWYG rich-text editor. Replaces a textarea with a contenteditable div
// + hidden input (so FormData still carries the HTML value under the same name).
// Uses document.execCommand — deprecated but universally supported (Gmail pattern).
function wireRichTextEditor(textarea) {
  if (!textarea || textarea.dataset.rteWired) return;
  textarea.dataset.rteWired = '1';

  const initialValue = textarea.value || '';
  const name = textarea.name;
  const placeholder = textarea.placeholder || '';
  const required = textarea.required;

  const wrap = document.createElement('div');
  wrap.className = 'rte-wrap';

  const bar = document.createElement('div');
  bar.className = 'rt-toolbar';

  const editor = document.createElement('div');
  editor.className = 'rte-editor';
  editor.contentEditable = 'true';
  editor.setAttribute('role', 'textbox');
  editor.setAttribute('aria-multiline', 'true');
  if (placeholder) editor.setAttribute('data-placeholder', placeholder);
  editor.innerHTML = initialValue;

  const hidden = document.createElement('input');
  hidden.type = 'hidden';
  hidden.name = name;
  hidden.value = initialValue;
  if (required) hidden.required = true;

  const sync = () => {
    const html = editor.innerHTML;
    // Treat empty editor ("<br>" is what browsers leave when all text is deleted) as empty string.
    hidden.value = (html === '<br>' || html === '<div><br></div>') ? '' : html;
  };

  // Prefer semantic tags (<b>, <i>) over inline styles. Call each time because
  // other editors on the page may flip this global state.
  const preferSemantic = () => { try { document.execCommand('styleWithCSS', false, false); } catch (_) {} };

  const exec = (cmd, val = null) => {
    editor.focus();
    preferSemantic();
    document.execCommand(cmd, false, val);
    sync();
  };

  const wrapSelectionWithTag = (tagName) => {
    editor.focus();
    const sel = window.getSelection();
    if (!sel || sel.rangeCount === 0) return;
    const range = sel.getRangeAt(0);
    if (range.collapsed) return;
    const el = document.createElement(tagName);
    try {
      range.surroundContents(el);
    } catch (_) {
      const text = range.toString();
      el.textContent = text;
      range.deleteContents();
      range.insertNode(el);
    }
    sel.removeAllRanges();
    const r = document.createRange();
    r.selectNodeContents(el);
    sel.addRange(r);
    sync();
  };

  const insertLink = () => {
    const url = prompt('URL tujuan:', 'https://');
    if (!url) return;
    exec('createLink', url);
  };

  const buttons = [
    { label: 'B', title: 'Bold (Ctrl+B)', style: 'font-weight:800', fn: () => exec('bold') },
    { label: 'I', title: 'Italic (Ctrl+I)', style: 'font-style:italic', fn: () => exec('italic') },
    { label: 'U', title: 'Underline (Ctrl+U) — pakai untuk garis bawah target word JLPT', style: 'text-decoration:underline', fn: () => exec('underline') },
    { label: 'H2', title: 'Heading besar', fn: () => exec('formatBlock', 'H2') },
    { label: 'H3', title: 'Subheading', fn: () => exec('formatBlock', 'H3') },
    { label: '• Daftar', title: 'List poin', fn: () => exec('insertUnorderedList') },
    { label: '❝', title: 'Blockquote', fn: () => exec('formatBlock', 'BLOCKQUOTE') },
    { label: '🔗', title: 'Link (Ctrl+K)', fn: insertLink },
    { label: '</>', title: 'Code inline', style: 'font-family:var(--font-mono)', fn: () => wrapSelectionWithTag('code') },
    { label: '✕', title: 'Hapus format', fn: () => exec('removeFormat') },
  ];

  for (const b of buttons) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'rt-btn';
    btn.textContent = b.label;
    btn.title = b.title;
    btn.setAttribute('aria-label', b.title);
    if (b.style) btn.style.cssText = b.style;
    // mousedown preventDefault keeps the editor selection intact when the
    // toolbar button takes focus; the click handler then runs the command.
    btn.addEventListener('mousedown', (ev) => { ev.preventDefault(); });
    btn.addEventListener('click', (ev) => { ev.preventDefault(); b.fn(); });
    bar.appendChild(btn);
  }

  // Paste as plain text so Word/web HTML doesn't pollute the document.
  editor.addEventListener('paste', (ev) => {
    ev.preventDefault();
    const text = (ev.clipboardData || window.clipboardData).getData('text/plain');
    document.execCommand('insertText', false, text);
  });

  editor.addEventListener('keydown', (ev) => {
    if (!(ev.ctrlKey || ev.metaKey)) return;
    const k = ev.key.toLowerCase();
    if (k === 'b') { ev.preventDefault(); exec('bold'); }
    else if (k === 'i') { ev.preventDefault(); exec('italic'); }
    else if (k === 'u') { ev.preventDefault(); exec('underline'); }
    else if (k === 'k') { ev.preventDefault(); insertLink(); }
  });

  editor.addEventListener('input', sync);
  editor.addEventListener('blur', sync);

  wrap.appendChild(bar);
  wrap.appendChild(editor);
  wrap.appendChild(hidden);
  textarea.replaceWith(wrap);
}
function wireRichToolbarAll(form) {
  form.querySelectorAll('textarea.rich-text').forEach(wireRichTextEditor);
}
// Preview panel — renders lesson content HTML inline below the editor.
// After wireRichTextEditor runs, [name="content"] matches the hidden input.
function wireContentPreview(form) {
  const input = form.querySelector('[name="content"]');
  if (!input) return;
  const btn = form.querySelector('[data-preview-btn]');
  const panel = form.querySelector('[data-preview-panel]');
  if (!btn || !panel) return;
  btn.addEventListener('click', () => {
    const open = panel.style.display !== 'none';
    if (open) { panel.style.display = 'none'; btn.textContent = 'Pratinjau'; return; }
    panel.innerHTML = (input.value || '').trim() || '<em style="color:var(--ink-500);">Konten kosong.</em>';
    panel.style.display = 'block';
    btn.textContent = 'Tutup pratinjau';
  });
}
// Default sort_order = max existing + 1 (only when creating new).
function nextSortOrder(list, key) {
  if (!Array.isArray(list) || list.length === 0) return 1;
  return Math.max(0, ...list.map((x) => Number(x[key || 'sort_order']) || 0)) + 1;
}

async function submitLesson(e, id, moduleId) {
  e.preventDefault();
  const fd = new FormData(e.target);
  const slug = slugify(fd.get('slug'));
  if (!SLUG_REGEX.test(slug)) { notify('Slug tidak valid — gunakan huruf kecil, angka, dan tanda hubung.', true); return; }
  const type = fd.get('type');
  const body = {
    slug,
    title: fd.get('title').trim(),
    type,
    content: fd.get('content').trim() || null,
    videoUrl: type === 'video' ? ((fd.get('videoUrl') || '').trim() || null) : null,
    durationMinutes: Number(fd.get('durationMinutes')) || null,
    sortOrder: Number(fd.get('sortOrder')) || 0,
    // Hanya grammar_task yang punya pelajaran pemicu; tipe lain selalu null
    // (juga meng-clear kalau lesson diubah dari grammar_task ke tipe lain).
    popupAfterLessonId: type === 'grammar_task' ? ((fd.get('popupAfterLessonId') || '').trim() || null) : null,
  };
  if (type === 'quiz') {
    const qpaRaw = (fd.get('questionsPerAttempt') || '').toString().trim();
    // Pakai Number().valueOf() bukan `Number() || N` karena 0 itu valid value
    // tapi falsy → `Number(0) || 12` salah-jadi-12. cooldown_hours=0 berarti
    // "tanpa cooldown" yang user-controlled.
    const passingRaw = fd.get('passingScorePct');
    const cooldownRaw = fd.get('cooldownHours');
    body.passingScorePct = passingRaw === '' || passingRaw == null ? 70 : Number(passingRaw);
    body.questionsPerAttempt = qpaRaw === '' ? null : Number(qpaRaw);
    body.cooldownHours = cooldownRaw === '' || cooldownRaw == null ? 12 : Number(cooldownRaw);
  }
  try {
    if (id) await api('/admin/lessons/' + id, { method: 'PUT', body: JSON.stringify(body) });
    else await api('/admin/lessons', { method: 'POST', body: JSON.stringify({ ...body, moduleId }) });
    closeModal();
    await loadModulesForCourse(STATE.selectedCourse); renderLessons();
    notify('Pelajaran tersimpan');
  } catch (err) { notify('Gagal simpan: ' + err.message, true); }
}

function _qgCatLabel(c) { return c === 'grammar' ? 'Grammar' : c === 'listening' ? 'Menyimak' : c === 'reading' ? 'Dokkai' : 'Kosakata'; }

function quizGenRenderPreview() {
  const cards = _quizGenDrafts.map((q, i) => {
    const typeLabel = q.questionType === 'fill_blank' ? 'Isian' : _qgCatLabel(q.questionCategory);
    let body = '';
    if (q.questionType === 'fill_blank') {
      body = `<div class="field"><label>Jawaban benar</label><input id="qg_ca_${i}" value="${escapeHtml(q.correctAnswer || '')}" /></div>`;
    } else {
      if (q.questionCategory === 'listening') {
        body += `<div class="field"><label>Audio script (Jepang)</label><input id="qg_audio_${i}" value="${escapeHtml(q.audioScript || '')}" /></div>`;
      }
      if (q.questionCategory === 'reading') {
        body += `<div class="field"><label>📖 Teks bacaan (dokkai) — soal dgn bacaan sama akan digabung 1 section</label><textarea id="qg_passage_${i}" rows="4" lang="ja" style="width:100%;font-family:'Noto Sans JP',serif;line-height:1.7;">${escapeHtml(q.passage || '')}</textarea></div>`;
      }
      body += '<div class="field"><label>Opsi (pilih yang benar)</label>' + (q.options || []).map((o, j) =>
        `<label style="display:flex;align-items:center;gap:6px;font-weight:400;margin-bottom:4px;">
           <input type="radio" name="qg_correct_${i}" value="${j}" ${o.isCorrect ? 'checked' : ''} />
           <input id="qg_opt_${i}_${j}" value="${escapeHtml(o.text || '')}" style="flex:1;" />
         </label>`).join('') + '</div>';
    }
    return `<div style="border:1px solid var(--border,#e5e5e5);border-radius:8px;padding:12px;margin-bottom:10px;">
      <label style="display:flex;align-items:center;gap:8px;font-weight:600;margin-bottom:8px;">
        <input type="checkbox" class="qg-inc" data-i="${i}" checked /> Soal ${i + 1}
        <span class="pill">${typeLabel}</span>
      </label>
      <div class="field"><label>Pertanyaan</label><textarea id="qg_q_${i}" rows="2">${escapeHtml(q.question || '')}</textarea></div>
      ${body}
      <div class="field"><label>Penjelasan</label><input id="qg_exp_${i}" value="${escapeHtml(q.explanation || '')}" /></div>
    </div>`;
  }).join('');
  openModal(`
    <h3>Review ${_quizGenDrafts.length} Soal — ${escapeHtml(_quizGenCtx.lessonTitle)}</h3>
    <p style="font-size:13px;color:#525252;font-family:var(--font-body);margin:0 0 12px;">Edit seperlunya, hilangkan centang soal yang tidak mau disimpan.</p>
    <div style="max-height:58vh;overflow-y:auto;">${cards}</div>
    <div class="modal-actions">
      <button type="button" class="btn btn-ghost" onclick="quizGenBack()">← Ulangi</button>

    </div>
  `);

}

window.quizGenSave = async () => {
  const includes = Array.from(document.querySelectorAll('.qg-inc:checked')).map((c) => Number(c.dataset.i));
  if (includes.length === 0) { notify('Tidak ada soal dipilih', true); return; }
  const btn = document.getElementById('qg-save');
  if (btn) { btn.disabled = true; btn.textContent = 'Menyimpan…'; }
  let saved = 0;
  try {
    let sort = 0;
    // Dokkai: soal dengan teks bacaan sama digabung jadi satu section reading
    // (passage → nomor section). Tiap passage unik = section reading baru.
    const readingSections = new Map();
    let nextReadingSec = 1;
    for (const i of includes) {
      const d = _quizGenDrafts[i];
      const question = (document.getElementById('qg_q_' + i)?.value || '').trim();
      if (!question) continue;
      const explanation = (document.getElementById('qg_exp_' + i)?.value || '').trim() || null;
      const isListening = d.questionCategory === 'listening' && d.questionType !== 'fill_blank';
      const isReading = d.questionCategory === 'reading' && d.questionType !== 'fill_blank';
      let sectionNumber, sectionLabel, passage = null;
      if (isReading) {
        passage = (document.getElementById('qg_passage_' + i)?.value || '').trim();
        let sec = readingSections.get(passage);
        if (!sec) { sec = nextReadingSec++; readingSections.set(passage, sec); }
        sectionNumber = sec;
        sectionLabel = `Dokkai ${sec}`;
      } else if (isListening) {
        sectionNumber = 2; sectionLabel = 'Bagian 2';
      } else {
        sectionNumber = 1; sectionLabel = 'Bagian 1';
      }
      const bodyObj = {
        lessonId: _quizGenCtx.lessonId,
        question,
        questionType: d.questionType,
        questionCategory: d.questionCategory,
        sectionNumber,
        sectionLabel,
        sectionInstruction: null,
        audioScript: isListening ? (document.getElementById('qg_audio_' + i)?.value || '').trim() : '',
        explanation,
        sortOrder: sort++,
        options: [],
      };
      if (isReading) bodyObj.passage = passage || null;
      if (d.questionType === 'fill_blank') {
        bodyObj.correctAnswer = (document.getElementById('qg_ca_' + i)?.value || '').trim();
        if (!bodyObj.correctAnswer) continue;
      } else {
        const checkedEl = document.querySelector('input[name="qg_correct_' + i + '"]:checked');
        const correctIdx = checkedEl ? Number(checkedEl.value) : 0;
        bodyObj.options = (d.options || []).map((o, j) => ({
          text: (document.getElementById('qg_opt_' + i + '_' + j)?.value || '').trim(),
          isCorrect: j === correctIdx,
          imageUrl: null,
        })).filter((o) => o.text);
        if (bodyObj.options.length < 2) continue;
        if (!bodyObj.options.some((o) => o.isCorrect)) bodyObj.options[0].isCorrect = true;
      }
      await api('/admin/quiz-questions', { method: 'POST', body: JSON.stringify(bodyObj) });
      saved++;
    }
    notify(saved + ' soal tersimpan ke kuis.');
    closeModal();
    manageQuiz(_quizGenCtx.lessonId, _quizGenCtx.lessonTitle);
  } catch (err) {
    notify('Gagal simpan (tersimpan ' + saved + '): ' + err.message, true);
    if (btn) { btn.disabled = false; btn.textContent = 'Simpan ke kuis'; }
  }
};

window.piRunImport = async (moduleId) => {
  const checks = [...document.querySelectorAll('.pi-check:checked')];

  if (ids.length === 0) { notify('Pilih minimal 1 pelajaran', true); return; }

  if (btn) { btn.disabled = true; btn.textContent = 'Memuat...'; }
  notify('Importing ' + ids.length + ' pelajaran dari Notion...');
  try {
    const d = await api('/admin/modules/' + moduleId + '/import-notion-pelajaran', {
      method: 'POST',
      body: JSON.stringify({ pelajaranIds: ids }),
    });

    const errors = d.errors || [];
    notify(created.length + ' pelajaran di-import' + (errors.length ? ' (' + errors.length + ' gagal)' : ''));

      alert('Berhasil: ' + created.length + '\nGagal: ' + errors.length + '\n\n' + errors.map((e) => '- ' + (e.title || e.pageId) + ': ' + e.error).join('\n'));

// ─── Quiz manager ───
const QUIZ_CATEGORY_LABELS = {
  vocabulary: 'Vocabulary',
  grammar: 'Grammar',
  reading: 'Dokkai',
  listening: 'Listening',
};

function quizCategory(value) {
  return QUIZ_CATEGORY_LABELS[value] ? value : 'vocabulary';
}

function quizCategoryLabel(value) {
  return QUIZ_CATEGORY_LABELS[quizCategory(value)];
}

// Pending section: admin tekan "+ Section baru" → meta-nya ditampung di
// sini, langsung lanjut ke form pertanyaan. Section persist ke DB pas
// pertanyaan pertama disimpan. Cancel = section discarded. Pemegang
// state hanya satu (1 pending section per session) — cukup buat flow ini.
let _pendingSection = null;
const _quizCtxStash = {};

window.manageQuiz = async (lessonId, lessonTitle, opts) => {
  let questions = [];
  let lessonMeta = null;
  try {
    const d = await api('/admin/lessons/' + lessonId + '/quiz');
    questions = d.questions || [];
    lessonMeta = d.lessonMeta || null;
  } catch (err) { notify('Gagal load kuis: ' + err.message, true); return; }
  if (!opts?.keepPending) _pendingSection = null;
  renderQuizModal(lessonId, lessonTitle, questions, lessonMeta);
};

function categorySortOrder(cat) {
  return { vocabulary: 1, grammar: 2, reading: 3, listening: 4 }[cat] || 9;
}

function collectSections(questions, lessonId) {
  const byKey = new Map();
  questions.forEach((q) => {
    const cat = quizCategory(q.question_category);
    const num = Number(q.section_number) || 1;
    const key = `${cat}:${num}`;
    if (!byKey.has(key)) {
      byKey.set(key, {
        category: cat, number: num,
        label: q.section_label || `Section ${num}`,
        instruction: q.section_instruction || '',
        passage: q.passage || '',
        questions: [],
        isPending: false,
      });
    }
    byKey.get(key).questions.push(q);
  });
  if (_pendingSection && _pendingSection.lessonId === lessonId) {
    const key = `${_pendingSection.category}:${_pendingSection.number}`;
    if (!byKey.has(key)) {
      byKey.set(key, {
        category: _pendingSection.category,
        number: _pendingSection.number,
        label: _pendingSection.label,
        instruction: _pendingSection.instruction || '',
        questions: [],
        isPending: true,
      });
    }
  }
  return Array.from(byKey.values()).sort((a, b) =>
    (categorySortOrder(a.category) - categorySortOrder(b.category)) || (a.number - b.number)
  );
}

function stashCtx(payload) {
  // Stash ke window-level supaya onclick handler ga perlu embed JSON
  // (escape hell). Token random, dipakai cuma di session ini.
  const key = 'k_' + Math.random().toString(36).slice(2, 11);
  _quizCtxStash[key] = payload;
  return key;
}

function renderQuizModal(lessonId, lessonTitle, questions, lessonMeta) {
  const sections = collectSections(questions, lessonId);
  const tabsHtml = Object.keys(QUIZ_CATEGORY_LABELS).map((cat) => {
    const count = sections.filter((s) => s.category === cat)
      .reduce((n, s) => n + s.questions.length, 0);
    return `<span class="quiz-paper-tab-admin ${count ? 'active' : ''}">${QUIZ_CATEGORY_LABELS[cat]} ${count}</span>`;
  }).join('');

  const sectionsHtml = sections.length === 0
    ? '<div class="quiz-admin-sections-empty">Belum ada section. Klik <strong>+ Section baru</strong> untuk mulai.</div>'
    : sections.map((s) => renderSectionCard(s, lessonId, lessonTitle)).join('');

  const newSectionCtx = stashCtx({
    lessonId, lessonTitle, mode: 'new',
    existingSections: sections.map((s) => ({ category: s.category, number: s.number })),
  });

  // Pool indicator: ratio actual pool size : target sample. Warn if <2×.
  const poolSize = questions.length;
  const qpa = lessonMeta?.questions_per_attempt || poolSize;
  const passing = lessonMeta?.passing_score_pct ?? 70;
  const cooldown = lessonMeta?.cooldown_hours ?? 12;
  const ratio = qpa > 0 ? (poolSize / qpa) : 0;
  let ratioBadge = '';
  if (qpa && qpa < poolSize) {
    if (ratio >= 3) ratioBadge = `<span style="color:#15803d;">✅ ${ratio.toFixed(1)}× variasi sehat</span>`;
    else if (ratio >= 2) ratioBadge = `<span style="color:#a16207;">⚠️ ${ratio.toFixed(1)}× — soal bisa berulang antar attempt</span>`;
    else ratioBadge = `<span style="color:#b91c1c;">🔴 ${ratio.toFixed(1)}× — pool kekecilan, retry sering dapet soal sama</span>`;
  } else if (lessonMeta) {
    ratioBadge = `<span style="color:#737373;">Tiap attempt pakai semua ${poolSize} soal (tidak ada rotasi).</span>`;
  }
  const poolIndicator = lessonMeta ? `
    <div style="background:#f9fafb;border:1px solid var(--paper-300);border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:13px;line-height:1.6;">
      <strong>Pool:</strong> ${poolSize} soal · <strong>Per attempt:</strong> ${qpa} acak · <strong>Lulus:</strong> ${passing}% · <strong>Cooldown:</strong> ${cooldown > 0 ? `${cooldown}h` : 'tanpa cooldown'}<br>
      ${ratioBadge}
    </div>` : '';

  openModal(`
    <div class="quiz-admin-head">
      <div>
        <div class="quiz-admin-kicker">Quiz / Assignment Harian</div>
        <h3 class="quiz-admin-title">${escapeHtml(lessonTitle)}</h3>
      </div>
      <button class="btn btn-primary" onclick="openSectionForm('${newSectionCtx}')">+ Section baru</button>
    </div>
    ${poolIndicator}
    <div class="quiz-paper-tabs-admin" aria-label="Kategori kuis">${tabsHtml}</div>
    <div class="quiz-admin-sections">${sectionsHtml}</div>
    <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">Tutup</button></div>
  `, { className: 'quiz-admin-modal' });
}

function renderSectionCard(s, lessonId, lessonTitle) {
  const sectionCtx = { lessonId, lessonTitle, category: s.category, number: s.number, label: s.label, instruction: s.instruction, passage: s.passage || '' };
  const editKey = stashCtx({ ...sectionCtx, mode: 'edit' });
  const addQKey = stashCtx({ ...sectionCtx, question: null });
  const delKey = stashCtx(sectionCtx);

  const qHtml = s.questions.map((q, qi) => {
    const editQKey = stashCtx({ ...sectionCtx, question: q });
    const delQKey = stashCtx({ id: q.id, lessonId, lessonTitle });
    return `
      <details class="quiz-admin-item">
        <summary>
          <span class="quiz-admin-no">${s.number}.${qi + 1}</span>
          <span>${escapeHtml(q.question.slice(0, 90))}${q.question.length > 90 ? '…' : ''}</span>
        </summary>
        <div class="quiz-admin-options">
          ${(q.options || []).map((o, oi) => `
            <div class="quiz-admin-option ${o.is_correct ? 'correct' : ''}">
              <span class="quiz-admin-option-no">${oi + 1}</span>
              <span>${escapeHtml(o.option_text)}</span>
            </div>
          `).join('')}
          ${q.explanation ? `<div class="quiz-admin-note">Penjelasan: ${escapeHtml(q.explanation)}</div>` : ''}
          <div style="margin-top:8px;display:flex;gap:6px;">
            <button class="btn btn-ghost" onclick="openQuestionForm('${editQKey}')">Edit</button>
            <button class="btn btn-danger" onclick="deleteQuestion('${delQKey}')">Hapus</button>
          </div>
        </div>
      </details>
    `;
  }).join('');

  const emptyQ = s.questions.length === 0
    ? `<div class="quiz-admin-empty-q">Section masih kosong — tambahkan pertanyaan pertama.</div>`
    : '';

  const pendingPill = s.isPending
    ? '<span class="pill" style="background:#fffbea;color:#8a6d00;border:1px solid #f0e0a0;">Belum tersimpan</span>'
    : `<button class="btn btn-danger btn-sm" onclick="deleteSection('${delKey}')">Hapus section</button>`;

  return `
    <div class="quiz-admin-paper" data-section-key="${s.category}:${s.number}">
      <div class="quiz-admin-section-label">${s.number}. ${escapeHtml(s.label)} · ${quizCategoryLabel(s.category)}</div>
      <div class="quiz-admin-section-actions">
        <button class="btn btn-ghost btn-sm" onclick="openSectionForm('${editKey}')">Edit section</button>
        ${pendingPill}
      </div>
      ${s.instruction ? `<div class="quiz-admin-instruction">${escapeHtml(s.instruction)}</div>` : ''}
      <div class="quiz-admin-list">${qHtml}${emptyQ}</div>
      <button class="btn btn-primary btn-sm" style="margin-top:12px;" onclick="openQuestionForm('${addQKey}')">+ Pertanyaan</button>
    </div>
  `;
}

window.deleteQuestion = async (key) => {
  const ctx = _quizCtxStash[key];
  if (!ctx) return;
  if (!confirm('Hapus pertanyaan ini?')) return;
  try {
    await api('/admin/quiz-questions/' + ctx.id, { method: 'DELETE' });
    notify('Pertanyaan dihapus');
    manageQuiz(ctx.lessonId, ctx.lessonTitle);
  } catch (err) { notify('Gagal hapus: ' + err.message, true); }
};

window.deleteSection = async (key) => {
  const ctx = _quizCtxStash[key];
  if (!ctx) return;
  if (!confirm(`Hapus section "${ctx.label}" beserta semua pertanyaannya?`)) return;
  try {
    await api(`/admin/lessons/${ctx.lessonId}/quiz/sections/${ctx.category}/${ctx.number}`, { method: 'DELETE' });
    notify('Section dihapus');
    manageQuiz(ctx.lessonId, ctx.lessonTitle);
  } catch (err) { notify('Gagal hapus: ' + err.message, true); }
};

window.openSectionForm = (key) => {
  const ctx = _quizCtxStash[key];
  if (!ctx) return;
  const isNew = ctx.mode === 'new';
  const { lessonId, lessonTitle } = ctx;

  // Default untuk new: kategori sesuai context kalau ada, nomor = next.
  const cat = ctx.category || 'vocabulary';
  // Untuk section baru: default nomor = max existing nomor di kategori itu + 1.
  const existing = ctx.existingSections || [];
  const nextNumFor = (c) => (existing.filter((s) => s.category === c)
    .reduce((m, s) => Math.max(m, s.number), 0)) + 1;
  const num = ctx.number || (isNew ? nextNumFor(cat) : 1);
  const label = ctx.label || '';
  const instruction = ctx.instruction || '';
  const passage = ctx.passage || '';
  const backKey = stashCtx({ lessonId, lessonTitle });

  openModal(`
    <div class="quiz-admin-head">
      <div>
        <div class="quiz-admin-kicker">Quiz / Assignment</div>
        <h3 class="quiz-admin-title">${isNew ? 'Section Baru' : 'Edit Section'}</h3>
      </div>
    </div>
    <form id="section-form">
      <div class="field-row">
        <div class="field"><label>Kategori</label>
          <select name="sectionCategory" ${isNew ? '' : 'disabled'}>
            <option value="vocabulary" ${cat === 'vocabulary' ? 'selected' : ''}>Vocabulary</option>
            <option value="grammar" ${cat === 'grammar' ? 'selected' : ''}>Grammar</option>
            <option value="reading" ${cat === 'reading' ? 'selected' : ''}>Dokkai</option>
            <option value="listening" ${cat === 'listening' ? 'selected' : ''}>Listening</option>
          </select>
        </div>
        <div class="field"><label>Nomor section</label>
          <input type="number" name="sectionNumber" min="1" value="${num}" ${isNew ? '' : 'readonly'} />
        </div>
      </div>
      <div class="field"><label>Label section</label>
        <input name="sectionLabel" value="${escapeHtml(label)}" placeholder="contoh: もじ・ごい (Moji-Goi)" />
      </div>
      <div class="field"><label>Instruksi section (mondai)</label>
        <textarea name="sectionInstruction" rows="3" lang="ja"
          placeholder="contoh: 問題1：＿＿の ことばは ひらがなで どう かきますか。 1・2・3・4から いちばん いい ものを ひとつ えらんで ください。">${escapeHtml(instruction)}</textarea>
      </div>
      <div class="field" id="sectionPassageWrap" style="${cat === 'reading' ? '' : 'display:none;'}">
        <label>📖 Teks bacaan (dokkai) — tampil di atas semua soal section ini</label>
        <textarea name="sectionPassage" rows="6" lang="ja"
          placeholder="Tempel teks bacaan Jepang di sini. Semua soal di section ini akan memakai bacaan yang sama."
          style="font-family:'Noto Sans JP',serif;width:100%;line-height:1.8;">${escapeHtml(passage)}</textarea>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" onclick="backToManageQuiz('${backKey}')">← Batal</button>
        <button type="submit" class="btn btn-primary">${isNew ? 'Lanjut → Tambah pertanyaan pertama' : 'Simpan section'}</button>
      </div>
    </form>
  `, { className: 'quiz-admin-modal' });
  const form = document.getElementById('section-form');
  // Saat user ganti kategori (cuma di mode baru), auto-update nomor section
  // ke max+1 di kategori baru — biar admin ga manual nebak nomor selanjutnya
  // per kategori. Tiap kategori punya number-space sendiri.
  if (isNew) {
    const catSelect = form.sectionCategory;
    const numInput = form.sectionNumber;
    const passageWrap = document.getElementById('sectionPassageWrap');
    catSelect.addEventListener('change', () => {
      numInput.value = nextNumFor(catSelect.value);
      if (passageWrap) passageWrap.style.display = catSelect.value === 'reading' ? '' : 'none';
    });
  }
  form.addEventListener('submit', (e) => submitSection(e, ctx));
};

async function submitSection(e, ctx) {
  e.preventDefault();
  const form = e.target;
  const category = form.sectionCategory.value;
  const number = Number(form.sectionNumber.value) || 1;
  const label = form.sectionLabel.value.trim() || `Section ${number}`;
  const instruction = form.sectionInstruction.value.trim();
  const passage = (form.sectionPassage && category === 'reading')
    ? form.sectionPassage.value.trim() : '';
  const { lessonId, lessonTitle } = ctx;

  if (ctx.mode === 'edit') {
    try {
      await api(`/admin/lessons/${lessonId}/quiz/sections/${ctx.category}/${ctx.number}`, {
        method: 'PUT',
        body: JSON.stringify({
          sectionLabel: label,
          sectionInstruction: instruction || null,
          ...(ctx.category === 'reading' ? { passage: passage || null } : {}),
        }),
      });
      notify('Section tersimpan');
      manageQuiz(lessonId, lessonTitle);
    } catch (err) { notify('Gagal simpan: ' + err.message, true); }
    return;
  }

  // New section → stash pending + langsung buka form pertanyaan pertama.
  _pendingSection = { lessonId, category, number, label, instruction, passage };
  const k = stashCtx({
    lessonId, lessonTitle,
    category, number, label, instruction, passage,
    question: null,
  });
  openQuestionForm(k);
}

window.quizGenOptions = async () => {

  const question = (form.question.value || '').trim();

// Tag bawaan ElevenLabs v3 + tag yang sering dipake JLPT-style.
const TTS_BUILTIN_TAGS = [
  'calm', 'questioning', 'thoughtful', 'excited', 'happy', 'sad',
  'surprised', 'shy', 'hesitant', 'angry', 'whisper', 'laughs',
  'sigh', 'gasp', 'pause',
];
// Server-side tag library (shared antar admin browser). Di-cache in-memory
// supaya re-render picker ga refetch tiap kali. Initial fetch on first
// render; subsequent mutations update cache + re-render.
let ttsServerTags = null; // null = belum fetch, [] = fetched empty.

async function fetchTtsServerTags() {
  try {
    const r = await ezApi('/admin/tts/tags');
    if (!r.ok) return [];
    const data = await r.json().catch(() => ({ tags: [] }));
    return Array.isArray(data.tags) ? data.tags : [];
  } catch { return []; }
}

async function renderTtsTagPicker() {
  const chipsBox = document.getElementById('ttsTagChips');
  if (!chipsBox) return;
  if (ttsServerTags === null) {
    chipsBox.innerHTML = '<span style="font-size:11px;color:var(--ink-500);">Loading tag library...</span>';
    ttsServerTags = await fetchTtsServerTags();
    // Picker mungkin udah unmount kalau modal di-close pas fetch jalan.
    if (!document.getElementById('ttsTagChips')) return;
  }
  const server = ttsServerTags;
  const all = [...server, ...TTS_BUILTIN_TAGS.filter((t) => !server.includes(t))];
  chipsBox.innerHTML = all.map((tag) => {
    const isCustom = server.includes(tag);
    return `<button type="button" class="tts-tag-chip ${isCustom ? 'is-fav' : ''}"
      onclick="insertTtsTag('${escapeHtml(tag)}')"
      title="${isCustom ? 'Custom (klik kanan untuk hapus dari library)' : 'Builtin ElevenLabs'}"
      oncontextmenu="event.preventDefault(); ${isCustom ? `removeFavTtsTag('${escapeHtml(tag)}')` : 'void 0'}; return false;"
      style="padding:3px 9px;background:${isCustom ? '#fef3c7' : '#fff'};color:#1a1a1a;border:1px solid ${isCustom ? '#fbbf24' : '#d1d5db'};border-radius:999px;font-size:11px;font-weight:600;cursor:pointer;font-family:var(--font-mono);">
      ${isCustom ? '⭐ ' : ''}[${escapeHtml(tag)}]
    </button>`;
  }).join('');
}

window.insertTtsTag = (tag) => {
  const ta = document.getElementById('audioScriptField');
  if (!ta) return;
  const start = ta.selectionStart;
  const end = ta.selectionEnd;
  const text = ta.value;
  const insert = `[${tag}] `;
  ta.value = text.slice(0, start) + insert + text.slice(end);
  // Geser cursor ke setelah insert.
  const newPos = start + insert.length;
  ta.focus();
  ta.setSelectionRange(newPos, newPos);
};

window.addCustomTtsTag = async () => {
  const input = document.getElementById('ttsCustomTagInput');
  if (!input) return;
  const raw = input.value.trim().toLowerCase();
  const tag = raw.replace(/[^a-z0-9_]/g, '');
  if (!tag || !/^[a-z]/.test(tag) || tag.length > 24) {
    notify('Tag harus mulai dgn huruf, hanya huruf/angka/underscore, max 24 char.', true);
    return;
  }
  try {
    const r = await ezApi('/admin/tts/tags', {
      method: 'POST',
      body: JSON.stringify({ tag }),
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) {
      notify(`Gagal: ${data.detail || data.error || r.status}`, true);
      return;
    }
    // Server-side accepted. Pasang di cache + re-render.
    if (!ttsServerTags) ttsServerTags = [];
    if (!ttsServerTags.includes(tag)) ttsServerTags = [tag, ...ttsServerTags];
    input.value = '';
    renderTtsTagPicker();
    notify(`Tag [${tag}] disimpan ke library`);
  } catch (err) {
    notify(`Network error: ${err.message}`, true);
  }
};

window.removeFavTtsTag = async (tag) => {
  if (!confirm(`Hapus tag [${tag}] dari library? (Admin lain juga akan kehilangan tag ini)`)) return;
  try {
    const r = await ezApi(`/admin/tts/tags/${encodeURIComponent(tag)}`, { method: 'DELETE' });
    if (!r.ok) {
      const data = await r.json().catch(() => ({}));
      notify(`Gagal: ${data.detail || data.error || r.status}`, true);
      return;
    }
    if (ttsServerTags) ttsServerTags = ttsServerTags.filter((t) => t !== tag);
    renderTtsTagPicker();
  } catch (err) {
    notify(`Network error: ${err.message}`, true);
  }
};

window.testTtsAudio = async () => {
  const ta = document.getElementById('audioScriptField');
  const audio = document.getElementById('ttsTestAudio');
  const status = document.getElementById('ttsTestStatus');
  if (!ta || !audio || !status) return;
  const text = ta.value.trim();
  if (!text) { notify('Audio script kosong', true); return; }
  status.textContent = 'Generating... (~5s kalau cache miss)';
  audio.style.display = 'none';
  try {
    const r = await ezApi('/admin/tts/preview', {
      method: 'POST',
      body: JSON.stringify({ text }),
    });
    if (!r.ok) {
      const err = await r.json().catch(() => ({}));
      status.textContent = `Error: ${err.detail || err.error || r.status}`;
      return;
    }
    const blob = await r.blob();
    audio.src = URL.createObjectURL(blob);
    audio.style.display = 'block';
    audio.play();
    status.textContent = `OK (${(blob.size / 1024).toFixed(1)}KB)`;
  } catch (err) {
    status.textContent = `Network error: ${err.message}`;
  }
};

window.clearTtsCacheCurrent = async () => {
  const ta = document.getElementById('audioScriptField');
  const status = document.getElementById('ttsTestStatus');
  if (!ta || !status) return;
  const text = ta.value.trim();

  if (!confirm('Hapus cache audio untuk script ini? Next test akan regenerate dari ElevenLabs (kena cost).')) return;
  status.textContent = 'Hapus cache...';
  try {
    const r = await ezApi('/admin/tts/cache', {
      method: 'DELETE',
      body: JSON.stringify({ text }),
    });
    const data = await r.json().catch(() => ({}));
    if (r.ok) {
      status.textContent = `Cache dihapus: ${data.deleted || 0} entry`;
      notify(`Cache dihapus (${data.deleted || 0} entry)`);
    } else {
      status.textContent = `Error: ${data.error || r.status}`;
    }
  } catch (err) {
    status.textContent = `Network error: ${err.message}`;
  }
};

// ───── TTS Cache Pane (global) ─────
// Stats + orphan cleanup. Orphan = entry dengan settings_version
// != current version (atau NULL). Cleanup deterministic, gak pake
// last_used_at (yg false-positive utk soal jarang dimaikan).

function ttsBytesFmt(n) {
  const v = Number(n) || 0;
  if (v < 1024) return `${v} B`;
  if (v < 1024 * 1024) return `${(v / 1024).toFixed(1)} KB`;
  return `${(v / 1024 / 1024).toFixed(2)} MB`;
}

async function renderTtsCachePane() {
  const pane = document.querySelector('[data-pane="tts"]');
  if (!pane) return;
  pane.innerHTML = `

      <h2 style="margin-top:0;">TTS Cache Management</h2>
      <p style="color:var(--ink-500);font-size:13px;">
        Audio MP3 dari ElevenLabs di-cache di Postgres supaya satu string japanese
        cuma hit API sekali. Bump <code>SETTINGS_VERSION</code> (voice settings ubah)
        bikin entry lama jadi orphan — bypass hash key beda, tapi tetep makan disk.
      </p>
      <div id="ttsCacheStatsBox" style="background:#f9fafb;border:1px solid var(--paper-300);border-radius:8px;padding:14px;margin-top:12px;">
        <div style="color:var(--ink-500);font-size:13px;">Loading stats...</div>
      </div>
      <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;">
        <button type="button" class="btn btn-ghost" onclick="loadTtsCacheStats()">↻ Refresh stats</button>
        <button type="button" class="btn btn-danger" onclick="cleanupTtsOrphans()" id="ttsOrphanBtn" disabled>🧹 Hapus orphan</button>
        <button type="button" class="btn btn-danger" onclick="nukeAllTtsCache()" style="margin-left:auto;">⚠️ Nuke semua cache</button>
      </div>
      <p style="font-size:12px;color:var(--ink-500);margin-top:14px;">
        <strong>Hapus orphan</strong> aman: cuma entry dgn versi settings beda dari current.
        Entry valid versi current (yang masih dipake) tidak akan tersentuh.
        <br>
        <strong>Nuke semua</strong> hapus everything → semua soal regen dari ElevenLabs pas first play (kena cost ~10-20k char).
      </p>
    </div>
  `;
  loadTtsCacheStats();
}

window.loadTtsCacheStats = async () => {
  const box = document.getElementById('ttsCacheStatsBox');
  const btn = document.getElementById('ttsOrphanBtn');
  if (!box) return;
  try {
    const r = await ezApi('/admin/tts/cache/stats');
    if (!r.ok) {
      box.innerHTML = `<div style="color:#b91c1c;">Error: HTTP ${r.status}</div>`;
      return;
    }
    const s = await r.json();
    const orphanCount = Number(s.orphan_count || 0);
    const totalBytes = Number(s.bytes || 0);
    box.innerHTML = `
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;">
        <div>
          <div style="font-size:11px;color:var(--ink-500);text-transform:uppercase;font-weight:700;">Total entries</div>
          <div style="font-size:22px;font-weight:700;">${s.count || 0}</div>
          <div style="font-size:11px;color:var(--ink-500);">${ttsBytesFmt(totalBytes)}</div>
        </div>
        <div>
          <div style="font-size:11px;color:#16a34a;text-transform:uppercase;font-weight:700;">Current (${escapeHtml(s.current_version || '?')})</div>
          <div style="font-size:22px;font-weight:700;color:#16a34a;">${s.current_count || 0}</div>
          <div style="font-size:11px;color:var(--ink-500);">${ttsBytesFmt(s.current_bytes || 0)}</div>
        </div>
        <div>
          <div style="font-size:11px;color:#b91c1c;text-transform:uppercase;font-weight:700;">Orphan</div>
          <div style="font-size:22px;font-weight:700;color:${orphanCount > 0 ? '#b91c1c' : '#9ca3af'};">${orphanCount}</div>
          <div style="font-size:11px;color:var(--ink-500);">${ttsBytesFmt(s.orphan_bytes || 0)}</div>
        </div>
      </div>
      <div style="font-size:11px;color:var(--ink-500);margin-top:10px;">
        Oldest: ${s.oldest ? new Date(s.oldest).toLocaleString('id-ID') : '-'} ·
        Newest: ${s.newest ? new Date(s.newest).toLocaleString('id-ID') : '-'}
      </div>
    `;
    if (btn) btn.disabled = orphanCount === 0;
  } catch (err) {
    box.innerHTML = `<div style="color:#b91c1c;">Network error: ${escapeHtml(err.message)}</div>`;
  }
};

window.cleanupTtsOrphans = async () => {
  // Preview dulu via GET → confirm dgn nominal exact.
  let preview;
  try {
    const r = await ezApi('/admin/tts/cache/orphans');
    if (!r.ok) { notify('Gagal preview orphan', true); return; }
    preview = await r.json();
  } catch (err) { notify(`Network: ${err.message}`, true); return; }
  const count = Number(preview.count || 0);
  if (count === 0) { notify('Gak ada orphan to clean'); return; }
  const msg = `Hapus ${count} orphan entries (${ttsBytesFmt(preview.bytes || 0)})?\n\n` +
    `Current version: ${preview.current_version}. Entry valid versi current tidak akan terhapus.`;
  if (!confirm(msg)) return;
  try {
    const r = await ezApi('/admin/tts/cache/orphans', { method: 'DELETE' });
    const data = await r.json().catch(() => ({}));
    if (r.ok) {
      notify(`Orphan dihapus: ${data.deleted || 0} entries`);
      loadTtsCacheStats();
    } else {
      notify(`Gagal: ${data.error || r.status}`, true);
    }
  } catch (err) {
    notify(`Network error: ${err.message}`, true);
  }
};

async function submitQuestion(e, qid, ctx) {
  e.preventDefault();
  const form = e.target;
  const rows = form.querySelectorAll('.quiz-option-row');
  const options = Array.from(rows).map((row) => {
    const idx = row.dataset.idx;
    const imgEl = row.querySelector(`input[name="opt_image_${idx}"]`);
    return {
      text: row.querySelector(`input[name="opt_text_${idx}"]`).value.trim(),
      isCorrect: row.querySelector(`input[name="opt_correct_${idx}"]`).checked,
      imageUrl: imgEl ? imgEl.value.trim() || null : null,
    };
  }).filter((o) => o.text);
  const { lessonId, lessonTitle, category, number, label, instruction, passage } = ctx;
  const body = {
    question: form.question.value.trim(),
    questionType: form.questionType.value,
    questionCategory: category,
    sectionNumber: number,
    sectionLabel: label,
    sectionInstruction: instruction || null,
    audioScript: (form.audioScript && form.audioScript.value.trim()) || '',
    explanation: form.explanation.value.trim() || null,
    sortOrder: Number(form.sortOrder.value) || 0,
    options,
  };
  if (category === 'reading') body.passage = passage || null;
  if (!qid) body.lessonId = lessonId;
  try {
    if (qid) await api('/admin/quiz-questions/' + qid, { method: 'PUT', body: JSON.stringify(body) });
    else await api('/admin/quiz-questions', { method: 'POST', body: JSON.stringify(body) });
    notify('Pertanyaan tersimpan');
    // Pertanyaan tersave = section pasti udah ada di DB → drop pending.
    _pendingSection = null;
    manageQuiz(lessonId, lessonTitle);
  } catch (err) { notify('Gagal simpan: ' + err.message, true); }
}
