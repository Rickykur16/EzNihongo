# Loaded from /etc/nginx/conf.d (http context).
# HTML is the release manifest for this static app, so browsers must
# revalidate it. Fingerprinted/versioned CSS and JS remain cacheable.
map $sent_http_content_type $eznihongo_html_cache_control {
    default      "";
    ~*text/html  "no-cache, no-store, must-revalidate";
}

add_header Cache-Control $eznihongo_html_cache_control always;
